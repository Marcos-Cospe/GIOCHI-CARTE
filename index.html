<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Sala Giochi</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=IBM+Plex+Mono:wght@400;600&display=swap');

:root{
  --bg:#152420;
  --surface:#1E332B;
  --surface-2:#264438;
  --line:#3C5A4C;
  --gold:#D4AF6A;
  --gold-soft:#8C7647;
  --cream:#F1ECE1;
  --cream-dim:#B9C4BC;
  --wine:#B04A4A;
  --wine-dim:#5C3232;
  --radius:14px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;touch-action:manipulation;}
body{
  background: radial-gradient(ellipse at top, #1C3129 0%, var(--bg) 60%);
  color:var(--cream);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  min-height:100vh;
  padding-bottom:64px;
}
.wrap{max-width:560px;margin:0 auto;padding:calc(20px + env(safe-area-inset-top)) calc(16px + env(safe-area-inset-right)) env(safe-area-inset-bottom) calc(16px + env(safe-area-inset-left));}

header.top{padding:22px 4px 14px;text-align:center;position:relative;}
.brand{font-family:'Fraunces',serif;font-weight:700;font-size:38px;letter-spacing:1px;color:var(--cream);line-height:1;}
.brand .accent{color:var(--gold);}
.tagline{color:var(--cream-dim);font-size:13px;margin-top:6px;letter-spacing:.5px;}

.suit-ladder{display:flex;justify-content:center;gap:0;margin-top:16px;border:1px solid var(--line);border-radius:999px;overflow:hidden;width:fit-content;margin-left:auto;margin-right:auto;}
.suit-ladder span{padding:6px 14px;font-size:12px;font-family:'IBM Plex Mono',monospace;border-right:1px solid var(--line);}
.suit-ladder span:last-child{border-right:none;}
.suit-b{color:#9C8358;background:rgba(140,118,71,.10);}
.suit-s{color:#C9C2B0;background:rgba(201,194,176,.10);}
.suit-c{color:#E7B98A;background:rgba(231,185,138,.14);}
.suit-d{color:var(--gold);background:rgba(212,175,106,.20);font-weight:600;}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px;margin-bottom:16px;}
.card h2{font-family:'Fraunces',serif;font-weight:600;font-size:19px;margin:0 0 14px;color:var(--cream);}
.hint{color:var(--cream-dim);font-size:13px;line-height:1.5;margin:-6px 0 14px;}

button{font-family:inherit;font-size:15px;font-weight:600;cursor:pointer;border-radius:12px;border:1px solid transparent;padding:13px 18px;transition:transform .08s ease, opacity .15s ease, box-shadow .08s ease;position:relative;}
button:active{transform:scale(0.97) translateY(1px);}
button:disabled{opacity:.35;cursor:not-allowed;}
.btn-primary{
  background:linear-gradient(180deg, #E9CB92 0%, var(--gold) 45%, #B8925A 100%);
  color:#1B2E27; width:100%; border:1px solid #8C7647;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.55), inset 0 -3px 4px rgba(90,65,25,.35), 0 3px 6px rgba(0,0,0,.35);
  text-shadow:0 1px 0 rgba(255,255,255,.25);
}
.btn-primary:active{box-shadow:inset 0 2px 5px rgba(90,65,25,.45);}
.btn-secondary{
  background:linear-gradient(180deg, #2C4A3E 0%, #1E332B 60%, #182A22 100%);
  border:1px solid var(--line); color:var(--cream);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.06), inset 0 -2px 3px rgba(0,0,0,.3), 0 2px 4px rgba(0,0,0,.25);
}
.btn-secondary:active{box-shadow:inset 0 2px 4px rgba(0,0,0,.35);}
.btn-danger{
  background:linear-gradient(180deg, #C97A7A 0%, var(--wine) 55%, #7A3232 100%);
  border:1px solid var(--wine-dim); color:#2A1414; font-weight:700;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.35), inset 0 -3px 4px rgba(60,15,15,.35), 0 2px 5px rgba(0,0,0,.3);
  text-shadow:0 1px 0 rgba(255,255,255,.15);
}
.btn-danger:active{box-shadow:inset 0 2px 5px rgba(60,15,15,.4);}
.btn-small{padding:8px 12px;font-size:13px;}
.row-btns{display:flex;gap:10px;}
.game-select-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px;}
.game-select-grid button{width:100%;padding:13px 8px;font-size:14px;}
.row-btns button{flex:1;}

.player-input-row{display:flex;gap:8px;margin-bottom:10px;}
.player-input-row input{flex:1;}
input[type=text], input[type=number]{background:var(--surface-2);border:1px solid var(--line);color:var(--cream);border-radius:8px;padding:10px 12px;font-size:16px;font-family:inherit;width:100%;}
input[type=number]{font-family:'IBM Plex Mono',monospace;text-align:center;}
.player-chip{display:flex;justify-content:space-between;align-items:center;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:8px 12px;margin-bottom:8px;font-size:14px;}
.player-chip button{background:none;border:none;color:var(--wine);font-size:16px;padding:0 4px;}

.round-banner{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;}
.round-badge{font-family:'IBM Plex Mono',monospace;font-size:13px;color:var(--gold);background:rgba(212,175,106,.12);border:1px solid var(--gold-soft);padding:4px 10px;border-radius:999px;}
.forehead-note{background:rgba(176,74,74,.12);border:1px solid var(--wine-dim);color:#E3B4B4;font-size:13px;padding:8px 12px;border-radius:8px;margin-bottom:14px;}
.turn-banner{background:rgba(212,175,106,.14);border:1px solid var(--gold-soft);padding:10px 12px;border-radius:8px;margin-bottom:12px;font-size:14px;}
.capture-spotlight{background:linear-gradient(135deg, rgba(212,175,106,.18), rgba(212,175,106,.07));border:2px solid var(--gold);padding:14px 12px;border-radius:12px;margin-bottom:14px;box-shadow:0 4px 18px rgba(212,175,106,.15);animation:dealEndPop .3s cubic-bezier(.2,.9,.3,1.2) both;}
.deal-end-banner{background:linear-gradient(135deg, rgba(212,175,106,.22), rgba(212,175,106,.10));border:2px solid var(--gold);padding:16px;border-radius:12px;margin-bottom:14px;box-shadow:0 4px 18px rgba(212,175,106,.15);animation:dealEndPop .4s cubic-bezier(.2,.9,.3,1.2) both;}
.deal-end-banner h3{margin:0 0 8px;font-family:'Fraunces',serif;font-size:19px;color:var(--gold);}
.deal-end-banner .deal-end-row{display:flex;justify-content:space-between;font-size:14px;padding:3px 0;border-bottom:1px dashed rgba(212,175,106,.2);}
.deal-end-banner .deal-end-row:last-of-type{border-bottom:none;}
.deal-end-banner .deal-end-row.win{color:var(--gold);font-weight:700;}
@keyframes dealEndPop{0%{opacity:0;transform:scale(.92) translateY(-6px);}100%{opacity:1;transform:scale(1) translateY(0);}}
.capture-banner{background:rgba(212,175,106,.22);border-color:var(--gold);animation:captureBannerIn .3s ease-out both;}
@keyframes captureBannerIn{from{opacity:0;transform:translateY(-4px);}to{opacity:1;transform:translateY(0);}}
.hand-card.capture-glow img.card-svg,
.hand-card.capture-glow svg.card-svg{outline:3px solid var(--gold);outline-offset:2px;filter:drop-shadow(0 0 10px rgba(212,175,106,.9));animation:captureGlowPulse 1.1s ease-in-out infinite;}
@keyframes captureGlowPulse{0%,100%{outline-color:var(--gold);}50%{outline-color:#fff3d6;}}
.waiting-banner{background:var(--surface-2);border:1px solid var(--line);padding:10px 12px;border-radius:8px;margin-bottom:12px;font-size:14px;color:var(--cream-dim);}

.player-row{display:grid;grid-template-columns:1fr 78px;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);}
.player-row:last-child{border-bottom:none;}
.player-name{font-size:15px;}
.lives-dots{display:flex;gap:4px;margin-top:3px;}
.dot{width:8px;height:8px;border-radius:50%;background:var(--gold);}
.dot.lost{background:var(--line);}
.sum-check{font-family:'IBM Plex Mono',monospace;font-size:13px;color:var(--cream-dim);text-align:right;margin:8px 0 14px;}
.sum-check.ok{color:var(--gold);}

.hand-block{margin-bottom:14px;padding:10px 0;border-bottom:1px solid var(--line);}
.hand-block:last-child{border-bottom:none;}
.hand-block-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;font-size:14px;}
.hand{display:flex;flex-wrap:wrap;gap:8px;}
.hand-grid6{display:grid;grid-template-columns:repeat(6, 1fr);gap:4px;overflow-x:visible;}
.hand-card{display:inline-flex;padding:0;border-radius:8px;border:none;background:none;cursor:pointer;line-height:0;}
.hand-card.disabled{opacity:.45;cursor:not-allowed;}
.hand-card.hidden-card{cursor:default;}
.card-svg{display:block;filter:drop-shadow(0 2px 4px rgba(0,0,0,.35));}
img.card-svg{width:52px;height:108px;object-fit:cover;border-radius:6px;background:#F1ECE1;}
.mystery-btn{background:var(--gold);color:#1B2E27;}

.trick-area{display:flex;flex-wrap:wrap;gap:12px;margin:0 0 16px;padding:12px;background:var(--surface-2);border-radius:10px;}
.trick-play{display:flex;flex-direction:column;align-items:center;font-size:11px;color:var(--cream-dim);gap:4px;}
.trick-play.winner{color:var(--gold);font-weight:700;}
.trick-play.winner .hand-card .card-svg{filter:drop-shadow(0 0 8px rgba(212,175,106,.8));}

.log-round{margin-bottom:14px;}
.log-round-title{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--gold-soft);text-transform:uppercase;letter-spacing:1px;margin-bottom:8px;}
.log-entry{display:grid;grid-template-columns:1fr auto auto auto;gap:10px;font-size:13px;padding:4px 0;color:var(--cream-dim);align-items:center;}
.log-entry .delta-ok{color:var(--gold);}
.log-entry .delta-bad{color:var(--wine);}
.eliminated-tag{font-size:10px;background:var(--wine-dim);color:#E3B4B4;padding:2px 6px;border-radius:4px;margin-left:6px;letter-spacing:.5px;}

.history-item{background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:10px;cursor:pointer;}
.history-item .h-top{display:flex;justify-content:space-between;font-size:13px;color:var(--cream-dim);}
.history-item .h-winner{font-family:'Fraunces',serif;font-weight:600;font-size:16px;color:var(--gold);margin-top:4px;}
.history-detail{margin-top:10px;border-top:1px solid var(--line);padding-top:10px;}
.rank-row{display:flex;justify-content:space-between;font-size:13px;padding:3px 0;color:var(--cream-dim);}
.rank-row.win{color:var(--gold);font-weight:600;}

.empty{color:var(--cream-dim);font-size:13px;text-align:center;padding:20px 0;}
.sync-note{font-size:11px;color:var(--cream-dim);text-align:center;margin-top:6px;opacity:.7;}
.toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;gap:8px;
  background:linear-gradient(180deg, rgba(0,0,0,.18), rgba(0,0,0,.08));
  border:1px solid var(--line); border-radius:999px; padding:6px 8px 6px 6px;
  box-shadow:inset 0 1px 3px rgba(0,0,0,.3);}
.toolbar span{font-size:12px;color:var(--cream-dim);font-family:'IBM Plex Mono',monospace;display:flex;align-items:center;gap:8px;}
.hud-avatar{
  width:26px;height:26px;border-radius:50%;flex:0 0 auto;
  display:flex;align-items:center;justify-content:center;
  background:radial-gradient(circle at 35% 30%, #E9CB92, var(--gold) 55%, #8C7647 100%);
  color:#1B2E27;font-family:'Fraunces',serif;font-weight:700;font-size:13px;
  border:1.5px solid #8C7647; box-shadow:0 1px 3px rgba(0,0,0,.4), inset 0 1px 0 rgba(255,255,255,.4);
}
.seat-select button{display:block;width:100%;margin-bottom:8px;text-align:left;}
.warn{color:var(--wine);font-size:12px;margin-top:8px;}
.btn-secondary.mode-active{
  background:linear-gradient(180deg, #E9CB92 0%, var(--gold) 45%, #B8925A 100%);
  color:#1B2E27; border-color:#8C7647;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.55), inset 0 -3px 4px rgba(90,65,25,.35), 0 3px 6px rgba(0,0,0,.35);
  text-shadow:0 1px 0 rgba(255,255,255,.25);
}
.predict-btn-row{display:flex;gap:8px;flex-wrap:wrap;}
.predict-btn{flex:1;min-width:44px;text-align:center;font-family:'IBM Plex Mono',monospace;font-size:16px;font-weight:700;padding:12px 0;}
.trick-fraction{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--gold);background:rgba(212,175,106,.14);border:1px solid var(--gold-soft);padding:1px 7px;border-radius:999px;margin-left:6px;}
.ace-tag{color:var(--gold);font-weight:700;}
.hand-block.compact{padding:8px 0;}

/* Banner di turno: dice senza ambiguita a chi tocca */
.turn-bar{
  text-align:center;padding:10px 12px;border-radius:10px;margin-bottom:12px;
  font-size:14px;color:var(--cream-dim);background:var(--surface-2);border:1px solid var(--line);
}
.turn-bar.mine{
  background:linear-gradient(180deg, rgba(212,175,106,.22), rgba(212,175,106,.10));
  border-color:var(--gold);color:var(--gold);font-weight:700;letter-spacing:.5px;font-size:15px;
  animation:mineGlow 1.8s ease-in-out infinite;
}
@keyframes mineGlow{
  0%,100%{box-shadow:0 0 0 rgba(212,175,106,0);}
  50%{box-shadow:0 0 14px rgba(212,175,106,.35);}
}

/* Avviso desincronizzazione: onesto e visibile, non nascosto in un pannello di debug */
.desync-warn{
  background:rgba(176,74,74,.16);border:1px solid var(--wine);color:#F0C9C9;
  padding:12px;border-radius:10px;margin-bottom:12px;font-size:13px;line-height:1.5;
}
body.force-share.in-match #sync-panel{display:block !important;}
.refresh-mini{
  background:transparent;border:1px solid var(--line);color:var(--cream-dim);
  border-radius:8px;padding:2px 8px;font-size:14px;margin-left:6px;line-height:1.2;
}

/* ---------- Lobby e sale d'aspetto ---------- */
.lobby-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
.live-dot{
  width:9px;height:9px;border-radius:50%;background:var(--gold);flex-shrink:0;
  animation:livePulse 1.6s ease-in-out infinite;
}
@keyframes livePulse{
  0%,100%{opacity:.35;box-shadow:0 0 0 rgba(212,175,106,0);}
  50%{opacity:1;box-shadow:0 0 8px rgba(212,175,106,.8);}
}
.room-card{
  background:var(--surface-2);border:1px solid var(--line);border-radius:12px;
  padding:14px;margin-bottom:12px;
}
.room-card.muted{opacity:.55;}
.room-top{display:flex;justify-content:space-between;align-items:center;gap:8px;}
.room-name{font-family:'Fraunces',serif;font-weight:700;font-size:16px;color:var(--cream);}
.game-tag{font-family:'IBM Plex Mono',monospace;font-size:10px;font-weight:700;color:var(--gold);background:rgba(212,175,106,.14);border:1px solid var(--gold-soft);padding:2px 7px;border-radius:999px;margin-left:6px;vertical-align:middle;}
.score-bar{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0;}
.score-chip{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:10px;padding:6px 12px;font-size:13px;}
.score-chip .score-num{font-family:'IBM Plex Mono',monospace;font-weight:700;font-size:16px;color:var(--gold);}
.score-chip.target{color:var(--cream-dim);font-size:12px;}
.room-count{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--cream-dim);white-space:nowrap;}
.room-players{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;}
.room-players.big{gap:8px;margin-top:14px;}
.room-chip{
  background:rgba(212,175,106,.12);border:1px solid var(--gold-soft);color:var(--gold);
  padding:4px 10px;border-radius:999px;font-size:13px;
}
.room-players.big .room-chip{font-size:15px;padding:6px 14px;}
.room-chip.me{background:var(--gold);color:#1B2E27;font-weight:700;}
.room-chip.bot{background:rgba(140,160,150,.12);border-color:#4A6B5B;color:#9DB3A8;}

/* ---------- Tavolo e animazioni ---------- */
.table-wrap{display:flex;justify-content:center;margin:0 -18px 16px;}

@keyframes turnPulse{
  0%,100%{opacity:.35;stroke-width:2;}
  50%{opacity:1;stroke-width:3;}
}
.turn-ring{animation:turnPulse 1.6s ease-in-out infinite;}

@keyframes playedIn{
  0%{opacity:0;transform:scale(.55) translateY(-14px);}
  60%{opacity:1;transform:scale(1.08) translateY(2px);}
  100%{opacity:1;transform:scale(1) translateY(0);}
}
.played-in{animation:playedIn .34s cubic-bezier(.2,.9,.3,1.2) both;transform-box:fill-box;transform-origin:center;}

@keyframes winGlow{
  0%,100%{filter:drop-shadow(0 0 3px rgba(212,175,106,.55));}
  50%{filter:drop-shadow(0 0 10px rgba(212,175,106,1));}
}
.played-win{animation:playedIn .34s cubic-bezier(.2,.9,.3,1.2) both, winGlow 1.3s ease-in-out .34s infinite;}

@keyframes badgePop{
  0%{transform:scale(1);}
  45%{transform:scale(1.22);}
  100%{transform:scale(1);}
}
.badge-done{animation:badgePop .5s ease-out;transform-box:fill-box;transform-origin:center;}

/* Carte in mano: entrata a ventaglio + reattività al tocco */
@keyframes dealIn{
  0%{opacity:0;transform:translateY(16px) rotate(-4deg) scale(.9);}
  100%{opacity:1;transform:none;}
}
.hand .hand-card{animation:dealIn .34s ease-out both;}
.hand .hand-card:nth-child(1){animation-delay:.02s}
.hand .hand-card:nth-child(2){animation-delay:.08s}
.hand .hand-card:nth-child(3){animation-delay:.14s}
.hand .hand-card:nth-child(4){animation-delay:.20s}
.hand .hand-card:nth-child(5){animation-delay:.26s}
.hand button.hand-card{transition:transform .16s cubic-bezier(.2,.9,.3,1.3);}
.hand button.hand-card:active{transform:translateY(-10px) scale(1.06);}

/* Pannelli e banner: entrata morbida */
@keyframes slideFade{from{opacity:0;transform:translateY(-6px);}to{opacity:1;transform:none;}}
.turn-banner,.waiting-banner,.forehead-note{animation:slideFade .25s ease-out both;}
.predict-btn{transition:transform .14s ease, background .14s ease;}
.predict-btn:active{transform:scale(.92);}

/* Modalita compatta durante la partita: meno intestazione, niente scroll inutile */
body.in-match header.top{padding:8px 4px 2px;}
body.in-match .brand{font-size:22px;}
body.in-match .tagline,
body.in-match .suit-ladder,
body.in-match #sync-panel{display:none;}
body.in-match .hand{flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:4px;}

.sync-row{display:flex;align-items:center;gap:8px;}
.sync-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;}
.sync-label{flex:1;font-size:13px;color:var(--cream-dim);}
.sync-toggle{font-size:12px;color:var(--gold-soft);margin-top:10px;cursor:pointer;}

/* Orizzontale: piu spazio in larghezza, tavolo piu compatto per lasciare spazio alla mano sotto */
@media (orientation: landscape) and (min-width: 640px){
  .wrap{max-width:900px;}
  #sync-panel, #app > .card, #app > .card + .card{max-width:none;}
  .hand{justify-content:flex-start;}
  svg.card-svg{width:60px;height:84px;}
  img.card-svg{width:60px;height:125px;}
}
@media (orientation: landscape) and (max-width: 900px) and (max-height: 500px){
  /* telefono girato: schermo basso, riduco i margini verticali per stare nello spazio */
  .card{padding:12px;margin-bottom:10px;}
  header.top{padding:10px 4px 8px;}
  .brand{font-size:28px;}
  .tagline{margin-top:2px;}
  .suit-ladder{margin-top:8px;}
}
/* ===== animazione carta lanciata (distribuzione e gioco carta) ===== */
.card-fx-overlay{ position:fixed; inset:0; z-index:9999; pointer-events:none; display:flex; align-items:flex-end; justify-content:center; perspective:1100px; }
.card-fx-overlay.fx-fadeout{ animation: cardFxFadeOut 180ms ease-in forwards; }
@keyframes f4DropIn{ 0%{ transform:translateY(-260px); } 70%{ transform:translateY(6px); } 85%{ transform:translateY(-3px); } 100%{ transform:translateY(0); } }
.f4-drop-in{ animation: f4DropIn 480ms cubic-bezier(.5,0,.7,1); transform-box: fill-box; transform-origin: center; }
@keyframes cardFxFadeOut{ from{opacity:1;} to{opacity:0;} }
.card-fx-flash{ position:absolute; inset:0; background:radial-gradient(circle at 50% 65%, rgba(212,175,106,0.30), rgba(10,20,16,0) 55%); animation: cardFxFlash var(--cardfx-duration,750ms) ease-out forwards; }
@keyframes cardFxFlash{ 0%{opacity:0;} 18%{opacity:1;} 100%{opacity:0;} }
.card-fx-stage{ position:relative; width:130px; height:182px; margin-bottom:14vh; transform-style:preserve-3d; }
.card-fx-main, .card-fx-ghost{
  position:absolute; inset:0; width:100%; height:100%; object-fit:contain;
  border-radius:10px; will-change:transform, opacity, filter;
  animation-name: cardFxThrowKF; animation-duration:var(--cardfx-duration,750ms);
  animation-timing-function:cubic-bezier(.15,.7,.25,1); animation-fill-mode:both;
  backface-visibility:hidden;
}
.card-fx-main{ filter:drop-shadow(0 0 16px #D4AF6A) drop-shadow(0 0 34px rgba(212,175,106,0.55)); z-index:4; }
.card-fx-ghost{ z-index:1; }
.card-fx-ghost.g1{ animation-delay:55ms; opacity:.5; filter:blur(2px) drop-shadow(0 0 10px rgba(212,175,106,.45)); z-index:3; }
.card-fx-ghost.g2{ animation-delay:110ms; opacity:.3; filter:blur(4px); z-index:2; }
.card-fx-ghost.g3{ animation-delay:165ms; opacity:.15; filter:blur(7px); z-index:1; }
@keyframes cardFxThrowKF{
  0%{ transform: translateZ(-520px) translateY(60px) rotateY(-115deg) rotateX(18deg) rotate(-12deg) scale(0.18); opacity:0; }
  9%{ opacity:1; }
  58%{ transform: translateZ(70px) translateY(-14px) rotateY(370deg) rotateX(-8deg) rotate(6deg) scale(1.22); }
  100%{ transform: translateZ(0) translateY(0) rotateY(720deg) rotateX(0deg) rotate(0deg) scale(1); opacity:1; }
}
/* Tavolo di distribuzione: vista dall'alto con tutti i giocatori, usata per
   l'animazione di inizio mano al posto (o in aggiunta) del semplice lampo
   cardFxDealBurst. Ogni carta vola dal mazzo centrale al proprio posto con
   un @keyframes dedicato (mai una transition): un'animazione a fotogrammi
   chiave interpola sempre dallo stato 0% dichiarato, anche se l'elemento
   nasce nel DOM gia' con lo stile finale nell'HTML — a differenza di una
   transition, che se non vede mai uno stato "prima" non anima affatto. */
.deal-table-overlay{ position:fixed; inset:0; z-index:9999; pointer-events:none; display:flex; align-items:center; justify-content:center; }
.deal-table-overlay.fx-fadeout{ animation: cardFxFadeOut 220ms ease-in forwards; }
.deal-table-seat-name{ position:absolute; transform:translate(-50%,-50%); font-size:12px; color:#F1ECE1; text-shadow:0 1px 3px rgba(0,0,0,.7); white-space:nowrap; font-weight:600; }
.deal-table-deck{ position:absolute; transform:translate(-50%,-50%); border-radius:4px; box-shadow:0 2px 8px rgba(0,0,0,.5); }
.deal-table-card{ position:absolute; border-radius:3px; box-shadow:0 2px 5px rgba(0,0,0,.5); animation-timing-function: cubic-bezier(.2,.7,.3,1); animation-fill-mode: both; }

   Sostituisce lo storage della sandbox con un database vero.
   Il resto del gioco resta identico: usa sempre window.storage.

// >>> INCOLLA QUI LA CONFIGURAZIONE CHE TI DA FIREBASE <<<
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyCry-EdYU8Pe9fdf4BVDk0tSx4OThVBxpY",
  authDomain: "bisca-gioco-carte.firebaseapp.com",
  databaseURL: "https://bisca-gioco-carte-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "bisca-gioco-carte",
  storageBucket: "bisca-gioco-carte.firebasestorage.app",
  messagingSenderId: "1015214579798",
  appId: "1:1015214579798:web:8cf6da164f4d020ac1dbf7"
};
// >>> FINE CONFIGURAZIONE <<<

const CONFIG_DA_FARE = String(FIREBASE_CONFIG.databaseURL || '').indexOf('INCOLLA_QUI') >= 0;

let db = null;
let firebaseOk = false;

function fbPath(key){ return 'bisca/' + String(key).replace(/[.#$\[\]\/]/g, '_'); }

// I dati personali (chi sono io su questo dispositivo) restano sul telefono.
// I dati condivisi (sale e partite) vanno su Firebase.
const localStore = {
  get(k){ try{ const v = localStorage.getItem('bisca:'+k); return v===null?null:v; }catch(e){ return null; } },
  set(k,v){ try{ localStorage.setItem('bisca:'+k, v); }catch(e){} },
  del(k){ try{ localStorage.removeItem('bisca:'+k); }catch(e){} }
};

window.storage = {
  async get(key, shared){
    if(!shared){
      const v = localStore.get(key);
      return v===null ? null : {key, value:v, shared:false};
    }
    if(!firebaseOk) throw new Error('database non collegato');
    const snap = await db.ref(fbPath(key)).get();
    return snap.exists() ? {key, value:snap.val(), shared:true} : null;
  },
  async set(key, value, shared){
    if(!shared){ localStore.set(key, value); return {key, value, shared:false}; }
    if(!firebaseOk) throw new Error('database non collegato');
    await db.ref(fbPath(key)).set(value);
    return {key, value, shared:true};
  },
  async delete(key, shared){
    if(!shared){ localStore.del(key); return {key, deleted:true, shared:false}; }
    if(!firebaseOk) throw new Error('database non collegato');
    await db.ref(fbPath(key)).remove();
    return {key, deleted:true, shared:true};
  }
};

// --- Aggiornamento istantaneo -------------------------------------------
// Invece di controllare ogni tot, Firebase avvisa il telefono nell'istante
// in cui qualcun altro muove.
let sottoscrittoPartita = null;
let refPartita = null;

function attivaTempoReale(){
  db.ref(fbPath('rooms')).on('value', ()=>{ if(window.render) render(); });
  aggiornaAscoltoPartita();
  setInterval(aggiornaAscoltoPartita, 1500);
}
function aggiornaAscoltoPartita(){
  if(typeof matchKey !== 'function') return;
  const k = matchKey();
  if(k === sottoscrittoPartita) return;
  if(refPartita) refPartita.off();
  sottoscrittoPartita = k;
  refPartita = db.ref(fbPath(k));
  refPartita.on('value', ()=>{ if(window.render) render(); });
}

function mostraIstruzioni(){
  document.getElementById('app').innerHTML = `
    <div class="card">
      <h2>Manca la configurazione</h2>
      <p class="hint">Questo file va collegato al tuo database Firebase prima di funzionare.
      Apri <b>index.html</b>, cerca la riga <b>INCOLLA_QUI</b> in cima allo script e sostituiscila
      con la configurazione che ti dà Firebase. La guida completa è nel file <b>LEGGIMI.md</b>.</p>
    </div>`;
}
function mostraErrore(msg){
  document.getElementById('app').innerHTML = `
    <div class="card">
      <h2>Non riesco a collegarmi</h2>
      <p class="hint">${msg}</p>
      <p class="hint">Controlla che nella configurazione ci sia <b>databaseURL</b> e che nelle
      regole del database sia consentita la lettura e la scrittura (vedi <b>LEGGIMI.md</b>, punto 4).</p>
    </div>`;
}

async function avviaApp(){
  if(CONFIG_DA_FARE){ mostraIstruzioni(); return; }
  try{
    firebase.initializeApp(FIREBASE_CONFIG);
    db = firebase.database();
    await db.ref(fbPath('__prova')).set(Date.now());   // verifica scrittura
    await db.ref(fbPath('__prova')).remove();
    firebaseOk = true;
  }catch(e){
    // Nessuna connessione o database non raggiungibile: non blocchiamo l'app.
    // La modalita' Solo (contro bot) non ha bisogno della rete, quindi deve
    // restare comunque utilizzabile; solo le sale online risulteranno assenti.
    firebaseOk = false;
  }
  await recallSeat();
  await tryLoadFromHash();
  await render();
  updateSyncPanel();
  if(firebaseOk) attivaTempoReale();
}

function esc(s){ return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

// ===== animazione carta lanciata verso la telecamera (distribuzione e gioco carta) =====
// riutilizzabile da tutti i giochi e tipi di carte: basta passare l'URL dell'immagine.
function cardFxThrow(imgSrc, opts){
  opts = opts || {};
  const duration = opts.duration || 750;
  const overlay = document.createElement('div');
  overlay.className = 'card-fx-overlay';
  overlay.style.setProperty('--cardfx-duration', duration+'ms');
  overlay.innerHTML = `
    <div class="card-fx-flash"></div>
    <div class="card-fx-stage">
      <img class="card-fx-ghost g3" src="${imgSrc}" aria-hidden="true">
      <img class="card-fx-ghost g2" src="${imgSrc}" aria-hidden="true">
      <img class="card-fx-ghost g1" src="${imgSrc}" aria-hidden="true">
      <img class="card-fx-main" src="${imgSrc}" aria-hidden="true">
    </div>`;
  document.body.appendChild(overlay);
  setTimeout(()=>{ overlay.classList.add('fx-fadeout'); }, duration);
  setTimeout(()=>{ overlay.remove(); }, duration+220);
  return overlay;
}
// distribuzione carte a inizio mano: invece di animare ogni singola carta (troppo lento
// con mani da 7-13 carte), mostra una breve raffica ravvicinata di lanci del dorso, che
// da' l'idea della distribuzione senza bloccare l'interfaccia.
function cardFxDealBurst(handSize, backImgSrc){
  const n = Math.max(1, Math.min(5, handSize||3));
  for(let i=0;i<n;i++){
    setTimeout(()=>{ cardFxThrow(backImgSrc || CARD_IMG['back'], {duration:600}); }, i*140);
  }
}
// Tavolo di distribuzione a volo d'uccello: mostra tutti i giocatori attorno a un
// mazzo centrale, con le carte che volano a RONDE sovrapposte (una carta a
// ciascun giocatore per ronda, poi la ronda successiva parte SENZA aspettare che
// le carte precedenti siano atterrate) invece che rigorosamente una alla volta:
// cosi' anche con mani da 13 carte e piu' giocatori la distribuzione resta
// veloce e non blocca l'interfaccia. "Io" e' sempre in basso (piu' vicino a chi
// guarda), gli altri sono disposti in ordine di turno attorno all'ovale.
//
// Animata con GSAP invece che con @keyframes generati a mano: GSAP anima le
// proprieta' direttamente via JS ad ogni frame, quindi non ha il problema (gia'
// incontrato con le variabili CSS dentro un @keyframes) di custom property
// trattate come stringhe opache in assenza di @property — e gestisce da solo
// la composizione di piu' trasformazioni (posizione, scala, rotazione) sullo
// stesso elemento, senza bisogno di ricostruire a mano la stringa transform.
function cardFxDealTable(names, myIndex, cardsPerPlayer, opts){
  opts = opts || {};
  if(!Array.isArray(names) || names.length<1) return;
  const n = names.length;
  cardsPerPlayer = Math.max(1, cardsPerPlayer||1);
  const start = ((myIndex||0) % n + n) % n;
  const ordered = names.map((_,i)=> names[(start+i)%n]);

  const overlay = document.createElement('div');
  overlay.className = 'deal-table-overlay';
  const vw = Math.min(window.innerWidth || 360, 480);
  const W = Math.min(vw-24, 360);
  const H = Math.round(W*0.92);
  const cx = W/2, cy = H/2;
  const rx = W*0.40, ry = H*0.38;
  const cardW = 30, cardH = 42;
  const backSrc = CARD_IMG['back'] || '';

  function seatPos(i){
    const angle = (i*(360/n)) * Math.PI/180;
    return { x: cx + rx*Math.sin(angle), y: cy + ry*Math.cos(angle) };
  }

  let html = `<div style="position:relative;width:${W}px;height:${H}px;background:rgba(10,20,16,0.88);border-radius:16px;border:1px solid rgba(212,175,106,0.3);">`;
  html += `<img class="deal-table-deck" src="${backSrc}" style="left:${cx}px;top:${cy}px;width:${cardW}px;height:${cardH}px;" alt="">`;
  ordered.forEach((name,i)=>{
    const pos = seatPos(i);
    const labelY = pos.y + (pos.y>=cy ? 24 : -24);
    html += `<div class="deal-table-seat-name" style="left:${pos.x}px;top:${labelY}px;">${esc(name)}${i===0?' (tu)':''}</div>`;
  });
  html += `</div>`;
  overlay.innerHTML = html;
  document.body.appendChild(overlay);
  const stage = overlay.firstElementChild;

  const roundAdvance = n<=2 ? 0.13 : (n<=4 ? 0.10 : 0.08); // secondi
  const perPlayerStagger = 0.022;
  const flightDuration = 0.40;

  const tl = gsap.timeline({
    onComplete: ()=>{
      gsap.to(overlay, {
        opacity: 0, duration: 0.22, ease: 'power1.in',
        onComplete: ()=>{ overlay.remove(); if(typeof opts.onDone==='function') opts.onDone(); }
      });
    }
  });

  for(let round=0; round<cardsPerPlayer; round++){
    for(let p=0; p<n; p++){
      const atTime = round*roundAdvance + p*perPlayerStagger;
      const pos = seatPos(p);
      // La pila cresce SEMPRE verso il centro del tavolo, mai verso il bordo
      // esterno dove sta il nome: una diagonale fissa, per chi siede in
      // basso, finirebbe dritta sul proprio nome (bug gia' incontrato in una
      // versione precedente) — dirigendola verso il centro funziona per
      // qualunque posizione attorno al tavolo, senza calcoli ad hoc per lato.
      const dx = cx-pos.x, dy = cy-pos.y;
      const dist = Math.sqrt(dx*dx+dy*dy) || 1;
      const stackMag = Math.min(round, 8) * 1.8;
      const ex = pos.x + (dx/dist)*stackMag;
      const ey = pos.y + (dy/dist)*stackMag;
      const rot0 = Math.random()*40-20;

      const card = document.createElement('div');
      card.className = 'deal-table-card';
      card.style.width = cardW+'px';
      card.style.height = cardH+'px';
      card.style.backgroundImage = `url("${backSrc}")`;
      card.style.backgroundSize = 'cover';
      card.style.zIndex = String(10+round);
      stage.appendChild(card);

      gsap.set(card, { left:cx, top:cy, opacity:0, scale:0.7, rotate:rot0, xPercent:-50, yPercent:-50 });
      tl.to(card, {
        left: ex, top: ey, opacity: 1, scale: 1, rotate: 0,
        duration: flightDuration, ease: 'back.out(1.5)'
      }, atTime);
    }
  }

  return overlay;
}

function cardScore(c){ return c.si*10 + c.ri; } // 0..39, il seme pesa piu del valore, come da regole

function cardPercentile(c){ return (c.si*10 + c.ri) / 39; } // 0 (Asso Bastoni) .. 1 (Re Denari)

function botPredict(hand, cardsThisRound, numPlayers){
  // per ogni carta, stima la probabilita' che sia la piu' forte tra tutti i giocatori:
  // una carta media vince quasi sempre in 2, raramente in 6-8 -> il numero di
  // avversari deve pesare, non solo la forza assoluta della carta.
  const n = Math.max(2, numPlayers || 4);
  let expected = 0;
  hand.forEach(c=>{
    const p = cardPercentile(c);
    expected += Math.pow(p, n-1);
  });
  // un pizzico di imprecisione umana: i bot non sono calcolatori infallibili,
  // a volte sovrastimano o sottostimano di poco la propria mano
  const rumore = (Math.random()<0.18) ? (Math.random()<0.5?-1:1) : 0;
  return Math.max(0, Math.min(cardsThisRound, Math.round(expected)+rumore));
}

function botChooseCard(hand, playsSoFar, wantsMore){
  const bestSoFar = playsSoFar.length ? Math.max(...playsSoFar.map(p=>effectiveScore(p.card,p.forcedValue))) : null;
  const scored = hand.map(c=>{
    const ace = isAssoDenari(c);
    return { c, winScore: ace?40:cardScore(c), loseScore: ace?-1:cardScore(c), ace };
  });

  function withForced(entry, usingToWin){
    return { card: entry.c, forcedValue: entry.ace ? (usingToWin?'alto':'basso') : undefined };
  }

  if(playsSoFar.length===0){
    if(wantsMore){
      scored.sort((a,b)=>b.winScore-a.winScore);
      return withForced(scored[0], true);
    } else {
      scored.sort((a,b)=>a.loseScore-b.loseScore);
      return withForced(scored[0], false);
    }
  }

  const beating = scored.filter(x=>x.winScore>bestSoFar).sort((a,b)=>a.winScore-b.winScore);
  const losing = scored.filter(x=>x.loseScore<=bestSoFar).sort((a,b)=>a.loseScore-b.loseScore);

  if(wantsMore){
    return beating.length ? withForced(beating[0], true) : withForced(losing[0], false);
  } else {
    return losing.length ? withForced(losing[0], false) : withForced(beating[0], true);
  }
}

}

async function scheduleBiscaBotMove(match){
  if(!match) return;
  const info = currentTurnInfo(match);
  if(!info.playerId) return;
  const player = match.players.find(p=>p.id===info.playerId);
  if(!player || !player.isBot){ botMoveKey=null; return; }

  const key = match.id+'|'+match.roundIndex+'|'+info.type+'|'+info.playerId+'|'+
    (match.phase==='play'?match.trick.plays.length:Object.keys(match.previsioni).length);
  if(botMoveKey===key) return;
  botMoveKey = key;
  if(botMoveTimer) clearTimeout(botMoveTimer);
  const delay = info.type==='play' ? 1700 : 1000;
  botMoveTimer = setTimeout(async ()=>{
    const cur = await getActiveMatch();
    if(!cur) return;
    if(cur.phase==='predict'){
      const cards = SEQ[cur.roundIndex%SEQ.length];
      let pred = botPredict(cur.hands[info.playerId], cards, cur.roundActive.length);
      const vietato = numeroVietato(cur, info.playerId, cards);
      if(vietato!==null && pred===vietato){
        // scosta di 1, restando nei limiti (0..carte)
        pred = (pred < cards) ? pred+1 : pred-1;
      }
      await declarePrevisione(cur.id, info.playerId, pred, cards);
    } else if(cur.phase==='play'){
      const wantsMore = ((cur.previsioni[info.playerId]||0) - (cur.tricksWon[info.playerId]||0)) > 0;
      const choice = botChooseCard(cur.hands[info.playerId], cur.trick.plays, wantsMore);
      await playCard(cur.id, info.playerId, choice.card.id, choice.forcedValue);
    }
  }, delay);
}

function isAssoDenari(c){ return c.suit==='Denari' && c.rank==='A'; }
function effectiveScore(card, forcedValue){
  if(forcedValue==='basso') return -1;   // vale meno dell'asso di bastoni (che ha score 0)
  if(forcedValue==='alto') return 40;    // vale piu del re di denari (che ha score 39)
  return cardScore(card);
}
function trickWinnerOf(plays){
  let best = plays[0];
  let bestScore = effectiveScore(best.card, best.forcedValue);
  for(const p of plays){
    const s = effectiveScore(p.card, p.forcedValue);
    if(s > bestScore){ best = p; bestScore = s; }
  }
  return best.playerId;
}

async function getActiveMatch(){
  try{
    const r=await window.storage.get(matchKey(), matchShared());
    if(r){
      storageStatus='ok';
      const remote = unpackMatch(JSON.parse(r.value));
      const remoteRev = remote.rev||0;
      // REGOLA: se lo stato condiviso e' cambiato rispetto all'ultima volta che lo abbiamo visto,
      // qualcun altro ha mosso -> lo adottiamo SEMPRE. Cosi le mosse degli altri non vengono mai ignorate,
      // anche se noi avessimo delle modifiche locali non salvate.
      if(!localOverrideMatch || localOverrideMatch.id!==remote.id || remoteRev!==lastKnownRemoteRev){
        lastKnownRemoteRev = remoteRev;
        localOverrideMatch = remote;
        syncDiverged = false;
        return remote;
      }
      // lo stato condiviso e' fermo: se noi siamo piu avanti, le nostre mosse non sono passate
      if((localOverrideMatch.rev||0) > remoteRev){
        syncDiverged = true;
        return localOverrideMatch;
      }
      syncDiverged = false;
      localOverrideMatch = remote;
      return remote;
    }
    return localOverrideMatch;
  }catch(e){ storageStatus='error:'+(e&&e.message?e.message:String(e)); return localOverrideMatch; }
}
async function setActiveMatch(m){
  m.rev = (m.rev||0) + 1;
  localOverrideMatch = m;
  try{
    await window.storage.set(matchKey(), JSON.stringify(packMatch(m)), matchShared());
    const back = await window.storage.get(matchKey(), matchShared());
    const okRev = back && (JSON.parse(back.value).rev) === m.rev;
    storageStatus = okRev ? 'ok' : 'error:scrittura non confermata';
    syncDiverged = !okRev;
    if(okRev) lastKnownRemoteRev = m.rev;
  }
  catch(e){ storageStatus='error:'+(e&&e.message?e.message:String(e)); syncDiverged = true; }
}

  // scarta la copia locale e riparte da quella condivisa

function stateKeyOf(match, claim){
  if(!match) return 'setup';
  const claimKey = claim ? (claim.type==='all' ? 'all' : 'seat:'+claim.playerId) : 'none';
  if(match.game==='scopa'){
    const tavolo = (match.table||[]).map(c=>c.id).join(',');

    const rev = match.captureReveal ? 'rv:'+match.captureReveal.cardId+':'+match.captureReveal.startedAt : '';
    const totali = match.totalScores ? Object.keys(match.totalScores).sort().map(k=>k+':'+match.totalScores[k]).join(',') : '';
    return [match.id, match.rev||0, match.dealNumber||1, match.turnIdx, match.phase, tavolo, mani, prese, pend, rev, totali, claimKey, syncDiverged?'DIV':''].join('|');
  }
  if(match.game==='briscola'){
    const plays = match.trick ? match.trick.plays.map(p=>p.playerId+':'+p.card.id).join(',') : '';
    const resolved = match.trick && match.trick.resolved ? 'R'+match.trick.winnerId : '';
    const mani = match.players.map(p=>(match.hands[p.id]||[]).length).join(',');
    const prese = match.players.map(p=>(p.captured||[]).length).join(',');
    const vinte = match.handWins ? Object.keys(match.handWins).sort().map(k=>k+':'+match.handWins[k]).join(',') : '';
    return [match.id, match.rev||0, match.dealNumber||1, match.phase, match.remainingDeck.length, mani, prese, plays, resolved, vinte, claimKey, syncDiverged?'DIV':''].join('|');
  }
  if(match.game==='vecia'){
    const mani = match.turnOrder.map(id=>(match.hands[id]||[]).length).join(',');
    const reveal = match.pendingReveal && match.lastDraw ? 'R'+match.lastDraw.drawerId+':'+match.lastDraw.fromId+':'+match.lastDraw.rank+':'+match.lastDraw.matched : '';
    return [match.id, match.rev||0, match.phase, match.currentIdx, mani, reveal, claimKey, syncDiverged?'DIV':''].join('|');
  }
  if(match.game==='cavacamisa'){
    const mani = match.turnOrder.map(id=>(match.hands[id]||[]).length).join(',');
    const sfida = match.pendingChallenge ? match.pendingChallenge.throwerId+':'+match.pendingChallenge.needed+':'+match.pendingChallenge.done : '';
    const reveal = match.pendingReveal && match.lastFlip ? 'R'+match.lastFlip.flipperId+':'+match.lastFlip.rank+':'+match.lastFlip.pileAwardedTo : '';
    const vinte = match.handWins ? Object.keys(match.handWins).sort().map(k=>k+':'+match.handWins[k]).join(',') : '';
    return [match.id, match.rev||0, match.dealNumber||1, match.phase, match.currentId, mani, match.center.length, sfida, reveal, vinte, claimKey, syncDiverged?'DIV':''].join('|');
  }
  if(match.game==='uno'){
    const mani = match.turnOrder.map(id=>(match.hands[id]||[]).length).join(',');
    const vinte = match.handWins ? Object.keys(match.handWins).sort().map(k=>k+':'+match.handWins[k]).join(',') : '';
    const wild = match.pendingWild ? 'W'+match.pendingWild.byId+':'+match.pendingWild.isDraw4+':'+(match.pendingWild.dumpCount||1) : '';
    const stack = match.pendingDrawStack ? 'S'+match.pendingDrawStack.kind+':'+match.pendingDrawStack.total+':'+match.pendingDrawStack.targetId+':'+match.pendingDrawStack.chainLength : '';
    const pescata = match.pendingDrawn ? 'D'+match.pendingDrawn.playerId+':'+match.pendingDrawn.cardId : '';
    const dump = match.pendingDump ? 'U'+match.pendingDump.playerId+':'+match.pendingDump.dumpKey+':'+match.pendingDump.played.length : '';
    return [match.id, match.rev||0, match.dealNumber||1, match.phase, match.currentId, match.direction, mani, match.discard.length, match.currentColor, match.unoPending, wild, stack, pescata, dump, vinte, claimKey, syncDiverged?'DIV':''].join('|');
  }
  if(match.game==='scala40'){
    const mani = match.turnOrder.map(id=>(match.hands[id]||[]).length).join(',');
    const meldsKey = match.melds.map(m=>m.id+':'+m.cards.length).join(',');
    const opened = match.turnOrder.map(id=>match.opened[id]?1:0).join(',');
    const punti = match.mode==='ramino' ? match.turnOrder.map(id=>match.totalScores[id]||0).join(',') : match.turnOrder.map(id=>match.handWins[id]||0).join(',');
    return [match.id, match.rev||0, match.dealNumber||1, match.phase, match.currentId, match.turnStep, mani, match.drawPile.length, match.discardPile.length, meldsKey, opened, punti, claimKey, syncDiverged?'DIV':''].join('|');
  }
  if(match.game==='poker'){
    const chips = match.players.map(p=>p.chips+(p.eliminated?'E':'')).join(',');
    const bets = match.bets ? match.turnOrder.map(id=>match.bets[id]||0).join(',') : '';
    const folded = match.folded ? match.turnOrder.map(id=>match.folded[id]?1:0).join(',') : '';
    return [match.id, match.rev||0, match.handNumber, match.phase, match.street, match.currentId, chips, bets, folded, (match.community||[]).length, claimKey, syncDiverged?'DIV':''].join('|');
  }
  if(match.game==='forza4'){
    const gridKey = match.grid.map(row=>row.map(c=>c||'-').join('')).join('/');
    return [match.id, match.rev||0, match.dealNumber, match.phase, match.currentId, gridKey, JSON.stringify(match.handWins), claimKey, syncDiverged?'DIV':''].join('|');
  }
  if(match.game==='battaglianavale'){
    const shotsKey = match.turnOrder.map(id=>Object.values(match.boards[id]).filter(c=>c.shot).length).join(',');
    const readyKey = match.turnOrder.map(id=>match.ready[id]?1:0).join(',');
    const placedKey = match.turnOrder.map(id=>Object.keys(match.placements[id]||{}).length).join(',');
    return [match.id, match.rev||0, match.phase, match.currentId, shotsKey, readyKey, placedKey, claimKey, syncDiverged?'DIV':''].join('|');
  }
  if(match.game==='dama'){
    const boardKey = Object.keys(match.board).sort().map(k=>{ const p=match.board[k]; return p?(p.color+(p.king?'K':'')):'-'; }).join('');
    return [match.id, match.rev||0, match.phase, match.currentColor, boardKey, claimKey, syncDiverged?'DIV':''].join('|');
  }
  if(match.game==='scacchi'){
    const boardKey = Object.keys(match.board).sort().map(k=>{ const p=match.board[k]; return p?(p.color+p.type):'-'; }).join('');
    const promoKey = match.pendingPromotion ? 'PROMO' : '';
    return [match.id, match.rev||0, match.phase, match.currentColor, boardKey, promoKey, claimKey, syncDiverged?'DIV':''].join('|');
  }
  if(match.game==='roulette'){
    const betsKey = match.turnOrder.map(id=>match.bets[id].length+':'+match.bets[id].reduce((s,b)=>s+b.amount,0)+':'+(match.ready[id]?1:0)).join(',');
    const chipsKey = match.turnOrder.map(id=>match.players.find(p=>p.id===id).chips).join(',');
    return [match.id, match.rev||0, match.phase, match.roundNumber, betsKey, chipsKey, match.spinResult, claimKey, syncDiverged?'DIV':''].join('|');
  }
  if(match.game==='blackjack'){
    const handsKey = match.turnOrder.map(id=> bjPlayerHands(match,id).map(h=>h.cards.length+':'+(h.done?1:0)).join('/')).join(',');
    const chipsKey = match.turnOrder.map(id=>match.players.find(p=>p.id===id).chips).join(',');
    const dealerKey = match.dealerHand ? match.dealerHand.length+':'+(match.dealerRevealed?1:0) : '-';
    return [match.id, match.rev||0, match.phase, match.roundNumber, match.currentPlayerId, match.currentHandIdx, handsKey, dealerKey, chipsKey, claimKey, syncDiverged?'DIV':''].join('|');
  }
  const prev = match.previsioni ? Object.keys(match.previsioni).sort().map(k=>k+':'+match.previsioni[k]).join(',') : '';
  const plays = match.trick ? match.trick.plays.map(p=>p.playerId+':'+p.card.id+':'+(p.forcedValue||'')).join(',') : '';
  const resolved = match.trick && match.trick.resolved ? 'R'+match.trick.winnerId : '';
  const ace = pendingAceChoice ? 'ace:'+pendingAceChoice.cardId : '';
  return [match.id, match.rev||0, match.roundIndex, match.phase, prev, plays, resolved, claimKey, ace, syncDiverged?'DIV':''].join('|');
}

// --- Sale d'aspetto ------------------------------------------------------
// Elenco condiviso di sale aperte: chi apre il link le vede tutte e puo entrare
// scrivendo il proprio nome, senza bisogno di link o codici da passare a mano.
let myRoomId = null;      // sala in cui mi trovo
let mySeatIdx = null;     // il mio posto in quella sala
let soloMode = false;     // partita contro bot: resta solo su questo dispositivo
let cachedRooms = [];
let lobbyView = 'lobby';  // 'lobby' | 'creaSala' | 'solo' | 'solitario'
let joinNameDraft = '';
let selectedGame = 'bisca'; // 'bisca' | 'scopa', scelto in creazione sala o in singolo

function matchKey(){
  if(soloMode) return 'solo-match';
  return myRoomId ? 'match:'+myRoomId : 'active-match';
}
function matchShared(){ return !soloMode; }

async function getRooms(){
  try{
    const r = await window.storage.get('rooms', true);
    const list = r ? JSON.parse(r.value) : [];
    // scarto le sale abbandonate da piu di 6 ore, per non accumulare rumore
    const limite = Date.now() - 6*3600*1000;
    return list.filter(s=>s && s.created > limite);
  }catch(e){ return []; }
}
async function saveRooms(list){
  try{ await window.storage.set('rooms', JSON.stringify(list), true); return true; }
  catch(e){ return false; }
}
async function upsertRoom(room){
  const list = await getRooms();
  const i = list.findIndex(s=>s.id===room.id);
  if(i>=0) list[i]=room; else list.unshift(room);
  return saveRooms(list.slice(0,20));
}
async function getRoom(id){
  const list = await getRooms();
  return list.find(s=>s.id===id) || null;
}
async function rememberSeat(){
  try{ await window.storage.set('my-seat', JSON.stringify({roomId:myRoomId, idx:mySeatIdx, solo:soloMode}), false); }catch(e){}
}
async function recallSeat(){
  try{
    const r = await window.storage.get('my-seat', false);
    if(r){ const v=JSON.parse(r.value); myRoomId=v.roomId; mySeatIdx=v.idx; soloMode=!!v.solo; }
  }catch(e){}
}

async function createRoom(){
  const nameEl = document.getElementById('room-name');
  const roomName = (nameEl && nameEl.value.trim()) || 'Sala di '+(hostNameValue.trim()||'qualcuno');
  const hostName = hostNameValue.trim() || 'Giocatore 1';
  const room = {
    id: 'r'+Date.now().toString(36),
    name: roomName, host: hostName, game: selectedGame,
    players: [hostName], bots: [], lives: startingLives,
    format: selectedGame==='briscola' ? briscolaFormat : scopaFormat,
    target: scopaTarget, rules: {...scopaRules}, scopone: scopaScopone,
    handsToWin: selectedGame==='uno' ? unoHandsToWin : (selectedGame==='scala40' ? scala40HandsToWin : (selectedGame==='forza4' ? forza4HandsToWin : cavaCamisaHandsToWin)),
    scala40Mode, scala40RaminoTarget, rouletteMode, blackjackMode,
    created: Date.now(), started: false
  };

  if(!ok){ alert('Non riesco a creare la sala: la sincronizzazione non è disponibile su questo dispositivo.'); return; }

  await rememberSeat();
  lobbyView = 'lobby';

// numero massimo di posti (giocatori+bot) ammessi in sala, in base al gioco:
// Scopa e Briscola hanno formati a numero fisso di giocatori (2/3/4), Bisca e' flessibile fino a 8
function roomFormatMax(room){
  if(room.game==='scopa') return scopaFormatPlayers(room.format||'1v1');
  if(room.game==='briscola') return briscolaFormatPlayers(room.format||'1v1');
  if(room.game==='vecia') return VECIA_MAX_PLAYERS;
  if(room.game==='cavacamisa') return CAVA_MAX_PLAYERS;
  if(room.game==='uno') return UNO_MAX_PLAYERS;
  if(room.game==='scala40') return SCALA40_MAX_PLAYERS;
  if(room.game==='poker') return POKER_MAX_PLAYERS;
  if(room.game==='forza4') return F4_MAX_PLAYERS;
  if(room.game==='battaglianavale') return BS_MAX_PLAYERS;
  if(room.game==='dama') return DAMA_MAX_PLAYERS;
  if(room.game==='scacchi') return CHESS_MAX_PLAYERS;
  if(room.game==='roulette') return ROULETTE_MAX_PLAYERS;
  if(room.game==='blackjack') return BJ_MAX_PLAYERS;
  return 8;
}
// Entra in un tavolo Roulette/Black Jack modalita' libera GIA' avviato, come al
// vero casino'. L'id del nuovo giocatore e' sempre 'p'+(indice in room.players):
// per questo room.players cresce soltanto (non si riduce mai quando qualcuno
// esce), cosi' gli indici restano stabili per chi era gia' seduto.
async function joinRunningTable(roomId){
  const el = document.getElementById('join-name-'+roomId);
  const nome = (el && el.value.trim()) || joinNameDraft.trim();
  if(!nome){ alert('Scrivi il tuo nome per entrare.'); return; }
  const room = await getRoom(roomId);
  if(!room){ alert('Questo tavolo non esiste più.'); await render(true); return; }
  myRoomId = roomId; soloMode = false;
  const match = await getActiveMatch();
  if(!match){
    alert('Il tavolo si è appena svuotato.');
    myRoomId = null;
    try{ const list=(await getRooms()).filter(s=>s.id!==roomId); await saveRooms(list); }catch(e){}
    await render(true);
    return;
  }
  const max = room.game==='roulette' ? ROULETTE_MAX_PLAYERS : BJ_MAX_PLAYERS;
  if(match.players.length>=max){ alert('Tavolo al completo ('+max+' giocatori).'); myRoomId=null; await render(true); return; }
  room.players.push(nome);
  const idx = room.players.length-1;
  const newId = 'p'+idx;
  match.players.push({id:newId, name:nome, isBot:false, chips:1000, busted:false});
  match.turnOrder.push(newId);
  if(room.game==='blackjack'){ match.hands[newId] = []; match.bets[newId] = 0; }
  else { match.bets[newId] = []; }
  const okRoom = await upsertRoom(room);
  if(!okRoom){ alert('Non riesco a entrare: la sincronizzazione non è disponibile su questo dispositivo.'); myRoomId=null; return; }
  await setActiveMatch(match);
  mySeatIdx = idx;
  joinNameDraft = '';
  await rememberSeat();
  lastRenderKey = null;
  await render(true);
}
async function joinRoom(roomId){
  const el = document.getElementById('join-name-'+roomId);
  const nome = (el && el.value.trim()) || joinNameDraft.trim();
  if(!nome){ alert('Scrivi il tuo nome per entrare.'); return; }
  const room = await getRoom(roomId);
  if(!room){ alert('Questa sala non esiste più.'); await render(true); return; }
  if(room.started){ alert('Questa partita è già iniziata.'); await render(true); return; }
  const botCount = Array.isArray(room.bots) ? room.bots.length : 0;
  const max = roomFormatMax(room);
  const formatoFisso = room.game==='scopa' || room.game==='briscola';
  if(room.players.length + botCount >= max){ alert(formatoFisso ? 'Sala già al completo per il formato scelto ('+max+' giocatori).' : 'Sala piena (massimo 8 tra giocatori e bot).'); return; }
  let idx = room.players.indexOf(nome);
  if(idx<0){ room.players.push(nome); idx = room.players.length-1; }
  const ok = await upsertRoom(room);
  if(!ok){ alert('Non riesco a entrare: la sincronizzazione non è disponibile su questo dispositivo.'); return; }
  myRoomId = roomId; mySeatIdx = idx; soloMode = false;
  joinNameDraft = '';
  await rememberSeat();
  lastRenderKey = null;
  await render(true);
}
async function leaveRoom(){
  if(myRoomId){
    const room = await getRoom(myRoomId);
    if(room && !room.started && mySeatIdx!=null){
      room.players.splice(mySeatIdx,1);
      if(room.players.length===0){
        const list = (await getRooms()).filter(s=>s.id!==room.id);
        await saveRooms(list);
      } else { await upsertRoom(room); }
    }
  }
  myRoomId=null; mySeatIdx=null; soloMode=false;
  await rememberSeat();
  lastRenderKey = null;
  await render(true);
}
// --- Bot nelle sale online (Bisca e Briscola; la Scopa resta solo in singolo per come
//     e' strutturata la sua fase di rivelazione presa) — solo l'host, solo prima dell'avvio
async function addRoomBot(){
  const room = await getRoom(myRoomId);
  if(!room || room.started || mySeatIdx!==0) return;
  if(room.game==='scopa'){ alert('I bot nelle sale sono disponibili per Bisca, Briscola, Vecia, Cava Camisa, UNO, Scala 40, Poker, Forza 4, Battaglia Navale, Dama, Scacchi, Roulette e Black Jack. Per la Scopa usa la partita in singolo.'); return; }
  if(!Array.isArray(room.bots)) room.bots = [];
  const max = roomFormatMax(room);
  const totale = room.players.length + room.bots.length;
  if(totale>=max){
    alert(room.game==='briscola'
      ? 'Il formato '+room.format+' richiede esattamente '+max+' giocatori (umani + bot).'
      : room.game==='vecia'
        ? 'Massimo '+max+' giocatori (umani + bot) a Vecia.'
        : room.game==='cavacamisa'
          ? 'Massimo '+max+' giocatori (umani + bot) a Cava Camisa.'
          : room.game==='uno'
            ? 'Massimo '+max+' giocatori (umani + bot) a UNO.'
            : room.game==='scala40'
              ? 'Massimo '+max+' giocatori (umani + bot) a Scala 40.'
              : room.game==='poker'
                ? 'Massimo '+max+' giocatori (umani + bot) al Poker.'
                : 'Massimo 8 giocatori (umani + bot) per il mazzo da 40 carte.');
    return;
  }
  room.bots.push('Bot '+(room.bots.length+1));
  const ok = await upsertRoom(room);
  if(!ok){ alert('Non riesco ad aggiornare la sala: sincronizzazione non disponibile.'); return; }
  lastRenderKey = null;
  await render(true);
}
async function removeRoomBot(){
  const room = await getRoom(myRoomId);
  if(!room || room.started || mySeatIdx!==0) return;
  if(!Array.isArray(room.bots) || room.bots.length===0) return;
  room.bots.pop();
  const ok = await upsertRoom(room);
  if(!ok){ alert('Non riesco ad aggiornare la sala: sincronizzazione non disponibile.'); return; }
  lastRenderKey = null;
  await render(true);
}
function assignScopaTeams(playerIds, format){
  if(format!=='2v2') return null;
  // le coppie si alternano (1°+3° vs 2°+4°), come da convenzione: i compagni siedono di fronte
  return { teamA:[playerIds[0], playerIds[2]], teamB:[playerIds[1], playerIds[3]] };
}
function buildScopaMatch(id, names, format, rules, target, scopone){
  const n = names.length;
  const players = names.map((name,i)=>({id:'p'+i, name, isBot:false, captured:[], scope:0}));
  const ids = players.map(p=>p.id);
  const teams = assignScopaTeams(ids, format);
  const excludeCardId = format==='1v1v1' ? 'Coppe-2' : null; // in tre si toglie il 2 di coppe
  const seed = (Math.random()*2147483647)|0;
  const dealt = scopone ? dealScopone(seed, ids) : dealScopa(seed, ids, excludeCardId);
  const totalScores = {};
  (teams ? [{key:'teamA'},{key:'teamB'}] : players.map(p=>({key:p.id}))).forEach(g=>{ totalScores[g.key]=0; });
  const startIdx = Math.floor(Math.random()*ids.length);
  return {
    id, game:'scopa', seed, excludeCardId, createdAt:new Date().toISOString(),
    format, rules:{...rules}, targetScore: target, scopone: !!scopone,
    players, teams, turnOrder: ids, turnIdx:startIdx, dealStartIdx:startIdx, dealNumber:1,
    hands: dealt.hands, table: dealt.table, remainingDeck: dealt.remainingDeck,
    lastCapturerId:null, phase:'playing', pendingCapture:null, totalScores
  };
}
async function startRoomMatch(){
  const room = await getRoom(myRoomId);
  if(!room) return;
  if(room.game==='scopa'){
    const need = scopaFormatPlayers(room.format||'1v1');
    if(room.players.length!==need){ alert('Il formato '+room.format+' richiede esattamente '+need+' giocatori (ora siete '+room.players.length+').'); return; }
    const match = buildScopaMatch(room.id, room.players, room.format, room.rules, room.target, room.scopone);
    await setActiveMatch(match);
    room.started = true;
    await upsertRoom(room);
    lastRenderKey = null;
    await render(true);
    return;
  }
  if(room.game==='briscola'){
    const need = briscolaFormatPlayers(room.format||'1v1');
    const bots = room.bots||[];
    const totale = room.players.length + bots.length;
    if(totale!==need){ alert('Il formato '+room.format+' richiede esattamente '+need+' giocatori (umani + bot); ora siete '+totale+'.'); return; }
    const names = room.players.concat(bots);
    const match = buildBriscolaMatch(room.id, names, room.format);
    match.players.forEach((p,i)=>{ if(i>=room.players.length) p.isBot=true; });
    await setActiveMatch(match);
    room.started = true;
    await upsertRoom(room);
    lastRenderKey = null;
    await render(true);
    return;
  }
  if(room.game==='vecia'){
    const bots = room.bots||[];
    const totale = room.players.length + bots.length;
    if(totale<2){ alert('Servono almeno 2 giocatori (umani o bot).'); return; }
    if(totale>VECIA_MAX_PLAYERS){ alert('Massimo '+VECIA_MAX_PLAYERS+' giocatori a Vecia.'); return; }
    const names = room.players.concat(bots);
    const match = buildVeciaMatch(room.id, names);
    match.players.forEach((p,i)=>{ if(i>=room.players.length) p.isBot=true; });
    await setActiveMatch(match);
    room.started = true;
    await upsertRoom(room);
    lastRenderKey = null;
    await render(true);
    return;
  }
  if(room.game==='cavacamisa'){
    const bots = room.bots||[];
    const totale = room.players.length + bots.length;
    if(totale<2){ alert('Servono almeno 2 giocatori (umani o bot).'); return; }
    if(totale>CAVA_MAX_PLAYERS){ alert('Massimo '+CAVA_MAX_PLAYERS+' giocatori a Cava Camisa.'); return; }
    const names = room.players.concat(bots);
    const match = buildCavaCamisaMatch(room.id, names, room.handsToWin||2);
    match.players.forEach((p,i)=>{ if(i>=room.players.length) p.isBot=true; });
    await setActiveMatch(match);
    room.started = true;
    await upsertRoom(room);
    lastRenderKey = null;
    await render(true);
    return;
  }
  if(room.game==='uno'){
    const bots = room.bots||[];
    const totale = room.players.length + bots.length;
    if(totale<2){ alert('Servono almeno 2 giocatori (umani o bot).'); return; }
    if(totale>UNO_MAX_PLAYERS){ alert('Massimo '+UNO_MAX_PLAYERS+' giocatori a UNO.'); return; }
    const names = room.players.concat(bots);
    const match = buildUnoMatch(room.id, names, room.handsToWin||2);
    match.players.forEach((p,i)=>{ if(i>=room.players.length) p.isBot=true; });
    await setActiveMatch(match);
    room.started = true;
    await upsertRoom(room);
    lastRenderKey = null;
    await render(true);
    return;
  }
  if(room.game==='scala40'){
    const bots = room.bots||[];
    const totale = room.players.length + bots.length;
    if(totale<2){ alert('Servono almeno 2 giocatori (umani o bot).'); return; }
    if(totale>SCALA40_MAX_PLAYERS){ alert('Massimo '+SCALA40_MAX_PLAYERS+' giocatori a Scala 40.'); return; }
    const names = room.players.concat(bots);
    const match = buildScala40Match(room.id, names, room.scala40Mode||'secche', room.scala40Mode==='ramino' ? (room.scala40RaminoTarget||101) : (room.handsToWin||2));
    match.players.forEach((p,i)=>{ if(i>=room.players.length) p.isBot=true; });
    await setActiveMatch(match);
    room.started = true;
    await upsertRoom(room);
    lastRenderKey = null;
    await render(true);
    return;
  }
  if(room.game==='poker'){
    const bots = room.bots||[];
    const totale = room.players.length + bots.length;
    if(totale<2){ alert('Servono almeno 2 giocatori (umani o bot).'); return; }
    if(totale>POKER_MAX_PLAYERS){ alert('Massimo '+POKER_MAX_PLAYERS+' giocatori al Poker.'); return; }
    const names = room.players.concat(bots);
    const match = buildPokerMatch(room.id, names);
    match.players.forEach((p,i)=>{ if(i>=room.players.length) p.isBot=true; });
    startPokerHand(match);
    await setActiveMatch(match);
    room.started = true;
    await upsertRoom(room);
    lastRenderKey = null;
    await render(true);
    return;
  }
  if(room.game==='forza4'){
    const bots = room.bots||[];
    const totale = room.players.length + bots.length;
    if(totale!==2){ alert('Forza 4 richiede esattamente 2 giocatori (ora siete '+totale+').'); return; }
    const names = room.players.concat(bots);
    const match = buildForza4Match(room.id, names, room.handsToWin||4);
    match.players.forEach((p,i)=>{ if(i>=room.players.length) p.isBot=true; });
    await setActiveMatch(match);
    room.started = true;
    await upsertRoom(room);
    lastRenderKey = null;
    await render(true);
    return;
  }
  if(room.game==='battaglianavale'){
    const bots = room.bots||[];
    const totale = room.players.length + bots.length;
    if(totale!==2){ alert('Battaglia Navale richiede esattamente 2 giocatori (ora siete '+totale+').'); return; }
    const names = room.players.concat(bots);
    const match = buildBattleshipMatch(room.id, names);
    match.players.forEach((p,i)=>{ if(i>=room.players.length) p.isBot=true; });
    await setActiveMatch(match);
    room.started = true;
    await upsertRoom(room);
    lastRenderKey = null;
    await render(true);
    return;
  }
  if(room.game==='dama'){
    const bots = room.bots||[];
    const totale = room.players.length + bots.length;
    if(totale!==2){ alert('La Dama richiede esattamente 2 giocatori (ora siete '+totale+').'); return; }
    const names = room.players.concat(bots);
    const match = buildDamaMatch(room.id, names);
    match.players.forEach((p,i)=>{ if(i>=room.players.length) p.isBot=true; });
    await setActiveMatch(match);
    room.started = true;
    await upsertRoom(room);
    lastRenderKey = null;
    await render(true);
    return;
  }
  if(room.game==='scacchi'){
    const bots = room.bots||[];
    const totale = room.players.length + bots.length;
    if(totale!==2){ alert('Gli Scacchi richiedono esattamente 2 giocatori (ora siete '+totale+').'); return; }
    const names = room.players.concat(bots);
    const match = buildChessMatch(room.id, names);
    match.players.forEach((p,i)=>{ if(i>=room.players.length) p.isBot=true; });
    await setActiveMatch(match);
    room.started = true;
    await upsertRoom(room);
    lastRenderKey = null;
    await render(true);
    return;
  }
  if(room.game==='roulette'){
    const bots = room.bots||[];
    const totale = room.players.length + bots.length;
    if(totale>ROULETTE_MAX_PLAYERS){ alert('Massimo '+ROULETTE_MAX_PLAYERS+' giocatori alla Roulette.'); return; }
    const names = room.players.concat(bots);
    const match = buildRouletteMatch(room.id, names, room.rouletteChips||1000, room.rouletteMode);
    match.players.forEach((p,i)=>{ if(i>=room.players.length) p.isBot=true; });
    await primeDeviceStatsCache('roulette');
    await setActiveMatch(match);
    room.started = true;
    await upsertRoom(room);
    lastRenderKey = null;
    await render(true);
    return;
  }
  if(room.game==='blackjack'){
    bjCurrentBet = 0;
    const bots = room.bots||[];
    const totale = room.players.length + bots.length;
    if(totale>BJ_MAX_PLAYERS){ alert('Massimo '+BJ_MAX_PLAYERS+' giocatori al Black Jack.'); return; }
    const names = room.players.concat(bots);
    const match = buildBlackjackMatch(room.id, names, 1000, room.blackjackMode);
    match.players.forEach((p,i)=>{ if(i>=room.players.length) p.isBot=true; });
    await primeDeviceStatsCache('blackjack');
    await setActiveMatch(match);
    room.started = true;
    await upsertRoom(room);
    lastRenderKey = null;
    await render(true);
    return;
  }
  if(room.players.length + (room.bots?room.bots.length:0) < 2){ alert('Servono almeno 2 giocatori (umani o bot).'); return; }
  const L = room.lives || 3;
  const umani = room.players.map((n,i)=>({id:'p'+i, name:n, lives:L, eliminated:false, eliminatedAtRound:null, isBot:false}));
  const bots = (room.bots||[]).map((n,j)=>({id:'p'+(room.players.length+j), name:n, lives:L, eliminated:false, eliminatedAtRound:null, isBot:true}));
  const players = umani.concat(bots);
  const match = {
    id: room.id, seed:(Math.random()*2147483647)|0, createdAt:new Date().toISOString(),
    players, roundIndex:0, startingLives:L,
    leaderId: players[Math.floor(Math.random()*players.length)].id, log:[]
  };
  startRound(match);
  await setActiveMatch(match);
  room.started = true;
  await upsertRoom(room);
  lastRenderKey = null;
  await render(true);
}

function renderLobby(rooms){
  const aperte = rooms.filter(s=>!s.started);
  const inCorso = rooms.filter(s=>s.started);
  const lista = aperte.length ? aperte.map(s=>{
    const label = s.game==='scopa' ? 'Scopa' : (s.game==='briscola' ? 'Briscola' : (s.game==='vecia' ? 'Vecia' : (s.game==='cavacamisa' ? 'Cava Camisa' : (s.game==='uno' ? 'UNO' : (s.game==='scala40' ? 'Scala 40' : (s.game==='poker' ? 'Poker' : (s.game==='forza4' ? 'Forza 4' : (s.game==='battaglianavale' ? 'Battaglia Navale' : (s.game==='dama' ? 'Dama' : (s.game==='scacchi' ? 'Scacchi' : (s.game==='roulette' ? 'Roulette' : (s.game==='blackjack' ? 'Black Jack' : 'Bisca'))))))))))));
    const max = roomFormatMax(s);
    return `
    <div class="room-card">
      <div class="room-top">
        <span class="room-name">${esc(s.name)} <span class="game-tag">${label}</span></span>
        <span class="room-count">${s.players.length + (s.bots?s.bots.length:0)}/${max}${(s.game==='scopa'||s.game==='briscola'||s.game==='vecia'||s.game==='cavacamisa'||s.game==='uno'||s.game==='scala40'||s.game==='poker'||s.game==='forza4'||s.game==='battaglianavale'||s.game==='dama'||s.game==='scacchi'||s.game==='roulette'||s.game==='blackjack')?'':' · '+s.lives+' vite'}</span>
      </div>
      <div class="room-players">${s.players.map(p=>`<span class="room-chip">${esc(p)}</span>`).join('')}${(s.bots||[]).map(b=>`<span class="room-chip bot">${esc(b)} 🤖</span>`).join('')}</div>
      <div class="player-input-row" style="margin-top:10px;">
        <input type="text" id="join-name-${s.id}" placeholder="Il tuo nome" autocomplete="off" value="${esc(joinNameDraft)}" oninput="joinNameDraft=this.value">
        <button class="btn-secondary btn-small" onclick="joinRoom('${s.id}')">Entra</button>
      </div>
    </div>`;
  }).join('') : '<p class="empty">Nessuna sala aperta in questo momento.</p>';

  const inCorsoRaggiungibili = inCorso.filter(s=>(s.game==='roulette' && s.rouletteMode==='free') || (s.game==='blackjack' && s.blackjackMode==='free'));
  const inCorsoAltro = inCorso.filter(s=>!inCorsoRaggiungibili.includes(s));
  const correnti = (inCorsoRaggiungibili.length || inCorsoAltro.length) ? `
    <div style="margin-top:14px;">
      <div class="log-round-title">Partite già in corso</div>
      ${inCorsoRaggiungibili.map(s=>{
        const label = s.game==='roulette' ? 'Roulette' : 'Black Jack';
        return `<div class="room-card">
          <div class="room-top"><span class="room-name">${esc(s.name)} <span class="game-tag">${label}</span></span><span class="room-count">tavolo aperto</span></div>
          <p class="hint" style="margin-top:4px;">Modalità libera: puoi unirti al tavolo in corso quando vuoi.</p>
          <div class="player-input-row" style="margin-top:10px;">
            <input type="text" id="join-name-${s.id}" placeholder="Il tuo nome" autocomplete="off" value="${esc(joinNameDraft)}" oninput="joinNameDraft=this.value">
            <button class="btn-secondary btn-small" onclick="joinRunningTable('${s.id}')">Unisciti al tavolo</button>
          </div>
        </div>`;
      }).join('')}
      ${inCorsoAltro.map(s=>`<div class="room-card muted"><div class="room-top"><span class="room-name">${esc(s.name)}</span><span class="room-count">in gioco</span></div></div>`).join('')}
    </div>` : '';

  return `
  <div class="card">
    <div class="lobby-head">
      <h2 style="margin:0;">Sale d'aspetto</h2>
      <span class="live-dot" title="aggiornamento automatico"></span>
    </div>
    <p class="hint">Chi apre questo link vede le sale aperte ed entra scrivendo il proprio nome. L'elenco si aggiorna da solo.</p>
    ${lista}
    ${correnti}
    <div class="row-btns" style="margin-top:16px;">
      <button class="btn-primary" onclick="lobbyView='creaSala'; render(true)">Crea una sala</button>
    </div>
    <div style="margin-top:10px;">
      <button class="btn-secondary" style="width:100%;" onclick="lobbyView='solo'; render(true)">Gioca da solo contro i bot</button>
    </div>
    <div style="margin-top:10px;">
      <button class="btn-secondary" style="width:100%;" onclick="lobbyView='solitario'; render(true)">Gioca a Solitario</button>
    </div>
  </div>`;
}
