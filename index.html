// DAMA ITALIANA - rendering
// ============================================================================
let damaSelected = null;

function damaLegalOptionsFor(match, myColor, r, c){
  const legal = damaAllLegalMoves(match.board, myColor);
  return legal.options.filter(o=>o.from.r===r && o.from.c===c);
}
function damaSelectableSquares(match, myColor){
  const legal = damaAllLegalMoves(match.board, myColor);
  const set = new Set();
  legal.options.forEach(o=> set.add(o.from.r+'_'+o.from.c));
  return set;
}
async function damaCellClick(matchId, myId, r, c){
  const match = await getActiveMatch();
  if(!match || match.phase!=='playing') return;
  const player = match.players.find(p=>p.id===myId);
  if(!player || player.color!==match.currentColor) return;
  const piece = damaGet(match.board, r, c);
  if(damaSelected){
    const options = damaLegalOptionsFor(match, player.color, damaSelected.r, damaSelected.c);
    const chosen = options.find(o=> o.path[o.path.length-1].r===r && o.path[o.path.length-1].c===c);
    if(chosen){
      damaSelected = null;
      await damaMakeMove(matchId, myId, chosen.from, r, c);
      return;
    }
  }
  const selectable = damaSelectableSquares(match, player.color);
  if(piece && piece.color===player.color && selectable.has(r+'_'+c)){
    damaSelected = {r,c};
  } else {
    damaSelected = null;
  }
  await render(true);
}
function damaBoardHTML(match, myId, revealAll){
  const player = myId ? match.players.find(p=>p.id===myId) : null;
  const canPlay = !revealAll && player && player.color===match.currentColor && match.phase==='playing';
  const selectable = canPlay ? damaSelectableSquares(match, player.color) : new Set();
  const destinations = (canPlay && damaSelected) ? damaLegalOptionsFor(match, player.color, damaSelected.r, damaSelected.c).map(o=>{ const last=o.path[o.path.length-1]; return last.r+'_'+last.c; }) : [];
  const cellSize = 34;
  let html = `<div style="display:grid;grid-template-columns:repeat(8,1fr);gap:1px;max-width:${8*(cellSize+1)}px;margin:0 auto;background:#0A1410;padding:4px;border-radius:8px;">`;
  for(let r=0;r<8;r++){
    for(let c=0;c<8;c++){
      const dark = (r+c)%2===1;
      const piece = dark ? damaGet(match.board, r, c) : null;
      const isSelected = damaSelected && damaSelected.r===r && damaSelected.c===c;
      const isSelectable = dark && selectable.has(r+'_'+c);
      const isDest = dark && destinations.includes(r+'_'+c);
      let bg = dark ? '#3C5A4C' : '#1A2E26';
      if(isSelected) bg = '#D4AF6A';
      else if(isDest) bg = '#5C8A6E';
      const clickable = dark && (isSelectable || isDest);
      let pieceHtml = '';
      if(piece){
        const fill = piece.color==='W' ? '#F1ECE1' : '#241812';
        const ring = piece.color==='W' ? '#B8A88C' : '#4A3826';
        const glow = (isSelectable && !isSelected) ? 'box-shadow:0 0 0 3px #D4AF6A, 0 2px 3px rgba(0,0,0,0.4);' : 'box-shadow:0 2px 3px rgba(0,0,0,0.4);';
        pieceHtml = `<div style="width:78%;height:78%;border-radius:50%;background:${fill};border:2.5px solid ${ring};display:flex;align-items:center;justify-content:center;${glow}">${piece.king?`<span style="font-size:${cellSize*0.42}px;">♛</span>`:''}</div>`;
      }
      html += `<div ${clickable?`onclick="damaCellClick('${match.id}','${myId}',${r},${c})"`:''} style="width:100%;aspect-ratio:1;background:${bg};display:flex;align-items:center;justify-content:center;${clickable?'cursor:pointer;':''}">${pieceHtml}</div>`;
    }
  }
  html += `</div>`;
  return html;
}
function damaLastMoveText(match){
  const m = match.lastMove;
  if(!m) return '';
  const nome = esc(nameOf(match, damaPlayerForColor(match, m.color).id));
  const colLetters = 'abcdefgh';
  const fromStr = colLetters[m.from.c]+(8-m.from.r);
  const toStr = colLetters[m.to.c]+(8-m.to.r);
  let txt = `${nome} gioca ${fromStr}-${toStr}`;
  if(m.captured>0) txt += ` (${m.captured} pezz${m.captured===1?'o':'i'} catturat${m.captured===1?'o':'i'})`;
  if(m.becameKing) txt += ' — promossa a dama!';
  return txt;
}
function renderDamaMatch(match, claim){
  const myId = claim.type==='seat' ? claim.playerId : null;
  const revealAll = claim.type==='all';

  if(match.phase==='ended'){
    maybeSaveDamaHistory(match);
    return `<div class="card">
      <h2>Dama finita!</h2>
      <p class="hint">Vince <b>${esc(nameOf(match,match.winnerId))}</b></p>
      <button class="btn-primary" style="width:100%;margin-top:12px;" onclick="abandonMatch()">Torna al menu</button>
    </div>`;
  }

  const isMyTurn = revealAll || (myId && match.players.find(p=>p.id===myId).color===match.currentColor);
  const currentPlayer = damaPlayerForColor(match, match.currentColor);
  const turnBanner = `<div class="turn-bar ${isMyTurn?'mine':''}">${
    isMyTurn
      ? (revealAll ? 'Tocca a <b>'+esc(nameOf(match,currentPlayer.id))+'</b> ('+(match.currentColor==='W'?'Bianco':'Nero')+')' : '► TOCCA A TE')
      : 'Tocca a <b>'+esc(nameOf(match,currentPlayer.id))+'</b> — aspetta <button class="refresh-mini" onclick="forceResync()" title="Aggiorna">⟳</button>'
  }</div>`;
  const lastMoveHtml = match.lastMove ? `<div class="turn-banner">${damaLastMoveText(match)}</div>` : '';
  const pieceCount = { W:0, B:0 };
  Object.values(match.board).forEach(p=>{ if(p) pieceCount[p.color]++; });
  const scoreBar = `<div class="row-pills">
    <span class="pill">⚪ ${esc(nameOf(match, damaPlayerForColor(match,'W').id))} <b>${pieceCount.W}</b></span>
    <span class="pill">⚫ ${esc(nameOf(match, damaPlayerForColor(match,'B').id))} <b>${pieceCount.B}</b></span>
  </div>`;

  return `<div class="card">
    <div class="toolbar"><span>Dama · ${revealAll?'tutti visibili':esc(nameOf(match,myId))}</span><button class="btn-danger btn-small" onclick="abandonMatch()">Abbandona</button></div>
    ${scoreBar}
    ${turnBanner}
    ${lastMoveHtml}
    ${damaBoardHTML(match, myId, revealAll)}
    <p class="hint" style="margin-top:10px;">Tocca una pedina evidenziata, poi la casella di arrivo. La cattura è obbligatoria quando disponibile.</p>
  </div>`;
}

// ============================================================================
// SCACCHI - rendering
// ============================================================================
let chessSelected = null;
const CHESS_SYMBOLS = { w:{k:'♔',q:'♕',r:'♖',b:'♗',n:'♘',p:'♙'}, b:{k:'♚',q:'♛',r:'♜',b:'♝',n:'♞',p:'♟'} };
const CHESS_PIECE_NAMES = { q:'Regina', r:'Torre', b:'Alfiere', n:'Cavallo' };

function chessSelectableSquares(match, myColor){
  const legal = chessAllLegalMoves(match.board, myColor, match.chessState);
  const set = new Set();
  legal.forEach(m=> set.add(m.from.r+'_'+m.from.c));
  return set;
}
function chessLegalOptionsFor(match, myColor, r, c){
  return chessAllLegalMoves(match.board, myColor, match.chessState).filter(m=>m.from.r===r && m.from.c===c);
}
async function chessCellClick(matchId, myId, r, c){
  const match = await getActiveMatch();
  if(!match || match.phase!=='playing' || match.pendingPromotion) return;
  const player = match.players.find(p=>p.id===myId);
  if(!player || player.color!==match.currentColor) return;
  const piece = chessGet(match.board, r, c);
  if(chessSelected){
    const options = chessLegalOptionsFor(match, player.color, chessSelected.r, chessSelected.c);
    const chosen = options.find(o=> o.to.r===r && o.to.c===c);
    if(chosen){
      const from = chessSelected;
      chessSelected = null;
      await chessMakeMove(matchId, myId, from, r, c);
      return;
    }
  }
  const selectable = chessSelectableSquares(match, player.color);
  if(piece && piece.color===player.color && selectable.has(r+'_'+c)) chessSelected = {r,c};
  else chessSelected = null;
  await render(true);
}
async function chessChoosePromotion(matchId, myId, type){
  const match = await getActiveMatch();
  if(!match || !match.pendingPromotion) return;
  const { from, to } = match.pendingPromotion;
  await chessMakeMove(matchId, myId, from, to.r, to.c, type);
}
function chessBoardHTML(match, myId, revealAll){
  const player = myId ? match.players.find(p=>p.id===myId) : null;
  const canPlay = !revealAll && player && player.color===match.currentColor && match.phase==='playing' && !match.pendingPromotion;
  const selectable = canPlay ? chessSelectableSquares(match, player.color) : new Set();
  const destOptions = (canPlay && chessSelected) ? chessLegalOptionsFor(match, player.color, chessSelected.r, chessSelected.c) : [];
  const destinations = destOptions.map(o=>o.to.r+'_'+o.to.c);
  const cellSize = 34;
  let html = `<div style="display:grid;grid-template-columns:repeat(8,1fr);gap:1px;max-width:${8*(cellSize+1)}px;margin:0 auto;background:#0A1410;padding:4px;border-radius:8px;">`;
  for(let r=0;r<8;r++){
    for(let c=0;c<8;c++){
      const light = (r+c)%2===0;
      const piece = chessGet(match.board, r, c);
      const isSelected = chessSelected && chessSelected.r===r && chessSelected.c===c;
      const isSelectable = selectable.has(r+'_'+c);
      const isDest = destinations.includes(r+'_'+c);
      const isLastMoveSq = match.lastMove && ((match.lastMove.from.r===r&&match.lastMove.from.c===c)||(match.lastMove.to.r===r&&match.lastMove.to.c===c));
      let bg = light ? '#8AA396' : '#3C5A4C';
      if(isSelected) bg = '#D4AF6A';
      else if(isDest) bg = '#5C8A6E';
      else if(isLastMoveSq) bg = light ? '#C9BC7E' : '#9C8F52';
      const clickable = isSelectable || isDest;
      let pieceHtml = '';
      if(piece){
        const glow = (isSelectable && !isSelected) ? 'text-shadow:0 0 6px #D4AF6A, 0 0 6px #D4AF6A;' : '';
        pieceHtml = `<span style="font-size:${cellSize*0.75}px;line-height:1;${glow}filter:drop-shadow(0 1px 1px rgba(0,0,0,0.5));">${CHESS_SYMBOLS[piece.color][piece.type]}</span>`;
      }
      html += `<div ${clickable?`onclick="chessCellClick('${match.id}','${myId}',${r},${c})"`:''} style="width:100%;aspect-ratio:1;background:${bg};display:flex;align-items:center;justify-content:center;${clickable?'cursor:pointer;':''}">${pieceHtml}</div>`;
    }
  }
  html += `</div>`;
  return html;
}
function chessLastMoveText(match){
  const m = match.lastMove;
  if(!m) return '';
  const nome = esc(nameOf(match, chessPlayerForColor(match, m.color).id));
  const fromStr = chessSquareName(m.from.r, m.from.c), toStr = chessSquareName(m.to.r, m.to.c);
  let txt = `${nome} gioca ${fromStr}-${toStr}`;
  if(m.castle) txt = `${nome} arrocca ${m.castle==='K'?'corto':'lungo'}`;
  if(m.capture) txt += ' (cattura)';
  if(m.promo) txt += ` — promozione a ${CHESS_PIECE_NAMES[m.promo]||'Regina'}`;
  return txt;
}
function chessPromotionPanel(match, myId){
  if(!match.pendingPromotion) return '';
  const player = match.players.find(p=>p.id===match.pendingPromotion.playerId);
  if(!player || player.id!==myId) return `<div class="turn-banner">${esc(nameOf(match,player.id))} sta scegliendo il pezzo per la promozione…</div>`;
  const color = player.color;
  const opts = [['q','Regina'],['r','Torre'],['b','Alfiere'],['n','Cavallo']];
  return `<div class="card" style="margin-top:8px;border-color:#D4AF6A;">
    <p style="margin:0 0 8px;font-weight:600;">Scegli il pezzo per la promozione:</p>
    <div class="row-btns">
      ${opts.map(([t,label])=>`<button class="btn-secondary" style="flex:1;font-size:${28}px;" onclick="chessChoosePromotion('${match.id}','${myId}','${t}')" title="${label}">${CHESS_SYMBOLS[color][t]}</button>`).join('')}
    </div>
  </div>`;
}
function renderChessMatch(match, claim){
  const myId = claim.type==='seat' ? claim.playerId : null;
  const revealAll = claim.type==='all';

  if(match.phase==='ended'){
    maybeSaveChessHistory(match);
    return `<div class="card">
      <h2>Scacchi finiti!</h2>
      <p class="hint">${match.isDraw ? 'Partita patta ('+match.drawReason+')' : 'Vince <b>'+esc(nameOf(match,match.winnerId))+'</b> per scacco matto'}</p>
      <button class="btn-primary" style="width:100%;margin-top:12px;" onclick="abandonMatch()">Torna al menu</button>
    </div>`;
  }

  const isMyTurn = revealAll || (myId && match.players.find(p=>p.id===myId).color===match.currentColor);

  const scoreBar = `<div class="row-pills">

let rouletteChipValue = 10;
const ROULETTE_CHIP_PRESETS = [5,10,25,50,100,500];

// Applica gli angoli finali di ruota/pallina SOLO dopo che l'HTML e' gia' nel DOM
// da almeno un frame dipinto. Se lo facessimo nello stesso momento in cui creiamo
// l'HTML, il browser non avrebbe nessuno stato "prima" da cui animare la
// transizione e salterebbe dritto al risultato, senza mostrare alcun movimento.
// Il doppio requestAnimationFrame e' la tecnica standard per garantirlo: il primo
// frame fa sì che il browser abbia "visto" lo stato di riposo, il secondo applica
// il cambiamento che deve animarsi.
function activateRouletteSpinAnimation(){
  const wheel = document.getElementById('roulette-wheel-svg');
  const ball = document.getElementById('roulette-ball-wrap');
  const wheelTarget = wheel && wheel.getAttribute('data-spin-target');
  const ballTarget = ball && ball.getAttribute('data-ball-target');
  if(wheelTarget==null && ballTarget==null) return;
  requestAnimationFrame(()=>{
    requestAnimationFrame(()=>{
      if(wheelTarget!=null) wheel.style.transform = `rotate(${wheelTarget}deg)`;
      if(ballTarget!=null) ball.style.transform = `rotate(${ballTarget}deg)`;
    });
  });
}
function rouletteWheelSVG(spinning, resultNumber){
  const size = 220;
  const cx = size/2, cy = size/2, R = size/2-8;
  let segs = '';
  ROULETTE_WHEEL_ORDER.forEach((n,i)=>{
    const a0 = (i*(360/37)-90)*Math.PI/180, a1 = ((i+1)*(360/37)-90)*Math.PI/180;
    const x0 = cx+R*Math.cos(a0), y0 = cy+R*Math.sin(a0);
    const x1 = cx+R*Math.cos(a1), y1 = cy+R*Math.sin(a1);
    const color = n===0 ? '#2E7D4F' : (ROULETTE_RED.has(n) ? '#B23B3B' : '#241812');
    segs += `<path d="M${cx},${cy} L${x0.toFixed(2)},${y0.toFixed(2)} A${R},${R} 0 0,1 ${x1.toFixed(2)},${y1.toFixed(2)} Z" fill="${color}" stroke="#0A1410" stroke-width="0.5"/>`;
  });
  // IMPORTANTE: l'elemento nasce SEMPRE a riposo (rotate(0)), anche quando sta per
  // girare. Se l'angolo finale fosse gia' presente nell'HTML fin dalla sua prima
  // apparizione nel DOM, il browser non avrebbe nessun "prima" da cui animare la
  // transizione e salterebbe istantaneamente al risultato, senza mostrare alcun
  // movimento (esattamente il bug che avevamo, invisibile perche' gli screenshot
  // isolati mostravano sempre e solo lo stato finale). L'angolo vero e proprio
  // viene applicato DOPO, da activateRouletteSpinAnimation(), quando l'elemento
  // e' gia' nel DOM da un frame — cosi' il cambiamento e' reale e si anima.
  const finalAngle = resultNumber!=null ? -(rouletteWheelAngleFor(resultNumber)) + 360*5 : 0;
  const wheelTargetAttr = spinning ? ` data-spin-target="${finalAngle}"` : '';
  const rotationStyle = spinning
    ? `transform:rotate(0deg); transition: transform 3.2s cubic-bezier(0.15,0.85,0.35,1);`
    : `transform:rotate(0deg);`;
  // La pallina ruota in senso OPPOSTO alla ruota (realismo: nella roulette vera la
  // pallina corre sul bordo in verso contrario al rotore), di un multiplo ESATTO di
  // 360°: qualunque sia il numero di giri, torna sempre alla sua posizione di
  // partenza — che e' fissata "in alto", allineata al puntatore, esattamente dove
  // la ruota (che gira per conto suo) porta il numero vincente. Nessuna fisica
  // incrementale, nessun bersaglio che si sposta: e' una semplice interpolazione
  // dichiarativa da un angolo di partenza a uno di arrivo, quindi non puo' mai
  // "non convergere" — a differenza di un ciclo a fotogrammi con inseguimento
  // proporzionale, dove il bersaglio in movimento puo' sfuggire per sempre.
  const ballTrackR = R*0.82;
  const ballAngleDeg = -360*7;
  const ballTargetAttr = (spinning && resultNumber!=null) ? ` data-ball-target="${ballAngleDeg}"` : '';
  const ballHtml = (spinning && resultNumber!=null) ? `
      <div id="roulette-ball-wrap" style="position:absolute;inset:0;transform:rotate(0deg);transition: transform 4.6s cubic-bezier(0.12,0.7,0.25,1);"${ballTargetAttr}>
        <div style="position:absolute;top:${size/2-ballTrackR-5}px;left:50%;width:10px;height:10px;margin-left:-5px;border-radius:50%;background:#F1ECE1;box-shadow:0 1px 3px rgba(0,0,0,.5);"></div>
      </div>` : '';
  return `<div style="display:flex;justify-content:center;margin:14px 0;">
    <div style="position:relative;width:${size}px;height:${size}px;">
      <svg id="roulette-wheel-svg" viewBox="0 0 ${size} ${size}" width="${size}" height="${size}" style="${rotationStyle}"${wheelTargetAttr}>${segs}<circle cx="${cx}" cy="${cy}" r="${R*0.18}" fill="#D4AF6A"/></svg>
      ${ballHtml}
      <div style="position:absolute;top:-6px;left:50%;transform:translateX(-50%);width:0;height:0;border-left:8px solid transparent;border-right:8px solid transparent;border-top:14px solid #D4AF6A;"></div>
    </div>
  </div>`;
}
function rouletteNumberCellStyle(n){
  const color = n===0 ? '#2E7D4F' : (ROULETTE_RED.has(n) ? '#B23B3B' : '#241812');
  return `background:${color};color:#F1ECE1;`;
}
function rouletteBettingBoard(match, myId){
  const player = match.players.find(p=>p.id===myId);
  const myBets = match.bets[myId] || [];
  const totPuntato = myBets.reduce((s,b)=>s+b.amount,0);
  const chipRow = ROULETTE_CHIP_PRESETS.map(v=>`<button class="btn-secondary btn-small ${rouletteChipValue===v?'mode-active':''}" onclick="rouletteChipValue=${v}; render(true)">${v}</button>`).join('');
  // fiche in sovrimpressione: un piccolo indicatore dorato con l'importo, per
  // mostrare a colpo d'occhio dove ho gia' puntato senza dover leggere la lista
  // testuale sotto. Sommo eventuali puntate multiple sulla stessa casella (es.
  // due fiches aggiunte in tempi diversi sullo stesso numero) in un unico badge.
  function chipBadge(type, param){
    const puntate = myBets.filter(b=> b.type===type && (param===undefined || b.param===param));
    if(!puntate.length) return '';
    const somma = puntate.reduce((s,b)=>s+b.amount,0);
    return `<span style="position:absolute;top:-6px;right:-6px;background:#D4AF6A;color:#1B1410;border:1.5px solid #1B1410;border-radius:50%;min-width:20px;height:20px;padding:0 3px;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;box-shadow:0 1px 3px rgba(0,0,0,.5);z-index:2;">${somma}</span>`;
  }
  // griglia numeri 1-36 in 3 colonne x 12 righe (ordine tabellone reale: colonna 1 = 1,4,7...34 ecc)
  let gridHtml = `<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:2px;max-width:280px;margin:8px auto;">`;
  for(let row=0; row<12; row++){
    for(let col=0; col<3; col++){
      const n = row*3 + col + 1;
      gridHtml += `<div style="position:relative;">
        <div onclick="roulettePlaceBet('${match.id}','${myId}','straight',${n},rouletteChipValue)" style="${rouletteNumberCellStyle(n)}aspect-ratio:1.6;border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:13px;cursor:pointer;border:1px solid #0A1410;">${n}</div>
        ${chipBadge('straight', n)}
      </div>`;
    }
  }
  gridHtml += `</div>`;
  const zeroHtml = `<div style="position:relative;max-width:280px;margin:0 auto;">
    <div onclick="roulettePlaceBet('${match.id}','${myId}','straight',0,rouletteChipValue)" style="${rouletteNumberCellStyle(0)}padding:8px;border-radius:4px;text-align:center;cursor:pointer;border:1px solid #0A1410;">0</div>
    ${chipBadge('straight', 0)}
  </div>`;
  const outsideBtn = (type,param,label)=>`<div style="position:relative;flex:1;">
    <button class="btn-secondary btn-small" style="width:100%;" onclick="roulettePlaceBet('${match.id}','${myId}','${type}',${param===null?'null':JSON.stringify(param)},rouletteChipValue)">${label}</button>
    ${chipBadge(type, param===null?undefined:param)}
  </div>`;
  const betListHtml = myBets.length ? `<div style="margin-top:10px;">
    <p style="font-size:12px;color:var(--cream-dim);margin:4px 0;">Le tue puntate (${totPuntato} in gioco):</p>
    ${myBets.map(b=>`<div class="rank-row"><span>${ROULETTE_BET_TYPES[b.type].label(b.param)} — ${b.amount}</span><button class="btn-danger btn-small" onclick="rouletteRemoveBet('${match.id}','${myId}','${b.id}')">✕</button></div>`).join('')}
  </div>` : `<p class="hint" style="margin-top:10px;">Nessuna puntata ancora piazzata.</p>`;
  return `
    <p class="hint">Valore fiche:</p>
    <div class="row-btns">${chipRow}</div>
    ${zeroHtml}
    ${gridHtml}
    <div class="row-btns" style="flex-wrap:wrap;gap:4px;">
      ${outsideBtn('dozen',1,'1ª dozzina')}${outsideBtn('dozen',2,'2ª dozzina')}${outsideBtn('dozen',3,'3ª dozzina')}
    </div>
    <div class="row-btns" style="flex-wrap:wrap;gap:4px;margin-top:4px;">
      ${outsideBtn('column',1,'Colonna 1')}${outsideBtn('column',2,'Colonna 2')}${outsideBtn('column',3,'Colonna 3')}
    </div>
    <div class="row-btns" style="flex-wrap:wrap;gap:4px;margin-top:4px;">
      ${outsideBtn('low',null,'Manque 1-18')}${outsideBtn('high',null,'Passe 19-36')}
    </div>
    <div class="row-btns" style="flex-wrap:wrap;gap:4px;margin-top:4px;">
      ${outsideBtn('red',null,'🔴 Rosso')}${outsideBtn('black',null,'⚫ Nero')}
    </div>
    <div class="row-btns" style="flex-wrap:wrap;gap:4px;margin-top:4px;">
      ${outsideBtn('even',null,'Pari')}${outsideBtn('odd',null,'Dispari')}
    </div>
    ${betListHtml}
    <div class="row-btns" style="margin-top:12px;">
      <button class="btn-secondary" style="flex:1;" onclick="rouletteClearBets('${match.id}','${myId}')" ${myBets.length?'':'disabled'}>Azzera puntate</button>
      <button class="btn-primary" style="flex:1;" onclick="rouletteConfirmReady('${match.id}','${myId}')" ${match.ready[myId]?'disabled':''}>${match.ready[myId]?'In attesa…':'Pronto, gira!'}</button>
    </div>
    <p class="hint" style="margin-top:6px;">Fiches disponibili: <b>${player.chips}</b>${totPuntato?' (di cui '+totPuntato+' già puntate questo giro)':''}</p>
    ${match.mode==='free' && cachedRouletteStats ? deviceStatsSummaryHTML(cachedRouletteStats) : ''}`;
}
function rouletteResultPanel(match, myId){
  const r = match.lastResult;
  const rows = match.turnOrder.map(id=>{
    const p = match.players.find(x=>x.id===id);
    const net = r.payouts[id]||0;
    const sign = net>0 ? '+' : '';
    const color = net>0 ? '#7FBF9E' : (net<0 ? '#D98C8C' : 'var(--cream-dim)');
    return `<div class="rank-row"><span>${esc(p.name)}${p.isBot?' 🤖':''}</span><span style="color:${color};font-weight:600;">${sign}${net} <span style="color:var(--cream-dim);font-weight:400;">(${p.chips} fiches)</span></span></div>`;
  }).join('');
  const colorLabel = r.color==='red' ? 'Rosso' : (r.color==='black' ? 'Nero' : 'Verde');
  return `<div class="turn-banner" style="text-align:center;">
    <div style="font-size:40px;font-weight:700;margin:6px 0;">${r.number}</div>
    <div>${colorLabel}</div>

  ${rows}
  <button class="btn-primary" style="width:100%;margin-top:12px;" onclick="rouletteNextRound('${match.id}')">Prossimo giro</button>`;
}
function rouletteEndPanel(match, myId){
  if(match.mode==='free'){
    const busted = match.players.find(p=>p.id===match.bustedPlayerId);
    const ranking = match.players.slice().sort((a,b)=>b.chips-a.chips);
    return `<div class="turn-banner" style="text-align:center;">
      <b>${esc(busted.name)}</b> è rimasto senza fiches — partita finita
    </div>
    ${ranking.map(p=>`<div class="rank-row ${p.id===match.bustedPlayerId?'':''}"><span>${esc(p.name)}${p.isBot?' 🤖':''}</span><span>${p.chips} fiches</span></div>`).join('')}
    <button class="btn-primary" style="width:100%;margin-top:12px;" onclick="abandonMatch()">Torna al menu</button>`;
  }
  // torneo
  const ranking = match.players.slice().sort((a,b)=>b.chips-a.chips);
  const titolo = match.tieWinners
    ? 'Pareggio tra ' + match.tieWinners.map(id=>esc(nameOf(match,id))).join(' e ')
    : 'Vince ' + esc(nameOf(match, match.winnerId));
  return `<div class="turn-banner" style="text-align:center;">
    <b>Torneo finito dopo ${ROULETTE_TOURNAMENT_ROUNDS} giri</b><br>${titolo}
  </div>
  ${ranking.map((p,i)=>`<div class="rank-row ${(match.tieWinners?match.tieWinners.includes(p.id):p.id===match.winnerId)?'win':''}"><span>${i+1}. ${esc(p.name)}${p.isBot?' 🤖':''}</span><span>${p.chips} fiches</span></div>`).join('')}
  <button class="btn-primary" style="width:100%;margin-top:12px;" onclick="abandonMatch()">Torna al menu</button>`;
}
// Sceglie il pulsante giusto: "Esci dal tavolo" (lascia il posto senza disturbare
// gli altri) solo per Roulette/Black Jack in modalita' libera dentro una sala
// online; altrimenti il normale "Abbandona" che chiude tutto (gioca-da-solo, torneo).
function tableExitButton(match, myId){
  if(myRoomId && !soloMode && myId && match.mode==='free'){
    return `<button class="btn-danger btn-small" onclick="leaveGameTable('${match.id}','${myId}')">Esci dal tavolo</button>`;
  }
  return `<button class="btn-danger btn-small" onclick="abandonMatch()">Abbandona</button>`;
}
function renderRouletteMatch(match, claim){
  const myId = claim.type==='seat' ? claim.playerId : null;
  const revealAll = claim.type==='all';
  const scoreBar = `<div class="row-pills" style="flex-wrap:wrap;">${match.players.map(p=>`<span class="pill" style="margin:2px 4px 2px 0;${p.busted?'opacity:0.5;':''}">${esc(p.name)}${p.isBot?' 🤖':''} <b>${p.chips}</b></span>`).join('')}</div>`;
  const historyHtml = match.history.length ? `<p class="hint" style="margin-top:6px;">Ultimi numeri: ${match.history.slice(0,10).map(n=>`<span style="display:inline-block;width:20px;height:20px;line-height:20px;text-align:center;border-radius:50%;font-size:11px;margin:0 2px;${rouletteNumberCellStyle(n)}">${n}</span>`).join('')}</p>` : '';
  const modeLabel = match.mode==='tournament' ? ('giro '+match.roundNumber+'/'+ROULETTE_TOURNAMENT_ROUNDS) : ('giro '+match.roundNumber);

  if(match.phase==='ended'){
    maybeSaveRouletteHistory(match);
    return `<div class="card">
      <div class="toolbar"><span>Roulette</span></div>
      ${scoreBar}
      ${rouletteEndPanel(match, myId)}
    </div>`;
  }
  if(match.phase==='spinning'){
    const spinGuardKey = 'spin|'+match.id+'|'+match.roundNumber;
    if(rouletteSpinGuard!==spinGuardKey){
      rouletteSpinGuard = spinGuardKey;
      setTimeout(()=>{ rouletteFinishSpin(match.id); }, 3300);
    }
    return `<div class="card">
      <div class="toolbar"><span>Roulette · ${modeLabel}</span>${tableExitButton(match, myId)}</div>
      ${scoreBar}
      <div class="turn-banner" style="text-align:center;">La pallina gira…</div>
      ${rouletteWheelSVG(true, match.spinResult)}
    </div>`;
  }
  if(match.phase==='result' && myId && match.lastResult && match.lastResult.payouts[myId]!==undefined){
    const key = 'roulette-stats|'+match.id+'|'+match.roundNumber;
    if(statsRecordGuard!==key){ statsRecordGuard = key; recordDeviceOutcome('roulette', match.lastResult.payouts[myId]); }
  }
  const myPlayer = myId ? match.players.find(p=>p.id===myId) : null;
  if(myPlayer && myPlayer.busted && !revealAll){
    if(match.mode==='tournament'){
      if(match.phase==='betting' && !match.ready[myId]){ rouletteConfirmReady(match.id, myId); }
      return `<div class="card">
        <div class="toolbar"><span>Roulette · ${modeLabel}</span>${tableExitButton(match, myId)}</div>
        ${scoreBar}
        <div class="turn-banner">Sei rimasto senza fiches. Aspetta la fine del torneo per vedere la classifica finale.</div>
      </div>`;
    }
    return `<div class="card">
      <div class="toolbar"><span>Roulette · ${modeLabel}</span>${tableExitButton(match, myId)}</div>
      ${scoreBar}
      <div class="turn-banner">Sei rimasto senza fiches.</div>
      <button class="btn-primary" style="width:100%;margin-top:10px;" onclick="rouletteConfirmTopUp('${match.id}','${myId}',1000)">Ricarica (+1000 fiches)</button>
    </div>`;
  }
  if(match.phase==='result'){
    return `<div class="card">
      <div class="toolbar"><span>Roulette · ${modeLabel}</span>${tableExitButton(match, myId)}</div>
      ${scoreBar}
      ${rouletteWheelSVG(false, null)}
      ${rouletteResultPanel(match, myId)}
      ${historyHtml}
    </div>`;
  }
  // fase 'betting'
  if(!myId && !revealAll){
    return `<div class="card"><div class="toolbar"><span>Roulette</span></div><p class="hint">Stai a guardare questa partita.</p></div>`;
  }
  const waitingOthers = match.ready[myId] ? `<div class="turn-banner">In attesa degli altri giocatori…</div>` : '';
  return `<div class="card">
    <div class="toolbar"><span>Roulette · ${modeLabel}</span>${tableExitButton(match, myId)}</div>
    ${scoreBar}
    ${historyHtml}
    ${waitingOthers}
    ${rouletteBettingBoard(match, myId)}
  </div>`;
}

async function bjConfirmBetAndReady(matchId, myId){

function bjPlayerHandsHTML(match, myId, forPlayerId, revealDealer){
  const hands = bjPlayerHands(match, forPlayerId);
  if(!hands.length) return '';
  const isMe = forPlayerId===myId;
  return hands.map((h,idx)=>{
    const isCurrent = match.phase==='playing' && match.currentPlayerId===forPlayerId && match.currentHandIdx===idx;
    const outcomeLabel = h.outcome ? ({blackjack:'🏆 Blackjack 3:2', win:'✅ Vince', push:'➖ Pari', lose:'❌ Perde'})[h.outcome] : '';
    const canAct = isCurrent && isMe && match.phase==='playing';
    const canDouble = canAct && h.cards.length===2 && match.players.find(p=>p.id===myId).chips>=h.bet*2;
    const canSplit = canAct && !h.isSplitHand && bjCanSplit(h.cards) && match.players.find(p=>p.id===myId).chips>=h.bet*2;
    const actionsHtml = canAct ? `<div class="row-btns" style="margin-top:6px;flex-wrap:wrap;">
        <button class="btn-secondary btn-small" onclick="bjPlayerAction('${match.id}','${myId}','hit')">Carta</button>
        <button class="btn-secondary btn-small" onclick="bjPlayerAction('${match.id}','${myId}','stand')">Stai</button>
        ${canDouble?`<button class="btn-secondary btn-small" onclick="bjPlayerAction('${match.id}','${myId}','double')">Raddoppia</button>`:''}
        ${canSplit?`<button class="btn-secondary btn-small" onclick="bjPlayerAction('${match.id}','${myId}','split')">Dividi</button>`:''}
      </div>` : '';
    return `<div style="margin:6px 0;padding:8px;border-radius:8px;${isCurrent?'background:rgba(212,175,106,0.12);border:1px solid #D4AF6A;':''}">
      <div style="display:flex;gap:4px;flex-wrap:wrap;">${bjCardsHTML(h.cards,false)}</div>
      <div class="hint" style="margin-top:4px;">${bjHandTotalLabel(h.cards)} · puntata ${h.doubled?h.bet*2:h.bet}${h.isSplitHand?' (split)':''} ${outcomeLabel}</div>
      ${actionsHtml}
    </div>`;
  }).join('');
}
function bjResultPanel(match, myId){
  const rows = match.turnOrder.map(id=>{
    const p = match.players.find(x=>x.id===id);
    const net = match.lastPayouts ? (match.lastPayouts[id]||0) : 0;
    const sign = net>0 ? '+' : '';
    const color = net>0 ? '#7FBF9E' : (net<0 ? '#D98C8C' : 'var(--cream-dim)');
    return `<div style="margin:8px 0;">
      <div style="font-weight:600;">${esc(p.name)}${p.isBot?' 🤖':''} <span style="color:${color};">${sign}${net}</span></div>
      ${bjPlayerHandsHTML(match, myId, id, true)}
    </div>`;
  }).join('');
  return `${rows}
    <button class="btn-primary" style="width:100%;margin-top:12px;" onclick="bjNextRound('${match.id}')">Prossima mano</button>`;
}
function bjEndPanel(match){
  if(match.mode==='free'){
    const busted = match.players.find(p=>p.id===match.bustedPlayerId);
    const ranking = match.players.slice().sort((a,b)=>b.chips-a.chips);
    return `<div class="turn-banner" style="text-align:center;"><b>${esc(busted.name)}</b> è rimasto senza fiches — partita finita</div>
      ${ranking.map(p=>`<div class="rank-row"><span>${esc(p.name)}${p.isBot?' 🤖':''}</span><span>${p.chips} fiches</span></div>`).join('')}
      <button class="btn-primary" style="width:100%;margin-top:12px;" onclick="abandonMatch()">Torna al menu</button>`;
  }
  const ranking = match.players.slice().sort((a,b)=>b.chips-a.chips);
  const titolo = match.tieWinners ? 'Pareggio tra ' + match.tieWinners.map(id=>esc(nameOf(match,id))).join(' e ') : 'Vince ' + esc(nameOf(match, match.winnerId));
  return `<div class="turn-banner" style="text-align:center;"><b>Torneo finito dopo ${BJ_TOURNAMENT_ROUNDS} mani</b><br>${titolo}</div>
    ${ranking.map((p,i)=>`<div class="rank-row ${(match.tieWinners?match.tieWinners.includes(p.id):p.id===match.winnerId)?'win':''}"><span>${i+1}. ${esc(p.name)}${p.isBot?' 🤖':''}</span><span>${p.chips} fiches</span></div>`).join('')}
    <button class="btn-primary" style="width:100%;margin-top:12px;" onclick="abandonMatch()">Torna al menu</button>`;
}
function renderBlackjackMatch(match, claim){
  const myId = claim.type==='seat' ? claim.playerId : null;
  const revealAll = claim.type==='all';
  const scoreBar = `<div class="row-pills" style="flex-wrap:wrap;">${match.players.map(p=>`<span class="pill" style="margin:2px 4px 2px 0;${p.busted?'opacity:0.5;':''}">${esc(p.name)}${p.isBot?' 🤖':''} <b>${p.chips}</b></span>`).join('')}</div>`;
  const modeLabel = match.mode==='tournament' ? ('mano '+match.roundNumber+'/'+BJ_TOURNAMENT_ROUNDS) : ('mano '+match.roundNumber);

  if(match.phase==='ended'){
    maybeSaveBlackjackHistory(match);
    return `<div class="card"><div class="toolbar"><span>Black Jack</span></div>${scoreBar}${bjEndPanel(match)}</div>`;
  }
  if(match.phase==='result' && myId && match.lastPayouts && match.lastPayouts[myId]!==undefined){
    const key = 'blackjack-stats|'+match.id+'|'+match.roundNumber;
    if(statsRecordGuard!==key){ statsRecordGuard = key; recordDeviceOutcome('blackjack', match.lastPayouts[myId]); }
  }
  const myPlayerGlobal = myId ? match.players.find(p=>p.id===myId) : null;
  if(myPlayerGlobal && myPlayerGlobal.busted && !revealAll && match.phase!=='ended'){
    if(match.mode==='tournament'){
      if(match.phase==='betting' && !match.ready[myId]) bjConfirmReady(match.id, myId);
      return `<div class="card"><div class="toolbar"><span>Black Jack · ${modeLabel}</span>${tableExitButton(match, myId)}</div>${scoreBar}<div class="turn-banner">Sei rimasto senza fiches. Aspetta la fine del torneo per vedere la classifica finale.</div></div>`;
    }
    return `<div class="card"><div class="toolbar"><span>Black Jack · ${modeLabel}</span>${tableExitButton(match, myId)}</div>${scoreBar}<div class="turn-banner">Sei rimasto senza fiches.</div><button class="btn-primary" style="width:100%;margin-top:10px;" onclick="bjConfirmTopUp('${match.id}','${myId}',1000)">Ricarica (+1000 fiches)</button></div>`;
  }
  if(match.phase==='betting'){
    if(!myId && !revealAll) return `<div class="card"><div class="toolbar"><span>Black Jack</span></div><p class="hint">Stai a guardare questa partita.</p></div>`;
    return `<div class="card">
      <div class="toolbar"><span>Black Jack · ${modeLabel}</span>${tableExitButton(match, myId)}</div>
      ${scoreBar}
      ${bjBettingPanel(match, myId)}
    </div>`;
  }
  // fasi 'playing', 'dealer', 'result': mostro il tavolo con banco e tutte le mani
  const dealerHidden = match.phase==='playing' && !match.dealerRevealed;
  const dealerLabel = dealerHidden ? bjHandTotalLabel([match.dealerHand[0]])+' + ?' : bjHandTotalLabel(match.dealerHand);
  const turnBanner = match.phase==='playing'
    ? (match.currentPlayerId===myId || revealAll ? `<div class="turn-bar mine">► TOCCA A ${revealAll?esc(nameOf(match,match.currentPlayerId)):'TE'}</div>` : `<div class="turn-bar">Tocca a <b>${esc(nameOf(match,match.currentPlayerId))}</b> <button class="refresh-mini" onclick="forceResync()" title="Aggiorna">⟳</button></div>`)
    : (match.phase==='dealer' ? `<div class="turn-banner" style="text-align:center;">Il banco gioca…</div>` : '');
  const playersHtml = match.turnOrder.map(id=>{
    if(!bjPlayerHands(match,id).length) return '';
    return `<div style="margin:8px 0;"><div style="font-weight:600;">${esc(nameOf(match,id))}${match.players.find(p=>p.id===id).isBot?' 🤖':''}</div>${bjPlayerHandsHTML(match, myId, id, match.dealerRevealed)}</div>`;
  }).join('');
  return `<div class="card">
    <div class="toolbar"><span>Black Jack · ${modeLabel}</span>${tableExitButton(match, myId)}</div>
    ${scoreBar}
    ${turnBanner}
    <div style="margin:10px 0;">
      <div style="font-weight:600;">Banco</div>
      <div style="display:flex;gap:4px;flex-wrap:wrap;margin-top:4px;">${bjCardsHTML(match.dealerHand, dealerHidden)}</div>
      <div class="hint">${dealerLabel}</div>
    </div>
    ${match.phase!=='result' ? playersHtml : ''}
    ${match.phase==='result' ? bjResultPanel(match, myId) : ''}
  </div>`;
}
setInterval(()=>{
  if(document.visibilityState!=='visible') return;
  const a = document.activeElement;
  if(a && (a.tagName==='INPUT' || a.tagName==='TEXTAREA')) return;
  render();
}, 4000);
document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState==='visible') render(); });

// rendo raggiungibili le funzioni usate dai pulsanti della pagina
window.render = render;
window.recallSeat = recallSeat;
window.tryLoadFromHash = tryLoadFromHash;
window.updateSyncPanel = updateSyncPanel;
window.matchKey = matchKey;

document.addEventListener('DOMContentLoaded', avviaApp);
if(document.readyState !== 'loading') avviaApp();
</script>
</body>
</html>
