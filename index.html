// ---------------- AVVIO ----------------
// L'avvio e' gestito da avviaApp() nel modulo Firebase, che parte quando la
// pagina e' pronta. Manteniamo un controllo di sicurezza poco frequente nel
// caso un aggiornamento in tempo reale andasse perso.
// ============================================================================
// SCALA 40 - rendering
// ============================================================================
let scala40Selected = new Set();
let scala40Staged = [];
let scala40ErrorMsg = '';
let scala40SelKey = '';

function scala40ResetSelectionIfNewTurn(match){
  const key = match.id+'|'+match.currentId+'|'+match.turnStep+'|'+match.dealNumber;
  if(scala40SelKey !== key){
    scala40SelKey = key;
    scala40Selected = new Set();
    scala40Staged = [];
    scala40ErrorMsg = '';
  }
}

function scala40ToggleCard(cardId){
  if(scala40Selected.has(cardId)) scala40Selected.delete(cardId);
  else scala40Selected.add(cardId);
  scala40ErrorMsg = '';
  render(true);
}

async function scala40StageGroup(){
  const match = await getActiveMatch();
  if(!match) return;
  const hand = match.hands[match.currentId] || [];
  const cards = hand.filter(c=>scala40Selected.has(c.id));
  if(!scala40IsValidMeld(cards)){
    scala40ErrorMsg = 'Questa selezione non forma un tris o una scala valida.';
    render(true);
    return;
  }
  scala40Staged.push(cards.map(c=>c.id));
  scala40Selected = new Set();
  scala40ErrorMsg = '';
  render(true);
}
function scala40UnstageGroup(idx){
  scala40Staged.splice(idx,1);
  render(true);
}
async function scala40ConfirmMeld(matchId, playerId){
  const groups = scala40Staged.length ? scala40Staged : (scala40Selected.size ? [[...scala40Selected]] : []);
  if(!groups.length) return;
  const res = await scala40Meld(matchId, playerId, groups);
  if(res && res.ok){
    scala40Staged = []; scala40Selected = new Set(); scala40ErrorMsg = '';
    render(true);
  } else {
    scala40ErrorMsg = (res && res.reason) || 'combinazione non valida';
    render(true);
  }
}
async function scala40TryAttach(matchId, playerId, meldId){
  if(scala40Selected.size===0){
    scala40ErrorMsg = 'Seleziona prima una carta dalla tua mano da aggiungere.';
    render(true);
    return;
  }
  const res = await scala40Attach(matchId, playerId, meldId, [...scala40Selected]);
  if(res && res.ok){ scala40Selected = new Set(); scala40ErrorMsg = ''; render(true); }
  else { scala40ErrorMsg = (res && res.reason) || 'aggiunta non valida'; render(true); }
}
async function scala40TryDiscard(matchId, playerId){
  if(scala40Selected.size!==1){
    scala40ErrorMsg = 'Seleziona esattamente una carta da scartare.';
    render(true);
    return;
  }
  const cardId = [...scala40Selected][0];
  scala40Selected = new Set();
  await scala40Discard(matchId, playerId, cardId);
}

function scala40TableSVG(match, myId){
  const ids = rotateIdsForMe(match.turnOrder, myId);
  const n = ids.length;
  const C = tableConfig(n);
  const VB = C.VB, fs = C.fs;
  const cx = VB/2, cy = VB/2, half = C.half, avatarR = C.avatarR;
  const layout = rectSeatLayout(half, half, n);

  let seats = '';
  ids.forEach((pid,i)=>{
    const {x:relX, y:relY} = layout[i];
    const x = cx+relX, y = cy+relY;
    const player = match.players.find(p=>p.id===pid);
    const cardsLeft = (match.hands[pid]||[]).length;
    const isTurn = pid===match.currentId;
    const isMe = pid===myId;
    const isOpen = match.opened[pid];

    const displayDirY = relY>=0 ? 1 : -1;
    const nameY = y + displayDirY*(avatarR + 26*fs);
    let nm = player.name.length>10 ? player.name.slice(0,9)+'…' : player.name;
    const label = esc(nm) + (isMe?' (tu)':(player.isBot?' ᴀɪ':'')) + (isOpen?' 🔓':'');
    const pillW = Math.max(52*fs, label.length*7*fs + 16);
    const lx = Math.max(pillW/2+3, Math.min(VB-pillW/2-3, x));
    const ly = nameY;

    seats += `
      <g>
        ${isTurn?`<circle cx="${x}" cy="${y}" r="${avatarR+5}" fill="none" stroke="#D4AF6A" stroke-width="2"/>`:''}
        <circle cx="${x}" cy="${y}" r="${avatarR}" fill="${isTurn?'#2C4C3E':(isMe?'#4A2A28':'#223B32')}" stroke="${isTurn?'#D4AF6A':(isMe?'#D98878':'#3C5A4C')}" stroke-width="${isTurn?2.4:1.8}"/>
        <circle cx="${x}" cy="${y}" r="${9*fs}" fill="#16261F" stroke="#D4AF6A" stroke-width="1"/>
        <text x="${x}" y="${y+3.5*fs}" text-anchor="middle" font-family="'IBM Plex Mono',monospace" font-size="${9.5*fs}" font-weight="700" fill="#D4AF6A">${cardsLeft}</text>
        <rect x="${lx-pillW/2}" y="${ly-11*fs}" width="${pillW}" height="${19*fs}" rx="${9.5*fs}" fill="rgba(10,20,16,0.92)" stroke="${isTurn?'#D4AF6A':'#3C5A4C'}" stroke-width="1"/>
        <text x="${lx}" y="${ly+3*fs}" text-anchor="middle" font-family="'Fraunces',serif" font-size="${12.5*fs}" font-weight="700" fill="${isTurn?'#D4AF6A':'#F1ECE1'}">${label}</text>
      </g>`;
  });

  const curIdx = ids.indexOf(match.currentId);
  const nextIdx = curIdx>=0 ? (curIdx+1)%n : -1;
  const centerHalf = C.centerHalf*fs;
  const flowArrowSvg = turnFlowArrowSVG(layout, curIdx, nextIdx, cx, cy, fs, avatarR, centerHalf);

  const tableDefs = `
    <defs>
      <linearGradient id="feltGrad40" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#274539"/><stop offset="60%" stop-color="#1D3730"/><stop offset="100%" stop-color="#132520"/>
      </linearGradient>
    </defs>`;
  const outerPad = 30*fs, feltR = 20*fs;
  return `
    <div class="table-wrap">
      <svg viewBox="0 0 ${VB} ${VB}" width="100%" style="max-width:420px;aspect-ratio:1/1;display:block;height:auto;">
        ${tableDefs}
        <rect x="${cx-half-outerPad}" y="${cy-half-outerPad}" width="${2*(half+outerPad)}" height="${2*(half+outerPad)}" rx="${feltR}" fill="url(#feltGrad40)" stroke="#4A6B5B" stroke-width="2"/>
        <text x="${cx}" y="${cy-2*fs}" text-anchor="middle" font-family="'Fraunces',serif" font-size="${13*fs}" font-weight="700" fill="#D4AF6A">Scala 40</text>
        <text x="${cx}" y="${cy+13*fs}" text-anchor="middle" font-family="'IBM Plex Mono',monospace" font-size="${8.5*fs}" fill="#6C8078">🔓 = gia' aperto</text>
        ${seats}
        ${flowArrowSvg}
      </svg>
    </div>`;
}

function scala40MiniCard(card, dim){

function scala40ScoreBar(match){
  if(match.mode==='secche'){
    const pills = match.players.map(p=>`<span class="pill">${esc(p.name)} <b>${match.handWins[p.id]||0}</b></span>`).join('');
    return `<div class="row-pills">${pills}<span class="pill">prima a ${match.target} man${match.target===1?'o':'i'}</span></div>`;
  }
  const pills = match.players.map(p=>`<span class="pill">${esc(p.name)} <b>${match.totalScores[p.id]||0}</b></span>`).join('');
  return `<div class="row-pills">${pills}<span class="pill">fine a ${match.target} punti (meno ne hai, meglio e')</span></div>`;
}

function renderScala40Match(match, claim){
  const myId = claim.type==='seat' ? claim.playerId : null;
  const revealAll = claim.type==='all';
  scala40ResetSelectionIfNewTurn(match);

  if(match.dealHistory && match.dealHistory.length){
    const ultima = match.dealHistory[match.dealHistory.length-1];
    const perdentiIds = Object.keys(ultima.dealScore).filter(pid=>ultima.dealScore[pid]>0);
    maybeShowLoserPopup(match.id, 'scala40-deal-'+ultima.dealNumber, myId, perdentiIds);
  }

  if(myId && match.phase!=='ended'){
    const dealKey = 'scala40|'+match.id+'|'+match.dealNumber;
    if(!(dealKey in dealTableAnimState)){
      dealTableAnimState[dealKey] = 'started';
      const names = match.turnOrder.map(id=>nameOf(match,id));
      cardFxDealTable(names, match.turnOrder.indexOf(myId), 13, {
        backImg: POKER_BACK_IMG,
        onDone: ()=>{ dealTableAnimState[dealKey]='done'; lastRenderKey=null; render(true); }
      });
    }
    if(dealTableAnimState[dealKey]==='started') return dealWaitingScreenHTML('Scala 40 · '+nameOf(match,myId));
  }

  if(match.phase==='ended'){
    maybeSaveScala40History(match);
    const ranking = match.mode==='secche'
      ? [...match.players].sort((a,b)=>(match.handWins[b.id]||0)-(match.handWins[a.id]||0))
      : [...match.players].sort((a,b)=>(match.totalScores[a.id]||0)-(match.totalScores[b.id]||0));
    const righe = ranking.map((p,i)=>`<div class="rank-row ${p.id===match._winnerId?'winner':''}">
        <span>${i+1}. ${esc(p.name)}${p.id===match._winnerId?' 🏆':''}</span>
        <span>${match.mode==='secche' ? (match.handWins[p.id]||0)+' man'+((match.handWins[p.id]||0)===1?'o':'i') : (match.totalScores[p.id]||0)+' pt'}</span>
      </div>`).join('');
    return `<div class="card">
      <h2>Scala 40 finita!</h2>
      <p class="hint">Vince <b>${esc(nameOf(match,match._winnerId))}</b></p>
      ${righe}
      <button class="btn-primary" style="width:100%;margin-top:12px;" onclick="backToLobbyFromEnd()">Torna al menu</button>
    </div>`;
  }

  const isMyTurn = revealAll || match.currentId===myId;
  const turnBanner = `<div class="turn-bar ${isMyTurn?'mine':''}">${
    isMyTurn
      ? (revealAll ? 'Tocca a <b>'+esc(nameOf(match,match.currentId))+'</b>' : (match.turnStep==='draw' ? '► TOCCA A TE — pesca una carta' : '► TOCCA A TE — cala, attacca o scarta'))
      : 'Tocca a <b>'+esc(nameOf(match,match.currentId))+'</b> — aspetta <button class="refresh-mini" onclick="forceResync()" title="Aggiorna">⟳</button>'
  }</div>`;

  const actionText = match.lastAction ? (()=>{
    const a = match.lastAction;
    if(a.type==='draw') return `${esc(nameOf(match,a.playerId))} pesca ${a.from==='discard'?'dagli scarti':'dal mazzo'}`;
    if(a.type==='meld') return `${esc(nameOf(match,a.playerId))} cala ${a.groups} combinazion${a.groups===1?'e':'i'}`;
    if(a.type==='attach') return `${esc(nameOf(match,a.playerId))} aggiunge una carta a una combinazione`;
    if(a.type==='jokerSwap') return `${esc(nameOf(match,a.playerId))} sostituisce un jolly con la carta vera e lo riprende in mano`;
    if(a.type==='discard') return `${esc(nameOf(match,a.playerId))} scarta ${esc(scala40CardLabel(a.card))}`;
    return '';
  })() : '';
  const actionBanner = actionText ? `<div class="turn-banner">${actionText}</div>` : '';
  const errorBanner = scala40ErrorMsg ? `<div class="turn-banner" style="border-color:#D5262C;background:rgba(213,38,44,.12);">${esc(scala40ErrorMsg)}</div>` : '';

  const tableSvg = scala40TableSVG(match, myId);

  // pesca/scarti: cliccabili solo durante il mio turno in fase 'draw'
  const canDraw = isMyTurn && match.turnStep==='draw' && !revealAll;
  const topDiscard = match.discardPile[match.discardPile.length-1];
  const drawArea = `
    <div class="row-btns" style="align-items:flex-start;gap:18px;justify-content:center;margin:10px 0;">
      <div style="text-align:center;">
        <div onclick="${canDraw?`scala40Draw('${match.id}','${myId}','pile')`:''}" style="cursor:${canDraw?'pointer':'default'};display:inline-block;${canDraw?'box-shadow:0 0 0 2px #D4AF6A;border-radius:6px;':''}">
          <span class="hand-card" style="width:44px;height:62px;display:inline-block;background:#16261F;border-radius:6px;border:1px solid #3C5A4C;"></span>
        </div>
        <div class="hint" style="margin-top:4px;">Mazzo (${match.drawPile.length})</div>
      </div>
      <div style="text-align:center;">
        ${topDiscard ? `<div onclick="${canDraw?`scala40Draw('${match.id}','${myId}','discard')`:''}" style="cursor:${canDraw?'pointer':'default'};display:inline-block;${canDraw?'box-shadow:0 0 0 2px #D4AF6A;border-radius:6px;':''}">${scala40MiniCard(topDiscard)}</div>` : '<div class="hint">vuoto</div>'}
        <div class="hint" style="margin-top:4px;">Scarti (${match.discardPile.length})</div>
      </div>
    </div>`;

  // combinazioni sul tavolo, raggruppate per proprietario
  const canAttach = isMyTurn && match.turnStep==='act' && match.opened[myId] && !revealAll;
  let tavoloHtml = '';
  if(match.melds.length){
    const byOwner = {};
    match.melds.forEach(m=>{ (byOwner[m.ownerId]=byOwner[m.ownerId]||[]).push(m); });
    tavoloHtml = Object.entries(byOwner).map(([ownerId, melds])=>`
      <div style="margin-bottom:8px;">
        <div class="hint" style="margin-bottom:3px;">${esc(nameOf(match,ownerId))}${ownerId===myId?' (tu)':''}</div>
        ${melds.map(m=>`
          <div onclick="${canAttach?`scala40TryAttach('${match.id}','${myId}','${m.id}')`:''}" style="cursor:${canAttach?'pointer':'default'};display:flex;gap:2px;padding:4px;margin-bottom:4px;border-radius:6px;${canAttach?'border:1px dashed #D4AF6A;':'border:1px solid transparent;'}">
            ${m.cards.map(c=>scala40MiniCard(c)).join('')}
          </div>
        `).join('')}
      </div>
    `).join('');
  } else {
    tavoloHtml = `<p class="hint">Nessuna combinazione calata ancora.</p>`;
  }

  // la mia mano (gia' ordinata nello stato stesso da scala40SortHand)
  const myHand = (myId && match.hands[myId]) || [];
  const sortedHand = scala40SortHand(myHand);
  const canAct = isMyTurn && match.turnStep==='act' && !revealAll;
  const handHtml = sortedHand.length ? `<div class="hand-grid6">${sortedHand.map(c=>{
    const sel = scala40Selected.has(c.id);
    const href = scala40ImageHref(c);
    return `<span class="hand-card ${canAct?'':'disabled'}" style="${sel?'box-shadow:0 0 0 3px #D4AF6A;border-radius:8px;transform:translateY(-6px);':''}transition:transform .12s;" onclick="${canAct?`scala40ToggleCard('${c.id}')`:''}" title="${esc(scala40CardLabel(c))}">
      <img src="${href}" style="width:52px;height:74px;object-fit:contain;" onerror="this.style.opacity=0.15"/>
    </span>`;
  }).join('')}</div>` : `<p class="hint">Mano vuota — hai chiuso! 🎉</p>`;

  // gruppi gia' preparati in questo turno (in attesa di conferma)
  const totaleStaged = scala40Staged.reduce((s,g)=> s + g.reduce((s2,id)=>{
    const c = myHand.find(x=>x.id===id); return s2 + (c?scala40Value(c):0);
  },0), 0);
  const stagedHtml = scala40Staged.length ? `
    <div style="margin:10px 0;">
      <div class="hint">Combinazioni preparate (totale ${totaleStaged} pt${match.opened[myId]?'':' su 40 richiesti'}):</div>
      ${scala40Staged.map((g,idx)=>`
        <div style="display:flex;align-items:center;gap:4px;margin:3px 0;">
          <div style="display:flex;gap:2px;">${g.map(id=>{ const c=myHand.find(x=>x.id===id); return c?scala40MiniCard(c):''; }).join('')}</div>
          <button class="btn-secondary btn-small" onclick="scala40UnstageGroup(${idx})">✕</button>
        </div>
      `).join('')}
    </div>` : '';

  const selCount = scala40Selected.size;
  const selCards = myHand.filter(c=>scala40Selected.has(c.id));
  const selValidMeld = selCount>=3 && scala40IsValidMeld(selCards);

  let actionButtons = '';
  if(canAct){
    const btns = [];
    if(selValidMeld){
      btns.push(`<button class="btn-secondary" onclick="scala40StageGroup()">Prepara combinazione (${selCards.reduce((s,c)=>s+scala40Value(c),0)} pt)</button>`);
    }
    if(scala40Staged.length || (selValidMeld && !scala40Staged.length)){
      btns.push(`<button class="btn-primary" onclick="scala40ConfirmMeld('${match.id}','${myId}')">Cala ${scala40Staged.length||1} combinazion${(scala40Staged.length||1)===1?'e':'i'}</button>`);
    }
    if(selCount===1 && !scala40Staged.length){
      btns.push(`<button class="btn-danger" onclick="scala40TryDiscard('${match.id}','${myId}')">Scarta questa carta</button>`);
    }
    if(btns.length) actionButtons = `<div class="row-btns" style="flex-wrap:wrap;margin:10px 0;">${btns.join('')}</div>`;
    else if(!selCount) actionButtons = `<p class="hint">Tocca una o piu' carte della tua mano per formare una combinazione, oppure una sola carta per scartarla o aggiungerla a una combinazione sul tavolo.</p>`;
  }

  return `
    <div class="card">
      <div class="toolbar">
        <span>Scala 40 · ${revealAll?'tutti visibili':esc(nameOf(match,myId))}</span>
        <button class="btn-danger btn-small" onclick="abandonMatch()">Abbandona</button>
      </div>
      ${scala40ScoreBar(match)}
      ${turnBanner}
      ${actionBanner}
      ${errorBanner}
      ${tableSvg}
      ${drawArea}
      <h2>Tavolo</h2>
      ${tavoloHtml}
      <h2>${revealAll?'Mani':'La tua mano'}</h2>
      ${handHtml}
      ${stagedHtml}
      ${actionButtons}
    </div>`;
}

let pokerRaiseAmount = null;
let pokerRaiseKey = '';

function pokerResetRaiseIfNewTurn(match){
  const key = match.id+'|'+match.currentId+'|'+match.street+'|'+match.currentBet;
  if(pokerRaiseKey !== key){ pokerRaiseKey = key; pokerRaiseAmount = null; }
}

function pokerMiniCard(card, w, h){
  w = w||44; h = h||62;
  const href = scala40ImageHref(card);
  return `<span class="hand-card" style="width:${w}px;height:${h}px;display:inline-block;" title="${esc(card.rank+' di '+card.suit)}"><img src="${href}" style="width:100%;height:100%;object-fit:contain;" onerror="this.style.opacity=0.15"/></span>`;
}
function pokerCardBack(w,h){
  w=w||44; h=h||62;
  return `<span class="hand-card" style="width:${w}px;height:${h}px;display:inline-block;"><img src="${POKER_BACK_IMG}" style="width:100%;height:100%;object-fit:contain;border-radius:6px;" onerror="this.parentElement.style.cssText+='background:#16261F;border:1px solid #3C5A4C;';this.remove();"/></span>`;
}

// Tavolo ovale vero (non piu' un rettangolo arrotondato): i posti si
// dispongono sul perimetro di un'ellisse, come un vero tavolo da poker
// pieghevole. Il viewBox e' volutamente piu' largo che alto — proprio
// perche' e' un ovale allungato, e' il gioco che ne approfitta di piu'
// quando il telefono e' in orizzontale (piu' larghezza disponibile), ma
// resta comunque un ovale corretto anche in verticale, solo piu' piccolo.
function pokerTableConfig(n){
  if(n<=4) return {VBW:580, VBH:330, rx:240, ry:118, avatarR:26, fs:1, centerHalf:44, cardScale:0.86};
  if(n<=6) return {VBW:620, VBH:350, rx:258, ry:124, avatarR:24, fs:.95, centerHalf:42, cardScale:0.80};
  return {VBW:660, VBH:370, rx:275, ry:130, avatarR:22, fs:.9, centerHalf:40, cardScale:0.74};
}
// Distribuisce n posti sul perimetro di un'ellisse (rx,ry), partendo dal
// punto piu' basso (theta=0, dove rotateIdsForMe mette sempre "io") e
// proseguendo in senso orario — stessa convenzione d'inizio del vecchio
// schema rettangolare.
function ellipseSeatLayout(rx, ry, n){
  const points = [];
  for(let i=0;i<n;i++){
    const theta = (i/n) * 2*Math.PI;
    points.push({ x: rx*Math.sin(theta), y: ry*Math.cos(theta) });
  }
  return points;
}
function pokerTableSVG(match, myId){
  const ids = rotateIdsForMe(match.turnOrder, myId);
  const n = ids.length;
  const C = pokerTableConfig(n);
  const VBW = C.VBW, VBH = C.VBH, fs = C.fs;
  const cx = VBW/2, cy = VBH/2, rx = C.rx, ry = C.ry, avatarR = C.avatarR;
  const layout = ellipseSeatLayout(rx, ry, n);

  let seats = '';
  ids.forEach((pid,i)=>{
    const {x:relX, y:relY} = layout[i];
    const x = cx+relX, y = cy+relY;
    const player = match.players.find(p=>p.id===pid);
    const isTurn = pid===match.currentId && match.phase==='betting';
    const isMe = pid===myId;
    const isBtn = match.players[match.buttonIdx] && match.players[match.buttonIdx].id===pid;
    const isFolded = match.folded && match.folded[pid];
    const isAllIn = match.allIn && match.allIn[pid];
    const bet = (match.bets && match.bets[pid]) || 0;

    const displayDirY = relY>=0 ? 1 : -1;
    const nameY = y + displayDirY*(avatarR + 26*fs);
    let nm = player.name.length>10 ? player.name.slice(0,9)+'…' : player.name;
    let statusTag = player.eliminated ? ' ☠' : (isFolded ? ' (passa)' : (isAllIn ? ' ALL-IN' : ''));
    const label = esc(nm) + (isMe?' (tu)':(player.isBot?' ᴀɪ':'')) + statusTag;
    const pillW = Math.max(52*fs, label.length*7*fs + 16);
    const lx = Math.max(pillW/2+3, Math.min(VBW-pillW/2-3, x));
    const ly = nameY;
    const dim = player.eliminated || isFolded;

    seats += `
      <g style="${dim?'opacity:0.4;':''}">
        ${isTurn?`<circle cx="${x}" cy="${y}" r="${avatarR+5}" fill="none" stroke="#D4AF6A" stroke-width="2"/>`:''}
        <circle cx="${x}" cy="${y}" r="${avatarR}" fill="${isTurn?'#2C4C3E':(isMe?'#4A2A28':'#223B32')}" stroke="${isTurn?'#D4AF6A':(isMe?'#D98878':'#3C5A4C')}" stroke-width="${isTurn?2.4:1.8}"/>
        <text x="${x}" y="${y+3.5*fs}" text-anchor="middle" font-family="'IBM Plex Mono',monospace" font-size="${8.5*fs}" font-weight="700" fill="#D4AF6A">${player.chips}</text>
        ${isBtn?`<circle cx="${x+avatarR*0.72}" cy="${y-avatarR*0.72}" r="${7*fs}" fill="#F1ECE1" stroke="#16261F" stroke-width="1"/><text x="${x+avatarR*0.72}" y="${y-avatarR*0.72+3*fs}" text-anchor="middle" font-family="'IBM Plex Mono',monospace" font-size="${8*fs}" font-weight="800" fill="#16261F">D</text>`:''}
        ${bet>0?`<foreignObject x="${x-14*fs}" y="${y+avatarR+3*fs}" width="${28*fs}" height="${28*fs}"><div xmlns="http://www.w3.org/1999/xhtml" style="display:flex;">${pokerChipHTML(bet, 28*fs)}</div></foreignObject>`:''}
        <rect x="${lx-pillW/2}" y="${ly-11*fs}" width="${pillW}" height="${19*fs}" rx="${9.5*fs}" fill="rgba(10,20,16,0.92)" stroke="${isTurn?'#D4AF6A':'#3C5A4C'}" stroke-width="1"/>
        <text x="${lx}" y="${ly+3*fs}" text-anchor="middle" font-family="'Fraunces',serif" font-size="${11.5*fs}" font-weight="700" fill="${isTurn?'#D4AF6A':'#F1ECE1'}">${label}</text>
      </g>`;
  });

  const curIdx = match.phase==='betting' ? ids.indexOf(match.currentId) : -1;
  const nextIdx = curIdx>=0 ? (curIdx+1)%n : -1;
  const centerHalf = C.centerHalf*fs;
  const flowArrowSvg = curIdx>=0 ? turnFlowArrowSVG(layout, curIdx, nextIdx, cx, cy, fs, avatarR, centerHalf) : '';

  // le carte comuni stanno su due righe (fino a 3 sopra, le ultime 2 sotto) cosi'
  // possono essere molto piu' grandi di quanto permetterebbe una sola riga da 5;
  // il poker non ha badge/combinazioni extra al centro come Scala 40, quindi puo'
  // usare piu' spazio verticale senza avvicinarsi agli avatar.
  const cardW = 34*fs, cardH = 47*fs;
  function communityCardImg(c){ return `<img src="${scala40ImageHref(c)}" style="width:${cardW}px;height:${cardH}px;object-fit:contain;margin:0 2px;" onerror="this.style.opacity=0.15"/>`; }
  const communityCards = match.community||[];
  const rigaSopra = communityCards.slice(0,3).map(communityCardImg).join('');
  const rigaSotto = communityCards.slice(3,5).map(communityCardImg).join('');
  const communityHtml = communityCards.length
    ? `<div style="display:flex;flex-direction:column;align-items:center;gap:3px;">
         <div style="display:flex;">${rigaSopra}</div>
         ${rigaSotto ? `<div style="display:flex;">${rigaSotto}</div>` : ''}
       </div>`
    : `<span style="color:#6C8078;font-size:${9*fs}px;font-family:'IBM Plex Mono',monospace;">in attesa…</span>`;
  const pot = pokerTotalPotNow(match);

  // Scritte "FLOP · TURN · RIVER" stampate sul feltro attorno al centro,
  // come su un vero tavolo da poker — quattro copie ruotate a raggiera
  // invece di una singola scritta curva, per restare leggibili anche
  // piccole (un unico arco lungo sarebbe stato illeggibile su un ovale
  // cosi' schiacciato).
  const felttextR = Math.min(rx,ry)*0.62;
  const felttext = [0,90,180,270].map(ang => {
    const rad = ang*Math.PI/180;
    const tx = cx + felttextR*Math.sin(rad), ty = cy - felttextR*Math.cos(rad)*(ry/rx);
    return `<text x="${tx.toFixed(1)}" y="${ty.toFixed(1)}" text-anchor="middle" font-size="${7*fs}" font-weight="700" letter-spacing="1.5" fill="#4A6B5B" font-family="'IBM Plex Mono',monospace" transform="rotate(${ang} ${tx.toFixed(1)} ${ty.toFixed(1)})">FLOP · TURN · RIVER</text>`;
  }).join('');

  // "Portabicchieri" decorativi lungo il bordo, come su un vero tavolo
  // pieghevole da poker: solo estetica, nessuna interazione.
  const railPad = 22*fs;
  const cupR = 7*fs;
  let cupHolders = '';
  const cupCount = n<=4 ? 6 : (n<=6 ? 8 : 9);
  for(let i=0;i<cupCount;i++){
    const theta = (i/cupCount) * 2*Math.PI + Math.PI/cupCount;
    const cxp = cx + (rx+railPad*0.6)*Math.sin(theta), cyp = cy - (ry+railPad*0.6)*Math.cos(theta);
    cupHolders += `<circle cx="${cxp.toFixed(1)}" cy="${cyp.toFixed(1)}" r="${cupR}" fill="#0E1A15" stroke="#3C5A4C" stroke-width="1"/>`;
  }

  const tableDefs = `
    <defs>
      <linearGradient id="feltGradPoker" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#274539"/><stop offset="60%" stop-color="#1D3730"/><stop offset="100%" stop-color="#132520"/>
      </linearGradient>
      <linearGradient id="railGradPoker" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#241A10"/><stop offset="100%" stop-color="#120C08"/>
      </linearGradient>
    </defs>`;
  return `
    <div class="table-wrap">
      <svg viewBox="0 0 ${VBW} ${VBH}" width="100%" style="max-width:560px;aspect-ratio:${(VBW/VBH).toFixed(3)};display:block;height:auto;">
        ${tableDefs}
        <ellipse cx="${cx}" cy="${cy}" rx="${rx+railPad}" ry="${ry+railPad}" fill="url(#railGradPoker)" stroke="#0A0704" stroke-width="2"/>
        ${cupHolders}
        <ellipse cx="${cx}" cy="${cy}" rx="${rx}" ry="${ry}" fill="url(#feltGradPoker)" stroke="#4A6B5B" stroke-width="2"/>
        ${felttext}
        <text x="${cx}" y="${cy-58*fs}" text-anchor="middle" font-family="'IBM Plex Mono',monospace" font-size="${9*fs}" fill="#D4AF6A">Piatto: ${pot}</text>
        <foreignObject x="${cx-80*fs}" y="${cy-48*fs}" width="${160*fs}" height="${104*fs}">
          <div xmlns="http://www.w3.org/1999/xhtml" style="display:flex;justify-content:center;align-items:center;height:100%;">${communityHtml}</div>
        </foreignObject>
        ${seats}
        ${flowArrowSvg}
      </svg>
    </div>`;
}

function pokerScoreBar(match){
  const pills = match.players.map(p=>`<span class="pill" style="${p.eliminated?'opacity:0.45;':''}">${esc(p.name)} <b>${p.eliminated?'☠':p.chips}</b></span>`).join('');
  const [sb,bb] = POKER_BLIND_LEVELS[match.blindLevel];
  return `<div class="row-pills">${pills}<span class="pill">bui ${sb}/${bb} · mano ${match.handNumber}</span></div>`;
}

function pokerLastActionText(match){
  const a = match.lastAction;
  if(!a) return '';
  if(a.type==='fold') return `${esc(nameOf(match,a.pid))} passa`;
  if(a.type==='check') return `${esc(nameOf(match,a.pid))} controlla`;
  if(a.type==='call') return `${esc(nameOf(match,a.pid))} paga ${a.amount}`;
  if(a.type==='raise') return `${esc(nameOf(match,a.pid))} rilancia a ${a.amount}`;
  if(a.type==='allin') return `${esc(nameOf(match,a.pid))} va ALL-IN con ${a.amount}!`;
  if(a.type==='uncontested') return `${esc(nameOf(match,a.winnerId))} vince ${a.amount} (tutti gli altri hanno passato)`;
  if(a.type==='showdown') return 'Showdown!';
  return '';
}

function renderPokerMatch(match, claim){
  const myId = claim.type==='seat' ? claim.playerId : null;
  const revealAll = claim.type==='all';

  if(myId && match.phase!=='ended'){
    const dealKey = 'poker|'+match.id+'|'+match.handNumber;
    const active = pokerActivePlayers(match);
    const sonoAttivo = active.some(p=>p.id===myId);
    if(sonoAttivo && !(dealKey in dealTableAnimState)){
      dealTableAnimState[dealKey] = 'started';
      const names = active.map(p=>p.name);
      cardFxDealTable(names, active.findIndex(p=>p.id===myId), 2, {
        backImg: POKER_BACK_IMG,
        onDone: ()=>{ dealTableAnimState[dealKey]='done'; lastRenderKey=null; render(true); }
      });
    }
    if(sonoAttivo && dealTableAnimState[dealKey]==='started') return dealWaitingScreenHTML('Poker · '+esc(nameOf(match,myId)));
  }

  if(match.phase==='ended'){
    maybeSavePokerHistory(match);
    const perdentiIds = match.players.map(p=>p.id).filter(id=>id!==match._winnerId);
    maybeShowLoserPopup(match.id, 'poker-end', myId, perdentiIds);
    const ranking = [...match.players].sort((a,b)=>(b.chips||0)-(a.chips||0));
    const righe = ranking.map((p,i)=>`<div class="rank-row ${p.id===match._winnerId?'winner':''}">
        <span>${i+1}. ${esc(p.name)}${p.id===match._winnerId?' 🏆':''}</span>
        <span>${p.chips} fiches</span>
      </div>`).join('');
    return `<div class="card">
      <h2>Torneo Poker finito!</h2>
      <p class="hint">Vince <b>${esc(nameOf(match,match._winnerId))}</b> con tutte le fiches del tavolo</p>
      ${righe}
      <button class="btn-primary" style="width:100%;margin-top:12px;" onclick="backToLobbyFromEnd()">Torna al menu</button>
    </div>`;
  }

  pokerResetRaiseIfNewTurn(match);
  const tableSvg = pokerTableSVG(match, myId);
  const actionBanner = match.lastAction ? `<div class="turn-banner">${pokerLastActionText(match)}</div>` : '';

  if(match.phase==='handEnd'){
    const perdentiIds = match.players.filter(p=>p.chips>=0).map(p=>p.id).filter(id=>!match.winners.some(w=>w.winnerIds.includes(id)));
    maybeShowLoserPopup(match.id, 'poker-hand-'+match.handNumber, myId, perdentiIds);
    let showdownHtml = '';
    if(match.showdown){
      const rows = Object.entries(match.showdown).map(([pid,val])=>{
        const cards = match.hands[pid].map(c=>pokerMiniCard(c,32,45)).join('');
        const won = match.winners.some(w=>w.winnerIds.includes(pid));
        return `<div style="display:flex;align-items:center;gap:8px;margin:6px 0;${won?'background:rgba(212,175,106,0.12);border-radius:8px;padding:4px;':''}">
          <span style="min-width:70px;">${esc(nameOf(match,pid))}${won?' 🏆':''}</span>
          <div style="display:flex;gap:2px;">${cards}</div>
          <span class="hint">${TEXAS_CATEGORY_NAMES[val[0]]}</span>
        </div>`;
      }).join('');
      showdownHtml = `<div style="margin:10px 0;">${rows}</div>`;
    }
    return `<div class="card">
      <div class="toolbar"><span>Poker · ${revealAll?'tutti visibili':esc(nameOf(match,myId))}</span><button class="btn-danger btn-small" onclick="abandonMatch()">Abbandona</button></div>
      ${pokerScoreBar(match)}
      <div class="turn-bar mine">Mano conclusa</div>
      ${actionBanner}
      <div class="poker-table-layout">
        <div class="poker-table-col">${tableSvg}</div>
        <div class="poker-info-col">
          ${showdownHtml}
          <button class="btn-primary" style="width:100%;margin-top:10px;" onclick="continueAfterPokerHand('${match.id}')">Prossima mano</button>
        </div>
      </div>
    </div>`;
  }

  // fase 'betting'
  const isMyTurn = revealAll || match.currentId===myId;
  const turnBanner = `<div class="turn-bar ${isMyTurn?'mine':''}">${
    isMyTurn
      ? (revealAll ? 'Tocca a <b>'+esc(nameOf(match,match.currentId))+'</b>' : '► TOCCA A TE')
      : 'Tocca a <b>'+esc(nameOf(match,match.currentId))+'</b> — aspetta <button class="refresh-mini" onclick="forceResync()" title="Aggiorna">⟳</button>'
  }</div>`;

  const myHand = (myId && match.hands[myId]) || [];
  const handHtml = myHand.length ? `<div class="hand">${myHand.map(c=>pokerMiniCard(c,58,82)).join('')}</div>` : '';

  const canAct = isMyTurn && !revealAll && myId && !match.folded[myId] && !match.allIn[myId];
  const toCall = myId ? (match.currentBet - (match.bets[myId]||0)) : 0;
  const myChips = myId ? (match.players.find(p=>p.id===myId)||{}).chips : 0;
  const pot = pokerTotalPotNow(match);

  let actionButtons = '';
  if(canAct){
    const foldBtn = `<button class="btn-danger" onclick="pokerFold('${match.id}','${myId}')">Passa</button>`;
    const checkOrCallBtn = toCall<=0
      ? `<button class="btn-secondary" onclick="pokerCheck('${match.id}','${myId}')">Controlla</button>`
      : `<button class="btn-secondary" onclick="pokerCall('${match.id}','${myId}')">Paga ${Math.min(toCall,myChips)}</button>`;
    const maxTotal = (match.bets[myId]||0) + myChips;
    const minRaiseTo = Math.min(maxTotal, match.currentBet + match.minRaise);
    const presets = [
      {label:'Minimo', val: minRaiseTo},
      {label:'Metà piatto', val: Math.min(maxTotal, match.currentBet + Math.max(match.minRaise, Math.round(pot*0.5)))},
      {label:'Piatto', val: Math.min(maxTotal, match.currentBet + Math.max(match.minRaise, pot))},
      {label:'ALL-IN', val: maxTotal}
    ];
    const presetBtns = presets.map(p=>`<button class="btn-secondary btn-small" onclick="pokerSetRaiseAmount(${p.val})">${p.label} (${p.val})</button>`).join('');
    const raiseVal = pokerRaiseAmount ?? minRaiseTo;
    actionButtons = `
      <div class="row-btns" style="flex-wrap:wrap;margin:10px 0;">${foldBtn}${checkOrCallBtn}</div>
      <div style="margin:8px 0;">
        <div class="hint">Rilancia a:</div>
        <div class="row-btns" style="flex-wrap:wrap;margin:6px 0;">${presetBtns}</div>
        <div style="display:flex;gap:6px;align-items:center;">
          <input type="number" id="poker-raise-input" value="${raiseVal}" min="${match.currentBet+1}" max="${maxTotal}" style="width:100px;padding:6px;border-radius:6px;border:1px solid #3C5A4C;background:#16261F;color:#F1ECE1;" oninput="pokerRaiseAmount=parseInt(this.value)||${minRaiseTo}">
          <button class="btn-primary" style="flex:1;" onclick="pokerConfirmRaise('${match.id}','${myId}')">Conferma rilancio</button>
        </div>
      </div>`;
  }

  return `
    <div class="card">
      <div class="toolbar"><span>Poker · ${revealAll?'tutti visibili':esc(nameOf(match,myId))}</span><button class="btn-danger btn-small" onclick="abandonMatch()">Abbandona</button></div>
      ${pokerScoreBar(match)}
      ${turnBanner}
      ${actionBanner}
      <div class="poker-table-layout">
        <div class="poker-table-col">${tableSvg}</div>
        <div class="poker-info-col">
          <h3 style="margin:10px 0 4px;">${revealAll?'':'La tua mano'}</h3>
          ${handHtml}
          ${actionButtons}
        </div>
      </div>
    </div>`;
}

function pokerSetRaiseAmount(val){ pokerRaiseAmount = val; render(true); }
async function pokerConfirmRaise(matchId, playerId){
  const match = await getActiveMatch();
  if(!match) return;
  const myChips = (match.players.find(p=>p.id===playerId)||{}).chips || 0;
  const maxTotal = (match.bets[playerId]||0) + myChips;
  const minRaiseTo = Math.min(maxTotal, match.currentBet + match.minRaise);
  const amount = pokerRaiseAmount ?? minRaiseTo;
  const res = await pokerRaise(matchId, playerId, amount);
  if(!res || !res.ok){
    alert((res&&res.reason) || 'rilancio non valido');
  } else {
    pokerRaiseAmount = null;
  }
}

function f4ColorHex(color){ return color==='R' ? '#D64550' : '#E8B94A'; }
function f4ColorName(color){ return color==='R' ? 'Rosso' : 'Giallo'; }

function f4BoardSVG(match, myId, canInteract){
  const cellSize = 46, padding = 12, topOffset = 34;
  const boardW = F4_COLS*cellSize + padding*2;
  const boardH = F4_ROWS*cellSize + padding*2 + topOffset;
  const winSet = new Set((match.winLine||[]).map(([r,c])=>r+'-'+c));

  let cells = '';
  for(let r=0;r<F4_ROWS;r++){
    for(let c=0;c<F4_COLS;c++){
      const cx = padding + c*cellSize + cellSize/2;
      const cy = topOffset + padding + r*cellSize + cellSize/2;
      const color = match.grid[r][c];
      const isWin = winSet.has(r+'-'+c);
      const isNew = match.lastMove && match.lastMove.row===r && match.lastMove.col===c;
      cells += `<circle cx="${cx}" cy="${cy}" r="${cellSize/2-4}" fill="${color?f4ColorHex(color):'#0A1410'}" stroke="${isWin?'#D4AF6A':'#0F2040'}" stroke-width="${isWin?3.5:2}" class="${isNew?'f4-drop-in':''}"/>`;
    }
  }
  let clickAreas = '';
  if(canInteract){
    for(let c=0;c<F4_COLS;c++){
      const full = f4ColumnFull(match.grid, c);
      const x = padding + c*cellSize;
      if(!full){
        clickAreas += `<rect x="${x}" y="0" width="${cellSize}" height="${boardH}" fill="transparent" style="cursor:pointer;" onclick="forza4Drop('${match.id}','${myId}',${c})"/>`;
        const previewRow = f4DropRow(match.grid, c);
        const previewColor = match.players.find(p=>p.id===myId).color;
        const px = x + cellSize/2, py = topOffset - 12;
        clickAreas += `<circle cx="${px}" cy="${py}" r="9" fill="${f4ColorHex(previewColor)}" opacity="0.55" style="pointer-events:none;"/>`;
      }
    }
  }
  return `
    <svg viewBox="0 0 ${boardW} ${boardH}" width="100%" style="max-width:min(380px, 88vw, 34vh);display:block;margin:0 auto;">
      <rect x="0" y="${topOffset}" width="${boardW}" height="${boardH-topOffset}" rx="14" fill="#1E3A8A" stroke="#16265A" stroke-width="2"/>
      ${cells}
      ${clickAreas}
    </svg>`;
}

function f4ScoreBar(match){
  return `<div class="row-pills">${match.players.map(p=>`
    <span class="pill" style="border-color:${f4ColorHex(p.color)};">
      <span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:${f4ColorHex(p.color)};margin-right:5px;vertical-align:middle;"></span>
      ${esc(p.name)} <b>${match.handWins[p.id]||0}</b>
    </span>`).join('')}<span class="pill">prima a ${match.handsToWin} vittorie</span></div>`;
}

function renderForza4Match(match, claim){
  const myId = claim.type==='seat' ? claim.playerId : null;
  const revealAll = claim.type==='all';

  if(match.phase==='ended'){
    maybeSaveForza4History(match);
    const perdentiIds = match.players.map(p=>p.id).filter(id=>id!==match._winnerId);
    maybeShowLoserPopup(match.id, 'f4-end', myId, perdentiIds);
    const ranking = [...match.players].sort((a,b)=>(match.handWins[b.id]||0)-(match.handWins[a.id]||0));
    const righe = ranking.map(p=>`<div class="rank-row ${p.id===match._winnerId?'winner':''}">
        <span><span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:${f4ColorHex(p.color)};margin-right:6px;"></span>${esc(p.name)}${p.id===match._winnerId?' 🏆':''}</span>
        <span>${match.handWins[p.id]||0} vittorie</span>
      </div>`).join('');
    return `<div class="card">
      <h2>Forza 4 finito!</h2>
      <p class="hint">Vince <b>${esc(nameOf(match,match._winnerId))}</b></p>
      ${righe}
      <button class="btn-primary" style="width:100%;margin-top:12px;" onclick="backToLobbyFromEnd()">Torna al menu</button>
    </div>`;
  }

  if(match.phase==='dealEnd'){
    const boardSvg = f4BoardSVG(match, myId, false);
    if(!match._draw){
      const ultima = match.dealHistory[match.dealHistory.length-1];
      const perdentiIds = match.players.map(p=>p.id).filter(id=>id!==ultima.winnerId);
      maybeShowLoserPopup(match.id, 'f4-deal-'+match.dealHistory.length, myId, perdentiIds);
    }
    const esito = match._draw
      ? 'Pareggio! Griglia piena, nessuno ha allineato 4 gettoni.'
      : `${esc(nameOf(match, match.dealHistory[match.dealHistory.length-1].winnerId))} allinea 4 gettoni e vince la mano!`;
    return `<div class="card">
      <div class="toolbar"><span>Forza 4 · ${revealAll?'tutti visibili':esc(nameOf(match,myId))}</span><button class="btn-danger btn-small" onclick="abandonMatch()">Abbandona</button></div>
      ${f4ScoreBar(match)}
      <div class="turn-banner">${esito}</div>
      ${boardSvg}
      <button class="btn-primary" style="width:100%;margin-top:10px;" onclick="continueAfterForza4Deal('${match.id}')">Prossima mano</button>
    </div>`;
  }

  const isMyTurn = revealAll || match.currentId===myId;
  const canInteract = isMyTurn && !revealAll && !!myId;
  const turnBanner = `<div class="turn-bar ${isMyTurn?'mine':''}">${
    isMyTurn
      ? (revealAll ? 'Tocca a <b>'+esc(nameOf(match,match.currentId))+'</b>' : '► TOCCA A TE — scegli una colonna')
      : 'Tocca a <b>'+esc(nameOf(match,match.currentId))+'</b> — aspetta <button class="refresh-mini" onclick="forceResync()" title="Aggiorna">⟳</button>'
  }</div>`;
  const boardSvg = f4BoardSVG(match, myId, canInteract);

  return `
    <div class="card">
      <div class="toolbar"><span>Forza 4 · ${revealAll?'tutti visibili':esc(nameOf(match,myId))}</span><button class="btn-danger btn-small" onclick="abandonMatch()">Abbandona</button></div>
      ${f4ScoreBar(match)}
      ${turnBanner}
      ${boardSvg}
    </div>`;
}

let bsSelectedShip = null;
let bsCursorRow = 'A';
let bsCursorCol = 1;
let rouletteSpinGuard = null;
let statsRecordGuard = null;
// Stato dell'animazione di distribuzione per ogni mano ('started' finche' gioca,
// assente/'done' quando ha finito): mentre e' 'started', il rendering del gioco
// mostra una schermata di attesa al posto del tavolo vero, cosi' il giocatore
// non si ritrova le carte gia' in mano PRIMA di vederle arrivare visivamente.
let dealTableAnimState = {};
function dealWaitingScreenHTML(gameLabel){
  return `<div class="card">
    <div class="toolbar"><span>${esc(gameLabel)}</span></div>
    <p class="hint" style="text-align:center;margin-top:50px;">Distribuzione delle carte in corso…</p>
  </div>`;
}
let rouletteMode = 'free';
let blackjackMode = 'free';
let bsSelectedHorizontal = true;

// Deduce da 'board' la lista delle navi effettivamente presenti (gruppi di
// celle contigue con lo stesso shipId) e per ciascuna calcola riga/colonna
// iniziale, lunghezza e orientamento — serve a disegnare una forma di scafo
// unica al posto di celle colorate separate, e resta valido qualunque sia la
// flotta configurata (non serve conoscerla in anticipo).
function bsShipsFromBoard(board){
  const byId = {};
  Object.keys(board).forEach(coord=>{
    const cell = board[coord];
    if(!cell.shipId) return;
    const row = coord[0], col = parseInt(coord.slice(1),10);
    (byId[cell.shipId] = byId[cell.shipId] || []).push({coord, row, col});
  });
  return Object.values(byId).map(cells=>{
    cells.sort((a,b)=> a.row===b.row ? a.col-b.col : a.row.localeCompare(b.row));
    const horizontal = cells.length>1 && cells[0].row===cells[1].row;
    return { cells, row: cells[0].row, col: cells[0].col, size: cells.length, horizontal };
  });
}
function bsGridHTML(board, opts){
  opts = opts || {};
  const cellSize = opts.cellSize || 27;
  const gap = 2;
  const idPrefix = opts.idPrefix || 'bs';
  const previewSet = new Set(opts.previewCells||[]);
  const previewValid = opts.previewValid!==false;
  const colLabelW = 16;
  const totalW = colLabelW + BS_SIZE*(cellSize+gap);
  const totalH = cellSize+gap + BS_SIZE*(cellSize+gap);

  let html = `<div style="position:relative;max-width:min(${totalW}px, 90vw, ${opts.vhBudget||32}vh);margin:0 auto;">`;
  html += `<div style="display:grid;grid-template-columns:${colLabelW}px repeat(${BS_SIZE},1fr);grid-template-rows:${cellSize}px repeat(${BS_SIZE},1fr);gap:${gap}px;">`;
  html += `<div></div>`;
  for(let c=1;c<=BS_SIZE;c++) html += `<div style="text-align:center;font-size:9px;color:#8AA396;">${c}</div>`;
  BS_ROWS.forEach(r=>{
    html += `<div style="display:flex;align-items:center;justify-content:center;font-size:9px;color:#8AA396;">${r}</div>`;
    for(let c=1;c<=BS_SIZE;c++){
      const coord = r+c;
      const cell = board[coord];
      let bg = '#16261F', border = '#2C4C3E', content = '';
      const isPreview = previewSet.has(coord);
      if(cell.shot){
        if(cell.shipId){ bg = '#3A1414'; content = ''; } // il segno di colpito arriva dall'animazione/overlay, non piu' dallo sfondo
        else { bg = '#274539'; content = '•'; }
      } else if(isPreview){
        bg = previewValid ? '#D4AF6A' : '#B23B3B'; border = previewValid ? '#F1D89A' : '#E07A7A';
      }
      const clickable = opts.clickable && !cell.shot;
      html += `<div id="${idPrefix}-${coord}" ${clickable?`onclick="${opts.clickAction}('${coord}')"`:''} style="${clickable?'cursor:pointer;':''}width:100%;aspect-ratio:1;background:${bg};border:1px solid ${border};border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:12px;color:#F1ECE1;">${content}</div>`;
    }
  });
  html += `</div>`;

  // Navi disegnate come forme di scafo (SVG sovrapposto), non come sfondo
  // piatto sulle celle: solo sulla propria griglia (revealShips), la nemica
  // resta a celle vuote finche' non viene colpita. Il segno "colpito" invece
  // va disegnato SEMPRE (anche sulla griglia nemica, dove la nave stessa
  // resta nascosta): senza, un colpo a segno sulla griglia d'attacco
  // sparirebbe nel nulla, senza alcun segno visibile sulla cella.
  let overlaySvg = '';
  if(opts.revealShips){
    const ships = bsShipsFromBoard(board);
    ships.forEach(ship=>{
      const rowIdx = BS_ROWS.indexOf(ship.row);
      const x0 = colLabelW+gap + (ship.col-1)*(cellSize+gap);
      const y0 = cellSize+gap + rowIdx*(cellSize+gap);
      const lenPx = ship.size*cellSize + (ship.size-1)*gap;
      const hullMargin = cellSize*0.10;
      const w = ship.horizontal ? lenPx : cellSize;
      const h = ship.horizontal ? cellSize : lenPx;
      const rx = Math.min(w,h)/2 - hullMargin*0.4;
      const anySunk = ship.cells.every(c=>board[c.coord].shot);
      const hullFill = anySunk ? '#5C2C2C' : '#5C6B72';
      const hullStroke = anySunk ? '#8A4444' : '#8A9BA3';
      overlaySvg += `<rect x="${(x0+hullMargin).toFixed(1)}" y="${(y0+hullMargin).toFixed(1)}" width="${(w-hullMargin*2).toFixed(1)}" height="${(h-hullMargin*2).toFixed(1)}" rx="${Math.max(rx,3).toFixed(1)}" fill="${hullFill}" stroke="${hullStroke}" stroke-width="1.5"/>`;
      // sovrastruttura centrale (ponte di comando), solo su navi di 2+ celle
      if(ship.size>=2){
        const midLenPx = cellSize*0.5;
        const bx = ship.horizontal ? x0+lenPx/2-midLenPx/2 : x0+cellSize*0.22;
        const by = ship.horizontal ? y0+cellSize*0.22 : y0+lenPx/2-midLenPx/2;
        const bw = ship.horizontal ? midLenPx : cellSize*0.56;
        const bh = ship.horizontal ? cellSize*0.56 : midLenPx;
        overlaySvg += `<rect x="${bx.toFixed(1)}" y="${by.toFixed(1)}" width="${bw.toFixed(1)}" height="${bh.toFixed(1)}" rx="2" fill="#3E4A50" stroke="#6C7D85" stroke-width="1"/>`;
      }
    });
  }
  BS_ROWS.forEach((r,ri)=>{
    for(let c=1;c<=BS_SIZE;c++){
      const coord = r+c;
      if(!board[coord].shot || !board[coord].shipId) continue;
      const cx = colLabelW+gap + (c-1)*(cellSize+gap) + cellSize/2;
      const cy = cellSize+gap + ri*(cellSize+gap) + cellSize/2;
      const s = cellSize*0.28;
      overlaySvg += `<line x1="${(cx-s).toFixed(1)}" y1="${(cy-s).toFixed(1)}" x2="${(cx+s).toFixed(1)}" y2="${(cy+s).toFixed(1)}" stroke="#F1ECE1" stroke-width="2.4" stroke-linecap="round"/>`;
      overlaySvg += `<line x1="${(cx+s).toFixed(1)}" y1="${(cy-s).toFixed(1)}" x2="${(cx-s).toFixed(1)}" y2="${(cy+s).toFixed(1)}" stroke="#F1ECE1" stroke-width="2.4" stroke-linecap="round"/>`;
    }
  });
  if(overlaySvg) html += `<svg width="${totalW}" height="${totalH}" viewBox="0 0 ${totalW} ${totalH}" style="position:absolute;top:0;left:0;pointer-events:none;">${overlaySvg}</svg>`;
  html += `</div>`;
  return html;
}

function renderBattleshipPlacement(match, myId, revealAll){
  const placed = match.placements[myId] || {};
  const board = match.boards[myId];
  const tutteRronte = BS_SHIPS.every(s=>placed[s.id]);
  const shipRows = `<div style="display:grid;grid-template-columns:1fr 1fr;gap:4px;margin:4px 0;">` + BS_SHIPS.map(s=>{
    const isPlaced = !!placed[s.id];
    const isSelected = bsSelectedShip===s.id;
    return `<div style="display:flex;gap:4px;">
      <button class="btn-secondary btn-small ${isSelected?'mode-active':''}" style="flex:1;${isPlaced?'opacity:0.55;':''}" onclick="bsSelectedShip='${s.id}'; render(true)">${esc(s.name)} (${s.size}) ${isPlaced?'✓':''}</button>
      ${isPlaced?`<button class="btn-danger btn-small" title="Rimuovi" onclick="bsRemoveShip('${match.id}','${myId}','${s.id}')">✕</button>`:''}
    </div>`;
  }).join('') + `</div>`;

  // anteprima della nave selezionata nella posizione corrente del cursore: se la
  // nave era gia' piazzata, la escludo dal controllo di validita' (posso sempre
  // rimetterla dove gia' si trova, o spostarla altrove).
  let previewCells = null, previewValid = true;
  const selectedShipDef = bsSelectedShip && BS_SHIPS.find(s=>s.id===bsSelectedShip);
  if(selectedShipDef){
    previewCells = bsCellsForShip(bsCursorRow, bsCursorCol, selectedShipDef.size, bsSelectedHorizontal);
    if(previewCells){
      const boardVirtuale = Object.assign({}, board);
      const curCells = placed[bsSelectedShip];
      if(curCells) curCells.forEach(k=>{ boardVirtuale[k] = Object.assign({}, board[k], {shipId:null}); });
      previewValid = bsCanPlace(boardVirtuale, previewCells);
    }
  }

  // In orizzontale l'altezza disponibile e' poca: calcolo la dimensione delle
  // celle direttamente in pixel (invece di affidarmi a un max-width via CSS)
  // perche' la griglia usa una riga di intestazione a altezza fissa insieme a
  // righe "1fr" — un max-width applicato dopo il fatto non le fa scalare in
  // modo affidabile, mentre partire da un cellSize piu' piccolo si' .
  const placementIsLandscape = window.innerWidth > window.innerHeight;
  const placementCellSize = placementIsLandscape
    ? (window.innerHeight < 420 ? 16 : 20)
    : (window.innerHeight < 700 ? 15 : 26);
  const grid = bsGridHTML(board, {
    revealShips: true, cellSize: placementCellSize,
    clickable: !match.ready[myId] && !!bsSelectedShip,
    clickAction: 'bsTryPlaceSelected',
    previewCells, previewValid, vhBudget: 40
  });

  const arrowsBlock = (!match.ready[myId] && bsSelectedShip) ? `
    <div style="display:flex;flex-direction:column;align-items:center;gap:4px;margin:10px 0;">
      <button class="btn-secondary btn-small" style="width:44px;" onclick="bsMoveCursor(-1,0)">↑</button>
      <div class="row-btns" style="gap:4px;">
        <button class="btn-secondary btn-small" style="width:44px;" onclick="bsMoveCursor(0,-1)">←</button>
        <button class="btn-secondary btn-small" style="width:44px;" onclick="bsMoveCursor(1,0)">↓</button>
        <button class="btn-secondary btn-small" style="width:44px;" onclick="bsMoveCursor(0,1)">→</button>
      </div>
      <button class="btn-primary btn-small" style="margin-top:6px;" ${previewCells&&previewValid?'':'disabled'} onclick="bsPlaceAtCursor('${match.id}','${myId}')">Piazza qui (${bsCursorRow}${bsCursorCol})</button>
      ${previewCells&&!previewValid ? '<p class="hint" style="color:#E07A7A;margin:2px 0;">Posizione non valida qui.</p>' : ''}
    </div>` : '';

  const readyButtons = !match.ready[myId] ? `<div class="row-btns" style="margin-top:10px;">
      <button class="btn-secondary" style="flex:1;" onclick="bsAutoPlace('${match.id}','${myId}')">Piazza casualmente</button>
      <button class="btn-primary" style="flex:1;" ${tutteRronte?'':'disabled'} onclick="bsConfirmReady('${match.id}','${myId}')">Pronto!</button>
    </div>` : '';

  return `<div class="card">
    <div class="toolbar"><span>Battaglia Navale · posiziona la flotta</span><button class="btn-danger btn-small" onclick="abandonMatch()">Abbandona</button></div>
    ${match.ready[myId] ? `<div class="turn-banner">Flotta pronta! Aspetta l'avversario…</div>` : `
    <div class="boardgame-layout">
      <div class="boardgame-info-col">
        <p class="hint">Scegli una nave, poi usa le frecce (o tocca la griglia) per posizionarla, quindi conferma.</p>
        ${shipRows}
        <div class="row-btns" style="margin:4px 0;">
          <button class="btn-secondary" onclick="bsSelectedHorizontal=!bsSelectedHorizontal; render(true)">Orientamento: ${bsSelectedHorizontal?'Orizzontale →':'Verticale ↓'}</button>
        </div>
      </div>
      <div class="boardgame-board-col">
        ${grid}
        ${arrowsBlock}
        ${readyButtons}
      </div>
    </div>`}
  </div>`;
}

// Animazioni d'impatto: un overlay a schermo intero (come per cardFxThrow),
// con l'effetto posizionato esattamente sopra la cella colpita tramite
// getBoundingClientRect — cosi' funziona identico sia sulla griglia
// d'attacco che sulla propria, qualunque sia la dimensione delle celle.
function bsImpactOverlay(){
  const overlay = document.createElement('div');
  overlay.style.cssText = 'position:fixed;inset:0;z-index:9998;pointer-events:none;overflow:visible;';
  document.body.appendChild(overlay);
  return overlay;
}
function bsSplashAt(cellId){
  sndSplash();
  const cellEl = document.getElementById(cellId);
  if(!cellEl || typeof gsap==='undefined') return;
  const rect = cellEl.getBoundingClientRect();
  const cx = rect.left+rect.width/2, cy = rect.top+rect.height/2;
  const overlay = bsImpactOverlay();
  // due anelli concentrici che si espandono come un'onda sulla superficie dell'acqua
  for(let i=0;i<2;i++){
    const ring = document.createElement('div');
    ring.style.cssText = `position:absolute;left:${cx}px;top:${cy}px;width:${rect.width}px;height:${rect.width}px;margin:${-rect.width/2}px;border-radius:50%;border:2px solid #8FC7E0;`;
    overlay.appendChild(ring);
    gsap.fromTo(ring, {scale:0.2, opacity:0.8}, {scale:2.4, opacity:0, duration:0.55, delay:i*0.10, ease:'power1.out'});
  }
  // goccioline che schizzano fuori e ricadono, come uno spruzzo vero
  for(let i=0;i<6;i++){
    const drop = document.createElement('div');
    const ang = (i/6)*Math.PI*2 + Math.random()*0.4;
    const dist = rect.width*0.9 + Math.random()*rect.width*0.5;
    const dx = Math.cos(ang)*dist, dy = Math.sin(ang)*dist*0.6 - rect.width*0.3;
    drop.style.cssText = `position:absolute;left:${cx}px;top:${cy}px;width:4px;height:4px;margin:-2px;border-radius:50%;background:#8FC7E0;opacity:0;`;
    overlay.appendChild(drop);
    gsap.timeline()
      .to(drop, {x:dx*0.5, y:dy, opacity:1, duration:0.28, ease:'power2.out'})
      .to(drop, {x:dx, y:dy+rect.width*0.7, opacity:0, duration:0.32, ease:'power1.in'});
  }
  setTimeout(()=> overlay.remove(), 750);
}
function bsExplosionAt(cellId){
  sndExplosion();
  vibrate([40]);
  const cellEl = document.getElementById(cellId);
  if(!cellEl || typeof gsap==='undefined') return;
  const rect = cellEl.getBoundingClientRect();
  const cx = rect.left+rect.width/2, cy = rect.top+rect.height/2;
  const overlay = bsImpactOverlay();
  // vampata centrale arancione, si espande e svanisce in fretta
  const flash = document.createElement('div');
  flash.style.cssText = `position:absolute;left:${cx}px;top:${cy}px;width:${rect.width*1.6}px;height:${rect.width*1.6}px;margin:${-rect.width*0.8}px;border-radius:50%;background:radial-gradient(circle, #FFE08A 0%, #E0752C 45%, rgba(224,117,44,0) 75%);`;
  overlay.appendChild(flash);
  gsap.fromTo(flash, {scale:0.2, opacity:1}, {scale:1.4, opacity:0, duration:0.45, ease:'power2.out'});
  // anello di fumo, piu' lento della vampata
  const smoke = document.createElement('div');
  smoke.style.cssText = `position:absolute;left:${cx}px;top:${cy}px;width:${rect.width}px;height:${rect.width}px;margin:${-rect.width/2}px;border-radius:50%;border:3px solid rgba(90,90,90,0.5);`;
  overlay.appendChild(smoke);
  gsap.fromTo(smoke, {scale:0.3, opacity:0.7}, {scale:2.2, opacity:0, duration:0.65, ease:'power1.out'});
  // detriti scagliati via, ciascuno con la propria rotazione e traiettoria
  for(let i=0;i<8;i++){
    const bit = document.createElement('div');
    const ang = Math.random()*Math.PI*2;
    const dist = rect.width*0.7 + Math.random()*rect.width*0.9;
    const dx = Math.cos(ang)*dist, dy = Math.sin(ang)*dist - rect.width*0.4;
    bit.style.cssText = `position:absolute;left:${cx}px;top:${cy}px;width:3px;height:3px;margin:-1.5px;background:#2A1E14;opacity:0;`;
    overlay.appendChild(bit);
    gsap.timeline()
      .to(bit, {x:dx, y:dy*0.6, rotation:Math.random()*360, opacity:1, duration:0.30, ease:'power2.out'})
      .to(bit, {y:dy*0.6+rect.width*0.9, opacity:0, duration:0.35, ease:'power1.in'});
  }
  // piccolo tremolio della cella colpita, per dare peso all'impatto
  gsap.timeline()
    .to(cellEl, {x:-3, duration:0.05})
    .to(cellEl, {x:3, duration:0.05})
    .to(cellEl, {x:-2, duration:0.05})
    .to(cellEl, {x:0, duration:0.05});
  setTimeout(()=> overlay.remove(), 850);
}
// Innesca l'animazione giusta per l'ultimo colpo sparato, una sola volta per
// colpo (bsLastAnimatedShotKey traccia quale e' gia' stato mostrato, cosi' i
// render successivi allo stesso stato non lo ripetono). La cella da colpire
// si trova sulla propria griglia se il bersaglio ero io, sulla griglia
// nemica se ho sparato io.
let bsLastAnimatedShotKey = null;
function activateBattleshipShotAnimation(match, claim){
  if(!match.lastShot) return;
  const myId = claim && claim.type==='seat' ? claim.playerId : null;
  const shotKey = match.id+'|'+match.lastShot.targetId+'|'+match.lastShot.coord;
  if(bsLastAnimatedShotKey===shotKey) return;
  bsLastAnimatedShotKey = shotKey;
  const idPrefix = match.lastShot.targetId===myId ? 'bs-def' : 'bs-atk';
  const cellId = idPrefix+'-'+match.lastShot.coord;
  if(match.lastShot.hit) bsExplosionAt(cellId); else bsSplashAt(cellId);
}
function bsLastShotText(match){
  const s = match.lastShot;
  if(!s) return '';
  const chi = esc(nameOf(match, s.shooterId));
  if(!s.hit) return `${chi} spara in ${s.coord}: acqua.`;
  if(s.sunk) return `${chi} spara in ${s.coord}: colpito e affondato! (${esc(BS_SHIPS.find(sh=>sh.id===s.shipId).name)})`;
  return `${chi} spara in ${s.coord}: colpito!`;
}

function renderBattleshipMatch(match, claim){
  const myId = claim.type==='seat' ? claim.playerId : null;
  const revealAll = claim.type==='all';

  if(match.phase==='ended'){
    maybeSaveBattleshipHistory(match);
    const perdentiIds = match.players.map(p=>p.id).filter(id=>id!==match.winnerId);
    maybeShowLoserPopup(match.id, 'bs-end', myId, perdentiIds);
    return `<div class="card">
      <h2>Battaglia Navale finita!</h2>
      <p class="hint">Vince <b>${esc(nameOf(match,match.winnerId))}</b> affondando l'intera flotta avversaria</p>
      <button class="btn-primary" style="width:100%;margin-top:12px;" onclick="backToLobbyFromEnd()">Torna al menu</button>
    </div>`;
  }

  if(match.phase==='placement'){
    if(revealAll){
      const rows = match.turnOrder.map(id=>`<h3 style="margin:10px 0 4px;">${esc(nameOf(match,id))} ${match.ready[id]?'✓ pronto':'(in preparazione)'}</h3>${bsGridHTML(match.boards[id],{revealShips:true, cellSize:22})}`).join('');
      return `<div class="card"><div class="toolbar"><span>Battaglia Navale · posizionamento</span><button class="btn-danger btn-small" onclick="abandonMatch()">Abbandona</button></div>${rows}</div>`;
    }
    return renderBattleshipPlacement(match, myId, revealAll);
  }

  // fase 'battle'
  const opponentId = match.turnOrder.find(id=>id!==myId) || match.turnOrder[1];
  const isMyTurn = revealAll || match.currentId===myId;
  const turnBanner = `<div class="turn-bar ${isMyTurn?'mine':''}">${
    isMyTurn
      ? (revealAll ? 'Tocca a <b>'+esc(nameOf(match,match.currentId))+'</b>' : '► TOCCA A TE — scegli una cella da colpire')
      : 'Tocca a <b>'+esc(nameOf(match,match.currentId))+'</b> — aspetta <button class="refresh-mini" onclick="forceResync()" title="Aggiorna">⟳</button>'
  }</div>`;
  const canAttack = isMyTurn && !revealAll && !!myId;
  // In orizzontale le due griglie stanno affiancate (larghezza abbondante),
  // quindi possono restare piu' grandi; in verticale sono impilate e devono
  // condividere l'altezza disponibile, percio' un budget verticale minore.
  const isLandscape = window.innerWidth > window.innerHeight;
  const shortHeight = window.innerHeight < 420;
  // Il cellSize guida direttamente tutte le misure interne della griglia
  // (etichette, overlay dei colpi): partire da un valore piu' piccolo quando
  // lo spazio scarseggia scala tutto in modo coerente, a differenza di un
  // max-width imposto dopo via CSS sulla riga di intestazione a altezza fissa.
  const atkCellSize = isLandscape ? (shortHeight ? 15 : 19) : (shortHeight ? 16 : 22);
  const defCellSize = isLandscape ? (shortHeight ? 13 : 17) : (shortHeight ? 14 : 19);
  const attackGrid = bsGridHTML(match.boards[opponentId], { revealShips:false, cellSize:atkCellSize, clickable:canAttack, clickAction:`bsShootAt.bind(null,'${match.id}','${myId}')`, idPrefix:'bs-atk', vhBudget:40 });
  const myGrid = bsGridHTML(match.boards[myId||match.turnOrder[0]], { revealShips:true, cellSize:defCellSize, idPrefix:'bs-def', vhBudget:40 });
  const lastShotHtml = match.lastShot ? `<div class="turn-banner">${bsLastShotText(match)}</div>` : '';

  // recap della flotta avversaria: quali navi sono gia' state affondate, cosi'
  // non serve tenere a mente lo storico dei colpi per sapere cosa manca.
  const oppPlacements = match.placements[opponentId] || {};
  const sunkRecap = BS_SHIPS.map(s=>{
    const cells = oppPlacements[s.id];
    const isSunk = cells && bsShipSunk(match.boards[opponentId], oppPlacements, s.id);
    return `<span class="hand-card btn-small" style="display:inline-flex;align-items:center;gap:4px;padding:5px 9px;border-radius:14px;${isSunk?'opacity:0.5;text-decoration:line-through;':''}">${isSunk?'💥':'🚢'} ${esc(s.name)}</span>`;
  }).join(' ');
  const sunkCount = BS_SHIPS.filter(s=> oppPlacements[s.id] && bsShipSunk(match.boards[opponentId], oppPlacements, s.id)).length;

  return `<div class="card">
    <div class="toolbar"><span>Battaglia Navale · ${revealAll?'tutti visibili':esc(nameOf(match,myId))}</span><button class="btn-danger btn-small" onclick="abandonMatch()">Abbandona</button></div>
    ${turnBanner}
    ${lastShotHtml}
    <h3 style="margin:10px 0 4px;">Flotta avversaria (${sunkCount}/${BS_SHIPS.length} affondate)</h3>
    <div style="display:flex;flex-wrap:wrap;gap:6px;">${sunkRecap}</div>
    <div class="bs-grids-row">
      <div>
        <h3 style="margin:10px 0 4px;">I tuoi attacchi</h3>
        ${attackGrid}
      </div>
      <div>
        <h3 style="margin:10px 0 4px;">La tua flotta</h3>
        ${myGrid}
      </div>
    </div>
  </div>`;
}

function bsMoveCursor(dr, dc){
  const rowIdx = BS_ROWS.indexOf(bsCursorRow);
  const newRowIdx = Math.max(0, Math.min(BS_ROWS.length-1, rowIdx+dr));
  bsCursorRow = BS_ROWS[newRowIdx];
  bsCursorCol = Math.max(1, Math.min(BS_SIZE, bsCursorCol+dc));
  render(true);
}
function bsSetCursor(coord){
  bsCursorRow = coord[0];
  bsCursorCol = parseInt(coord.slice(1));
  render(true);
}
async function bsPlaceAtCursor(matchId, playerId){
  if(!bsSelectedShip) return;
  await bsPlaceShipManual(matchId, playerId, bsSelectedShip, bsCursorRow, bsCursorCol, bsSelectedHorizontal);
}
// Click diretto sulla griglia: sposta il cursore li', non piazza subito. Le
// frecce e il pulsante "Piazza qui" restano sempre il modo certo di
// confermare, indipendentemente da eventuali differenze di comportamento del
// tocco sulla griglia tra un dispositivo e l'altro.
async function bsTryPlaceSelected(coord){
  if(!bsSelectedShip) return;
  bsSetCursor(coord);
}

// ============================================================================
// DAMA ITALIANA - rendering
// ============================================================================
let damaSelected = null;

function damaLegalOptionsFor(match, myColor, r, c){
  const legal = damaAllLegalMoves(match.board, myColor);
  return legal.options.filter(o=>o.from.r===r && o.from.c===c);
}
function damaSelectableSquares(match, myColor){
  const legal = damaAllLegalMoves(match.board, myColor);
  const set = new Set();
  legal.options.forEach(o=> set.add(o.from.r+'_'+o.from.c));
  return set;
}
async function damaCellClick(matchId, myId, r, c){
  const match = await getActiveMatch();
  if(!match || match.phase!=='playing') return;
  const player = match.players.find(p=>p.id===myId);
  if(!player || player.color!==match.currentColor) return;
  const piece = damaGet(match.board, r, c);
  if(damaSelected){
    const options = damaLegalOptionsFor(match, player.color, damaSelected.r, damaSelected.c);
    const chosen = options.find(o=> o.path[o.path.length-1].r===r && o.path[o.path.length-1].c===c);
    if(chosen){
      damaSelected = null;
      await damaMakeMove(matchId, myId, chosen.from, r, c);
      return;
    }
  }
  const selectable = damaSelectableSquares(match, player.color);
  if(piece && piece.color===player.color && selectable.has(r+'_'+c)){
    damaSelected = {r,c};
  } else {
    damaSelected = null;
  }
  await render(true);
}
function damaBoardHTML(match, myId, revealAll){
  const player = myId ? match.players.find(p=>p.id===myId) : null;
  const canPlay = !revealAll && player && player.color===match.currentColor && match.phase==='playing';
  const selectable = canPlay ? damaSelectableSquares(match, player.color) : new Set();

function chessSelectableSquares(match, myColor){
  const legal = chessAllLegalMoves(match.board, myColor, match.chessState);
  const set = new Set();
  legal.forEach(m=> set.add(m.from.r+'_'+m.from.c));
  return set;
}
function chessLegalOptionsFor(match, myColor, r, c){
  return chessAllLegalMoves(match.board, myColor, match.chessState).filter(m=>m.from.r===r && m.from.c===c);
}
async function chessCellClick(matchId, myId, r, c){
  const match = await getActiveMatch();
  if(!match || match.phase!=='playing' || match.pendingPromotion) return;
  const player = match.players.find(p=>p.id===myId);
  if(!player || player.color!==match.currentColor) return;
  const piece = chessGet(match.board, r, c);
  if(chessSelected){
    const options = chessLegalOptionsFor(match, player.color, chessSelected.r, chessSelected.c);
    const chosen = options.find(o=> o.to.r===r && o.to.c===c);
    if(chosen){
      const from = chessSelected;
      chessSelected = null;
      await chessMakeMove(matchId, myId, from, r, c);
      return;
    }
  }
  const selectable = chessSelectableSquares(match, player.color);
  if(piece && piece.color===player.color && selectable.has(r+'_'+c)) chessSelected = {r,c};
  else chessSelected = null;
  await render(true);
}
async function chessChoosePromotion(matchId, myId, type){
  const match = await getActiveMatch();
  if(!match || !match.pendingPromotion) return;
  const { from, to } = match.pendingPromotion;
  await chessMakeMove(matchId, myId, from, to.r, to.c, type);

// ROULETTE - rendering
// ============================================================================
let rouletteChipValue = 10;
const ROULETTE_CHIP_PRESETS = [5,10,25,50,100,500];

// Applica gli angoli finali di ruota/pallina SOLO dopo che l'HTML e' gia' nel DOM
// da almeno un frame dipinto. Se lo facessimo nello stesso momento in cui creiamo
// l'HTML, il browser non avrebbe nessuno stato "prima" da cui animare la
// transizione e salterebbe dritto al risultato, senza mostrare alcun movimento.
// Il doppio requestAnimationFrame e' la tecnica standard per garantirlo: il primo
// frame fa sì che il browser abbia "visto" lo stato di riposo, il secondo applica
// il cambiamento che deve animarsi.
// La ruota gira DI CONTINUO per tutta la durata dello spin (come una vera
// roulette, che non si arresta mai in una posizione "calcolata"): e' la
// pallina a dover convergere nel punto giusto, tenendo conto di dove si
// trovera' la ruota esattamente nell'istante in cui la pallina si ferma.
// Dato che la ruota gira a velocita' angolare costante e nota in anticipo,
// questo punto futuro e' calcolabile fin dall'inizio, senza bisogno di
// inseguire un bersaglio che si sposta frame per frame.
const ROULETTE_SPIN_DURATION = 4.6; // secondi, intera corsa della pallina
const ROULETTE_WHEEL_DEG_PER_SEC = 46; // velocita' angolare costante della ruota
function activateRouletteSpinAnimation(){
  const wheel = document.getElementById('roulette-wheel-svg');
  const ballDot = document.getElementById('roulette-ball-dot');
  const resultAttr = wheel && wheel.getAttribute('data-result-number');
  if(resultAttr==null || !ballDot) return;
  const resultNumber = parseInt(resultAttr, 10);

  // Ruota: rotazione lineare continua, senza mai fermarsi da sola — e' la
  // pallina che deve "trovarla" al momento giusto, non il contrario.
  gsap.to(wheel, {
    rotation: `+=${ROULETTE_WHEEL_DEG_PER_SEC * ROULETTE_SPIN_DURATION}`,
    duration: ROULETTE_SPIN_DURATION,
    ease: 'none',
    transformOrigin: '50% 50%'
  });

  // Angolo assoluto (nello schermo) a cui si trovera' il CENTRO del settore
  // vincente quando la ruota avra' girato per tutta la durata dello spin:
  // e' un valore fisso e noto gia' ora, non qualcosa da rincorrere.
  const arcSize = 360/37;
  const wheelAngleAtEnd = ROULETTE_WHEEL_DEG_PER_SEC * ROULETTE_SPIN_DURATION;
  const finalBallAngle = wheelAngleAtEnd + rouletteWheelAngleFor(resultNumber) + arcSize/2 - 90; // -90: 0 gradi SVG punta a destra, vogliamo "in alto"

  const cx = parseFloat(wheel.dataset.cx), cy = parseFloat(wheel.dataset.cy);
  const outerR = parseFloat(wheel.dataset.outerBallR);
  const innerR = parseFloat(wheel.dataset.innerBallR);

  function place(angleDeg, radius){
    const rad = angleDeg*Math.PI/180;
    gsap.set(ballDot, { left: cx+radius*Math.cos(rad), top: cy+radius*Math.sin(rad) });
  }

  // Stato animato: angolo e raggio della pallina, applicati ad ogni frame.
  // Fase 1 — corsa veloce sul bordo esterno, in senso contrario alla ruota,
  // con una lieve decelerazione (come l'attrito dell'aria e della pista).
  // Fase 2 — "caduta" verso la pista interna con un piccolo rimbalzo/
  // assestamento (come quando la pallina reale scavalca gli ultimi
  // separatori prima di fermarsi), fino al punto finale gia' calcolato.
  const state = { angle: finalBallAngle - 360*7, radius: outerR };
  const tl = gsap.timeline({
    onUpdate: ()=> place(state.angle, state.radius)
  });
  // NB: la prima tween anima SOLO l'angolo (mai il raggio): se anche lei
  // toccasse "radius" (anche come no-op verso outerR) confliggerebbe con la
  // tween successiva che lo fa scendere verso innerR, dato che entrambe
  // scriverebbero sulla stessa proprieta' dello stesso oggetto "state" nello
  // stesso intervallo di tempo — la tween piu' lunga vincerebbe sempre alla
  // fine, riportando la pallina sul bordo esterno invece di lasciarla
  // scendere verso il centro (il bug segnalato).
  tl.to(state, { angle: finalBallAngle - 360*1.15, duration: ROULETTE_SPIN_DURATION*0.62, ease:'power1.in' })
    .to(state, { radius: innerR, duration: ROULETTE_SPIN_DURATION*0.16, ease:'power1.in' }, '<')
    .to(state, { angle: finalBallAngle, duration: ROULETTE_SPIN_DURATION*0.38, ease:'back.out(2.2)' });

  // Tick sonori della pallina sui separatori: ravvicinati all'inizio (corsa
  // veloce), via via piu' radi verso la fine della fase 1 -- non legati alla
  // posizione esatta frame per frame (sarebbe fragile da sincronizzare), ma
  // a intervalli pianificati in anticipo che imitano lo stesso rallentamento
  // della pallina vera.
  const runPhaseMs = ROULETTE_SPIN_DURATION*0.62*1000;
  let t = 0, gap = 70;
  while(t < runPhaseMs){
    setTimeout(sndBallTick, t);
    t += gap;
    gap *= 1.10; // ogni intervallo un po' piu' lungo del precedente
  }
  setTimeout(sndBallTick, ROULETTE_SPIN_DURATION*1000 - 60);
}
// Costruisce il disegno della ruota: bordo esterno in legno, separatori
// metallici tra i settori, piccoli deflettori decorativi, mozzo centrale con
// gradiente. E' un SVG statico (la rotazione la applica GSAP sull'elemento
// intero via CSS transform), quindi puo' essere disegnato una volta sola con
// dettagli fissi senza penalita' di prestazioni durante lo spin.
function rouletteWheelSVG(spinning, resultNumber){
  const size = 240;
  const cx = size/2, cy = size/2;
  const rimW = 16;
  const R = size/2 - rimW; // raggio dei settori numerici, dentro il bordo
  let segs = '';
  ROULETTE_WHEEL_ORDER.forEach((n,i)=>{
    const a0 = (i*(360/37)-90)*Math.PI/180, a1 = ((i+1)*(360/37)-90)*Math.PI/180;
    const x0 = cx+R*Math.cos(a0), y0 = cy+R*Math.sin(a0);
    const x1 = cx+R*Math.cos(a1), y1 = cy+R*Math.sin(a1);
    const xIn0 = cx+(R*0.32)*Math.cos(a0), yIn0 = cy+(R*0.32)*Math.sin(a0);
    const xIn1 = cx+(R*0.32)*Math.cos(a1), yIn1 = cy+(R*0.32)*Math.sin(a1);
    const color = n===0 ? '#2E7D4F' : (ROULETTE_RED.has(n) ? '#B23B3B' : '#181410');
    segs += `<path d="M${xIn0.toFixed(2)},${yIn0.toFixed(2)} L${x0.toFixed(2)},${y0.toFixed(2)} A${R},${R} 0 0,1 ${x1.toFixed(2)},${y1.toFixed(2)} L${xIn1.toFixed(2)},${yIn1.toFixed(2)} Z" fill="${color}" stroke="#C9C2AE" stroke-width="0.6"/>`;
    const mid = (a0+a1)/2;
    const tx = cx+(R*0.68)*Math.cos(mid), ty = cy+(R*0.68)*Math.sin(mid);
    const rotDeg = mid*180/Math.PI + 90;
    segs += `<text x="${tx.toFixed(2)}" y="${ty.toFixed(2)}" fill="#F1ECE1" font-size="9" font-weight="600" text-anchor="middle" dominant-baseline="middle" transform="rotate(${rotDeg.toFixed(1)} ${tx.toFixed(2)} ${ty.toFixed(2)})">${n}</text>`;
  });
  // deflettori decorativi sul bordo interno del rim (le "canoe" delle roulette vere)
  let deflectors = '';
  for(let i=0;i<8;i++){
    const a = (i*45)*Math.PI/180;
    const dx = cx+(R+6)*Math.cos(a), dy = cy+(R+6)*Math.sin(a);
    deflectors += `<circle cx="${dx.toFixed(2)}" cy="${dy.toFixed(2)}" r="3" fill="#D4AF6A" stroke="#8A6A2E" stroke-width="0.6"/>`;
  }
  const outerBallR = R + rimW*0.55;
  const innerBallR = R*0.50;
  return `<div style="display:flex;justify-content:center;margin:14px 0;">
    <div style="position:relative;width:${size}px;height:${size}px;">
      <svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" style="position:absolute;inset:0;">
        <defs>
          <radialGradient id="rg-rim" cx="35%" cy="35%" r="75%">
            <stop offset="0%" stop-color="#8A5A2E"/>
            <stop offset="55%" stop-color="#5C3A1C"/>
            <stop offset="100%" stop-color="#3B2412"/>
          </radialGradient>
          <radialGradient id="rg-hub" cx="35%" cy="30%" r="75%">
            <stop offset="0%" stop-color="#F1D89A"/>
            <stop offset="45%" stop-color="#D4AF6A"/>
            <stop offset="100%" stop-color="#8A6A2E"/>
          </radialGradient>
        </defs>
        <circle cx="${cx}" cy="${cy}" r="${size/2-1}" fill="url(#rg-rim)" stroke="#241608" stroke-width="1.5"/>
        <circle cx="${cx}" cy="${cy}" r="${R+3}" fill="none" stroke="#E8DCC0" stroke-width="1.5" opacity="0.6"/>
        ${deflectors}
      </svg>
      <svg id="roulette-wheel-svg" width="${size}" height="${size}" viewBox="0 0 ${size} ${size}"
           data-cx="${cx}" data-cy="${cy}" data-outer-ball-r="${outerBallR.toFixed(1)}" data-inner-ball-r="${innerBallR.toFixed(1)}"
           ${spinning && resultNumber!=null ? `data-result-number="${resultNumber}"` : ''}
           style="position:absolute;inset:0;">
        ${segs}
        <circle cx="${cx}" cy="${cy}" r="${R*0.30}" fill="url(#rg-hub)" stroke="#5C3A1C" stroke-width="1"/>
        <circle cx="${cx}" cy="${cy}" r="${R*0.10}" fill="#5C3A1C"/>
      </svg>
      ${(spinning && resultNumber!=null) ? `<div id="roulette-ball-dot" style="position:absolute;width:9px;height:9px;margin:-4.5px;border-radius:50%;background:radial-gradient(circle at 35% 30%, #FFFFFF, #C9C2AE 70%);box-shadow:0 1px 3px rgba(0,0,0,.6);"></div>` : ''}
      <div style="position:absolute;top:-6px;left:50%;transform:translateX(-50%);width:0;height:0;border-left:8px solid transparent;border-right:8px solid transparent;border-top:14px solid #D4AF6A;"></div>
    </div>
