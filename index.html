function renderVeciaMatch(match, claim){
  if(match.phase==='ended') return renderVeciaEnd(match);
  const revealAll = claim.type==='all';
  const myId = claim.type==='seat' ? claim.playerId : null;
  const drawerId = match.turnOrder[match.currentIdx];
  const isMyTurn = !match.pendingReveal && (revealAll || drawerId===myId);

  const revealBanner = match.pendingReveal ? (()=>{
    const ld = match.lastDraw;
    const chi = esc(nameOf(match, ld.drawerId));
    const daChi = esc(nameOf(match, ld.fromId));
    const cardTxt = cardLabel({suit:ld.suit, rank:ld.rank});
    return `
      <div class="turn-banner">${chi} ha pescato <b>${cardTxt}</b> da ${daChi}${ld.matched?' — <b>coppia! 🎉</b>':' — nessuna coppia'}</div>
      <button class="btn-primary" style="width:100%;margin-bottom:12px;" onclick="continueAfterVeciaDraw('${match.id}')">Continua</button>`;
  })() : '';

  const turnBanner = match.pendingReveal ? '' : `<div class="turn-bar ${isMyTurn?'mine':''}">${isMyTurn
    ? (revealAll ? 'Tocca a <b>'+esc(nameOf(match,drawerId))+'</b>' : '► TOCCA A TE — pesca dal tuo vicino')
    : 'Sta pescando <b>'+esc(nameOf(match,drawerId))+'</b> — aspetta <button class="refresh-mini" onclick="forceResync()" title="Aggiorna">⟳</button>'}</div>`;

  const tableSvg = renderVeciaTableSVG(match, myId);

  const displayOwner = revealAll ? drawerId : myId;
  const hand = (displayOwner && match.hands[displayOwner]) || [];
  const handHtml = hand.length
    ? `<div class="hand">${hand.map(c=>`<span class="hand-card ${SUIT_CLASS[c.suit]} disabled" title="${cardLabel(c)}">${cardFrontSVG(c)}</span>`).join('')}</div>`
    : `<p class="hint" style="margin:6px 0 0;">Mano vuota — sei salvo! 🎉</p>`;

  const drawPicker = (isMyTurn && !match.pendingReveal) ? (()=>{
    const fromId = veciaLeftNeighborId(match, drawerId);
    if(!fromId) return '';
    const fromHand = match.hands[fromId] || [];
    const cardsHtml = fromHand.map((c,idx)=>
      `<button class="hand-card vecia-pick" title="Carta coperta" onclick="veciaDraw('${match.id}','${drawerId}',${idx})">${cardBackSVG()}</button>`
    ).join('');
    return `
      <h2 style="margin-top:14px;">Scegli una carta dal mazzo di ${esc(nameOf(match,fromId))}</h2>
      <p class="hint" style="margin-top:-8px;">Sono coperte: non sai cosa prendi finché non la giri.</p>
      <div class="hand">${cardsHtml}</div>`;
  })() : '';

  return `
    <div class="card">
      <div class="toolbar">
        <span>Vecia · ${revealAll?'tutti visibili':esc(nameOf(match,myId))}</span>
        <button class="btn-danger btn-small" onclick="abandonMatch()">Abbandona</button>
      </div>
      ${turnBanner}
      ${revealBanner}
      ${tableSvg}
      ${drawPicker}
      <h2>${revealAll?'Mano di '+esc(nameOf(match,displayOwner)):'La tua mano'}</h2>
      ${handHtml}
    </div>`;
}

function renderVeciaEnd(match){
  const loser = match._loserId;
  const rows = match.players.map(p=>{
    const isLoser = p.id===loser;
    return `<div class="rank-row ${isLoser?'':'win'}">
      <span>${esc(p.name)}${p.isBot?' 🤖':''}</span>
      <span>${isLoser?'😱 è la Vecia':'✅ salvo'}</span>
    </div>`;
  }).join('');
  return `
    <div class="card">
      <h2>Partita di Vecia finita</h2>
      <p class="hint">😱 <b>${esc(nameOf(match,loser))}</b> è rimasto con il Fante di Spade: è la Vecia!</p>
      ${rows}
      <button class="btn-primary" style="margin-top:14px;" onclick="backToLobbyFromEnd()">Torna alla lobby</button>
    </div>`;
}

// =========================================================================
// CAVA CAMISA — si gira a turno la carta in cima al proprio mazzetto coperto
// (nessuna scelta: e' sempre e solo quella in cima, come nel gioco reale).
// Asso/Due/Tre sono carte speciali: chi le gira obbliga il giocatore dopo di lui
// a girarne rispettivamente 1/2/3 in risposta. Se tra quelle risposte esce
// un'altra carta speciale, la sfida "si resetta" sul nuovo giocatore con il nuovo
// conteggio (chi aveva lanciato prima perde il diritto). Se invece si completano
// le carte richieste senza altre sorprese, chi aveva lanciato la carta speciale
// si prende tutto il mazzetto al centro. Vince la mano chi arriva a possedere
// tutte le carte del mazzo. Partita a piu' mani, prima a 2 o 3 mani vinte.
// =========================================================================
const CAVA_MAX_PLAYERS = 4;
const CAVA_SPECIALI = {'A':1, '2':2, '3':3};
const CAVA_DECK_SIZE = 40;

function buildCavaCamisaDeck(){
  const deck = [];
  SUITS.forEach(s=>RANKS.forEach(r=>deck.push({suit:s, rank:r, id:s+'-'+r})));
  return deck;
}

// il prossimo giocatore attivo (con carte in mano) a partire da "afterId", saltando
// eventualmente "excludeId" (tipicamente chi ha lanciato la sfida corrente: non deve
// mai essere chiamato a rispondere alla propria carta speciale). Restituisce null se
// non resta nessun altro giocatore con carte.
function cavaCamisaNextActive(match, afterId, excludeId){
  const ids = match.turnOrder, n = ids.length;
  let idx = ids.indexOf(afterId);
  for(let step=0; step<n; step++){
    idx = (idx+1)%n;
    const pid = ids[idx];
    if(pid===excludeId) continue;
    if(match.hands[pid].length>0) return pid;
  }
  return null;
}

function buildCavaCamisaMatch(id, names, handsToWin){
  const players = names.map((name,i)=>({id:'p'+i, name, isBot:false}));
  const ids = players.map(p=>p.id);
  const deck = shuffle(buildCavaCamisaDeck());
  const hands = {}; ids.forEach(pid=>hands[pid]=[]);
  deck.forEach((c,i)=>hands[ids[i%ids.length]].push(c)); // distribuzione equa: chi capita capita se non torna esatta
  const handWins = {}; ids.forEach(pid=>handWins[pid]=0);
  const leaderIdx = Math.floor(Math.random()*ids.length);
  return {
    id, game:'cavacamisa', createdAt:new Date().toISOString(),
    players, hands, turnOrder: ids,
    handsToWin: handsToWin||2, dealNumber:1, handWins, dealHistory:[],
    center:[], pendingChallenge:null,
    currentId: ids[leaderIdx], _leaderIdx: leaderIdx,
    lastFlip:null, pendingReveal:false,
    phase:'playing'
  };
}

async function cavaCamisaFlip(matchId, flipperId){
  const match = await getActiveMatch();
  if(!match || match.id!==matchId || match.phase!=='playing' || match.pendingReveal) return;
  if(match.currentId !== flipperId) return;
  const hand = match.hands[flipperId];
  if(!hand.length) return;
  const card = hand.shift();
  match.center.push(card);
  const specialValue = CAVA_SPECIALI[card.rank];
  let pileAwardedTo = null;

  if(specialValue){
    // nuova sfida: chiunque fosse gia' in sospeso perde il diritto, ora tocca al
    // prossimo giocatore attivo rispondere a QUESTA carta
    const responder = cavaCamisaNextActive(match, flipperId, flipperId);
    if(responder===null){
      pileAwardedTo = flipperId; // nessun altro ha carte: il mazzetto e' gia' suo
    } else {
      match.pendingChallenge = { throwerId: flipperId, needed: specialValue, done: 0 };
      match.currentId = responder;
    }
  } else if(match.pendingChallenge){
    match.pendingChallenge.done += 1;
    if(match.pendingChallenge.done >= match.pendingChallenge.needed){
      pileAwardedTo = match.pendingChallenge.throwerId;
      match.pendingChallenge = null;
    } else if(hand.length===0){
      // chi doveva rispondere ha finito le carte a meta' sfida: la sfida prosegue
      // con il prossimo giocatore attivo, il conteggio gia' fatto resta valido
      const cont = cavaCamisaNextActive(match, flipperId, match.pendingChallenge.throwerId);
      if(cont===null){ pileAwardedTo = match.pendingChallenge.throwerId; match.pendingChallenge=null; }
      else { match.currentId = cont; }
    }
    // altrimenti lo stesso giocatore continua a girare (currentId invariato)
  } else {
    match.currentId = cavaCamisaNextActive(match, flipperId, null);
  }

  if(pileAwardedTo){
    const wonCards = match.center.splice(0, match.center.length);
    match.hands[pileAwardedTo].push(...shuffle(wonCards));
    match.currentId = pileAwardedTo;
    match.lastFlip = { flipperId, suit:card.suit, rank:card.rank, special: !!specialValue, pileAwardedTo, pileSize: wonCards.length };
    match.pendingReveal = true;
  } else {
    match.lastFlip = { flipperId, suit:card.suit, rank:card.rank, special: !!specialValue, pileAwardedTo: null };
  }
  await setActiveMatch(match);
  await render();
}

async function continueAfterCavaCamisaFlip(matchId){
  const match = await getActiveMatch();
  if(!match || match.id!==matchId || !match.pendingReveal) return;
  match.pendingReveal = false;
  const winnerId = match.lastFlip.pileAwardedTo;
  if(winnerId && match.hands[winnerId].length===CAVA_DECK_SIZE){
    finishCavaCamisaDeal(match, winnerId);
    await maybeSaveCavaCamisaHistory(match);
  }
  await setActiveMatch(match);
  await render();
}

function finishCavaCamisaDeal(match, winnerId){
  match.handWins[winnerId] = (match.handWins[winnerId]||0) + 1;
  match.dealHistory.push({dealNumber: match.dealNumber, winnerId});
  const traguardo = match.players.find(p=>(match.handWins[p.id]||0) >= match.handsToWin);
  if(traguardo){
    match.phase = 'ended';
    match._winnerId = traguardo.id;
  } else {
    match.phase = 'dealEnd';
  }
}

async function continueAfterCavaCamisaDeal(matchId){
  const match = await getActiveMatch();
  if(!match || match.id!==matchId || match.phase!=='dealEnd') return;
  match.dealNumber += 1;
  const ids = match.turnOrder;
  const deck = shuffle(buildCavaCamisaDeck());
  const hands = {}; ids.forEach(pid=>hands[pid]=[]);
  deck.forEach((c,i)=>hands[ids[i%ids.length]].push(c));
  match.hands = hands;
  match.center = [];
  match.pendingChallenge = null;
  const leaderIdx = ((match._leaderIdx ?? 0) + 1) % ids.length;
  match._leaderIdx = leaderIdx;
  match.currentId = ids[leaderIdx];
  match.phase = 'playing';
  await setActiveMatch(match);
  await render();
}

async function maybeSaveCavaCamisaHistory(match){
  if(match.phase!=='ended' || match._historySaved) return;
  match._historySaved = true;
  const ranked = [...match.players].sort((a,b)=>(match.handWins[b.id]||0)-(match.handWins[a.id]||0))
    .map((p,i)=>({name:p.name, rank:i+1, maniVinte: match.handWins[p.id]||0, isBot:p.isBot}));
  const historyEntry = {
    id:match.id, date:match.createdAt, endedAt:new Date().toISOString(),
    game:'cavacamisa', handsToWin: match.handsToWin, dealNumber: match.dealNumber,
    winner: nameOf(match, match._winnerId),
    players: ranked, solo: match.players.some(p=>p.isBot)
  };
  const history = await getHistory();
  history.unshift(historyEntry);
  await saveHistory(history);
  if(myRoomId){
    try{ const list=(await getRooms()).filter(s=>s.id!==myRoomId); await saveRooms(list); }catch(e){}
  }
}

// girare la propria carta in cima e' un'azione obbligata, senza nessuna scelta
// possibile (ne' per l'umano ne' per il bot): il bot deve solo "premere gira"
// quando tocca a lui.
const CAVA_BOT_THINK_MS = 700;
async function scheduleCavaCamisaBotMove(match){
  if(!match || match.phase!=='playing' || match.pendingReveal) return;
  const flipperId = match.currentId;
  const player = match.players.find(p=>p.id===flipperId);
  if(!player || !player.isBot){ botMoveKey=null; return; }
  const key = 'cavacamisa|'+match.id+'|'+match.currentId+'|'+match.hands[flipperId].length+'|'+match.center.length;
  if(botMoveKey===key) return;
  botMoveKey = key;
  if(botMoveTimer) clearTimeout(botMoveTimer);
  botMoveTimer = setTimeout(async ()=>{
    const cur = await getActiveMatch();
    if(!cur || cur.game!=='cavacamisa' || cur.phase!=='playing' || cur.pendingReveal) return;
    const curFlipper = cur.currentId;
    const curPlayer = cur.players.find(p=>p.id===curFlipper);
    if(curPlayer && curPlayer.isBot) await cavaCamisaFlip(cur.id, curFlipper);
  }, CAVA_BOT_THINK_MS);
}

function renderCavaCamisaTableSVG(match, myId){
  const ids = match.turnOrder;
  const n = ids.length;
  const C = tableConfig(n);
  const VB = C.VB, fs = C.fs;
  const cx = VB/2, cy = VB/2, half = C.half, avatarR = C.avatarR;
  const layout = rectSeatLayout(half, half, n);

  let seats = '';
  let turnDotSvg = '';
  ids.forEach((pid,i)=>{
    const {x:relX, y:relY} = layout[i];
    const x = cx+relX, y = cy+relY;
    const radialLen = Math.hypot(relX, relY) || 1;
    const nx = relX/radialLen, ny = relY/radialLen;
    const player = match.players.find(p=>p.id===pid);
    const cardsLeft = (match.hands[pid]||[]).length;
    const isTurn = pid===match.currentId && !match.pendingReveal;
    const isMe = pid===myId;
    const isSafe = cardsLeft===0;
    const isThrower = match.pendingChallenge && match.pendingChallenge.throwerId===pid;

    const displayDirY = relY>=0 ? 1 : -1;
    const nameY = y + displayDirY*(avatarR + 26*fs);

    let nm = player.name.length>10 ? player.name.slice(0,9)+'…' : player.name;
    const label = esc(nm) + (isMe?' (tu)':(player.isBot?' ᴀɪ':'')) + (isSafe?' 💀':'');
    const pillW = Math.max(52*fs, label.length*7*fs + 16);
    const lx = Math.max(pillW/2+3, Math.min(VB-pillW/2-3, x));
    const ly = nameY;

    if(isTurn){
      const dotDist = avatarR + 10*fs;
      turnDotSvg = `<circle class="turn-dot" cx="${x-nx*dotDist}" cy="${y-ny*dotDist}" r="${5*fs}" fill="#D4AF6A" stroke="#16261F" stroke-width="1.2"/>`;
    }

    const handSvg = isSafe
      ? `<text x="${x}" y="${y+5*fs}" text-anchor="middle" font-size="${15*fs}">💀</text>`
      : `
        <rect x="${x-9*fs}" y="${y-13*fs}" width="${18*fs}" height="${26*fs}" rx="3" fill="url(#cava-cardback)" stroke="${isThrower?'#D4AF6A':'#8C7647'}" stroke-width="${isThrower?2:1}"/>
        <circle cx="${x+9*fs}" cy="${y+10*fs}" r="${7.5*fs}" fill="#16261F" stroke="#D4AF6A" stroke-width="1"/>
        <text x="${x+9*fs}" y="${y+13.5*fs}" text-anchor="middle" font-family="'IBM Plex Mono',monospace" font-size="${9.5*fs}" font-weight="700" fill="#D4AF6A">${cardsLeft}</text>`;

    seats += `
      <g>
        ${isTurn?`<circle class="turn-ring" cx="${x}" cy="${y}" r="${avatarR+5}" fill="none" stroke="#D4AF6A" stroke-width="2"/>`:''}
        <circle cx="${x}" cy="${y}" r="${avatarR}" fill="${isTurn?'#2C4C3E':'#223B32'}" stroke="${isTurn?'#D4AF6A':(isMe?'#8C7647':'#3C5A4C')}" stroke-width="${isTurn?2.4:1.8}" opacity="${isSafe?0.5:1}"/>
        ${handSvg}
        <rect x="${lx-pillW/2}" y="${ly-11*fs}" width="${pillW}" height="${19*fs}" rx="${9.5*fs}" fill="rgba(10,20,16,0.92)" stroke="${isTurn?'#D4AF6A':'#3C5A4C'}" stroke-width="1"/>
        <text x="${lx}" y="${ly+3*fs}" text-anchor="middle" font-family="'Fraunces',serif" font-size="${12.5*fs}" font-weight="700" fill="${isTurn?'#D4AF6A':'#F1ECE1'}">${label}</text>
      </g>`;
  });

  // --- centro: l'ultima carta girata (in cima al mazzetto comune), ben visibile
  const top = match.center[match.center.length-1];
  const cW = 30*fs, cH = 62*fs;
  const centerCardSvg = top ? `
    <g transform="translate(${cx},${cy-8*fs})" style="filter:drop-shadow(0 2px 4px rgba(0,0,0,.4));">
      <rect x="${-cW/2}" y="${-cH/2}" width="${cW}" height="${cH}" rx="3" fill="#F1ECE1" stroke="#8C7647" stroke-width="0.8"/>
      <image href="${cardSrc(top.suit, top.rank)}" x="${-cW/2}" y="${-cH/2}" width="${cW}" height="${cH}" preserveAspectRatio="xMidYMid slice" clip-path="url(#cava-cardclip)"/>
    </g>
    <text x="${cx}" y="${cy+cH/2+10*fs}" text-anchor="middle" font-family="'IBM Plex Mono',monospace" font-size="${9*fs}" fill="#B9C4BC">${match.center.length} cart${match.center.length===1?'a':'e'} nel mazzetto</text>
    ` : `<text x="${cx}" y="${cy+4*fs}" text-anchor="middle" font-family="'IBM Plex Mono',monospace" font-size="${9*fs}" fill="#6C8078">mazzetto vuoto</text>`;

  const tableDefs = `
    <defs>
      <clipPath id="cava-cardclip"><rect x="${-cW/2}" y="${-cH/2}" width="${cW}" height="${cH}" rx="3"/></clipPath>
      <pattern id="cava-cardback" width="4" height="4" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
        <rect width="4" height="4" fill="#2A4A3C"/>
        <rect width="2" height="4" fill="#1E332B"/>
      </pattern>
      <linearGradient id="feltGrad5" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#274539"/>
        <stop offset="60%" stop-color="#1D3730"/>
        <stop offset="100%" stop-color="#132520"/>
      </linearGradient>
      <linearGradient id="centerGrad5" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#28483B"/>
        <stop offset="100%" stop-color="#1B322A"/>
      </linearGradient>
    </defs>`;

  const outerPad = 30*fs, feltR = 20*fs, centerR = 14*fs;
  const centerHalf = C.centerHalf*fs;
  return `
    <div class="table-wrap">
      <svg viewBox="0 0 ${VB} ${VB}" width="100%" style="max-width:420px;aspect-ratio:1/1;display:block;height:auto;">
        ${tableDefs}
        <rect x="${cx-half-outerPad}" y="${cy-half-outerPad}" width="${2*(half+outerPad)}" height="${2*(half+outerPad)}" rx="${feltR}" fill="url(#feltGrad5)" stroke="#4A6B5B" stroke-width="2"/>
        <rect x="${cx-centerHalf}" y="${cy-centerHalf}" width="${2*centerHalf}" height="${2*centerHalf}" rx="${centerR}" fill="url(#centerGrad5)" stroke="#3C5A4C" stroke-width="1.2"/>
        ${centerCardSvg}
        ${seats}
        ${turnDotSvg}
      </svg>
    </div>`;
}

function cavaCamisaScoreBar(match){
  const chips = match.players.map(p=>`
    <div class="score-chip">
      <span>${esc(p.name)}</span>
      <span class="score-num">${match.handWins[p.id]||0}</span>
    </div>`).join('');
  return `<div class="score-bar">${chips}<div class="score-chip target">prima a ${match.handsToWin} mani</div></div>`;
}

function renderCavaCamisaDealEndBanner(match){
  const ultima = match.dealHistory[match.dealHistory.length-1];
  return `
    <div class="deal-end-banner">
      <h3>Fine mano ${ultima.dealNumber} — vince ${esc(nameOf(match,ultima.winnerId))}</h3>
      <div class="deal-end-row win"><span>${esc(nameOf(match,ultima.winnerId))}</span><span>ha preso tutte le 40 carte</span></div>
      <button class="btn-primary" style="margin-top:10px;width:100%;" onclick="continueAfterCavaCamisaDeal('${match.id}')">Prossima mano</button>
    </div>`;
}

function renderCavaCamisaMatch(match, claim){
  if(match.phase==='ended') return renderCavaCamisaEnd(match);
  const revealAll = claim.type==='all';
  const myId = claim.type==='seat' ? claim.playerId : null;

  if(match.phase==='dealEnd'){
    return `
      <div class="card">
        <div class="toolbar">
          <span>${hudAvatar(revealAll?'?':esc(nameOf(match,myId)))}Cava Camisa · ${revealAll?'tutti visibili':esc(nameOf(match,myId))}</span>
          <button class="btn-danger btn-small" onclick="abandonMatch()">Abbandona</button>
        </div>
        ${cavaCamisaScoreBar(match)}
        ${renderCavaCamisaDealEndBanner(match)}
      </div>`;
  }

  const flipperId = match.currentId;
  const isMyTurn = !match.pendingReveal && (revealAll || flipperId===myId);

  const challengeBanner = (!match.pendingReveal && match.pendingChallenge) ? `
    <div class="turn-banner">Carta speciale! <b>${esc(nameOf(match,match.pendingChallenge.throwerId))}</b> si prende il mazzetto se ${esc(nameOf(match,flipperId))} gira ${match.pendingChallenge.needed-match.pendingChallenge.done} cart${(match.pendingChallenge.needed-match.pendingChallenge.done)===1?'a':'e'} senza altre sorprese.</div>` : '';

  const revealBanner = match.pendingReveal ? (()=>{
    const lf = match.lastFlip;
    const chi = esc(nameOf(match, lf.flipperId));
    const cardTxt = cardLabel({suit:lf.suit, rank:lf.rank});
    const esito = lf.pileAwardedTo
      ? `<b>${esc(nameOf(match,lf.pileAwardedTo))}</b> si prende il mazzetto: ${lf.pileSize} carte! 🎉`
      : (lf.special ? 'carta speciale — si continua a girare' : 'nessuna sorpresa');
    return `
      <div class="turn-banner">${chi} ha girato <b>${cardTxt}</b> — ${esito}</div>
      <button class="btn-primary" style="width:100%;margin-bottom:12px;" onclick="continueAfterCavaCamisaFlip('${match.id}')">Continua</button>`;
  })() : '';

  const turnBanner = match.pendingReveal ? '' : `<div class="turn-bar ${isMyTurn?'mine':''}">${isMyTurn
    ? (revealAll ? 'Tocca a <b>'+esc(nameOf(match,flipperId))+'</b>' : '► TOCCA A TE — gira la tua carta')
    : 'Sta girando <b>'+esc(nameOf(match,flipperId))+'</b> — aspetta <button class="refresh-mini" onclick="forceResync()" title="Aggiorna">⟳</button>'}</div>`;

  const tableSvg = renderCavaCamisaTableSVG(match, myId);

  const displayOwner = revealAll ? flipperId : myId;
  const myCards = (displayOwner && match.hands[displayOwner]) || [];

  const flipBtn = (isMyTurn && !match.pendingReveal)
    ? `<button class="btn-primary" style="width:100%;margin-bottom:12px;" onclick="cavaCamisaFlip('${match.id}','${flipperId}')">Gira la tua carta</button>`
    : '';

  return `
    <div class="card">
      <div class="toolbar">
        <span>${hudAvatar(revealAll?'?':esc(nameOf(match,myId)))}Cava Camisa · ${revealAll?'tutti visibili':esc(nameOf(match,myId))}</span>
        <button class="btn-danger btn-small" onclick="abandonMatch()">Abbandona</button>
      </div>
      ${cavaCamisaScoreBar(match)}
      ${turnBanner}
      ${challengeBanner}
      ${revealBanner}
      ${tableSvg}
      ${flipBtn}
      <p class="hint">${revealAll?'Mazzetto di '+esc(nameOf(match,displayOwner)):'Il tuo mazzetto'}: ${myCards.length} cart${myCards.length===1?'a':'e'} coperte — non sai cosa uscirà finché non giri.</p>
    </div>`;
}

function renderCavaCamisaEnd(match){
  const ranked = [...match.players].sort((a,b)=>(match.handWins[b.id]||0)-(match.handWins[a.id]||0));
  const rows = ranked.map((p,i)=>`
    <div class="rank-row ${i===0?'win':''}">
      <span>${i+1}. ${esc(p.name)}${p.isBot?' 🤖':''}</span>
      <span>${match.handWins[p.id]||0} man${match.handWins[p.id]===1?'o':'i'} vint${match.handWins[p.id]===1?'a':'e'}</span>
    </div>`).join('');
  return `
    <div class="card">
      <h2>Partita di Cava Camisa finita</h2>
      <p class="hint">🏆 Vince <b>${esc(nameOf(match,match._winnerId))}</b> — prima ad arrivare a ${match.handsToWin} mani vinte, dopo ${match.dealNumber} man${match.dealNumber===1?'o':'i'} giocate</p>
      ${rows}
      <button class="btn-primary" style="margin-top:14px;" onclick="backToLobbyFromEnd()">Torna alla lobby</button>
    </div>`;
}

// =========================================================================
// SOLITARIO ("Scarta il Re") — gioco puramente locale: nessuna sala, nessun
// bot, nessuna sincronizzazione online. Si mescola il mazzo da 40 carte, si
// dispongono 4 righe da 9 carte coperte (una riga per seme) e restano 4
// carte di riserva in mano. Si pesca la prima carta di riserva, la si
// scopre e la si mette nella posizione numerica corretta (1=Asso...9=Cavallo)
// della riga del suo seme; la carta coperta che c'era li' sotto si scopre a
// sua volta e si ripete. Quando esce un Re (posizione 10, fuori dal
// rettangolo) non c'e' nessuna carta sotto da raccogliere: il giro si
// blocca e si pesca la prossima carta di riserva per ripartire. Si vince se
// si riescono a scoprire tutte le 36 carte (valore 1-9 per ognuno dei 4
// semi) prima di esaurire le 4 carte di riserva; se si trovano tutti e
// quattro i Re prima che il tavolo sia completo, si resta senza carte in
// mano e il solitario e' perso.
// =========================================================================
const SOLITARIO_ROW_SUITS = ['Bastoni','Spade','Coppe','Denari']; // riga i -> seme di quella riga
const SOLITARIO_POS_RANKS = ['A','2','3','4','5','6','7','Fante','Cavallo']; // posizione i (0-8) -> rango, cioe' posizione 1-9

function solitarioRowOf(suit){ return SOLITARIO_ROW_SUITS.indexOf(suit); }
function solitarioPosOf(rank){ return SOLITARIO_POS_RANKS.indexOf(rank); } // -1 per il Re, gestito a parte

function buildSolitarioGame(){
  const deck = shuffle(buildCavaCamisaDeck()); // mazzo standard da 40 carte, riuso il generatore gia' esistente
  const riserva = deck.slice(0,4);   // le 4 carte di riserva, in ordine di pesca
  const tavolo = deck.slice(4);      // le 36 carte da disporre coperte, 4 righe da 9
  const originalDeal = [[],[],[],[]]; // originalDeal[row][pos] = la carta che c'era li' all'inizio (coperta)
  for(let r=0;r<4;r++){
    for(let p=0;p<9;p++) originalDeal[r].push(tavolo[r*9+p]);
  }
  const revealed = [
    new Array(9).fill(false), new Array(9).fill(false),
    new Array(9).fill(false), new Array(9).fill(false)
  ]; // revealed[row][pos] = true una volta che la carta giusta e' stata sistemata li'
  return {
    game: 'solitario',
    originalDeal, revealed,
    kingFound: [null,null,null,null], // kingFound[row] = il Re di quella riga, una volta trovato
    riserva, riservaIdx: 0,
    current: null,       // carta attualmente scoperta, in attesa di essere piazzata al prossimo click
    filledCount: 0,
    lastEvent: null,      // per il messaggio "ultima mossa"
    phase: 'start',        // 'start' | 'ready' | 'blocked' | 'won' | 'lost'
    createdAt: new Date().toISOString()
  };
}

// esegue UN passo: pesca dalla riserva se serve iniziare/continuare, altrimenti
// piazza la carta corrente nella sua posizione e raccoglie quella che c'era sotto.
function solitarioAdvance(state){
  if(state.phase==='won' || state.phase==='lost') return state;

  let card = state.current;
  if(!card){
    if(state.riservaIdx >= state.riserva.length){
      state.phase = state.filledCount===36 ? 'won' : 'lost';
      return state;
    }
    card = state.riserva[state.riservaIdx];
    state.riservaIdx += 1;
  }

  if(card.rank === 'Re'){
    const row = solitarioRowOf(card.suit);
    state.kingFound[row] = card;
    state.current = null;
    state.lastEvent = { type:'king', card, row };
    state.phase = (state.riservaIdx >= state.riserva.length)
      ? (state.filledCount===36 ? 'won' : 'lost')
      : 'blocked';
    return state;
  }

  const row = solitarioRowOf(card.suit);
  const pos = solitarioPosOf(card.rank);
  const under = state.originalDeal[row][pos]; // la carta coperta che c'era li', da raccogliere ora
  state.revealed[row][pos] = true;
  state.filledCount += 1;
  state.lastEvent = { type:'place', card, row, pos };
  if(state.filledCount === 36){
    state.phase = 'won';
    state.current = null;
    return state;
  }
  state.current = under;
  state.phase = 'ready';
  return state;
}

let solitarioGame = null;

async function getSolitarioGame(){
  if(solitarioGame) return solitarioGame;
  try{
    const r = await window.storage.get('solitario-game', false);
    if(r) solitarioGame = JSON.parse(r.value);
  }catch(e){}
  return solitarioGame;
}
async function saveSolitarioGame(){
  try{ await window.storage.set('solitario-game', JSON.stringify(solitarioGame), false); }catch(e){}
}
async function newSolitarioGame(){
  solitarioGame = buildSolitarioGame();
  await saveSolitarioGame();
  lastRenderKey = null;
  await render(true);
}
async function solitarioStep(){
  if(!solitarioGame) return;
  solitarioAdvance(solitarioGame);
  await saveSolitarioGame();
  lastRenderKey = null;
  await render(true);
}
async function exitSolitario(){
  solitarioGame = null;
  try{ await window.storage.delete('solitario-game', false); }catch(e){}
  lobbyView = 'lobby';
  lastRenderKey = null;
  await render(true);
}

function renderSolitarioCardSlot(card, faceUp){
  const w = 25, h = 46;
  if(!faceUp || !card){
    return `<div class="soli-slot" style="width:${w}px;height:${h}px;border-radius:4px;background:#223B32;border:1.5px dashed #3C5A4C;flex-shrink:0;"></div>`;
  }
  return `<img src="${cardSrc(card.suit,card.rank)}" width="${w}" height="${h}" style="border-radius:3px;border:1px solid #8C7647;display:block;object-fit:cover;box-shadow:0 2px 4px rgba(0,0,0,.35);flex-shrink:0;" alt="${card.rank} di ${card.suit}">`;
}

function renderSolitarioRow(state, row){
  const suit = SOLITARIO_ROW_SUITS[row];
  const cells = [];
  for(let p=0;p<9;p++){
    const faceUp = state.revealed[row][p];
    const card = faceUp ? {suit, rank: SOLITARIO_POS_RANKS[p]} : null;
    cells.push(renderSolitarioCardSlot(card, faceUp));
  }
  const kingCell = state.kingFound[row]
    ? renderSolitarioCardSlot(state.kingFound[row], true)
    : `<div style="width:25px;height:46px;flex-shrink:0;"></div>`;
  return `
    <div style="display:flex;align-items:center;gap:3px;margin-bottom:5px;">
      <span style="width:22px;font-size:9px;color:var(--cream-dim);text-align:right;flex-shrink:0;line-height:1.1;">${esc(suit.slice(0,3))}</span>
      <div style="display:flex;gap:1px;flex-shrink:0;">${cells.join('')}</div>
      <div style="margin-left:2px;padding-left:3px;border-left:2px solid #3C5A4C;flex-shrink:0;">${kingCell}</div>
    </div>`;
}

function renderSolitario(){
  const state = solitarioGame;
  if(!state){
    return `
    <div class="card">
      <h2>Solitario</h2>
      <p class="hint">"Scarta il Re": mescoli il mazzo, disponi 4 righe coperte da 9 carte (una per seme) e ti restano 4 carte di riserva.
      Scopri la prima, mettila nella posizione giusta della riga del suo seme, raccogli quella che c'era sotto e continua.
      Un Re blocca il giro: pesca la prossima carta di riserva per ripartire. Vinci se scopri tutto il tavolo prima di finire le riserve.
      Nessuna sala, nessun bot: solo tu contro il mazzo.</p>
      <div class="row-btns" style="margin-top:16px;">
        <button class="btn-secondary" onclick="lobbyView='lobby'; render(true)">Indietro</button>
        <button class="btn-primary" onclick="newSolitarioGame()">Mescola e inizia</button>
      </div>
    </div>`;
  }

  const rows = [0,1,2,3].map(r=>renderSolitarioRow(state, r)).join('');
  const riservaRestanti = state.riserva.length - state.riservaIdx;
  const riservaDots = state.riserva.map((_,i)=>{
    const usata = i < state.riservaIdx;
    return `<span style="display:inline-block;width:10px;height:10px;border-radius:50%;margin:0 2px;background:${usata?'#4A6B5B':'#D4AF6A'};border:1px solid #8C7647;"></span>`;
  }).join('');

  let banner = '';
  if(state.phase==='won'){
    banner = `<div class="deal-end-banner"><h3>🏆 Solitario riuscito!</h3><p class="hint">Hai scoperto tutte le 36 carte prima di esaurire le riserve.</p></div>`;
  } else if(state.phase==='lost'){
    banner = `<div class="deal-end-banner"><h3>😔 Solitario non riuscito</h3><p class="hint">Hai trovato tutti e quattro i Re con ${state.filledCount}/36 carte scoperte: le riserve sono finite.</p></div>`;
  } else if(state.lastEvent){
    const ev = state.lastEvent;
    if(ev.type==='king'){
      banner = `<div class="turn-banner">Hai trovato il <b>Re di ${esc(ev.card.suit)}</b>: nessuna carta sotto da raccogliere, il giro si blocca.</div>`;
    } else {
      banner = `<div class="turn-banner">Hai piazzato <b>${cardLabel(ev.card)}</b> in posizione ${ev.pos+1} della riga ${esc(SOLITARIO_ROW_SUITS[ev.row])}.</div>`;
    }
  }

  const btnLabel = state.phase==='start' ? 'Pesca la prima carta'
    : state.phase==='ready' ? 'Rivela la prossima carta'
    : state.phase==='blocked' ? 'Pesca la carta successiva di riserva'
    : null;

  return `
    <div class="card">
      <div class="toolbar">
        <span>Solitario · ${state.filledCount}/36 scoperte</span>
        <button class="btn-danger btn-small" onclick="exitSolitario()">Esci</button>
      </div>
      ${banner}
      <div style="margin:14px 0;overflow-x:auto;">${rows}</div>
      <div style="display:flex;align-items:center;gap:10px;margin:10px 0;">
        <span class="hint" style="margin:0;">Riserva: ${riservaRestanti}/4</span>
        ${riservaDots}
      </div>
      ${btnLabel ? `<button class="btn-primary" style="width:100%;" onclick="solitarioStep()">${btnLabel}</button>` : ''}
      ${(state.phase==='won'||state.phase==='lost') ? `<button class="btn-secondary" style="width:100%;margin-top:10px;" onclick="newSolitarioGame()">Gioca ancora</button>` : ''}
    </div>`;
}

function renderRoundEndBanner(match){
  const ultima = match.log[match.log.length-1];
  const rows = ultima.entries.map(e=>{
    const persaVita = e.delta>0;
    const esito = e.previsione===e.prese ? 'previsione azzeccata' : (e.prese>e.previsione ? 'ha preso troppe prese' : 'ha preso troppo poche prese');
    return `<div class="deal-end-row ${persaVita?'':'win'}" style="flex-direction:column;align-items:flex-start;gap:2px;">
      <span style="font-weight:700;">${esc(e.name)}${e.eliminated?' 💀 eliminato':''}</span>
      <span style="font-weight:400;font-size:13px;">${e.previsione} previste · ${e.prese} prese — ${esito}${persaVita?' · -1 vita ('+e.viteAfter+' rimaste)':' · nessuna vita persa ('+e.viteAfter+' rimaste)'}</span>
    </div>`;
  }).join('');
  return `
    <div class="deal-end-banner">
      <h3>Fine mano ${ultima.round} — ${ultima.cards} cart${ultima.cards===1?'a':'e'}</h3>
      ${rows}
      <button class="btn-primary" style="margin-top:12px;width:100%;" onclick="continueAfterBiscaRoundEnd('${match.id}')">Prossima mano</button>
    </div>`;
}

function renderMatch(match, claim){
  const cards = SEQ[match.roundIndex % SEQ.length];
  const revealAll = claim.type==='all';
  const myId = claim.type==='seat' ? claim.playerId : null;
  const myLabel = revealAll ? 'tutti visibili' : esc(nameOf(match,myId));

  if(match.phase==='roundEnd'){
    return `
      <div class="card">
        <div class="toolbar">
          <span>${hudAvatar(myLabel)}Sei: ${myLabel}</span>
          <button class="btn-danger btn-small" onclick="abandonMatch()">Abbandona</button>
        </div>
        ${renderRoundEndBanner(match)}
      </div>
      ${renderLog(match)}
    `;
  }

  let body = match.phase==='predict' ? renderPredict(match, cards, revealAll, myId) : renderPlay(match, cards, revealAll, myId);

  // --- chi ha il turno adesso, detto in modo inequivocabile
  const turnId = match.phase==='play'
    ? (match.trick && match.trick.resolved ? null : match.trick.turnOrder[match.trick.plays.length])
    : match.turnOrder.find(id=>match.previsioni[id]===undefined);
  let turnBar = '';
  if(turnId){
    const isMine = revealAll || turnId===myId;
    turnBar = `<div class="turn-bar ${isMine?'mine':''}">${isMine
      ? (revealAll ? 'Tocca a <b>'+esc(nameOf(match,turnId))+'</b>' : '► TOCCA A TE')
      : 'Sta giocando <b>'+esc(nameOf(match,turnId))+'</b> — aspetta <button class="refresh-mini" onclick="forceResync()" title="Aggiorna">⟳</button>'}</div>`;
  }

  // --- avviso onesto quando le nostre mosse non stanno arrivando agli altri
  const syncWarn = syncDiverged ? `
    <div class="desync-warn">
      <b>Attenzione:</b> le tue mosse non stanno arrivando agli altri dispositivi.
      Voi due state vedendo due partite diverse.
      <div class="row-btns" style="margin-top:8px;">
        <button class="btn-secondary btn-small" onclick="forceResync()">Riallinea alla partita degli altri</button>
        <button class="btn-secondary btn-small" onclick="openShareFromMatch()">Codice partita</button>
      </div>
    </div>` : '';

  return `
    <div class="card">
      <div class="toolbar">
        <span>${hudAvatar(myLabel)}Sei: ${myLabel}</span>
        <div class="row-btns" style="flex:0;gap:6px;">
          <button class="btn-secondary btn-small" onclick="changeSeat('${match.id}')">Cambia</button>
          <button class="btn-danger btn-small" onclick="abandonMatch()">Abbandona</button>
        </div>
      </div>
      ${syncWarn}
      ${turnBar}
      ${renderTableSVG(match, cards, revealAll, myId)}
      ${body}
    </div>
    ${renderLog(match)}
  `;
}
function openShareFromMatch(){
  // mostra il pannello di condivisione anche durante la partita (di norma nascosto in modalita compatta)
  document.body.classList.add('force-share');
  const p = document.getElementById('code-panel');
  if(p) p.style.display = 'block';
  const el = document.getElementById('sync-panel');
  if(el) el.scrollIntoView({behavior:'smooth', block:'center'});
}

function renderHandsBlock(match, cards, revealAll, myId, opts){
  const forehead = cards===1;
  const turnId = opts && opts.turnId;
  const interactive = !!(opts && opts.interactive);
  return match.roundActive.map(pid=>{
    const isMe = pid===myId;
    const isTurn = !!turnId && pid===turnId;
    const hidden = !revealAll && (forehead ? isMe : !isMe);
    const player = match.players.find(p=>p.id===pid);
    const previsione = match.previsioni ? match.previsioni[pid] : undefined;
    const preseFatte = (match.tricksWon && match.tricksWon[pid]) || 0;
    const fraction = previsione!==undefined ? `<span class="trick-fraction">${preseFatte}/${previsione}</span>` : '';

    if(hidden && !isMe){
      // avversario a mano nascosta: riga compatta senza le carte (gia rappresentate sul tavolo), ma con nome/previsione/vite ben visibili
      return `
        <div class="hand-block compact">
          <div class="hand-block-head">
            <span>${esc(player.name)}${player.isBot?' 🤖':''}${fraction} ${isTurn?'<b>· tocca a lui/lei</b>':''}</span>
            <span class="lives-dots">${livesDots(player.lives, match.startingLives)}</span>
          </div>
        </div>`;
    }
    const hand = match.hands[pid];

    let cardsHtml;
    if(hidden){
      cardsHtml = `<div class="hand">${hand.map(()=>`<span class="hand-card hidden-card">${cardBackSVG()}</span>`).join('')}</div>`;
      if(interactive && forehead && isMe && isTurn && hand.length===1){
        cardsHtml += `<button class="btn-primary mystery-btn" style="margin-top:8px;" onclick="playCard('${match.id}','${pid}','${hand[0].id}')">Gioca la tua carta misteriosa</button>`;
      }
    } else {
      const sorted = [...hand].sort((a,b)=> a.si-b.si || a.ri-b.ri);
      const clickable = interactive && (revealAll || isMe) && isTurn;
      cardsHtml = `<div class="hand">${sorted.map(c=>
        clickable
          ? (isAssoDenari(c)
              ? `<button class="hand-card ${SUIT_CLASS[c.suit]}" title="${cardLabel(c)}" onclick="chooseAceValue('${match.id}','${pid}','${c.id}')">${cardFrontSVG(c)}</button>`
              : `<button class="hand-card ${SUIT_CLASS[c.suit]}" title="${cardLabel(c)}" onclick="playCard('${match.id}','${pid}','${c.id}')">${cardFrontSVG(c)}</button>`)
          : `<span class="hand-card ${SUIT_CLASS[c.suit]} disabled" title="${cardLabel(c)}">${cardFrontSVG(c)}</span>`
      ).join('')}</div>`;
    }

    return `
      <div class="hand-block">
        <div class="hand-block-head">
          <span>${esc(nameOf(match,pid))}${player.isBot?' 🤖':''}${fraction} ${isTurn?'<b>· tocca a lui/lei</b>':''}</span>
          <span class="lives-dots">${livesDots(player.lives, match.startingLives)}</span>
        </div>
        ${cardsHtml}
      </div>`;
  }).join('');
}

function renderPredict(match, cards, revealAll, myId){
  const target = match.turnOrder.find(id => match.previsioni[id]===undefined);
  const already = match.turnOrder.filter(id=>match.previsioni[id]!==undefined)
    .map(id=>`<div class="player-row"><div class="player-name">${esc(nameOf(match,id))}</div><div style="text-align:right;font-family:'IBM Plex Mono',monospace;">${match.previsioni[id]}</div></div>`).join('');

  const canAct = revealAll || target===myId;
  const forehead = cards===1;

  const vietato = numeroVietato(match, target, cards);
  const buttons = Array.from({length: cards+1}, (_,v)=>v)
    .map(v=> v===vietato
      ? `<button class="btn-secondary predict-btn" disabled title="Non puoi far pareggiare tutti">${v}</button>`
      : `<button class="btn-secondary predict-btn" onclick="declarePrevisione('${match.id}','${target}',${v},${cards})">${v}</button>`)
    .join('');

  const inputBlock = canAct ? `
    <div class="turn-banner">Tocca a <b>${esc(nameOf(match,target))}</b> dichiarare.</div>
    ${forehead && !revealAll ? '<div class="forehead-note">Mano da 1 carta: non conosci la tua carta, dichiara alla cieca.</div>' : ''}
    ${vietato!==null ? `<div class="forehead-note">Sei l'ultimo a dichiarare: non puoi scegliere ${vietato}, farebbe pareggiare esattamente le carte in gioco.</div>` : ''}
    <div class="predict-btn-row">${buttons}</div>
  ` : `<div class="waiting-banner">In attesa che <b>${esc(nameOf(match,target))}</b> dichiari...</div>`;

  return `
    <div class="round-banner"><span class="round-badge">Mano ${match.roundIndex+1} · ${cards} cart${cards===1?'a':'e'}</span></div>
    <h2 style="margin-top:0;">La tua mano</h2>
    ${renderHandsBlock(match, cards, revealAll, myId, {interactive:false, turnId:null})}
    <h2>Previsioni</h2>
    <p class="hint">Si dichiara in ordine, a partire da chi apre questa mano a rotazione. Guarda la tua mano qui sopra prima di dichiarare.</p>
    ${already}
    ${inputBlock}
  `;
}

function renderPlay(match, cards, revealAll, myId){
  const trick = match.trick;
  const resolved = !!trick.resolved;
  const turnId = resolved ? null : trick.turnOrder[trick.plays.length];
  const forehead = cards===1;

  const continueBlock = resolved ? `
    <div class="turn-banner">Presa vinta da <b>${esc(nameOf(match,trick.winnerId))}</b>.</div>
    <button class="btn-primary" onclick="continueAfterTrick('${match.id}')">${trick.roundDoneNext ? 'Vedi il risultato della mano' : 'Prossima presa'}</button>
  ` : '';

  const aceChoiceBlock = (pendingAceChoice && pendingAceChoice.matchId===match.id) ? `
    <div class="turn-banner">Asso di Denari: che valore gli dai?</div>
    <div class="row-btns">
      <button class="btn-secondary" onclick="confirmAceValue('basso')">Meno dell'Asso di Bastoni</button>
      <button class="btn-secondary" onclick="confirmAceValue('alto')">Più del Re di Denari</button>
    </div>
    <button class="btn-danger btn-small" style="margin-top:8px;" onclick="cancelAceChoice()">Annulla</button>
  ` : '';

  const hands = renderHandsBlock(match, cards, revealAll, myId, {interactive:true, turnId});

  return `
    <div class="round-banner"><span class="round-badge">Mano ${match.roundIndex+1} · ${cards} cart${cards===1?'a':'e'} · presa ${trick.plays.length? 'in corso':'nuova'}</span></div>
    ${forehead ? '<div class="forehead-note">Mano da 1 carta: vedi le carte degli altri ma non la tua.</div>' : ''}
    ${continueBlock}
    ${aceChoiceBlock}
    ${hands}
  `;
}

function renderLog(match){
  if(!match.log || match.log.length===0) return '';
  const rounds = match.log.slice().reverse().map(r=>`
    <div class="log-round">
      <div class="log-round-title">Mano ${r.round} · ${r.cards} carte</div>
      ${r.entries.map(e=>`
        <div class="log-entry">
          <span>${esc(e.name)}${e.eliminated?'<span class="eliminated-tag">eliminato</span>':''}</span>
          <span>prev ${e.previsione}</span>
          <span>fatte ${e.prese}</span>
          <span class="${e.delta===0?'delta-ok':'delta-bad'}">${e.delta===0?'esatto':'-1 vita (scarto '+e.delta+')'}</span>
        </div>`).join('')}
    </div>`).join('');
  return `<div class="card">
    <div class="sync-toggle" onclick="toggleLogPanel()" style="margin-top:0;">Andamento partita ▾</div>
    <div id="log-panel" style="display:none;margin-top:12px;">${rounds}</div>
  </div>`;
}
function toggleLogPanel(){
  const p = document.getElementById('log-panel');
  if(p) p.style.display = p.style.display==='none' ? 'block' : 'none';
}

async function abandonMatch(){
  if(!confirm('Abbandonare la partita in corso? Non verrà salvata nello storico.')) return;
  const match = await getActiveMatch();
  await clearActiveMatch();
  if(match) await clearClaim(match.id);
  if(myRoomId){
    try{ const list=(await getRooms()).filter(s=>s.id!==myRoomId); await saveRooms(list); }catch(e){}
  }
  myRoomId=null; mySeatIdx=null; soloMode=false; lobbyView='lobby';
  await rememberSeat();
  lastRenderKey=null;
  await render(true);
}

// ---------------- STORICO ----------------
let openHistoryId = null;
function renderHistory(history){
  if(history.length===0) return `<div class="card"><h2>Storico partite</h2><p class="empty">Nessuna partita ancora giocata.</p></div>`;
  const items = history.map(h=>{
    const isOpen = openHistoryId === h.id;
    const scopa = h.game==='scopa';
    const briscola = h.game==='briscola';
    const vecia = h.game==='vecia';
    const cavacamisa = h.game==='cavacamisa';
    const gameLabel = scopa ? 'Scopa' : (briscola ? 'Briscola' : (vecia ? 'Vecia' : (cavacamisa ? 'Cava Camisa' : 'Bisca')));
    const detail = isOpen ? `
      <div class="history-detail">
        ${h.players.map(p=>`
          <div class="rank-row ${vecia ? (p.isLoser?'':'win') : (p.rank===1?'win':'')}">
            <span>${vecia ? '' : p.rank+'. '}${esc(p.name)}${p.isBot?' 🤖':''}</span>
            <span>${scopa ? p.punti+' punti' : (briscola||cavacamisa) ? p.maniVinte+' man'+(p.maniVinte===1?'o':'i')+' vinte' : vecia ? (p.isLoser?'😱 è la Vecia':'✅ salvo') : (p.rank===1?'vincitore':'eliminato mano '+p.eliminatedAtRound)}</span>
          </div>`).join('')}
        <div style="font-size:12px;color:var(--cream-dim);margin-top:6px;">${
          scopa ? 'formato '+(h.format||'1v1')+' · a '+(h.target||11)+' punti · '+h.rounds+' man'+(h.rounds===1?'o':'i')+' giocate'
          : briscola ? 'formato '+(h.format||'1v1')+' · prima a '+(h.handsToWin||4)+' mani vinte · '+(h.dealNumber||1)+' man'+((h.dealNumber||1)===1?'o':'i')+' giocate'
          : cavacamisa ? 'prima a '+(h.handsToWin||2)+' mani vinte · '+(h.dealNumber||1)+' man'+((h.dealNumber||1)===1?'o':'i')+' giocate'
          : vecia ? 'partita secca'
          : h.rounds+' man'+(h.rounds===1?'o':'i')+' giocate · '+(h.startingLives||3)+' vite a testa'
        }</div>
      </div>` : '';
    return `
      <div class="history-item" onclick="toggleHistory('${h.id}')">
        <div class="h-top">
          <span>${new Date(h.date).toLocaleDateString('it-IT',{day:'2-digit',month:'2-digit',year:'numeric'})} · <span class="game-tag">${gameLabel}</span> · ${h.solo?'Singolo 🤖':'Con amici'}</span>
          <span>${h.players.length} giocatori</span>
        </div>
        <div class="h-winner">${vecia ? '😱 '+esc(h.loser)+' è la Vecia' : (h.winner ? '🏆 '+esc(h.winner) : 'Nessun vincitore netto')}</div>
        ${detail}
      </div>`;
  }).join('');
  return `<div class="card"><h2>Storico partite</h2>${items}</div>`;
}
function toggleHistory(id){ openHistoryId = openHistoryId===id ? null : id; render(); }

// ---------------- AVVIO ----------------
// L'avvio e' gestito da avviaApp() nel modulo Firebase, che parte quando la
// pagina e' pronta. Manteniamo un controllo di sicurezza poco frequente nel
// caso un aggiornamento in tempo reale andasse perso.
setInterval(()=>{
  if(document.visibilityState!=='visible') return;
  const a = document.activeElement;
  if(a && (a.tagName==='INPUT' || a.tagName==='TEXTAREA')) return;
  render();
}, 4000);
document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState==='visible') render(); });

// rendo raggiungibili le funzioni usate dai pulsanti della pagina
window.render = render;
window.recallSeat = recallSeat;
window.tryLoadFromHash = tryLoadFromHash;
window.updateSyncPanel = updateSyncPanel;
window.matchKey = matchKey;

document.addEventListener('DOMContentLoaded', avviaApp);
if(document.readyState !== 'loading') avviaApp();
</script>
