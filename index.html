// =========================================================================
// BRISCOLA — motore completo: 1v1, 1v1v1 (ognuno per se'), 2v2 a coppie fisse.
// Mano singola che esaurisce tutto il mazzo (niente punteggio a obiettivo
// su piu' mani, a differenza della Scopa): chi somma piu' punti a fine mazzo vince.
// =========================================================================
const BRISCOLA_VALUE = {'A':11,'3':10,'Re':4,'Cavallo':3,'Fante':2,'7':0,'6':0,'5':0,'4':0,'2':0};
const BRISCOLA_STRENGTH = {'A':10,'3':9,'Re':8,'Cavallo':7,'Fante':6,'7':5,'6':4,'5':3,'4':2,'2':1};
function briscolaValue(c){ return BRISCOLA_VALUE[c.rank]; }
function briscolaStrength(c){ return BRISCOLA_STRENGTH[c.rank]; }

// stato scelto in creazione sala / solitario, prima di avviare
let briscolaFormat = '1v1'; // '1v1' | '1v1v1' | '2v2'
let briscolaShowLiveScore = true; // mostra o nasconde i punti gia' accumulati durante la mano corrente
function briscolaFormatPlayers(format){ return format==='2v2' ? 4 : (format==='1v1v1' ? 3 : 2); }

function dealBriscola(seed, playerIds){
  const deck = seededShuffle(freshDeck(), seed);
  let idx = 0;
  const hands = {};
  playerIds.forEach(pid=>{ hands[pid] = deck.slice(idx, idx+3); idx += 3; });
  const briscolaCard = deck[idx]; idx += 1;
  const restoMazzo = deck.slice(idx);
  // la carta di briscola resta scoperta "in fondo" al mazzo: e' l'ultima che si pesca
  const remainingDeck = restoMazzo.concat([briscolaCard]);
  return { hands, briscolaCard, briscolaSuit: briscolaCard.suit, remainingDeck };
}

function trickWinnerBriscola(plays, briscolaSuit){
  const ledSuit = plays[0].card.suit;
  function beats(sfidante, attuale){
    const sfB = sfidante.card.suit===briscolaSuit, atB = attuale.card.suit===briscolaSuit;
    if(sfB && !atB) return true;
    if(!sfB && atB) return false;
    if(sfB && atB) return briscolaStrength(sfidante.card) > briscolaStrength(attuale.card);
    const sfSeme = sfidante.card.suit===ledSuit, atSeme = attuale.card.suit===ledSuit;
    if(sfSeme && atSeme) return briscolaStrength(sfidante.card) > briscolaStrength(attuale.card);
    if(sfSeme && !atSeme) return true; // per robustezza, anche se 'attuale' resta sempre valido
    return false;
  }
  let best = plays[0];
  for(let i=1;i<plays.length;i++) if(beats(plays[i], best)) best = plays[i];
  return best.playerId;
}

function buildBriscolaMatch(id, names, format){
  const players = names.map((name,i)=>({id:'p'+i, name, isBot:false, captured:[]}));
  const ids = players.map(p=>p.id);
  const teams = assignScopaTeams(ids, format); // generica: {teamA,teamB} solo se format==='2v2'
  const seed = (Math.random()*2147483647)|0;
  const dealt = dealBriscola(seed, ids);
  const groups = teams ? [{key:'teamA'},{key:'teamB'}] : players.map(p=>({key:p.id}));
  const totalScores = {}, handWins = {};
  groups.forEach(g=>{ totalScores[g.key]=0; handWins[g.key]=0; });
  const leaderId = ids[Math.floor(Math.random()*ids.length)];
  return {
    id, game:'briscola', seed, createdAt:new Date().toISOString(),
    format, players, teams, totalScores,
    handsToWin: 4, dealNumber: 1, handWins, dealHistory: [],
    hands: dealt.hands, briscolaCard: dealt.briscolaCard, briscolaSuit: dealt.briscolaSuit,
    remainingDeck: dealt.remainingDeck,
    trick: { plays:[], turnOrder: rotateFromId(ids, leaderId) },
    showLiveScore: briscolaShowLiveScore,
    phase: 'playing'
  };
}

async function playBriscolaCard(matchId, playerId, cardId){
  const match = await getActiveMatch();
  if(!match || match.id!==matchId) return;
  const trick = match.trick;
  const expected = trick.turnOrder[trick.plays.length];
  if(expected !== playerId) return;
  const hand = match.hands[playerId];
  const ci = hand.findIndex(c=>c.id===cardId);
  if(ci<0) return;
  const card = hand.splice(ci,1)[0];
  cardFxThrowFromSeat(match, match.turnOrder, playerId, cardSrc(card.suit, card.rank));
  trick.plays.push({playerId, card});

  if(trick.plays.length === trick.turnOrder.length){
    const winnerId = trickWinnerBriscola(trick.plays, match.briscolaSuit);
    const winner = match.players.find(p=>p.id===winnerId);
    winner.captured.push(...trick.plays.map(p=>p.card));
    trick.winnerId = winnerId;
    trick.resolved = true;
    // etichetta bottone: sara' l'ultima presa? (dopo che i partecipanti a questa presa
    // avranno pescato, a nessuno resterebbero piu' carte)
    const cardsLeftAfterDraw = Object.values(match.hands).reduce((s,h)=>s+h.length,0) + Math.min(match.remainingDeck.length, trick.turnOrder.length);
    trick.roundDoneNext = cardsLeftAfterDraw === 0;
  }
  await setActiveMatch(match);
  await render();
}

async function continueAfterBriscolaTrick(matchId){
  const match = await getActiveMatch();
  if(!match || match.id!==matchId || !match.trick || !match.trick.resolved) return;
  const winnerId = match.trick.winnerId;
  // il vincitore della presa pesca per primo, poi gli altri PARTECIPANTI A QUESTA PRESA
  // in ordine di turno (chi aveva gia' esaurito le carte prima non pesca, non ha senso);
  // l'ultima carta pescata da qualcuno e' proprio quella di briscola rimasta scoperta
  const drawOrder = rotateFromId(match.trick.turnOrder.slice(), winnerId);
  drawOrder.forEach(pid=>{
    if(match.remainingDeck.length>0) match.hands[pid].push(match.remainingDeck.shift());
  });
  const finished = match.players.every(p=>match.hands[p.id].length===0);
  if(finished){
    finishBriscolaDeal(match);
    await maybeSaveBriscolaHistory(match);
  } else {
    // la prossima presa coinvolge solo chi ha ancora almeno una carta in mano: con un
    // numero di giocatori che non divide esattamente il mazzo (es. in 3), le ultime
    // prese possono avere meno partecipanti, come nella Briscola tradizionale.
    const prossimiAttivi = match.players.map(p=>p.id).filter(pid=>match.hands[pid].length>0);
    match.trick = { plays:[], turnOrder: rotateFromId(prossimiAttivi, winnerId) };
  }
  await setActiveMatch(match);
  await render();
}

// Calcola i punti della mano (mazzo) appena conclusa, aggiorna le mani vinte — il pareggio
// in una singola mano NON conta ai fini delle mani vinte, come richiesto — e decide se la
// partita e' finita (qualcuno ha raggiunto l'obiettivo di mani vinte) o se si continua.
function finishBriscolaDeal(match){
  const groups = scopaTeams(match); // generica: coppie in 2v2, altrimenti ognuno per se'
  const dealScores = {};
  groups.forEach(g=>{
    dealScores[g.key] = g.ids.reduce((s,pid)=>{
      const player = match.players.find(p=>p.id===pid);
      return s + player.captured.reduce((s2,c)=>s2+briscolaValue(c),0);
    }, 0);
  });
  let vincitoreMano = groups[0].key, maxPunti = dealScores[groups[0].key], pareggio=false;
  groups.forEach(g=>{
    if(dealScores[g.key] > maxPunti){ maxPunti = dealScores[g.key]; vincitoreMano = g.key; pareggio=false; }
    else if(g.key!==vincitoreMano && dealScores[g.key]===maxPunti){ pareggio = true; }
  });
  if(!pareggio) match.handWins[vincitoreMano] = (match.handWins[vincitoreMano]||0) + 1;
  match.dealHistory.push({dealNumber: match.dealNumber, scores: dealScores, winnerKey: pareggio ? null : vincitoreMano});
  match.totalScores = dealScores; // punti dell'ultima mano, mostrati nel banner e nel punteggio corrente

  const traguardo = groups.find(g=>(match.handWins[g.key]||0) >= match.handsToWin);
  if(traguardo){
    match.phase = 'ended';
    match._winnerKey = traguardo.key;
  } else {
    match.phase = 'dealEnd'; // fase intermedia: banner di fine mano, si avanza solo al click dell'utente
  }
}

async function continueAfterBriscolaDeal(matchId){
  const match = await getActiveMatch();
  if(!match || match.id!==matchId || match.phase!=='dealEnd') return;
  match.dealNumber += 1;
  const ids = match.players.map(p=>p.id);
  const seed = (Math.random()*2147483647)|0;
  match.seed = seed;
  const dealt = dealBriscola(seed, ids);
  match.hands = dealt.hands; match.briscolaCard = dealt.briscolaCard; match.briscolaSuit = dealt.briscolaSuit;
  match.remainingDeck = dealt.remainingDeck;
  match.players.forEach(p=>{ p.captured=[]; });
  // il mazziere/apertura ruota di un posto a ogni mano, come in Bisca
  const leaderIdx = ((match._leaderIdx ?? Math.floor(Math.random()*ids.length)) + 1) % ids.length;
  match._leaderIdx = leaderIdx;
  match.trick = { plays:[], turnOrder: rotateFromId(ids, ids[leaderIdx]) };
  match.phase = 'playing';
  await setActiveMatch(match);
  await render();
}

async function maybeSaveBriscolaHistory(match){
  if(match.phase!=='ended' || match._historySaved) return;
  match._historySaved = true;
  const groups = scopaTeams(match);
  const ranked = [...groups].sort((a,b)=>(match.handWins[b.key]||0)-(match.handWins[a.key]||0))
    .map((g,i)=>({name: teamLabel(match,g.key), rank:i+1, maniVinte: match.handWins[g.key]||0,
      isBot: g.ids.every(id=>match.players.find(p=>p.id===id).isBot)}));
  const historyEntry = {
    id:match.id, date:match.createdAt, endedAt:new Date().toISOString(),
    game:'briscola', format:match.format, handsToWin: match.handsToWin, dealNumber: match.dealNumber,
    winner: match._winnerKey ? teamLabel(match,match._winnerKey) : null,
    players:ranked, solo: match.players.some(p=>p.isBot)
  };
  const history = await getHistory();
  history.unshift(historyEntry);
  await saveHistory(history);
  if(myRoomId){
    try{ const list=(await getRooms()).filter(s=>s.id!==myRoomId); await saveRooms(list); }catch(e){}
  }
}

// --- Bot Briscola ---------------------------------------------------------
// Euristica piu' sofisticata di un semplice "vinco se conviene": chi apre scarta
// la carta piu' debole senza punti (risparmia assi/tre); chi segue vince solo se
// conviene (ci sono punti in palio o e' l'ultima presa) e con la carta piu'
// economica che comunque basta; se il compagno di squadra sta gia' vincendo, non
// spreca carte inutilmente. In piu': tiene il conto di quali briscole "cariche"
// (Asso, 3, Re, Cavallo, Fante) sono gia' uscite, per capire quanto rischia di
// farsi rubare la presa da un avversario che deve ancora giocare dopo di lui in
// questo stesso giro — un giocatore esperto non rischia una carta preziosa per
// pochi punti se sa che in giro ci sono ancora molte briscole forti sconosciute.
function briscolaCarteVisibili(match){
  const viste = new Set();
  match.players.forEach(p=>{ (p.captured||[]).forEach(c=>viste.add(c.id)); });
  match.trick.plays.forEach(p=>viste.add(p.card.id));
  return viste;
}
function briscolaCaricheSconosciute(match, playerId){
  const viste = briscolaCarteVisibili(match);
  const miaMano = new Set(match.hands[playerId].map(c=>c.id));
  let n = 0;
  RANKS.forEach(r=>{
    const id = match.briscolaSuit+'-'+r;
    if(BRISCOLA_VALUE[r]>0 && !viste.has(id) && !miaMano.has(id)) n++;
  });
  return n;
}
function botChooseBriscolaCard(match, playerId){
  const hand = match.hands[playerId];
  const trick = match.trick;
  const briscolaSuit = match.briscolaSuit;
  const is2v2 = match.format==='2v2';

  function scartaMigliore(pool){
    const nonBriscola = pool.filter(c=>c.suit!==briscolaSuit);
    const base = nonBriscola.length ? nonBriscola : pool;
    const senzaValore = base.filter(c=>briscolaValue(c)===0);
    const scelte = senzaValore.length ? senzaValore : base;
    return scelte.reduce((a,b)=> briscolaStrength(a)<=briscolaStrength(b) ? a : b);
  }

  if(trick.plays.length===0){
    return scartaMigliore(hand);
  }

  const currentWinnerId = trickWinnerBriscola(trick.plays, briscolaSuit);
  const teammateWinning = is2v2 && teamOf(match,currentWinnerId)===teamOf(match,playerId) && currentWinnerId!==playerId;
  const puntiSulTavolo = trick.plays.reduce((s,p)=>s+briscolaValue(p.card),0);

  if(teammateWinning){
    return scartaMigliore(hand);
  }

  const vincenti = hand.filter(c=>{
    const test = trick.plays.concat([{playerId:'__bot__', card:c}]);
    return trickWinnerBriscola(test, briscolaSuit)==='__bot__';
  });

  // conviene provare a vincere se ci sono punti in palio, oppure se questa e' l'ultima
  // carta in mano a tutti (ultimissima presa della partita: ogni punto conta)
  const ultimissimaPresa = Object.values(match.hands).every(h=>h.length===1) && match.remainingDeck.length===0;
  if(vincenti.length && (puntiSulTavolo>0 || ultimissimaPresa)){
    const scelta = vincenti.reduce((a,b)=> briscolaStrength(a)<=briscolaStrength(b) ? a : b);
    // se dopo di me c'e' ancora qualcuno che deve giocare in questa presa, la carta
    // che sto per usare vale parecchio, e in giro ci sono ancora molte briscole cariche
    // sconosciute, il rischio di perderla per pochi punti non conviene: meglio scartare
    // e aspettare un momento piu' sicuro (a meno che sia comunque l'ultimissima presa).
    const restanoDopo = trick.turnOrder.length - trick.plays.length - 1;
    if(restanoDopo>0 && !ultimissimaPresa && briscolaValue(scelta)>=4){
      const rischio = briscolaCaricheSconosciute(match, playerId);
      // rischio "alto" se almeno meta' delle briscole cariche rimanenti sono ancora
      // sconosciute e in palio ci sono pochi punti rispetto a quanto rischierei di perdere
      if(rischio>=3 && puntiSulTavolo < briscolaValue(scelta)){
        return scartaMigliore(hand);
      }
    }
    return scelta;
  }
  return scartaMigliore(hand);
}

const BRISCOLA_BOT_THINK_MS = 900;
const BRISCOLA_TRICK_REVEAL_MS = 1500; // quanto resta in vista, illuminata, la carta che ha preso
async function scheduleBriscolaBotMove(match){
  if(!match || match.phase!=='playing') return;

  // presa appena risolta: nessuno gioca, si aspetta solo che la breve pausa finisca.
  // Ogni dispositivo che la vede tiene il proprio timer, come per la Scopa, cosi la
  // partita non resta bloccata se chi ha giocato l'ultima carta chiude la pagina.
  if(match.trick.resolved){
    const key = 'briscolaResolved|'+match.id+'|'+match.trick.winnerId+'|'+match.trick.plays.length;
    if(botMoveKey===key) return;
    botMoveKey = key;
    if(botMoveTimer) clearTimeout(botMoveTimer);
    botMoveTimer = setTimeout(()=>{ continueAfterBriscolaTrick(match.id); }, BRISCOLA_TRICK_REVEAL_MS);
    return;
  }

  const playerId = match.trick.turnOrder[match.trick.plays.length];
  const player = match.players.find(p=>p.id===playerId);
  if(!player || !player.isBot){ botMoveKey=null; return; }
  const key = 'briscola|'+match.id+'|'+match.trick.plays.length+'|'+match.hands[playerId].length+'|'+match.remainingDeck.length;
  if(botMoveKey===key) return;
  botMoveKey = key;
  if(botMoveTimer) clearTimeout(botMoveTimer);
  botMoveTimer = setTimeout(async ()=>{
    const cur = await getActiveMatch();
    if(!cur || cur.game!=='briscola' || cur.phase!=='playing' || cur.trick.resolved) return;
    const choice = botChooseBriscolaCard(cur, playerId);
    if(choice) await playBriscolaCard(cur.id, playerId, choice.id);
  }, BRISCOLA_BOT_THINK_MS);
}

// --- Tavolo circolare Briscola: stessa geometria di Bisca (una carta giocata
// per posto durante la presa), con mazzo residuo + carta di briscola al centro.
function renderBriscolaTableSVG(match, myId){
  const ids = rotateIdsForMe(match.players.map(p=>p.id), myId);
  const n = ids.length;
  const C = tableConfig(n);
  const VB = C.VB, fs = C.fs;
  const cx = VB/2, cy = VB/2, half = C.half, avatarR = C.avatarR;
  const cardSc = C.cardScale*fs;
  const cardW = 52*cardSc, cardH = 108*cardSc;
  const is2v2 = match.format==='2v2';
  const turnId = match.trick.resolved ? null : match.trick.turnOrder[match.trick.plays.length];
  const layout = rectSeatLayout(half, half, n);

  let seats = '';
  let turnDotSvg = '';
  ids.forEach((pid,i)=>{
    const {x:relX, y:relY, dirX, dirY} = layout[i];
    const x = cx+relX, y = cy+relY;
    const radialLen = Math.hypot(relX, relY) || 1;
    const nx = relX/radialLen, ny = relY/radialLen;
    const player = match.players.find(p=>p.id===pid);
    const cardsLeft = (match.hands[pid]||[]).length;
    const isTurn = pid===turnId;
    const isMe = pid===myId;
    const squadra = is2v2 ? teamOf(match,pid) : null;
    const teamTint = squadra==='teamA' ? '#D4AF6A' : (squadra==='teamB' ? '#7FA8C9' : null);

    const displayDirY = dirY!==0 ? dirY : (relY>=0 ? 1 : -1);
    const statY = y + displayDirY*(avatarR + 11*fs);
    const nameY = y + displayDirY*(avatarR + 27*fs);

    const puntiPresi = (player.captured||[]).reduce((s,c)=>s+briscolaValue(c),0);
    const statW = 46*fs;
    const statSvg = match.showLiveScore ? `
      <rect x="${x-statW/2}" y="${statY-8*fs}" width="${statW}" height="${16*fs}" rx="${8*fs}" fill="rgba(255,255,255,.05)" stroke="#3C5A4C" stroke-width="1"/>
      <text x="${x}" y="${statY+4*fs}" text-anchor="middle" font-family="'IBM Plex Mono',monospace" font-size="${9.5*fs}" font-weight="700" fill="#B9C4BC">${puntiPresi} pt</text>` : '';

    let nm = player.name.length>10 ? player.name.slice(0,9)+'…' : player.name;
    const squadraTag = is2v2 ? (squadra==='teamA'?' (A)':' (B)') : '';
    const label = esc(nm) + (isMe?' (tu)':(player.isBot?' ᴀɪ':'')) + squadraTag;
    const pillW = Math.max(52*fs, label.length*7*fs + 16);
    const lx = Math.max(pillW/2+3, Math.min(VB-pillW/2-3, x));
    const ly = nameY;

    // carta giocata in questa presa, spostata verso il centro lungo l'asse giusto
    let playedCardSvg = '';
    const playEntry = match.trick.plays.find(p=>p.playerId===pid);
    if(playEntry){
      const outerEdge = half - avatarR;
      const innerEdge = C.centerHalf;
      const playedDist = (innerEdge+outerEdge)/2;
      const px = cx + nx*playedDist;
      const py = cy + ny*playedDist;
      const isWin = match.trick.resolved && match.trick.winnerId===pid;
      const tilt = (Math.atan2(ny,nx)*180/Math.PI + 90) * 0.12;
      const src = cardSrc(playEntry.card.suit, playEntry.card.rank);
      playedCardSvg = `
        <g transform="translate(${px},${py}) rotate(${tilt})" style="filter:drop-shadow(0 2px 4px rgba(0,0,0,.4));">
          <g class="played-in ${isWin?'played-win':''}">
            <rect x="${-cardW/2}" y="${-cardH/2}" width="${cardW}" height="${cardH}" rx="${3*cardSc}" fill="#F1ECE1" stroke="#8C7647" stroke-width="0.8"/>
            <image href="${src}" x="${-cardW/2}" y="${-cardH/2}" width="${cardW}" height="${cardH}" preserveAspectRatio="xMidYMid slice" clip-path="url(#brisc-cardclip)"/>
          </g>
        </g>`;
    }

    if(isTurn){
      const dotDist = avatarR + 10*fs;
      const dx2 = x - nx*dotDist, dy2 = y - ny*dotDist;
      turnDotSvg = `<circle class="turn-dot" cx="${dx2}" cy="${dy2}" r="${5*fs}" fill="#D4AF6A" stroke="#16261F" stroke-width="1.2"/>`;
    }

    seats += `
      <g>
        ${isTurn?`<circle class="turn-ring" cx="${x}" cy="${y}" r="${avatarR+5}" fill="none" stroke="#D4AF6A" stroke-width="2"/>`:''}
        <circle cx="${x}" cy="${y}" r="${avatarR}" fill="${isTurn?'#2C4C3E':(isMe?'#4A2A28':'#223B32')}" stroke="${isTurn?'#D4AF6A':(isMe?'#D98878':(teamTint||'#3C5A4C'))}" stroke-width="${isTurn?2.4:(teamTint?2.2:1.8)}"/>
        <rect x="${x-9*fs}" y="${y-13*fs}" width="${18*fs}" height="${26*fs}" rx="3" fill="url(#brisc-cardback)" stroke="#8C7647" stroke-width="1"/>
        <circle cx="${x+9*fs}" cy="${y+10*fs}" r="${7.5*fs}" fill="#16261F" stroke="#D4AF6A" stroke-width="1"/>
        <text x="${x+9*fs}" y="${y+13.5*fs}" text-anchor="middle" font-family="'IBM Plex Mono',monospace" font-size="${9.5*fs}" font-weight="700" fill="#D4AF6A">${cardsLeft}</text>
        ${statSvg}
        ${playedCardSvg}
        <rect x="${lx-pillW/2}" y="${ly-11*fs}" width="${pillW}" height="${19*fs}" rx="${9.5*fs}" fill="rgba(10,20,16,0.92)" stroke="${isTurn?'#D4AF6A':(teamTint||'#3C5A4C')}" stroke-width="1"/>
        <text x="${lx}" y="${ly+3*fs}" text-anchor="middle" font-family="'Fraunces',serif" font-size="${12*fs}" font-weight="700" fill="${isTurn?'#D4AF6A':'#F1ECE1'}">${label}</text>
      </g>`;
  });

  // --- centro: carta di briscola scoperta, ben leggibile nel quadrato centrale
  const deckLeft = match.remainingDeck.length;
  const briscolaVisible = deckLeft > 0; // una volta esaurito il mazzo, l'ultimo l'ha gia' presa in mano
  const bcW = 26*fs, bcH = 54*fs;
  const centerSvg = briscolaVisible ? `
    <g transform="translate(${cx},${cy})">
      <rect x="${-bcW/2}" y="${-bcH/2}" width="${bcW}" height="${bcH}" rx="3" fill="#F1ECE1" stroke="#8C7647" stroke-width="0.8"/>
      <image href="${cardSrc(match.briscolaCard.suit, match.briscolaCard.rank)}" x="${-bcW/2}" y="${-bcH/2}" width="${bcW}" height="${bcH}" preserveAspectRatio="xMidYMid slice" clip-path="url(#brisc-briscolaclip)"/>
    </g>` : '';

  const tableDefs = `
    <defs>
      <clipPath id="brisc-cardclip"><rect x="${-cardW/2}" y="${-cardH/2}" width="${cardW}" height="${cardH}" rx="${3*cardSc}"/></clipPath>
      <clipPath id="brisc-briscolaclip"><rect x="${-bcW/2}" y="${-bcH/2}" width="${bcW}" height="${bcH}" rx="3"/></clipPath>
      <pattern id="brisc-cardback" width="4" height="4" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
        <rect width="4" height="4" fill="#2A4A3C"/>
        <rect width="2" height="4" fill="#1E332B"/>
      </pattern>
      <linearGradient id="feltGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#274539"/>
        <stop offset="60%" stop-color="#1D3730"/>
        <stop offset="100%" stop-color="#132520"/>
      </linearGradient>
      <linearGradient id="centerGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#28483B"/>
        <stop offset="100%" stop-color="#1B322A"/>
      </linearGradient>
    </defs>`;

  const outerPad = 30*fs, feltR = 20*fs, centerR = 14*fs;
  const centerHalf = C.centerHalf*fs;
  const curIdx = turnId ? ids.indexOf(turnId) : -1;
  const nextIdx = curIdx>=0 ? (curIdx+1)%n : -1;
  const flowArrowSvg = turnFlowArrowSVG(layout, curIdx, nextIdx, cx, cy, fs, avatarR, centerHalf);
  return `
    <div class="table-wrap">
      <svg viewBox="0 0 ${VB} ${VB}" width="100%" style="max-width:420px;aspect-ratio:1/1;display:block;height:auto;">
        ${tableDefs}
        <rect x="${cx-half-outerPad}" y="${cy-half-outerPad}" width="${2*(half+outerPad)}" height="${2*(half+outerPad)}" rx="${feltR}" fill="url(#feltGrad3)" stroke="#4A6B5B" stroke-width="2"/>
        <rect x="${cx-centerHalf}" y="${cy-centerHalf}" width="${2*centerHalf}" height="${2*centerHalf}" rx="${centerR}" fill="url(#centerGrad3)" stroke="#3C5A4C" stroke-width="1.2"/>
        ${centerSvg}
        ${seats}
        ${turnDotSvg}
        ${flowArrowSvg}
      </svg>
    </div>`;
}

function briscolaScoreBar(match){
  const groups = scopaTeams(match);
  const chips = groups.map(g=>`
    <div class="score-chip">
      <span>${esc(teamLabel(match,g.key))}</span>
      <span class="score-num">${match.handWins[g.key]||0}</span>
    </div>`).join('');
  return `<div class="score-bar">${chips}<div class="score-chip target">prima a ${match.handsToWin} mani</div></div>`;
}

function renderBriscolaDealEndBanner(match, myId){
  const groups = scopaTeams(match);
  const ultima = match.dealHistory[match.dealHistory.length-1];
  const pareggioMano = ultima.winnerKey===null;
  if(!pareggioMano){
    const perdentiIds = groups.filter(g=>g.key!==ultima.winnerKey).flatMap(g=>g.ids);
    maybeShowLoserPopup(match.id, 'briscola-deal-'+ultima.dealNumber, myId, perdentiIds);
  }
  const rows = groups.map(g=>{
    const vinceQuestaMano = !pareggioMano && ultima.winnerKey===g.key;
    return `<div class="deal-end-row ${vinceQuestaMano?'win':''}">
      <span>${esc(teamLabel(match,g.key))}</span>
      <span>${ultima.scores[g.key]} pt in mano · ${match.handWins[g.key]||0} man${match.handWins[g.key]===1?'o':'i'} vint${match.handWins[g.key]===1?'a':'e'}</span>
    </div>`;
  }).join('');
  return `
    <div class="deal-end-banner">
      <h3>Fine mano ${ultima.dealNumber}${pareggioMano ? ' — pareggio, non conta' : ' — vince '+esc(teamLabel(match,ultima.winnerKey))}</h3>
      ${rows}
      <button class="btn-primary" style="margin-top:10px;width:100%;" onclick="continueAfterBriscolaDeal('${match.id}')">Prossima mano</button>
    </div>`;
}

function renderBriscolaMatch(match, claim){
  const revealAll = claim.type==='all';
  const myId = claim.type==='seat' ? claim.playerId : null;
  if(match.phase==='ended') return renderBriscolaEnd(match, myId);

  if(myId){
    const dealKey = 'briscola|'+match.id+'|'+(match.dealNumber||1);
    if(!(dealKey in dealTableAnimState)){
      dealTableAnimState[dealKey] = 'started';
      const ids = match.players.map(p=>p.id);
      const names = match.players.map(p=>p.name);
      cardFxDealTable(names, ids.indexOf(myId), 3, {
        onDone: ()=>{ dealTableAnimState[dealKey]='done'; lastRenderKey=null; render(true); }
      });
    }
    if(dealTableAnimState[dealKey]==='started') return dealWaitingScreenHTML('Briscola · '+esc(nameOf(match,myId)));
  }

  if(match.phase==='dealEnd'){
    return `
      <div class="card">
        <div class="toolbar">
          <span>Briscola · ${match.format} · ${revealAll?'tutti visibili':esc(nameOf(match,myId))}</span>
          <button class="btn-danger btn-small" onclick="abandonMatch()">Abbandona</button>
        </div>
        ${briscolaScoreBar(match)}
        ${renderBriscolaDealEndBanner(match, myId)}
      </div>`;
  }

  const trick = match.trick;
  const resolved = !!trick.resolved;
  const turnId = resolved ? null : trick.turnOrder[trick.plays.length];
  const isMyTurn = !resolved && (revealAll || turnId===myId);

  const continueBlock = resolved ? `
    <div class="turn-banner">Presa vinta da <b>${esc(nameOf(match,trick.winnerId))}</b>.</div>
  ` : '';

  const turnBanner = resolved ? '' : `<div class="turn-bar ${isMyTurn?'mine':''}">${isMyTurn
    ? (revealAll ? 'Tocca a <b>'+esc(nameOf(match,turnId))+'</b>' : '► TOCCA A TE')
    : 'Sta giocando <b>'+esc(nameOf(match,turnId))+'</b> — aspetta <button class="refresh-mini" onclick="forceResync()" title="Aggiorna">⟳</button>'}</div>`;

  const tableSvg = renderBriscolaTableSVG(match, myId);

  const displayOwner = revealAll ? (turnId!==null?turnId:match.players[0].id) : myId;
  const hand = (displayOwner && match.hands[displayOwner]) || [];
  const puoGiocare = !resolved && displayOwner===turnId && (revealAll || displayOwner===myId);
  const handHtml = hand.length ? `<div class="hand">${hand.map(c=>
      puoGiocare
        ? `<button class="hand-card ${SUIT_CLASS[c.suit]}" title="${cardLabel(c)}" onclick="playBriscolaCard('${match.id}','${displayOwner}','${c.id}')">${cardFrontSVG(c)}</button>`
        : `<span class="hand-card ${SUIT_CLASS[c.suit]} disabled" title="${cardLabel(c)}">${cardFrontSVG(c)}</span>`
    ).join('')}</div>` : `<p class="hint" style="margin:6px 0 0;">Mano vuota.</p>`;

  return `
    <div class="card">
      <div class="toolbar">
        <span>Briscola · ${match.format} · mano ${match.dealNumber} · briscola: ${match.briscolaSuit} · ${match.remainingDeck.length} nel mazzo · ${revealAll?'tutti visibili':esc(nameOf(match,myId))}</span>
        <button class="btn-danger btn-small" onclick="abandonMatch()">Abbandona</button>
      </div>
      ${briscolaScoreBar(match)}
      ${turnBanner}
      ${continueBlock}
      ${tableSvg}
      <h2>${revealAll?'Mano di '+esc(nameOf(match,displayOwner)):'La tua mano'}</h2>
      ${handHtml}
    </div>`;
}

function renderBriscolaEnd(match, myId){
  const groups = scopaTeams(match);
  const perdentiIds = groups.filter(g=>g.key!==match._winnerKey).flatMap(g=>g.ids);
  maybeShowLoserPopup(match.id, 'briscola-end', myId, perdentiIds);
  const ranked = [...groups].sort((a,b)=>(match.handWins[b.key]||0)-(match.handWins[a.key]||0));
  const ultima = match.dealHistory[match.dealHistory.length-1];
  const rows = ranked.map((g,i)=>`
    <div class="rank-row ${i===0?'win':''}">
      <span>${i+1}. ${esc(teamLabel(match,g.key))}</span>
      <span>${match.handWins[g.key]||0} man${match.handWins[g.key]===1?'o':'i'} vint${match.handWins[g.key]===1?'a':'e'}</span>
    </div>
    <div class="hint" style="margin:2px 0 10px;">ultima mano: ${ultima.scores[g.key]} punti</div>`).join('');
  return `
    <div class="card">
      <h2>Partita di Briscola finita</h2>
      <p class="hint">🏆 Vince <b>${esc(teamLabel(match,match._winnerKey))}</b> — prima squadra/giocatore ad arrivare a ${match.handsToWin} mani vinte, dopo ${match.dealNumber} man${match.dealNumber===1?'o':'i'} giocate</p>
      ${rows}
      <button class="btn-primary" style="margin-top:14px;" onclick="backToLobbyFromEnd()">Torna alla lobby</button>
    </div>`;
}

// =========================================================================
// VECIA — la variante italiana del gioco delle coppie ("vecchia"/asino).
// Mazzo da 37 carte (40 meno 3 Fanti: resta solo il Fante di Spade, che per
// costruzione non ha mai un compagno). Si pescano carte a caso, coperte, dal
// vicino di sinistra; chi resta con l'unico Fante di Spade in mano e' la Vecia.
// Partita secca, nessun punteggio da raggiungere. Fino a 6 giocatori.
// =========================================================================
const VECIA_MAX_PLAYERS = 6;

function buildVeciaDeck(){
  const deck = [];
  SUITS.forEach(s=>RANKS.forEach(r=>{
    if(r==='Fante' && s!=='Spade') return; // tolti i 3 fanti diversi da spade: 40-3=37 carte
    deck.push({suit:s, rank:r, id:s+'-'+r});
  }));
  return deck;
}
// Scarta subito le coppie di rango uguale trovate in una mano (come quando si
// guardano le carte appena ricevute): tiene 1 carta se il conteggio e' dispari,
// scarta tutte le coppie complete. Le carte sono anonime tra loro a parita' di
// rango, quindi non importa "quale" scartare, solo il conteggio finale.
function veciaAutoDiscard(hand){
  const byRank = {};
  hand.forEach(c=>{ (byRank[c.rank]=byRank[c.rank]||[]).push(c); });
  const kept = [];
  Object.values(byRank).forEach(arr=>{ if(arr.length%2===1) kept.push(arr[0]); });
  return kept;
}

function buildVeciaMatch(id, names){
  const players = names.map((name,i)=>({id:'p'+i, name, isBot:false}));
  const ids = players.map(p=>p.id);
  const deck = shuffle(buildVeciaDeck());
  const hands = {}; ids.forEach(pid=>hands[pid]=[]);
  deck.forEach((c,i)=>hands[ids[i%ids.length]].push(c));
  ids.forEach(pid=>{ hands[pid] = veciaAutoDiscard(hands[pid]); });
  // il turno parte da chi ha piu' carte; a parita' vince chi e' piu' vicino alla
  // sinistra del mazziere (convenzionalmente il primo giocatore, p0)
  let starterIdx=-1, maxCount=-1;
  for(let step=0; step<ids.length; step++){
    const idx = (1+step) % ids.length;
    const cnt = hands[ids[idx]].length;
    if(cnt>maxCount){ maxCount=cnt; starterIdx=idx; }
  }
  return {
    id, game:'vecia', createdAt:new Date().toISOString(),
    players, hands, turnOrder: ids, currentIdx: starterIdx,
    phase:'playing', pendingReveal:false, lastDraw:null, _loserId:null
  };
}

// il vicino di sinistra di un giocatore: il prossimo in ordine di posto che ha ancora
// carte in mano (chi e' gia' senza carte viene saltato). Riusata sia dal motore sia
// dalla UI, per mostrare di chi e' il mazzetto da cui si sta per pescare.
function veciaLeftNeighborId(match, drawerId){
  const ids = match.turnOrder, n = ids.length;
  const drawerIdx = ids.indexOf(drawerId);
  let leftIdx = (drawerIdx+1)%n, guard=0;
  while(match.hands[ids[leftIdx]].length===0){ leftIdx=(leftIdx+1)%n; guard++; if(guard>n) return null; }
  return ids[leftIdx];
}

// pickIndex: quale carta (per posizione, a dorso coperto) pescare dal mazzetto del
// vicino — come nel gioco reale, dove si vede solo il dorso e si sceglie "quale" carta,
// non "quale valore". Se omesso (o non valido, es. mossa di un bot) si pesca a caso.
// mescola la propria mano coperta in qualsiasi momento: le carte pescate/aggiunte nel
// tempo non restano sempre nello stesso ordine relativo, cosi' nessuno puo' "ricordarsi"
// dove sta una carta gia' vista in un turno precedente.
async function veciaShuffleMyHand(matchId, playerId){
  const match = await getActiveMatch();
  if(!match || match.id!==matchId || match.phase!=='playing') return;
  const hand = match.hands[playerId];
  if(!hand || hand.length<2) return;
  match.hands[playerId] = shuffle(hand);
  await setActiveMatch(match);
  await render();
}

async function veciaDraw(matchId, drawerId, pickIndex){
  const match = await getActiveMatch();
  if(!match || match.id!==matchId || match.phase!=='playing' || match.pendingReveal) return;
  const ids = match.turnOrder, n = ids.length;
  if(ids[match.currentIdx] !== drawerId) return;
  const fromId = veciaLeftNeighborId(match, drawerId);
  if(!fromId) return;
  const fromHand = match.hands[fromId];
  const pickIdx = (Number.isInteger(pickIndex) && pickIndex>=0 && pickIndex<fromHand.length)
    ? pickIndex : Math.floor(Math.random()*fromHand.length);
  const card = fromHand.splice(pickIdx,1)[0];
  cardFxThrowFromSeat(match, match.turnOrder, fromId, CARD_IMG['back']);
  const hand = match.hands[drawerId];
  const matched = hand.some(c=>c.rank===card.rank); // c'e' gia' una carta dello stesso rango in mano?
  hand.push(card); // la carta pescata resta in mano finche' non si clicca "Scarta la coppia"
  match.lastDraw = {drawerId, fromId, suit:card.suit, rank:card.rank, matched};
  match.pendingReveal = true;
  await setActiveMatch(match);
  await render();
}

async function continueAfterVeciaDraw(matchId){
  const match = await getActiveMatch();
  if(!match || match.id!==matchId || !match.pendingReveal) return;
  match.pendingReveal = false;
  if(match.lastDraw.matched){
    // scarto esplicito della coppia (rango pescato + rango gia' in mano), su click dell'utente
    const hand = match.hands[match.lastDraw.drawerId];
    const rank = match.lastDraw.rank;
    let tolte = 0;
    for(let i=hand.length-1; i>=0 && tolte<2; i--){
      if(hand[i].rank===rank){ hand.splice(i,1); tolte++; }
    }
  }
  const ids = match.turnOrder, n = ids.length;
  const drawerIdx = ids.indexOf(match.lastDraw.drawerId);
  const active = ids.filter(pid=>match.hands[pid].length>0);
  if(active.length<=1){
    match.phase = 'ended';
    match._loserId = active[0] || null; // chi resta con carte in mano ha per forza il solo Fante di Spade
    await maybeSaveVeciaHistory(match);
  } else {
    let nextIdx=(drawerIdx+1)%n, guard=0;
    while(match.hands[ids[nextIdx]].length===0){ nextIdx=(nextIdx+1)%n; guard++; if(guard>n) break; }
    match.currentIdx = nextIdx;
  }
  await setActiveMatch(match);
  await render();
}

async function maybeSaveVeciaHistory(match){
  if(match.phase!=='ended' || match._historySaved) return;
  match._historySaved = true;
  const historyEntry = {
    id:match.id, date:match.createdAt, endedAt:new Date().toISOString(),
    game:'vecia', loser: nameOf(match, match._loserId),
    players: match.players.map(p=>({name:p.name, isBot:p.isBot, isLoser:p.id===match._loserId})),
    solo: match.players.some(p=>p.isBot)
  };
  const history = await getHistory();
  history.unshift(historyEntry);
  await saveHistory(history);
  if(myRoomId){
    try{ const list=(await getRooms()).filter(s=>s.id!==myRoomId); await saveRooms(list); }catch(e){}
  }
}

// il pescare e' sempre una carta a caso e coperta: non c'e' nessuna scelta strategica
// da simulare, il bot deve solo "premere pesca" quando tocca a lui
const VECIA_BOT_THINK_MS = 900;
const VECIA_REVEAL_MS = 1500; // quanto resta in vista il banner "ha pescato..." prima di passare da solo
async function scheduleVeciaBotMove(match){
  if(!match || match.phase!=='playing') return;

  // pausa dopo una pescata: nessuno deve cliccare nulla, si avanza da sola dopo una
  // breve vista del risultato, esattamente come le prese in Briscola e Scopa.
  if(match.pendingReveal){
    const ld = match.lastDraw;
    const key = 'veciaReveal|'+match.id+'|'+ld.drawerId+'|'+ld.fromId+'|'+ld.rank+'|'+ld.suit;
    if(botMoveKey===key) return;
    botMoveKey = key;
    if(botMoveTimer) clearTimeout(botMoveTimer);
    botMoveTimer = setTimeout(()=>{ continueAfterVeciaDraw(match.id); }, VECIA_REVEAL_MS);
    return;
  }

  const drawerId = match.turnOrder[match.currentIdx];
  const player = match.players.find(p=>p.id===drawerId);
  if(!player || !player.isBot){ botMoveKey=null; return; }
  const key = 'vecia|'+match.id+'|'+match.currentIdx+'|'+match.hands[drawerId].length;
  if(botMoveKey===key) return;
  botMoveKey = key;
  if(botMoveTimer) clearTimeout(botMoveTimer);
  botMoveTimer = setTimeout(async ()=>{
    const cur = await getActiveMatch();
    if(!cur || cur.game!=='vecia' || cur.phase!=='playing' || cur.pendingReveal) return;
    const curDrawer = cur.turnOrder[cur.currentIdx];
    const curPlayer = cur.players.find(p=>p.id===curDrawer);
    if(curPlayer && curPlayer.isBot) await veciaDraw(cur.id, curDrawer);
  }, VECIA_BOT_THINK_MS);
}

  })() : '';

  const turnBanner = match.pendingReveal ? '' : `<div class="turn-bar ${isMyTurn?'mine':''}">${isMyTurn

    : `<p class="hint" style="margin:6px 0 0;">Mano vuota — sei salvo! 🎉</p>`;

    const fromId = veciaLeftNeighborId(match, drawerId);

      `<button class="hand-card vecia-pick" title="Carta coperta" onclick="veciaDraw('${match.id}','${drawerId}',${idx})">${cardBackSVG()}</button>`

      <div class="hand">${cardsHtml}</div>`;

        <span>Vecia · ${revealAll?'tutti visibili':esc(nameOf(match,myId))}</span>
        <button class="btn-danger btn-small" onclick="abandonMatch()">Abbandona</button>

// =========================================================================
// CAVA CAMISA — si gira a turno la carta in cima al proprio mazzetto coperto
// (nessuna scelta: e' sempre e solo quella in cima, come nel gioco reale).
// Asso/Due/Tre sono carte speciali: chi le gira obbliga il giocatore dopo di lui
// a girarne rispettivamente 1/2/3 in risposta. Se tra quelle risposte esce
// un'altra carta speciale, la sfida "si resetta" sul nuovo giocatore con il nuovo
// conteggio (chi aveva lanciato prima perde il diritto). Se invece si completano
// le carte richieste senza altre sorprese, chi aveva lanciato la carta speciale
// si prende tutto il mazzetto al centro. Vince la mano chi arriva a possedere
// tutte le carte del mazzo. Partita a piu' mani, prima a 2 o 3 mani vinte.
// =========================================================================
const CAVA_MAX_PLAYERS = 4;
const CAVA_SPECIALI = {'A':1, '2':2, '3':3};
const CAVA_DECK_SIZE = 40;

function buildCavaCamisaDeck(){
  const deck = [];
  SUITS.forEach(s=>RANKS.forEach(r=>deck.push({suit:s, rank:r, id:s+'-'+r})));
  return deck;
}

// il prossimo giocatore attivo (con carte in mano) a partire da "afterId", saltando
// eventualmente "excludeId" (tipicamente chi ha lanciato la sfida corrente: non deve
// mai essere chiamato a rispondere alla propria carta speciale). Restituisce null se
// non resta nessun altro giocatore con carte.
function cavaCamisaNextActive(match, afterId, excludeId){
  const ids = match.turnOrder, n = ids.length;
  let idx = ids.indexOf(afterId);
  for(let step=0; step<n; step++){
    idx = (idx+1)%n;
    const pid = ids[idx];
    if(pid===excludeId) continue;
    if(match.hands[pid].length>0) return pid;
  }
  return null;
}

function buildCavaCamisaMatch(id, names, handsToWin){
  const players = names.map((name,i)=>({id:'p'+i, name, isBot:false}));
  const ids = players.map(p=>p.id);
  const deck = shuffle(buildCavaCamisaDeck());
  const hands = {}; ids.forEach(pid=>hands[pid]=[]);
  deck.forEach((c,i)=>hands[ids[i%ids.length]].push(c)); // distribuzione equa: chi capita capita se non torna esatta
  const handWins = {}; ids.forEach(pid=>handWins[pid]=0);
  const leaderIdx = Math.floor(Math.random()*ids.length);
  return {
    id, game:'cavacamisa', createdAt:new Date().toISOString(),
    players, hands, turnOrder: ids,
    handsToWin: handsToWin||2, dealNumber:1, handWins, dealHistory:[],
    center:[], pendingChallenge:null,
    currentId: ids[leaderIdx], _leaderIdx: leaderIdx,
    lastFlip:null, pendingReveal:false,
    phase:'playing'
  };
}

async function cavaCamisaFlip(matchId, flipperId){
  const match = await getActiveMatch();
  if(!match || match.id!==matchId || match.phase!=='playing' || match.pendingReveal) return;
  if(match.currentId !== flipperId) return;
  const hand = match.hands[flipperId];
  if(!hand.length) return;
  const card = hand.shift();
  cardFxThrowFromSeat(match, match.turnOrder, flipperId, cardSrc(card.suit, card.rank));
  match.center.push(card);
  const specialValue = CAVA_SPECIALI[card.rank];
  let pileAwardedTo = null;

  if(specialValue){
    // nuova sfida: chiunque fosse gia' in sospeso perde il diritto, ora tocca al
    // prossimo giocatore attivo rispondere a QUESTA carta
    const responder = cavaCamisaNextActive(match, flipperId, flipperId);
    if(responder===null){
      pileAwardedTo = flipperId; // nessun altro ha carte: il mazzetto e' gia' suo
    } else {
      match.pendingChallenge = { throwerId: flipperId, needed: specialValue, done: 0 };
      match.currentId = responder;
    }
  } else if(match.pendingChallenge){
    match.pendingChallenge.done += 1;
    if(match.pendingChallenge.done >= match.pendingChallenge.needed){
      pileAwardedTo = match.pendingChallenge.throwerId;
      match.pendingChallenge = null;
    } else if(hand.length===0){
      // chi doveva rispondere ha finito le carte a meta' sfida: la sfida prosegue
      // con il prossimo giocatore attivo, il conteggio gia' fatto resta valido
      const cont = cavaCamisaNextActive(match, flipperId, match.pendingChallenge.throwerId);
      if(cont===null){ pileAwardedTo = match.pendingChallenge.throwerId; match.pendingChallenge=null; }
      else { match.currentId = cont; }
    }
    // altrimenti lo stesso giocatore continua a girare (currentId invariato)
  } else {
    match.currentId = cavaCamisaNextActive(match, flipperId, null);
  }

  const revealCard = { flipperId, suit:card.suit, rank:card.rank, special: !!specialValue, pileAwardedTo: null };
  if(pileAwardedTo){
    const wonCards = match.center.splice(0, match.center.length);
    match.hands[pileAwardedTo].push(...shuffle(wonCards));
    match.currentId = pileAwardedTo;
    revealCard.pileAwardedTo = pileAwardedTo;
    revealCard.pileSize = wonCards.length;
    match.pendingReveal = true; // ci si ferma SOLO quando qualcuno prende il mazzetto, specificando chi
  }
  match.lastFlip = revealCard;
  await setActiveMatch(match);
  await render();
}

async function continueAfterCavaCamisaFlip(matchId){
  const match = await getActiveMatch();
  if(!match || match.id!==matchId || !match.pendingReveal) return;
  match.pendingReveal = false;
  const winnerId = match.lastFlip.pileAwardedTo;
  if(winnerId && match.hands[winnerId].length===CAVA_DECK_SIZE){
    finishCavaCamisaDeal(match, winnerId);
    await maybeSaveCavaCamisaHistory(match);
  }
  await setActiveMatch(match);
  await render();
}

function finishCavaCamisaDeal(match, winnerId){
  match.handWins[winnerId] = (match.handWins[winnerId]||0) + 1;
  match.dealHistory.push({dealNumber: match.dealNumber, winnerId});
  const traguardo = match.players.find(p=>(match.handWins[p.id]||0) >= match.handsToWin);
  if(traguardo){
    match.phase = 'ended';
    match._winnerId = traguardo.id;
  } else {
    match.phase = 'dealEnd';
  }
}

async function continueAfterCavaCamisaDeal(matchId){
  const match = await getActiveMatch();
  if(!match || match.id!==matchId || match.phase!=='dealEnd') return;
  match.dealNumber += 1;
  const ids = match.turnOrder;
  const deck = shuffle(buildCavaCamisaDeck());
  const hands = {}; ids.forEach(pid=>hands[pid]=[]);
  deck.forEach((c,i)=>hands[ids[i%ids.length]].push(c));
  match.hands = hands;
  match.center = [];
  match.pendingChallenge = null;
  const leaderIdx = ((match._leaderIdx ?? 0) + 1) % ids.length;
  match._leaderIdx = leaderIdx;
  match.currentId = ids[leaderIdx];
  match.phase = 'playing';
  await setActiveMatch(match);
  await render();
}

async function maybeSaveCavaCamisaHistory(match){
  if(match.phase!=='ended' || match._historySaved) return;
  match._historySaved = true;
  const ranked = [...match.players].sort((a,b)=>(match.handWins[b.id]||0)-(match.handWins[a.id]||0))
    .map((p,i)=>({name:p.name, rank:i+1, maniVinte: match.handWins[p.id]||0, isBot:p.isBot}));
  const historyEntry = {
    id:match.id, date:match.createdAt, endedAt:new Date().toISOString(),
    game:'cavacamisa', handsToWin: match.handsToWin, dealNumber: match.dealNumber,
    winner: nameOf(match, match._winnerId),
    players: ranked, solo: match.players.some(p=>p.isBot)
  };
  const history = await getHistory();
  history.unshift(historyEntry);
  await saveHistory(history);
  if(myRoomId){
    try{ const list=(await getRooms()).filter(s=>s.id!==myRoomId); await saveRooms(list); }catch(e){}
  }
}

// girare la propria carta in cima e' un'azione obbligata, senza nessuna scelta
// possibile (ne' per l'umano ne' per il bot): il bot deve solo "premere gira"
// quando tocca a lui.
const CAVA_BOT_THINK_MS = 1600;
async function scheduleCavaCamisaBotMove(match){
  if(!match || match.phase!=='playing' || match.pendingReveal) return;
  const flipperId = match.currentId;
  const player = match.players.find(p=>p.id===flipperId);
  if(!player || !player.isBot){ botMoveKey=null; return; }
  const key = 'cavacamisa|'+match.id+'|'+match.currentId+'|'+match.hands[flipperId].length+'|'+match.center.length;
  if(botMoveKey===key) return;
  botMoveKey = key;
  if(botMoveTimer) clearTimeout(botMoveTimer);
  botMoveTimer = setTimeout(async ()=>{
    const cur = await getActiveMatch();
    if(!cur || cur.game!=='cavacamisa' || cur.phase!=='playing' || cur.pendingReveal) return;
    const curFlipper = cur.currentId;
    const curPlayer = cur.players.find(p=>p.id===curFlipper);
    if(curPlayer && curPlayer.isBot) await cavaCamisaFlip(cur.id, curFlipper);
  }, CAVA_BOT_THINK_MS);
}

function renderCavaCamisaTableSVG(match, myId){
  const ids = rotateIdsForMe(match.turnOrder, myId);
  const n = ids.length;
  const C = tableConfig(n);
  const VB = C.VB, fs = C.fs;
  const cx = VB/2, cy = VB/2, half = C.half, avatarR = C.avatarR;
  const layout = rectSeatLayout(half, half, n);

  let seats = '';
  let turnDotSvg = '';
  ids.forEach((pid,i)=>{
    const {x:relX, y:relY} = layout[i];
    const x = cx+relX, y = cy+relY;
    const radialLen = Math.hypot(relX, relY) || 1;
    const nx = relX/radialLen, ny = relY/radialLen;
    const player = match.players.find(p=>p.id===pid);
    const cardsLeft = (match.hands[pid]||[]).length;
    const isTurn = pid===match.currentId && !match.pendingReveal;
    const isMe = pid===myId;
    const isSafe = cardsLeft===0;
    const isThrower = match.pendingChallenge && match.pendingChallenge.throwerId===pid;

    const displayDirY = relY>=0 ? 1 : -1;
    const nameY = y + displayDirY*(avatarR + 26*fs);

    let nm = player.name.length>10 ? player.name.slice(0,9)+'…' : player.name;
    const label = esc(nm) + (isMe?' (tu)':(player.isBot?' ᴀɪ':'')) + (isSafe?' 💀':'');
    const pillW = Math.max(52*fs, label.length*7*fs + 16);
    const lx = Math.max(pillW/2+3, Math.min(VB-pillW/2-3, x));
    const ly = nameY;

    if(isTurn){
      const dotDist = avatarR + 10*fs;
      turnDotSvg = `<circle class="turn-dot" cx="${x-nx*dotDist}" cy="${y-ny*dotDist}" r="${5*fs}" fill="#D4AF6A" stroke="#16261F" stroke-width="1.2"/>`;
    }

    const handSvg = isSafe
      ? `<text x="${x}" y="${y+5*fs}" text-anchor="middle" font-size="${15*fs}">💀</text>`
      : `
        <rect x="${x-9*fs}" y="${y-13*fs}" width="${18*fs}" height="${26*fs}" rx="3" fill="url(#cava-cardback)" stroke="${isThrower?'#D4AF6A':'#8C7647'}" stroke-width="${isThrower?2:1}"/>
        <circle cx="${x+9*fs}" cy="${y+10*fs}" r="${7.5*fs}" fill="#16261F" stroke="#D4AF6A" stroke-width="1"/>
        <text x="${x+9*fs}" y="${y+13.5*fs}" text-anchor="middle" font-family="'IBM Plex Mono',monospace" font-size="${9.5*fs}" font-weight="700" fill="#D4AF6A">${cardsLeft}</text>`;

    seats += `
      <g>
        ${isTurn?`<circle class="turn-ring" cx="${x}" cy="${y}" r="${avatarR+5}" fill="none" stroke="#D4AF6A" stroke-width="2"/>`:''}
        <circle cx="${x}" cy="${y}" r="${avatarR}" fill="${isTurn?'#2C4C3E':(isMe?'#4A2A28':'#223B32')}" stroke="${isTurn?'#D4AF6A':(isMe?'#D98878':'#3C5A4C')}" stroke-width="${isTurn?2.4:1.8}" opacity="${isSafe?0.5:1}"/>
        ${handSvg}
        <rect x="${lx-pillW/2}" y="${ly-11*fs}" width="${pillW}" height="${19*fs}" rx="${9.5*fs}" fill="rgba(10,20,16,0.92)" stroke="${isTurn?'#D4AF6A':'#3C5A4C'}" stroke-width="1"/>
        <text x="${lx}" y="${ly+3*fs}" text-anchor="middle" font-family="'Fraunces',serif" font-size="${12.5*fs}" font-weight="700" fill="${isTurn?'#D4AF6A':'#F1ECE1'}">${label}</text>
      </g>`;
  });

  // --- centro: l'ultima carta girata (in cima al mazzetto comune), ben visibile
  const top = match.center[match.center.length-1];
  const cW = 30*fs, cH = 62*fs;
  const centerCardSvg = top ? `
    <g transform="translate(${cx},${cy-8*fs})" style="filter:drop-shadow(0 2px 4px rgba(0,0,0,.4));">
      <rect x="${-cW/2}" y="${-cH/2}" width="${cW}" height="${cH}" rx="3" fill="#F1ECE1" stroke="#8C7647" stroke-width="0.8"/>
      <image href="${cardSrc(top.suit, top.rank)}" x="${-cW/2}" y="${-cH/2}" width="${cW}" height="${cH}" preserveAspectRatio="xMidYMid slice" clip-path="url(#cava-cardclip)"/>
    </g>
    <text x="${cx}" y="${cy+cH/2+10*fs}" text-anchor="middle" font-family="'IBM Plex Mono',monospace" font-size="${9*fs}" fill="#B9C4BC">${match.center.length} cart${match.center.length===1?'a':'e'} nel mazzetto</text>
    ` : `<text x="${cx}" y="${cy+4*fs}" text-anchor="middle" font-family="'IBM Plex Mono',monospace" font-size="${9*fs}" fill="#6C8078">mazzetto vuoto</text>`;
  const tableDefs = `
    <defs>
      <clipPath id="cava-cardclip"><rect x="${-cW/2}" y="${-cH/2}" width="${cW}" height="${cH}" rx="3"/></clipPath>
      <pattern id="cava-cardback" width="4" height="4" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
        <rect width="4" height="4" fill="#2A4A3C"/>
        <rect width="2" height="4" fill="#1E332B"/>
      </pattern>
      <linearGradient id="feltGrad5" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#274539"/>
        <stop offset="60%" stop-color="#1D3730"/>
        <stop offset="100%" stop-color="#132520"/>
      </linearGradient>
      <linearGradient id="centerGrad5" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#28483B"/>
        <stop offset="100%" stop-color="#1B322A"/>
      </linearGradient>
    </defs>`;

  const outerPad = 30*fs, feltR = 20*fs, centerR = 14*fs;
  const centerHalf = C.centerHalf*fs;
  const turnId2 = match.pendingReveal ? null : match.currentId;
  const curIdx = turnId2 ? ids.indexOf(turnId2) : -1;
  const nextIdx = curIdx>=0 ? (curIdx+1)%n : -1;
  const flowArrowSvg = turnFlowArrowSVG(layout, curIdx, nextIdx, cx, cy, fs, avatarR, centerHalf);
  return `
    <div class="table-wrap">
      <svg viewBox="0 0 ${VB} ${VB}" width="100%" style="max-width:420px;aspect-ratio:1/1;display:block;height:auto;">
        ${tableDefs}
        <rect x="${cx-half-outerPad}" y="${cy-half-outerPad}" width="${2*(half+outerPad)}" height="${2*(half+outerPad)}" rx="${feltR}" fill="url(#feltGrad5)" stroke="#4A6B5B" stroke-width="2"/>
        <rect x="${cx-centerHalf}" y="${cy-centerHalf}" width="${2*centerHalf}" height="${2*centerHalf}" rx="${centerR}" fill="url(#centerGrad5)" stroke="#3C5A4C" stroke-width="1.2"/>
        ${centerCardSvg}
        ${seats}
        ${turnDotSvg}
        ${flowArrowSvg}
      </svg>
    </div>`;
}

function renderCavaCamisaMatch(match, claim){
  const revealAll = claim.type==='all';
  const myId = claim.type==='seat' ? claim.playerId : null;
  if(match.phase==='ended') return renderCavaCamisaEnd(match, myId);

  if(myId){
    const dealKey = 'cavacamisa|'+match.id+'|'+(match.dealNumber||1);
    if(!(dealKey in dealTableAnimState)){
      dealTableAnimState[dealKey] = 'started';
      const names = match.turnOrder.map(id=>nameOf(match,id));
      cardFxDealTable(names, match.turnOrder.indexOf(myId), match.hands[myId] ? match.hands[myId].length : 10, {
        onDone: ()=>{ dealTableAnimState[dealKey]='done'; lastRenderKey=null; render(true); }
      });
    }
    if(dealTableAnimState[dealKey]==='started') return dealWaitingScreenHTML('Cava Camisa · '+esc(nameOf(match,myId)));
  }

  if(match.phase==='dealEnd'){
    return `
      <div class="card">
        <div class="toolbar">
          <span>${hudAvatar(revealAll?'?':esc(nameOf(match,myId)))}Cava Camisa · ${revealAll?'tutti visibili':esc(nameOf(match,myId))}</span>
          <button class="btn-danger btn-small" onclick="abandonMatch()">Abbandona</button>
        </div>
        ${cavaCamisaScoreBar(match)}
        ${renderCavaCamisaDealEndBanner(match, myId)}
      </div>`;
  }

  const flipperId = match.currentId;
  const isMyTurn = !match.pendingReveal && (revealAll || flipperId===myId);

  const challengeBanner = (!match.pendingReveal && match.pendingChallenge) ? `
    <div class="turn-banner">Carta speciale! <b>${esc(nameOf(match,match.pendingChallenge.throwerId))}</b> si prende il mazzetto se ${esc(nameOf(match,flipperId))} gira ${match.pendingChallenge.needed-match.pendingChallenge.done} cart${(match.pendingChallenge.needed-match.pendingChallenge.done)===1?'a':'e'} senza altre sorprese.</div>` : '';

  const revealBanner = match.pendingReveal ? (()=>{
    const lf = match.lastFlip;
    const chi = esc(nameOf(match, lf.flipperId));
    const cardTxt = cardLabel({suit:lf.suit, rank:lf.rank});
    return `
      <div class="turn-banner"><b>${chi} ha girato ${cardTxt}</b> — <b>${esc(nameOf(match,lf.pileAwardedTo))}</b> si prende il mazzetto: ${lf.pileSize} carte! 🎉</div>
      <button class="btn-primary" style="width:100%;margin-bottom:12px;" onclick="continueAfterCavaCamisaFlip('${match.id}')">Continua</button>`;
  })() : '';

  const turnBanner = match.pendingReveal ? '' : `<div class="turn-bar ${isMyTurn?'mine':''}">${isMyTurn
    ? (revealAll ? 'Tocca a <b>'+esc(nameOf(match,flipperId))+'</b>' : '► TOCCA A TE — gira la tua carta')
    : 'Sta girando <b>'+esc(nameOf(match,flipperId))+'</b> — aspetta <button class="refresh-mini" onclick="forceResync()" title="Aggiorna">⟳</button>'}</div>`;

  const tableSvg = renderCavaCamisaTableSVG(match, myId);
  const pileStrip = renderCavaCamisaPileStrip(match);

  const displayOwner = revealAll ? flipperId : myId;
  const myCards = (displayOwner && match.hands[displayOwner]) || [];

  const puoiTirare = isMyTurn && !match.pendingReveal;
  const azioniBtn = `<button class="btn-primary" style="width:100%;margin-bottom:12px;" ${puoiTirare?'':'disabled'} onclick="cavaCamisaFlip('${match.id}','${flipperId}')">Tira una carta</button>`;

  return `
    <div class="card">
      <div class="toolbar">
        <span>${hudAvatar(revealAll?'?':esc(nameOf(match,myId)))}Cava Camisa · ${revealAll?'tutti visibili':esc(nameOf(match,myId))}</span>
        <button class="btn-danger btn-small" onclick="abandonMatch()">Abbandona</button>
      </div>
      ${cavaCamisaScoreBar(match)}
      ${turnBanner}
      ${challengeBanner}
      ${revealBanner}
      ${tableSvg}
      ${pileStrip}
      ${azioniBtn}
      <p class="hint">${revealAll?'Mazzetto di '+esc(nameOf(match,displayOwner)):'Il tuo mazzetto'}: ${myCards.length} cart${myCards.length===1?'a':'e'} coperte — non sai cosa uscirà finché non giri.</p>
    </div>`;
}

function renderCavaCamisaEnd(match, myId){
  const perdentiIds = match.players.map(p=>p.id).filter(id=>id!==match._winnerId);
  maybeShowLoserPopup(match.id, 'cava-end', myId, perdentiIds);
  const ranked = [...match.players].sort((a,b)=>(match.handWins[b.id]||0)-(match.handWins[a.id]||0));
  const rows = ranked.map((p,i)=>`
    <div class="rank-row ${i===0?'win':''}">

    <div class="card">

      <button class="btn-primary" style="margin-top:14px;" onclick="backToLobbyFromEnd()">Torna alla lobby</button>

// =========================================================================
// SOLITARIO ("Scarta il Re") — gioco puramente locale: nessuna sala, nessun
// bot, nessuna sincronizzazione online. Si mescola il mazzo da 40 carte, si
// dispongono 4 righe da 9 carte coperte (una riga per seme) e restano 4
// carte di riserva in mano. Si pesca la prima carta di riserva, la si
// scopre e la si mette nella posizione numerica corretta (1=Asso...9=Cavallo)
// della riga del suo seme; la carta coperta che c'era li' sotto si scopre a
// sua volta e si ripete. Quando esce un Re (posizione 10, fuori dal
// rettangolo) non c'e' nessuna carta sotto da raccogliere: il giro si
// blocca e si pesca la prossima carta di riserva per ripartire. Si vince se
// si riescono a scoprire tutte le 36 carte (valore 1-9 per ognuno dei 4
// semi) prima di esaurire le 4 carte di riserva; se si trovano tutti e
// quattro i Re prima che il tavolo sia completo, si resta senza carte in
// mano e il solitario e' perso.
// =========================================================================
const SOLITARIO_POS_RANKS = ['A','2','3','4','5','6','7','Fante','Cavallo']; // posizione i (0-8) -> rango, cioe' posizione 1-9

function solitarioRowOf(state, suit){ return state.rowSuits.indexOf(suit); }
function solitarioPosOf(rank){ return SOLITARIO_POS_RANKS.indexOf(rank); } // -1 per il Re, gestito a parte
function solitarioNeedsRowAssignment(state, card){ return solitarioRowOf(state, card.suit) === -1; }

function buildSolitarioGame(){
  const deck = shuffle(buildCavaCamisaDeck()); // mazzo standard da 40 carte, riuso il generatore gia' esistente
  cardFxDealBurst(4);
  const riserva = deck.slice(0,4);   // le 4 carte di riserva, in ordine di pesca
  const tavolo = deck.slice(4);      // le 36 carte da disporre coperte, 4 righe da 9
  const originalDeal = [[],[],[],[]]; // originalDeal[row][pos] = la carta che c'era li' all'inizio (coperta)
  for(let r=0;r<4;r++){
    for(let p=0;p<9;p++) originalDeal[r].push(tavolo[r*9+p]);
  }
  const revealed = [
    new Array(9).fill(false), new Array(9).fill(false),
    new Array(9).fill(false), new Array(9).fill(false)
  ]; // revealed[row][pos] = true una volta che la carta giusta e' stata sistemata li'
  return {
    game: 'solitario',
    rowSuits: [null,null,null,null], // si riempie mano a mano: rowSuits[i] = seme scelto per la riga i, o null se non ancora assegnata
    originalDeal, revealed,
    postMortemRevealed: [
      new Array(9).fill(false), new Array(9).fill(false),
      new Array(9).fill(false), new Array(9).fill(false)
    ], // rivelazioni "per curiosita'" fatte a mano dopo una sconfitta, non contano ai fini del risultato
    kingFound: [null,null,null,null], // kingFound[row] = il Re di quella riga, una volta trovato
    riserva, riservaIdx: 0,
    current: null,       // carta attualmente scoperta "in mano", in attesa che l'utente clicchi la casella giusta
    filledCount: 0,
    lastEvent: null,      // per il messaggio "ultima mossa"
    phase: 'start',        // 'start' (serve pescare) | 'assignRow' (scegli la riga per questo seme) | 'holding' (carta in mano, clicca la casella) | 'blocked' | 'won' | 'lost'
    createdAt: new Date().toISOString()
  };
}

// pesca la prossima carta di riserva e la mette "in mano", scoperta ma non ancora
// piazzata: serve poi un click esplicito sulla casella giusta per piazzarla (o,
// se e' la prima carta di quel seme, prima bisogna scegliere su quale riga va).
function solitarioDrawFromReserve(state){
  if(state.phase!=='start' && state.phase!=='blocked') return state;
  if(state.riservaIdx >= state.riserva.length){
    state.phase = state.filledCount===36 ? 'won' : 'finalReveal';
    return state;
  }
  state.current = state.riserva[state.riservaIdx];
  state.riservaIdx += 1;
  state.lastEvent = null;
  state.phase = solitarioNeedsRowAssignment(state, state.current) ? 'assignRow' : 'holding';
  return state;
}

// assegna la riga scelta dall'utente al seme della carta attualmente in mano
// (solo la prima volta che compare quel seme), poi si passa al piazzamento normale.
function solitarioAssignRow(state, rowIdx){
  if(state.phase!=='assignRow' || !state.current) return state;
  if(state.rowSuits[rowIdx] !== null) return state; // riga gia' occupata, click non valido
  state.rowSuits[rowIdx] = state.current.suit;
  state.phase = 'holding';
  return state;
}

// piazza la carta attualmente "in mano" nella sua posizione corretta (o nello slot
// del Re), su click esplicito dell'utente sulla casella evidenziata.
function solitarioPlaceCurrent(state){
  if(state.phase!=='holding' || !state.current) return state;
  const card = state.current;

  if(card.rank === 'Re'){
    const row = solitarioRowOf(state, card.suit);
    state.kingFound[row] = card;
    state.current = null;
    state.lastEvent = { type:'king', card, row };
    state.phase = (state.riservaIdx >= state.riserva.length)
      ? (state.filledCount===36 ? 'won' : 'finalReveal')
      : 'blocked';
    return state;
  }

  const row = solitarioRowOf(state, card.suit);
  const pos = solitarioPosOf(card.rank);
  const under = state.originalDeal[row][pos]; // la carta coperta che c'era li', da raccogliere ora
  state.revealed[row][pos] = true;
  state.filledCount += 1;
  state.lastEvent = { type:'place', card, row, pos };
  if(state.filledCount === 36){
    state.phase = 'won';
    state.current = null;
    return state;
  }
  state.current = under; // resta "in mano" pronta per un altro click sulla sua casella
  state.phase = solitarioNeedsRowAssignment(state, under) ? 'assignRow' : 'holding';
  return state;
}

let solitarioGame = null;

async function getSolitarioGame(){
  if(solitarioGame) return solitarioGame;
  try{
    const r = await window.storage.get('solitario-game', false);
    if(r) solitarioGame = JSON.parse(r.value);
  }catch(e){}
  return solitarioGame;
}
async function saveSolitarioGame(){
  try{ await window.storage.set('solitario-game', JSON.stringify(solitarioGame), false); }catch(e){}
}
async function newSolitarioGame(){
  solitarioGame = buildSolitarioGame();
  await saveSolitarioGame();
  lastRenderKey = null;
  await render(true);
}
async function solitarioDraw(){
  if(!solitarioGame) return;
  solitarioDrawFromReserve(solitarioGame);
  
  await saveSolitarioGame();
  lastRenderKey = null;
  await render(true);
}
async function solitarioPlace(){
  if(!solitarioGame) return;
  solitarioPlaceCurrent(solitarioGame);
  await saveSolitarioGame();
  lastRenderKey = null;
  await render(true);
}
async function solitarioAssign(rowIdx){
  if(!solitarioGame) return;
  solitarioAssignRow(solitarioGame, rowIdx);
  await saveSolitarioGame();
  lastRenderKey = null;
  await render(true);
}
// durante la rivelazione finale (riserve esaurite, tavolo non completo): ogni click
// controlla davvero se quella casella coperta conteneva la carta giusta. Se lo era,
// si aggiunge alle scoperte "vere" (concorre alla vittoria); se non lo era, resta
// segnata come sbagliata. L'esito si decide solo quando tutte sono state controllate.
async function solitarioReveal(row, pos){
  const state = solitarioGame;
  if(!state || state.phase!=='finalReveal') return;
  if(state.revealed[row][pos] || state.postMortemRevealed[row][pos]) return;
  state.postMortemRevealed[row][pos] = true;
  const real = state.originalDeal[row][pos];
  const eraGiusta = real.suit===state.rowSuits[row] && real.rank===SOLITARIO_POS_RANKS[pos];
  if(eraGiusta){
    state.revealed[row][pos] = true;
    state.filledCount += 1;
  }
  let tutteControllate = true;
  for(let r=0;r<4 && tutteControllate;r++){
    for(let p=0;p<9;p++){
      if(!state.revealed[r][p] && !state.postMortemRevealed[r][p]){ tutteControllate=false; break; }
    }
  }
  if(tutteControllate){
    state.phase = (state.filledCount===36) ? 'won' : 'lost';
  }
  await saveSolitarioGame();
  lastRenderKey = null;
  await render(true);
}
async function exitSolitario(){
  solitarioGame = null;
  try{ await window.storage.delete('solitario-game', false); }catch(e){}
  lobbyView = 'lobby';
  lastRenderKey = null;
  await render(true);
}

function renderSolitarioFaceUpCard(card, ringColor){
  const w = 25, h = 46;
  return `<img src="${cardSrc(card.suit,card.rank)}" width="${w}" height="${h}" style="border-radius:3px;border:${ringColor?'2px solid '+ringColor:'1px solid #8C7647'};display:block;object-fit:cover;box-shadow:0 2px 4px rgba(0,0,0,.35);flex-shrink:0;" alt="${card.rank} di ${card.suit}">`;
}
function renderSolitarioCoveredSlot(clickable, onclickAttr){
  const w = 25, h = 46;
  const border = clickable ? '#D4AF6A' : '#3C5A4C';
  const ring = clickable ? 'box-shadow:0 0 0 2px #D4AF6A inset;cursor:pointer;' : '';
  return `<div class="soli-slot" style="width:${w}px;height:${h}px;border-radius:4px;background:#223B32;border:1.5px dashed ${border};flex-shrink:0;${ring}" ${clickable?`onclick="${onclickAttr}"`:''}></div>`;
}

function solitarioFinalRevealProgress(state){
  let daControllare=0, sbagliate=0;
  for(let r=0;r<4;r++) for(let p=0;p<9;p++){
    if(state.revealed[r][p]) continue;
    if(state.postMortemRevealed[r][p]) sbagliate++;
    else daControllare++;
  }
  return {daControllare, sbagliate};
}

function renderSolitarioRow(state, row){
  const suit = state.rowSuits[row]; // puo' essere null se ancora nessuna carta di quel seme e' comparsa
  const currentIsForThisRow = state.phase==='holding' && state.current && suit!==null && solitarioRowOf(state, state.current.suit)===row;
  const targetPos = (currentIsForThisRow && state.current.rank!=='Re') ? solitarioPosOf(state.current.rank) : -1;
  const isKingTarget = currentIsForThisRow && state.current.rank==='Re';

  const cells = [];
  for(let p=0;p<9;p++){
    if(state.revealed[row][p]){
      cells.push(renderSolitarioFaceUpCard({suit, rank: SOLITARIO_POS_RANKS[p]}));
    } else if(state.postMortemRevealed[row][p]){
      // controllata durante la rivelazione finale e risultata SBAGLIATA (altrimenti sarebbe gia' in "revealed")
      cells.push(renderSolitarioFaceUpCard(state.originalDeal[row][p], '#B0524A'));
    } else if(state.phase==='finalReveal'){
      cells.push(renderSolitarioCoveredSlot(true, `solitarioReveal(${row},${p})`));
    } else {
      cells.push(renderSolitarioCoveredSlot(p===targetPos, 'solitarioPlace()'));
    }
  }

  let kingCell;
  if(state.kingFound[row]){
    kingCell = renderSolitarioFaceUpCard(state.kingFound[row]);
  } else if(isKingTarget){
    kingCell = renderSolitarioCoveredSlot(true, 'solitarioPlace()');
  } else {
    kingCell = `<div style="width:25px;height:46px;flex-shrink:0;"></div>`;
  }

  const suitLabel = suit ? esc(suit.slice(0,3)) : '?';
  return `
    <div style="display:flex;align-items:center;gap:3px;margin-bottom:5px;">
      <span style="width:22px;font-size:9px;color:var(--cream-dim);text-align:right;flex-shrink:0;line-height:1.1;">${suitLabel}</span>
      <div style="display:flex;gap:1px;flex-shrink:0;">${cells.join('')}</div>
      <div style="margin-left:2px;padding-left:3px;border-left:2px solid #3C5A4C;flex-shrink:0;">${kingCell}</div>
    </div>`;
}

function renderSolitario(){

  let banner = '';
  if(state.phase==='won'){

  } else if(state.phase==='finalReveal'){

    Restano da controllare: <b>${prog.daControllare}</b>.${prog.sbagliate>0 ? ` Finora trovate <b>${prog.sbagliate}</b> fuori posto — la partita è già persa, ma puoi continuare a controllare le altre per curiosità.` : ''}</div>`;

  const handCardHtml = (state.current && (state.phase==='holding' || state.phase==='assignRow')) ? `
