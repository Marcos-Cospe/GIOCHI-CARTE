<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>BISCA — il gioco delle previsioni</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=IBM+Plex+Mono:wght@400;600&display=swap');

:root{
  --bg:#152420;
  --surface:#1E332B;
  --surface-2:#264438;
  --line:#3C5A4C;
  --gold:#D4AF6A;
  --gold-soft:#8C7647;
  --cream:#F1ECE1;
  --cream-dim:#B9C4BC;
  --wine:#B04A4A;
  --wine-dim:#5C3232;
  --radius:14px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background: radial-gradient(ellipse at top, #1C3129 0%, var(--bg) 60%);
  color:var(--cream);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  min-height:100vh;
  padding-bottom:64px;
}
.wrap{max-width:560px;margin:0 auto;padding:calc(20px + env(safe-area-inset-top)) calc(16px + env(safe-area-inset-right)) env(safe-area-inset-bottom) calc(16px + env(safe-area-inset-left));}

header.top{padding:22px 4px 14px;text-align:center;position:relative;}
.brand{font-family:'Fraunces',serif;font-weight:700;font-size:38px;letter-spacing:1px;color:var(--cream);line-height:1;}
.brand .accent{color:var(--gold);}
.tagline{color:var(--cream-dim);font-size:13px;margin-top:6px;letter-spacing:.5px;}

.suit-ladder{display:flex;justify-content:center;gap:0;margin-top:16px;border:1px solid var(--line);border-radius:999px;overflow:hidden;width:fit-content;margin-left:auto;margin-right:auto;}
.suit-ladder span{padding:6px 14px;font-size:12px;font-family:'IBM Plex Mono',monospace;border-right:1px solid var(--line);}
.suit-ladder span:last-child{border-right:none;}
.suit-b{color:#9C8358;background:rgba(140,118,71,.10);}
.suit-s{color:#C9C2B0;background:rgba(201,194,176,.10);}
.suit-c{color:#E7B98A;background:rgba(231,185,138,.14);}
.suit-d{color:var(--gold);background:rgba(212,175,106,.20);font-weight:600;}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px;margin-bottom:16px;}
.card h2{font-family:'Fraunces',serif;font-weight:600;font-size:19px;margin:0 0 14px;color:var(--cream);}
.hint{color:var(--cream-dim);font-size:13px;line-height:1.5;margin:-6px 0 14px;}

button{font-family:inherit;font-size:15px;font-weight:600;cursor:pointer;border-radius:10px;border:1px solid transparent;padding:12px 18px;transition:transform .08s ease, opacity .15s ease;}
button:active{transform:scale(0.97);}
button:disabled{opacity:.35;cursor:not-allowed;}
.btn-primary{background:var(--gold);color:#1B2E27;width:100%;}
.btn-secondary{background:transparent;border-color:var(--line);color:var(--cream);}
.btn-danger{background:transparent;border-color:var(--wine-dim);color:var(--wine);}
.btn-small{padding:8px 12px;font-size:13px;}
.row-btns{display:flex;gap:10px;}
.row-btns button{flex:1;}

.player-input-row{display:flex;gap:8px;margin-bottom:10px;}
.player-input-row input{flex:1;}
input[type=text], input[type=number]{background:var(--surface-2);border:1px solid var(--line);color:var(--cream);border-radius:8px;padding:10px 12px;font-size:16px;font-family:inherit;width:100%;}
input[type=number]{font-family:'IBM Plex Mono',monospace;text-align:center;}
.player-chip{display:flex;justify-content:space-between;align-items:center;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:8px 12px;margin-bottom:8px;font-size:14px;}
.player-chip button{background:none;border:none;color:var(--wine);font-size:16px;padding:0 4px;}

.round-banner{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;}
.round-badge{font-family:'IBM Plex Mono',monospace;font-size:13px;color:var(--gold);background:rgba(212,175,106,.12);border:1px solid var(--gold-soft);padding:4px 10px;border-radius:999px;}
.forehead-note{background:rgba(176,74,74,.12);border:1px solid var(--wine-dim);color:#E3B4B4;font-size:13px;padding:8px 12px;border-radius:8px;margin-bottom:14px;}
.turn-banner{background:rgba(212,175,106,.14);border:1px solid var(--gold-soft);padding:10px 12px;border-radius:8px;margin-bottom:12px;font-size:14px;}
.waiting-banner{background:var(--surface-2);border:1px solid var(--line);padding:10px 12px;border-radius:8px;margin-bottom:12px;font-size:14px;color:var(--cream-dim);}

.player-row{display:grid;grid-template-columns:1fr 78px;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);}
.player-row:last-child{border-bottom:none;}
.player-name{font-size:15px;}
.lives-dots{display:flex;gap:4px;margin-top:3px;}
.dot{width:8px;height:8px;border-radius:50%;background:var(--gold);}
.dot.lost{background:var(--line);}
.sum-check{font-family:'IBM Plex Mono',monospace;font-size:13px;color:var(--cream-dim);text-align:right;margin:8px 0 14px;}
.sum-check.ok{color:var(--gold);}

.hand-block{margin-bottom:14px;padding:10px 0;border-bottom:1px solid var(--line);}
.hand-block:last-child{border-bottom:none;}
.hand-block-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;font-size:14px;}
.hand{display:flex;flex-wrap:wrap;gap:8px;}
.hand-card{display:inline-flex;padding:0;border-radius:8px;border:none;background:none;cursor:pointer;line-height:0;}
.hand-card.disabled{opacity:.45;cursor:not-allowed;}
.hand-card.hidden-card{cursor:default;}
.card-svg{display:block;filter:drop-shadow(0 2px 4px rgba(0,0,0,.35));}
.mystery-btn{background:var(--gold);color:#1B2E27;}

.trick-area{display:flex;flex-wrap:wrap;gap:12px;margin:0 0 16px;padding:12px;background:var(--surface-2);border-radius:10px;}
.trick-play{display:flex;flex-direction:column;align-items:center;font-size:11px;color:var(--cream-dim);gap:4px;}
.trick-play.winner{color:var(--gold);font-weight:700;}
.trick-play.winner .hand-card .card-svg{filter:drop-shadow(0 0 8px rgba(212,175,106,.8));}

.log-round{margin-bottom:14px;}
.log-round-title{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--gold-soft);text-transform:uppercase;letter-spacing:1px;margin-bottom:8px;}
.log-entry{display:grid;grid-template-columns:1fr auto auto auto;gap:10px;font-size:13px;padding:4px 0;color:var(--cream-dim);align-items:center;}
.log-entry .delta-ok{color:var(--gold);}
.log-entry .delta-bad{color:var(--wine);}
.eliminated-tag{font-size:10px;background:var(--wine-dim);color:#E3B4B4;padding:2px 6px;border-radius:4px;margin-left:6px;letter-spacing:.5px;}

.history-item{background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:10px;cursor:pointer;}
.history-item .h-top{display:flex;justify-content:space-between;font-size:13px;color:var(--cream-dim);}
.history-item .h-winner{font-family:'Fraunces',serif;font-weight:600;font-size:16px;color:var(--gold);margin-top:4px;}
.history-detail{margin-top:10px;border-top:1px solid var(--line);padding-top:10px;}
.rank-row{display:flex;justify-content:space-between;font-size:13px;padding:3px 0;color:var(--cream-dim);}
.rank-row.win{color:var(--gold);font-weight:600;}

.empty{color:var(--cream-dim);font-size:13px;text-align:center;padding:20px 0;}
.sync-note{font-size:11px;color:var(--cream-dim);text-align:center;margin-top:6px;opacity:.7;}
.toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;gap:8px;}
.toolbar span{font-size:12px;color:var(--cream-dim);font-family:'IBM Plex Mono',monospace;}
.seat-select button{display:block;width:100%;margin-bottom:8px;text-align:left;}
.warn{color:var(--wine);font-size:12px;margin-top:8px;}
.btn-secondary.mode-active{background:var(--gold);color:#1B2E27;border-color:var(--gold);}
.predict-btn-row{display:flex;gap:8px;flex-wrap:wrap;}
.predict-btn{flex:1;min-width:44px;text-align:center;font-family:'IBM Plex Mono',monospace;font-size:16px;font-weight:700;padding:12px 0;}
.trick-fraction{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--gold);background:rgba(212,175,106,.14);border:1px solid var(--gold-soft);padding:1px 7px;border-radius:999px;margin-left:6px;}
.ace-tag{color:var(--gold);font-weight:700;}
.hand-block.compact{padding:8px 0;}

/* Banner di turno: dice senza ambiguita a chi tocca */
.turn-bar{
  text-align:center;padding:10px 12px;border-radius:10px;margin-bottom:12px;
  font-size:14px;color:var(--cream-dim);background:var(--surface-2);border:1px solid var(--line);
}
.turn-bar.mine{
  background:linear-gradient(180deg, rgba(212,175,106,.22), rgba(212,175,106,.10));
  border-color:var(--gold);color:var(--gold);font-weight:700;letter-spacing:.5px;font-size:15px;
  animation:mineGlow 1.8s ease-in-out infinite;
}
@keyframes mineGlow{
  0%,100%{box-shadow:0 0 0 rgba(212,175,106,0);}
  50%{box-shadow:0 0 14px rgba(212,175,106,.35);}
}

/* Avviso desincronizzazione: onesto e visibile, non nascosto in un pannello di debug */
.desync-warn{
  background:rgba(176,74,74,.16);border:1px solid var(--wine);color:#F0C9C9;
  padding:12px;border-radius:10px;margin-bottom:12px;font-size:13px;line-height:1.5;
}
body.force-share.in-match #sync-panel{display:block !important;}
.refresh-mini{
  background:transparent;border:1px solid var(--line);color:var(--cream-dim);
  border-radius:8px;padding:2px 8px;font-size:14px;margin-left:6px;line-height:1.2;
}

/* ---------- Lobby e sale d'aspetto ---------- */
.lobby-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
.live-dot{
  width:9px;height:9px;border-radius:50%;background:var(--gold);flex-shrink:0;
  animation:livePulse 1.6s ease-in-out infinite;
}
@keyframes livePulse{
  0%,100%{opacity:.35;box-shadow:0 0 0 rgba(212,175,106,0);}
  50%{opacity:1;box-shadow:0 0 8px rgba(212,175,106,.8);}
}
.room-card{
  background:var(--surface-2);border:1px solid var(--line);border-radius:12px;
  padding:14px;margin-bottom:12px;
}
.room-card.muted{opacity:.55;}
.room-top{display:flex;justify-content:space-between;align-items:center;gap:8px;}
.room-name{font-family:'Fraunces',serif;font-weight:700;font-size:16px;color:var(--cream);}
.room-count{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--cream-dim);white-space:nowrap;}
.room-players{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;}
.room-players.big{gap:8px;margin-top:14px;}
.room-chip{
  background:rgba(212,175,106,.12);border:1px solid var(--gold-soft);color:var(--gold);
  padding:4px 10px;border-radius:999px;font-size:13px;
}
.room-players.big .room-chip{font-size:15px;padding:6px 14px;}
.room-chip.me{background:var(--gold);color:#1B2E27;font-weight:700;}

/* ---------- Tavolo e animazioni ---------- */
.table-wrap{display:flex;justify-content:center;margin-bottom:16px;}

@keyframes turnPulse{
  0%,100%{opacity:.35;stroke-width:2;}
  50%{opacity:1;stroke-width:3;}
}
.turn-ring{animation:turnPulse 1.6s ease-in-out infinite;}

@keyframes playedIn{
  0%{opacity:0;transform:scale(.55) translateY(-14px);}
  60%{opacity:1;transform:scale(1.08) translateY(2px);}
  100%{opacity:1;transform:scale(1) translateY(0);}
}
.played-in{animation:playedIn .34s cubic-bezier(.2,.9,.3,1.2) both;transform-box:fill-box;transform-origin:center;}

@keyframes winGlow{
  0%,100%{filter:drop-shadow(0 0 3px rgba(212,175,106,.55));}
  50%{filter:drop-shadow(0 0 10px rgba(212,175,106,1));}
}
.played-win{animation:playedIn .34s cubic-bezier(.2,.9,.3,1.2) both, winGlow 1.3s ease-in-out .34s infinite;}

@keyframes badgePop{
  0%{transform:scale(1);}
  45%{transform:scale(1.22);}
  100%{transform:scale(1);}
}
.badge-done{animation:badgePop .5s ease-out;transform-box:fill-box;transform-origin:center;}

/* Carte in mano: entrata a ventaglio + reattività al tocco */
@keyframes dealIn{
  0%{opacity:0;transform:translateY(16px) rotate(-4deg) scale(.9);}
  100%{opacity:1;transform:none;}
}
.hand .hand-card{animation:dealIn .34s ease-out both;}
.hand .hand-card:nth-child(1){animation-delay:.02s}
.hand .hand-card:nth-child(2){animation-delay:.08s}
.hand .hand-card:nth-child(3){animation-delay:.14s}
.hand .hand-card:nth-child(4){animation-delay:.20s}
.hand .hand-card:nth-child(5){animation-delay:.26s}
.hand button.hand-card{transition:transform .16s cubic-bezier(.2,.9,.3,1.3);}
.hand button.hand-card:active{transform:translateY(-10px) scale(1.06);}

/* Pannelli e banner: entrata morbida */
@keyframes slideFade{from{opacity:0;transform:translateY(-6px);}to{opacity:1;transform:none;}}
.turn-banner,.waiting-banner,.forehead-note{animation:slideFade .25s ease-out both;}
.predict-btn{transition:transform .14s ease, background .14s ease;}
.predict-btn:active{transform:scale(.92);}

/* Modalita compatta durante la partita: meno intestazione, niente scroll inutile */
body.in-match header.top{padding:8px 4px 2px;}
body.in-match .brand{font-size:22px;}
body.in-match .tagline,
body.in-match .suit-ladder,
body.in-match #sync-panel{display:none;}
body.in-match .hand{flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:4px;}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.01ms !important;animation-iteration-count:1 !important;transition-duration:.01ms !important;}
}

.sync-row{display:flex;align-items:center;gap:8px;}
.sync-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;}
.sync-label{flex:1;font-size:13px;color:var(--cream-dim);}
.sync-toggle{font-size:12px;color:var(--gold-soft);margin-top:10px;cursor:pointer;}

/* Orizzontale: piu spazio in larghezza, tavolo piu compatto per lasciare spazio alla mano sotto */
@media (orientation: landscape) and (min-width: 640px){
  .wrap{max-width:900px;}
  #sync-panel, #app > .card, #app > .card + .card{max-width:none;}
  .hand{justify-content:flex-start;}
  svg.card-svg{width:60px;height:84px;}
}
@media (orientation: landscape) and (max-width: 900px) and (max-height: 500px){
  /* telefono girato: schermo basso, riduco i margini verticali per stare nello spazio */
  .card{padding:12px;margin-bottom:10px;}
  header.top{padding:10px 4px 8px;}
  .brand{font-size:28px;}
  .tagline{margin-top:2px;}
  .suit-ladder{margin-top:8px;}
}

<script>
/* ============================================================
   COLLEGAMENTO A FIREBASE
   Sostituisce lo storage della sandbox con un database vero.
   Il resto del gioco resta identico: usa sempre window.storage.
   ============================================================ */

// >>> INCOLLA QUI LA CONFIGURAZIONE CHE TI DA FIREBASE <<<
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyCry-EdYU8Pe9fdf4BVDk0tSx4OThVBxpY",
  authDomain: "bisca-gioco-carte.firebaseapp.com",
  databaseURL: "https://bisca-gioco-carte-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "bisca-gioco-carte",
  storageBucket: "bisca-gioco-carte.firebasestorage.app",
  messagingSenderId: "1015214579798",
  appId: "1:1015214579798:web:8cf6da164f4d020ac1dbf7"
};
// >>> FINE CONFIGURAZIONE <<<

const CONFIG_DA_FARE = String(FIREBASE_CONFIG.databaseURL || '').indexOf('INCOLLA_QUI') >= 0;

let db = null;
let firebaseOk = false;

function fbPath(key){ return 'bisca/' + String(key).replace(/[.#$\[\]\/]/g, '_'); }

// I dati personali (chi sono io su questo dispositivo) restano sul telefono.
// I dati condivisi (sale e partite) vanno su Firebase.
const localStore = {
  get(k){ try{ const v = localStorage.getItem('bisca:'+k); return v===null?null:v; }catch(e){ return null; } },
  set(k,v){ try{ localStorage.setItem('bisca:'+k, v); }catch(e){} },
  del(k){ try{ localStorage.removeItem('bisca:'+k); }catch(e){} }
};

window.storage = {
  async get(key, shared){
    if(!shared){
      const v = localStore.get(key);
      return v===null ? null : {key, value:v, shared:false};
    }
    if(!firebaseOk) throw new Error('database non collegato');
    const snap = await db.ref(fbPath(key)).get();
    return snap.exists() ? {key, value:snap.val(), shared:true} : null;
  },
  async set(key, value, shared){
    if(!shared){ localStore.set(key, value); return {key, value, shared:false}; }
    if(!firebaseOk) throw new Error('database non collegato');
    await db.ref(fbPath(key)).set(value);
    return {key, value, shared:true};
  },
  async delete(key, shared){
    if(!shared){ localStore.del(key); return {key, deleted:true, shared:false}; }
    if(!firebaseOk) throw new Error('database non collegato');
    await db.ref(fbPath(key)).remove();
    return {key, deleted:true, shared:true};
  }
};

// --- Aggiornamento istantaneo -------------------------------------------
// Invece di controllare ogni tot, Firebase avvisa il telefono nell'istante
// in cui qualcun altro muove.
let sottoscrittoPartita = null;
let refPartita = null;

function attivaTempoReale(){
  db.ref(fbPath('rooms')).on('value', ()=>{ if(window.render) render(); });
  aggiornaAscoltoPartita();
  setInterval(aggiornaAscoltoPartita, 1500);
}
function aggiornaAscoltoPartita(){
  if(typeof matchKey !== 'function') return;
  const k = matchKey();
  if(k === sottoscrittoPartita) return;
  if(refPartita) refPartita.off();
  sottoscrittoPartita = k;
  refPartita = db.ref(fbPath(k));
  refPartita.on('value', ()=>{ if(window.render) render(); });
}

function mostraIstruzioni(){
  document.getElementById('app').innerHTML = `
    <div class="card">
      <h2>Manca la configurazione</h2>
      <p class="hint">Questo file va collegato al tuo database Firebase prima di funzionare.
      Apri <b>index.html</b>, cerca la riga <b>INCOLLA_QUI</b> in cima allo script e sostituiscila
      con la configurazione che ti dà Firebase. La guida completa è nel file <b>LEGGIMI.md</b>.</p>
    </div>`;
}
function mostraErrore(msg){
  document.getElementById('app').innerHTML = `
    <div class="card">
      <h2>Non riesco a collegarmi</h2>
      <p class="hint">${msg}</p>
      <p class="hint">Controlla che nella configurazione ci sia <b>databaseURL</b> e che nelle
      regole del database sia consentita la lettura e la scrittura (vedi <b>LEGGIMI.md</b>, punto 4).</p>
    </div>`;
}

async function avviaApp(){
  if(CONFIG_DA_FARE){ mostraIstruzioni(); return; }
  try{
    firebase.initializeApp(FIREBASE_CONFIG);
    db = firebase.database();
    await db.ref(fbPath('__prova')).set(Date.now());   // verifica scrittura
    await db.ref(fbPath('__prova')).remove();
    firebaseOk = true;
  }catch(e){
    mostraErrore((e && e.message) ? e.message : String(e));
    return;
  }
  await recallSeat();
  await tryLoadFromHash();
  await render();
  updateSyncPanel();
  attivaTempoReale();
}



const SEQ = [5,4,3,2,1];
const SUITS = ['Bastoni','Spade','Coppe','Denari'];
const RANKS = ['A','2','3','4','5','6','7','Cavallo','Fante','Re'];
const SUIT_CLASS = {'Bastoni':'suit-b','Spade':'suit-s','Coppe':'suit-c','Denari':'suit-d'};
let newPlayers = [];
let cachedUsual = [];
let setupMode = 'friends'; // 'friends' | 'solo'
let startingLives = 3;     // 3 o 5, scelto a inizio partita
let soloYourName = 'Tu';
let soloBotCount = 3;
let botMoveTimer = null;
let botMoveKey = null;
let pendingAceChoice = null; // {matchId, playerId, cardId}
let lastRenderKey = null;
let localOverrideMatch = null;
let localClaims = {}; // fallback locale: matchId -> claim, se lo storage personale fallisce
let storageStatus = 'checking'; // 'checking' | 'ok' | 'error:...'
let syncDiverged = false;       // true quando le nostre mosse non arrivano agli altri dispositivi
let lastKnownRemoteRev = -1;    // ultima revisione condivisa vista, per accorgersi delle mosse altrui

function esc(s){ return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function cardScore(c){ return c.si*10 + c.ri; } // 0..39, il seme pesa piu del valore, come da regole

function cardPercentile(c){ return (c.si*10 + c.ri) / 39; } // 0 (Asso Bastoni) .. 1 (Re Denari)

function botPredict(hand, cardsThisRound, numPlayers){
  // per ogni carta, stima la probabilita' che sia la piu' forte tra tutti i giocatori:
  // una carta media vince quasi sempre in 2, raramente in 6-8 -> il numero di
  // avversari deve pesare, non solo la forza assoluta della carta.
  const n = Math.max(2, numPlayers || 4);
  let expected = 0;
  hand.forEach(c=>{
    const p = cardPercentile(c);
    expected += Math.pow(p, n-1);
  });
  // un pizzico di imprecisione umana: i bot non sono calcolatori infallibili,
  // a volte sovrastimano o sottostimano di poco la propria mano
  const rumore = (Math.random()<0.18) ? (Math.random()<0.5?-1:1) : 0;
  return Math.max(0, Math.min(cardsThisRound, Math.round(expected)+rumore));
}

function botChooseCard(hand, playsSoFar, wantsMore){
  const bestSoFar = playsSoFar.length ? Math.max(...playsSoFar.map(p=>effectiveScore(p.card,p.forcedValue))) : null;
  const scored = hand.map(c=>{
    const ace = isAssoDenari(c);
    return { c, winScore: ace?40:cardScore(c), loseScore: ace?-1:cardScore(c), ace };
  });

  function withForced(entry, usingToWin){
    return { card: entry.c, forcedValue: entry.ace ? (usingToWin?'alto':'basso') : undefined };
  }

  if(playsSoFar.length===0){
    if(wantsMore){
      scored.sort((a,b)=>b.winScore-a.winScore);
      return withForced(scored[0], true);
    } else {
      scored.sort((a,b)=>a.loseScore-b.loseScore);
      return withForced(scored[0], false);
    }
  }

  const beating = scored.filter(x=>x.winScore>bestSoFar).sort((a,b)=>a.winScore-b.winScore);
  const losing = scored.filter(x=>x.loseScore<=bestSoFar).sort((a,b)=>a.loseScore-b.loseScore);

  if(wantsMore){
    return beating.length ? withForced(beating[0], true) : withForced(losing[0], false);
  } else {
    return losing.length ? withForced(losing[0], false) : withForced(beating[0], true);
  }
}

function currentTurnInfo(match){
  if(match.phase==='predict'){
    return {type:'predict', playerId: match.turnOrder.find(id=>match.previsioni[id]===undefined)};
  }
  const trick = match.trick;
  return {type:'play', playerId: trick.turnOrder[trick.plays.length]};
}

async function scheduleBotMove(){
  const match = await getActiveMatch();
  if(!match) return;
  const info = currentTurnInfo(match);
  if(!info.playerId) return;
  const player = match.players.find(p=>p.id===info.playerId);
  if(!player || !player.isBot){ botMoveKey=null; return; }

  const key = match.id+'|'+match.roundIndex+'|'+info.type+'|'+info.playerId+'|'+
    (match.phase==='play'?match.trick.plays.length:Object.keys(match.previsioni).length);
  if(botMoveKey===key) return;
  botMoveKey = key;
  if(botMoveTimer) clearTimeout(botMoveTimer);
  const delay = info.type==='play' ? 1700 : 1000;
  botMoveTimer = setTimeout(async ()=>{
    const cur = await getActiveMatch();
    if(!cur) return;
    if(cur.phase==='predict'){
      const cards = SEQ[cur.roundIndex%SEQ.length];
      const pred = botPredict(cur.hands[info.playerId], cards, cur.roundActive.length);
      await declarePrevisione(cur.id, info.playerId, pred, cards);
    } else if(cur.phase==='play'){
      const wantsMore = ((cur.previsioni[info.playerId]||0) - (cur.tricksWon[info.playerId]||0)) > 0;
      const choice = botChooseCard(cur.hands[info.playerId], cur.trick.plays, wantsMore);
      await playCard(cur.id, info.playerId, choice.card.id, choice.forcedValue);
    }
  }, delay);
}

function freshDeck(){
  const d=[];
  SUITS.forEach((s,si)=>RANKS.forEach((r,ri)=>d.push({id:s+'-'+r, suit:s, rank:r, si, ri})));
  return d;
}
function shuffle(arr){ for(let i=arr.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1)); [arr[i],arr[j]]=[arr[j],arr[i]];} return arr; }
function isAssoDenari(c){ return c.suit==='Denari' && c.rank==='A'; }
function effectiveScore(card, forcedValue){
  if(forcedValue==='basso') return -1;   // vale meno dell'asso di bastoni (che ha score 0)
  if(forcedValue==='alto') return 40;    // vale piu del re di denari (che ha score 39)
  return cardScore(card);
}
function trickWinnerOf(plays){
  let best = plays[0];
  let bestScore = effectiveScore(best.card, best.forcedValue);
  for(const p of plays){
    const s = effectiveScore(p.card, p.forcedValue);
    if(s > bestScore){ best = p; bestScore = s; }
  }
  return best.playerId;
}
function rotateFromId(ids, startId){ const idx=ids.indexOf(startId); if(idx<0) return ids.slice(); return ids.slice(idx).concat(ids.slice(0,idx)); }
function cardLabel(c){ return c.rank+' di '+c.suit; }

function pipPositions(n){
  const map = {
    1:[[30,46]],
    2:[[30,32],[30,60]],
    3:[[30,24],[30,46],[30,68]],
    4:[[18,32],[42,32],[18,60],[42,60]],
    5:[[18,30],[42,30],[30,46],[18,62],[42,62]],
    6:[[18,24],[42,24],[18,46],[42,46],[18,68],[42,68]],
    7:[[18,22],[42,22],[30,34],[18,50],[42,50],[18,68],[42,68]]
  };
  return map[n]||map[1];
}

const WORD_SIZE = {'Fante':13,'Cavallo':9.5,'Re':22};
function cardFrontSVG(card){
  const color = SUIT_HEX[card.suit];
  const symbol = suitSymbolInner(card.suit);
  const isCourt = ['Cavallo','Fante','Re'].includes(card.rank);
  if(isCourt){
    const fs = WORD_SIZE[card.rank];
    return `<svg viewBox="0 0 60 84" width="52" height="73" class="card-svg">
      <rect x="1" y="1" width="58" height="82" rx="8" fill="#F1ECE1" stroke="${color}" stroke-width="2.4"/>

    </svg>`;
  }
  const n = RANKS.indexOf(card.rank)+1;

  const pips = pipPositions(n).map(([x,y])=>`<g transform="translate(${x-9},${y-9}) scale(0.75)" style="color:${color};">${symbol}</g>`).join('');

    ${pips}
  </svg>`;
}

async function getActiveMatch(){
  try{
    const r=await window.storage.get(matchKey(), matchShared());
    if(r){
      storageStatus='ok';
      const remote = unpackMatch(JSON.parse(r.value));
      const remoteRev = remote.rev||0;
      // REGOLA: se lo stato condiviso e' cambiato rispetto all'ultima volta che lo abbiamo visto,
      // qualcun altro ha mosso -> lo adottiamo SEMPRE. Cosi le mosse degli altri non vengono mai ignorate,
      // anche se noi avessimo delle modifiche locali non salvate.
      if(!localOverrideMatch || localOverrideMatch.id!==remote.id || remoteRev!==lastKnownRemoteRev){
        lastKnownRemoteRev = remoteRev;
        localOverrideMatch = remote;
        syncDiverged = false;
        return remote;
      }
      // lo stato condiviso e' fermo: se noi siamo piu avanti, le nostre mosse non sono passate
      if((localOverrideMatch.rev||0) > remoteRev){
        syncDiverged = true;
        return localOverrideMatch;
      }
      syncDiverged = false;
      localOverrideMatch = remote;
      return remote;
    }
    return localOverrideMatch;
  }catch(e){ storageStatus='error:'+(e&&e.message?e.message:String(e)); return localOverrideMatch; }
}
async function setActiveMatch(m){
  m.rev = (m.rev||0) + 1;
  localOverrideMatch = m;
  try{
    await window.storage.set(matchKey(), JSON.stringify(packMatch(m)), matchShared());
    const back = await window.storage.get(matchKey(), matchShared());
    const okRev = back && (JSON.parse(back.value).rev) === m.rev;
    storageStatus = okRev ? 'ok' : 'error:scrittura non confermata';
    syncDiverged = !okRev;
    if(okRev) lastKnownRemoteRev = m.rev;
  }
  catch(e){ storageStatus='error:'+(e&&e.message?e.message:String(e)); syncDiverged = true; }
}
async function forceResync(){
  // scarta la copia locale e riparte da quella condivisa
  localOverrideMatch = null;
  lastKnownRemoteRev = -1;
  syncDiverged = false;
  lastRenderKey = null;
  document.body.classList.remove('force-share');
  await render(true);
}
async function clearActiveMatch(){

}

async function tryLoadFromHash(){
  const hash = window.location.hash;
  if(!hash || !hash.startsWith('#s=')) return false;
  try{
    const payload = decodeState(hash.slice(3));
    if(payload.type==='match'){
      await setActiveMatch(unpackMatch(payload.data));
      return true;
    }
  }catch(e){ /* link non valido, ignora e prosegue normalmente */ }
  return false;
}
async function importCode(){
  const input = document.getElementById('import-code-input');
  const msg = document.getElementById('import-msg');
  try{
    const payload = decodeState(input.value);
    if(payload.type==='match'){
      await setActiveMatch(unpackMatch(payload.data));
      msg.textContent = 'Partita caricata da codice.';
    } else if(payload.type==='roster'){
      newPlayers = payload.data;
      msg.textContent = 'Lista giocatori caricata da codice.';
    } else {
      msg.textContent = 'Codice non riconosciuto.';
    }
    input.value='';
    await render();
  }catch(e){
    msg.textContent = 'Codice non valido o corrotto.';
  }
}

function stateKeyOf(match, claim){
  if(!match) return 'setup';
  const prev = match.previsioni ? Object.keys(match.previsioni).sort().map(k=>k+':'+match.previsioni[k]).join(',') : '';
  const plays = match.trick ? match.trick.plays.map(p=>p.playerId+':'+p.card.id+':'+(p.forcedValue||'')).join(',') : '';
  const resolved = match.trick && match.trick.resolved ? 'R'+match.trick.winnerId : '';
  const claimKey = claim ? (claim.type==='all' ? 'all' : 'seat:'+claim.playerId) : 'none';
  const ace = pendingAceChoice ? 'ace:'+pendingAceChoice.cardId : '';
  return [match.id, match.rev||0, match.roundIndex, match.phase, prev, plays, resolved, claimKey, ace, syncDiverged?'DIV':''].join('|');
}

// Elenco condiviso di sale aperte: chi apre il link le vede tutte e puo entrare
// scrivendo il proprio nome, senza bisogno di link o codici da passare a mano.
let myRoomId = null;      // sala in cui mi trovo
let mySeatIdx = null;     // il mio posto in quella sala
let soloMode = false;     // partita contro bot: resta solo su questo dispositivo
let cachedRooms = [];
let lobbyView = 'lobby';  // 'lobby' | 'creaSala' | 'solo'
let joinNameDraft = '';

function matchKey(){
  if(soloMode) return 'solo-match';
  return myRoomId ? 'match:'+myRoomId : 'active-match';
}
function matchShared(){ return !soloMode; }

async function getRooms(){
  try{
    const r = await window.storage.get('rooms', true);
    const list = r ? JSON.parse(r.value) : [];
    // scarto le sale abbandonate da piu di 6 ore, per non accumulare rumore
    const limite = Date.now() - 6*3600*1000;
    return list.filter(s=>s && s.created > limite);
  }catch(e){ return []; }
}
async function saveRooms(list){
  try{ await window.storage.set('rooms', JSON.stringify(list), true); return true; }
  catch(e){ return false; }
}
async function upsertRoom(room){
  const list = await getRooms();
  const i = list.findIndex(s=>s.id===room.id);
  if(i>=0) list[i]=room; else list.unshift(room);
  return saveRooms(list.slice(0,20));
}
async function getRoom(id){
  const list = await getRooms();
  return list.find(s=>s.id===id) || null;
}
async function rememberSeat(){
  try{ await window.storage.set('my-seat', JSON.stringify({roomId:myRoomId, idx:mySeatIdx, solo:soloMode}), false); }catch(e){}
}
async function recallSeat(){
  try{
    const r = await window.storage.get('my-seat', false);
    if(r){ const v=JSON.parse(r.value); myRoomId=v.roomId; mySeatIdx=v.idx; soloMode=!!v.solo; }
  }catch(e){}
}

async function createRoom(){
  const nameEl = document.getElementById('room-name');
  const hostEl = document.getElementById('host-name');
  const roomName = (nameEl && nameEl.value.trim()) || 'Sala di '+((hostEl&&hostEl.value.trim())||'qualcuno');
  const hostName = (hostEl && hostEl.value.trim()) || 'Giocatore 1';
  const room = {
    id: 'r'+Date.now().toString(36),
    name: roomName, host: hostName,
    players: [hostName], lives: startingLives,
    created: Date.now(), started: false
  };
  const ok = await upsertRoom(room);
  if(!ok){ alert('Non riesco a creare la sala: la sincronizzazione non è disponibile su questo dispositivo.'); return; }
  myRoomId = room.id; mySeatIdx = 0; soloMode = false;
  await rememberSeat();
  lobbyView = 'lobby';
  lastRenderKey = null;
  await render(true);
}
async function joinRoom(roomId){
  const el = document.getElementById('join-name-'+roomId);
  const nome = (el && el.value.trim()) || joinNameDraft.trim();
  if(!nome){ alert('Scrivi il tuo nome per entrare.'); return; }
  const room = await getRoom(roomId);
  if(!room){ alert('Questa sala non esiste più.'); await render(true); return; }
  if(room.started){ alert('Questa partita è già iniziata.'); await render(true); return; }
  if(room.players.length>=8){ alert('Sala piena (massimo 8 giocatori).'); return; }
  let idx = room.players.indexOf(nome);
  if(idx<0){ room.players.push(nome); idx = room.players.length-1; }
  const ok = await upsertRoom(room);
  if(!ok){ alert('Non riesco a entrare: la sincronizzazione non è disponibile su questo dispositivo.'); return; }
  myRoomId = roomId; mySeatIdx = idx; soloMode = false;
  joinNameDraft = '';
  await rememberSeat();
  lastRenderKey = null;
  await render(true);
}
async function leaveRoom(){
  if(myRoomId){
    const room = await getRoom(myRoomId);
    if(room && !room.started && mySeatIdx!=null){
      room.players.splice(mySeatIdx,1);
      if(room.players.length===0){
        const list = (await getRooms()).filter(s=>s.id!==room.id);
        await saveRooms(list);
      } else { await upsertRoom(room); }
    }
  }
  myRoomId=null; mySeatIdx=null; soloMode=false;
  await rememberSeat();
  lastRenderKey = null;
  await render(true);
}
async function startRoomMatch(){
  const room = await getRoom(myRoomId);
  if(!room) return;
  if(room.players.length<2){ alert('Servono almeno 2 giocatori.'); return; }
  const L = room.lives || 3;
  const players = room.players.map((n,i)=>({id:'p'+i, name:n, lives:L, eliminated:false, eliminatedAtRound:null}));
  const match = {
    id: room.id, seed:(Math.random()*2147483647)|0, createdAt:new Date().toISOString(),
    players, roundIndex:0, startingLives:L,
    leaderId: players[Math.floor(Math.random()*players.length)].id, log:[]
  };
  startRound(match);
  await setActiveMatch(match);
  room.started = true;
  await upsertRoom(room);
  lastRenderKey = null;
  await render(true);
}

function renderLobby(rooms){
  const aperte = rooms.filter(s=>!s.started);
  const inCorso = rooms.filter(s=>s.started);

async function render(force){
  const app = document.getElementById('app');

  // 1) partita in corso (di sala o in singolo)
  const match = await getActiveMatch();
  if(match){
    document.body.classList.add('in-match');
    // in una sala il posto e' gia' noto: chi sei lo hai dichiarato entrando
    let claim = (myRoomId && mySeatIdx!=null && !soloMode)
      ? {type:'seat', playerId:'p'+mySeatIdx}
      : await getClaim(match.id);
    const key = stateKeyOf(match, claim);
    if(!force && key===lastRenderKey && app.innerHTML){ scheduleBotMove(); return; }
    lastRenderKey = key;
    app.innerHTML = claim ? renderMatch(match, claim) : renderSeatSelect(match);
    scheduleBotMove();
    return;
  }

  document.body.classList.remove('in-match');

  // 2) sono dentro una sala che non ha ancora avviato
  if(myRoomId && !soloMode){
    const room = await getRoom(myRoomId);
    if(room){
      if(room.started){
        // l'host ha avviato: la partita comparira' al prossimo giro di aggiornamento
        app.innerHTML = `<div class="card"><div class="lobby-head"><h2 style="margin:0;">Si comincia…</h2><span class="live-dot"></span></div><p class="hint">La partita sta partendo.</p></div>`;
        lastRenderKey = 'starting';
        return;
      }
      const key = 'room|'+room.id+'|'+room.players.join(',')+'|'+room.lives;
      if(!force && key===lastRenderKey) return;
      lastRenderKey = key;
      app.innerHTML = renderRoom(room);
      return;
    }
    // la sala non esiste piu
    myRoomId=null; mySeatIdx=null; await rememberSeat();
  }

  // 3) schermata di creazione sala
  if(lobbyView==='creaSala'){
    if(lastRenderKey!=='creaSala' || force){ lastRenderKey='creaSala'; app.innerHTML = renderCreaSala(); }
    return;
  }

  // 4) schermata partita in singolo
  if(lobbyView==='solo'){
    if(lastRenderKey!=='solo' || force){
      lastRenderKey='solo';
      const history = await getHistory();
      app.innerHTML = renderSoloSetup() + renderHistory(history);
    }
    return;
  }

  // 5) lobby con le sale aperte, aggiornata da sola
  cachedRooms = await getRooms();
  const history = await getHistory();
  const key = 'lobby|'+cachedRooms.map(s=>s.id+':'+s.players.length+':'+(s.started?1:0)).join(',')+'|'+history.length;
  if(!force && key===lastRenderKey) return;
  lastRenderKey = key;
  app.innerHTML = renderLobby(cachedRooms) + renderHistory(history);
}

// ---------------- ROUND ENGINE ----------------
function activeIds(match){ return match.players.filter(p=>!p.eliminated).map(p=>p.id); }

// --- Distribuzione deterministica ---------------------------------------
// Il mazzo viene mescolato con un generatore pseudo-casuale a seme fisso:
// dal solo (seme, numero mano) ogni dispositivo ricava le stesse identiche mani.
// Cosi le carte non viaggiano mai sulla rete: e' il grosso del risparmio.
function mulberry32(a){
  return function(){
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function seededShuffle(arr, seed){
  const rnd = mulberry32(seed);
  for(let i=arr.length-1;i>0;i--){ const j=Math.floor(rnd()*(i+1)); [arr[i],arr[j]]=[arr[j],arr[i]]; }
  return arr;
}
function dealRound(seed, roundIndex, activeIds, cardsPerPlayer){
  const deck = seededShuffle(freshDeck(), (seed|0) + roundIndex*7919);
  const hands = {}; let idx=0;
  activeIds.forEach(pid=>{ hands[pid]=deck.slice(idx, idx+cardsPerPlayer); idx+=cardsPerPlayer; });
  return hands;
}
function cardIdx(c){ return c.si*10 + c.ri; }               // 0..39, univoco
function cardFromIdx(i){
  const si = Math.floor(i/10), ri = i%10;
  return {id:SUITS[si]+'-'+RANKS[ri], suit:SUITS[si], rank:RANKS[ri], si, ri};
}

// --- Compressione dello stato condiviso ---------------------------------
// Sulla rete non mandiamo mai le mani (ricavabili dal seme) ne' le carte per
// esteso: solo indici 0..39. Riduce di molto il peso di ogni singola mossa.
function packMatch(m){
  // partite iniziate con una versione precedente non hanno il seme: le mani non
  // sarebbero ricostruibili, quindi restano nel formato esteso.
  if(m.seed===undefined || m.seed===null) return m;
  const p = {
    i:m.id, s:m.seed, t:m.createdAt, L:m.startingLives, r:m.roundIndex,
    ld:m.leaderId, ph:m.phase, rev:m.rev||0,
    pl:m.players.map(x=>[x.name, x.lives, x.eliminated?1:0, x.eliminatedAtRound, x.isBot?1:0]),
    pv:m.previsioni||{}, tw:m.tricksWon||{},
    rp:(m.roundPlays||[]).map(x=>[x.playerId, cardIdx(x.card)]),
    lg:(m.log||[]).map(r=>[r.round, r.cards, r.entries.map(e=>[e.name, e.previsione, e.prese, e.viteAfter, e.eliminated?1:0])])
  };
  if(m.trick) p.tk = {
    pl:m.trick.plays.map(x=>[x.playerId, cardIdx(x.card), x.forcedValue||0]),
    to:m.trick.turnOrder, ld:m.trick.leaderId,
    rs:m.trick.resolved?1:0, wn:m.trick.winnerId||0, rd:m.trick.roundDoneNext?1:0
  };
  if(m._matchEnded){ p.end=1; p.win=m._winnerId||0; }
  return p;
}
function unpackMatch(p){
  if(!p || !p.i) return p; // formato non compresso: lascia com'e'
  const m = {
    id:p.i, seed:p.s, createdAt:p.t, startingLives:p.L, roundIndex:p.r,
    leaderId:p.ld, phase:p.ph, rev:p.rev||0,
    players:p.pl.map((x,idx)=>({id:'p'+idx, name:x[0], lives:x[1], eliminated:!!x[2], eliminatedAtRound:x[3], isBot:!!x[4]})),
    previsioni:p.pv||{}, tricksWon:p.tw||{},
    roundPlays:(p.rp||[]).map(x=>({playerId:x[0], card:cardFromIdx(x[1])})),
    log:(p.lg||[]).map(r=>({round:r[0], cards:r[1],
      entries:r[2].map(e=>({name:e[0], previsione:e[1], prese:e[2], delta:Math.abs(e[1]-e[2]), viteAfter:e[3], eliminated:!!e[4]}))}))
  };
  m.roundActive = m.players.filter(x=>!x.eliminated).map(x=>x.id);
  m.turnOrder = rotateFromId(m.roundActive, m.leaderId);
  // ricostruzione delle mani: distribuzione dal seme, meno le carte gia' calate
  const cards = SEQ[m.roundIndex % SEQ.length];
  m.hands = dealRound(m.seed, m.roundIndex, m.roundActive, cards);
  for(const rp of m.roundPlays){
    const h = m.hands[rp.playerId];
    if(!h) continue;
    const k = h.findIndex(c=>c.id===rp.card.id);
    if(k>=0) h.splice(k,1);
  }
  if(p.tk) m.trick = {
    plays:p.tk.pl.map(x=>({playerId:x[0], card:cardFromIdx(x[1]), forcedValue:x[2]||undefined})),
    turnOrder:p.tk.to, leaderId:p.tk.ld,
    resolved:!!p.tk.rs, winnerId:p.tk.wn||undefined, roundDoneNext:!!p.tk.rd
  };
  if(p.end){ m._matchEnded = true; m._winnerId = p.win||null; }
  return m;
}

function startRound(match){
  const active = activeIds(match);
  const cards = SEQ[match.roundIndex % SEQ.length];
  match.hands = dealRound(match.seed, match.roundIndex, active, cards);
  match.roundActive = active;
  match.roundPlays = [];   // carte gia calate in questa mano, per ricostruire le mani residue
  match.previsioni = {};
  match.tricksWon = {}; active.forEach(pid=>match.tricksWon[pid]=0);
  match.turnOrder = rotateFromId(active, match.leaderId);
  match.phase = 'predict';
  match.trick = null;
}

async function declarePrevisione(matchId, playerId, value, maxCards){
  const match = await getActiveMatch();
  let n = parseInt(value,10);
  if(isNaN(n)) return;
  n = Math.max(0, Math.min(maxCards, n));
  match.previsioni[playerId] = n;
  if(match.roundActive.every(id => match.previsioni[id]!==undefined)){
    match.phase='play';
    match.trick = {plays:[], turnOrder: match.turnOrder.slice(), leaderId: match.leaderId};
  }
  await setActiveMatch(match);
  await render();
}

async function playCard(matchId, playerId, cardId, forcedValue){
  const match = await getActiveMatch();
  const trick = match.trick;
  const expected = trick.turnOrder[trick.plays.length];
  if(expected !== playerId) return;
  const hand = match.hands[playerId];
  const ci = hand.findIndex(c=>c.id===cardId);
  if(ci<0) return;
  const card = hand.splice(ci,1)[0];
  const play = {playerId, card};
  if(isAssoDenari(card) && (forcedValue==='alto' || forcedValue==='basso')) play.forcedValue = forcedValue;
  trick.plays.push(play);
  if(!match.roundPlays) match.roundPlays = [];
  match.roundPlays.push({playerId, card});

  if(trick.plays.length === match.roundActive.length){
    const winnerId = trickWinnerOf(trick.plays);
    match.tricksWon[winnerId] = (match.tricksWon[winnerId]||0) + 1;
    match.leaderId = winnerId;
    trick.winnerId = winnerId;
    trick.resolved = true;
    trick.roundDoneNext = match.roundActive.every(pid => match.hands[pid].length===0);
    await setActiveMatch(match);
    await render();
    return; // aspetta che l'utente tocchi "prossima presa" prima di proseguire
  }

  await setActiveMatch(match);
  await render();
}

async function continueAfterTrick(matchId){
  const match = await getActiveMatch();
  if(!match || !match.trick || !match.trick.resolved) return;
  const winnerId = match.trick.winnerId;
  const roundDone = match.trick.roundDoneNext;
  let ended = false;
  if(roundDone){
    ended = finishRound(match);
  } else {
    match.trick = {plays:[], turnOrder: rotateFromId(match.roundActive, winnerId), leaderId: winnerId};
  }
  if(ended){
    await finalizeMatch(match);
  } else {
    await setActiveMatch(match);
  }
  await render();
}

function finishRound(match){
  const cards = SEQ[match.roundIndex % SEQ.length];
  const entries = match.roundActive.map(pid=>{
    const player = match.players.find(p=>p.id===pid);
    const previsione = match.previsioni[pid]||0;
    const prese = match.tricksWon[pid]||0;
    const delta = Math.abs(previsione-prese);
    const viteLostThisRound = delta>0 ? 1 : 0; // al massimo 1 vita persa per turno, non proporzionale allo scarto
    const viteAfter = Math.max(0, player.lives - viteLostThisRound);
    player.lives = viteAfter;
    if(player.lives<=0 && !player.eliminated){ player.eliminated=true; player.eliminatedAtRound=match.roundIndex+1; }
    return {name:player.name, previsione, prese, delta, viteAfter, eliminated: player.eliminated};
  });
  match.log.push({round: match.roundIndex+1, cards, entries});

  const stillActive = activeIds(match);
  if(stillActive.length<=1){
    match._matchEnded = true;
    match._winnerId = stillActive.length===1 ? stillActive[0] : null;
    return true;
  } else {
    match.roundIndex += 1;
    startRound(match);
    return false;
  }
}

async function finalizeMatch(match){
  const ranked = [...match.players].sort((a,b)=>{
    const av = a.eliminated ? a.eliminatedAtRound : Infinity;
    const bv = b.eliminated ? b.eliminatedAtRound : Infinity;
    return bv-av;
  }).map((p,i)=>({name:p.name, rank:i+1, eliminatedAtRound:p.eliminatedAtRound, isBot:!!p.isBot}));
  const historyEntry = {
    id: match.id, date: match.createdAt, endedAt: new Date().toISOString(),
    winner: match._winnerId ? match.players.find(p=>p.id===match._winnerId).name : null,
    players: ranked, rounds: match.log.length, log: match.log,
    solo: match.players.some(p=>p.isBot),
    startingLives: match.startingLives || 3
  };
  const history = await getHistory();
  history.unshift(historyEntry);
  await saveHistory(history);
  await clearActiveMatch();
  await clearClaim(match.id);
  // chiudo la sala e riporto tutti alla lobby
  if(myRoomId){
    try{ const list=(await getRooms()).filter(s=>s.id!==myRoomId); await saveRooms(list); }catch(e){}
  }
  myRoomId=null; mySeatIdx=null; soloMode=false; lobbyView='lobby';
  await rememberSeat();
  lastRenderKey=null;
}

// ---------------- SEAT SELECT ----------------
function renderSeatSelect(match){
  const opts = match.players.map(p=>`<button class="btn-secondary" onclick="claimSeat('${match.id}','${p.id}')">${esc(p.name)}</button>`).join('');
  return `<div class="card">
    <h2>Chi sei tu in questa partita?</h2>
    <p class="hint">Su questo dispositivo vedrai solo la tua mano. Se giocate tutti passandovi lo stesso telefono, scegli l'altra opzione.</p>
    <div class="seat-select">${opts}</div>
    <button class="btn-secondary" onclick="claimSeat('${match.id}','ALL')">Un unico dispositivo per tutti (mostra tutte le mani)</button>
  </div>`;
}
async function claimSeat(matchId, playerId){
  await setClaim(matchId, playerId==='ALL' ? {type:'all'} : {type:'seat', playerId});
  await render();
}
async function changeSeat(matchId){
  await clearClaim(matchId);
  await render();
}

// ---------------- MATCH RENDER ----------------
function livesDots(n, max){ const m = max || 3; let d=''; for(let i=0;i<m;i++) d+=`<span class="dot ${i<n?'':'lost'}"></span>`; return d; }
function nameOf(match,id){ return match.players.find(p=>p.id===id).name; }

function tableConfig(n){
  // il tavolo si allarga e gli elementi si rimpiccioliscono al crescere dei giocatori,
  // cosi nomi e badge non si sovrappongono mai (verificato per 2..8 giocatori)
  if(n<=4) return {VB:400, seatR:118, avatarR:27, fs:1};
  if(n<=6) return {VB:430, seatR:132, avatarR:26, fs:.95};
  return {VB:470, seatR:150, avatarR:25, fs:.88};
}

function renderTableSVG(match, cards, revealAll, myId){
  const ids = match.roundActive;
  const n = ids.length;
  const C = tableConfig(n);
  const VB = C.VB, fs = C.fs;
  const cx = VB/2, cy = VB/2, seatR = C.seatR, avatarR = C.avatarR;
  const turnId = match.phase==='play'
    ? (match.trick.resolved ? null : match.trick.turnOrder[match.trick.plays.length])
    : match.turnOrder.find(id=>match.previsioni[id]===undefined);

  let seats = '';
  ids.forEach((pid,i)=>{
    const angle = -Math.PI/2 + i*(2*Math.PI/n);
    const x = cx + seatR*Math.cos(angle);
    const y = cy + seatR*Math.sin(angle);
    const player = match.players.find(p=>p.id===pid);
    const cardsLeft = (match.hands && match.hands[pid]) ? match.hands[pid].length : 0;
    const isTurn = pid===turnId;
    const isMe = pid===myId;

    // --- vite: pallini subito sotto l'avatar, centrati qualunque sia il numero massimo
    const maxLives = match.startingLives || 3;
    const dotGap = maxLives>3 ? 8*fs : 10*fs;
    const dotR = maxLives>3 ? 2.9*fs : 3.4*fs;
    const dotsStart = x - ((maxLives-1)*dotGap)/2;
    let livesDotsSvg='';
    for(let d=0; d<maxLives; d++){
      livesDotsSvg += `<circle cx="${dotsStart+d*dotGap}" cy="${y+avatarR+13*fs}" r="${dotR}" fill="${d<player.lives?'#D4AF6A':'#3C5A4C'}"/>`;
    }

    // --- badge prese/previsione: sotto le vite, sempre in verticale (mai radiale, evita sovrapposizioni ai lati)
    const previsione = match.previsioni ? match.previsioni[pid] : undefined;
    const preseFatte = (match.tricksWon && match.tricksWon[pid]) || 0;
    const declared = previsione!==undefined;
    const done = declared && preseFatte===previsione;
    const over = declared && preseFatte>previsione;
    const badgeY = y + avatarR + 30*fs;
    const bw = 34*fs;
    const badgeFill = !declared ? 'rgba(255,255,255,.04)' : (over ? 'rgba(176,74,74,.22)' : (done ? 'rgba(212,175,106,.30)' : 'rgba(212,175,106,.14)'));
    const badgeStroke = !declared ? '#3C5A4C' : (over ? '#B04A4A' : '#8C7647');
    const badgeText = !declared ? '#6C8078' : (over ? '#E3B4B4' : '#D4AF6A');
    const fractionSvg = `
      <g class="${done?'badge-done':''}">
        <rect x="${x-bw/2}" y="${badgeY-10*fs}" width="${bw}" height="${16*fs}" rx="${8*fs}" fill="${badgeFill}" stroke="${badgeStroke}" stroke-width="1"/>
        <text x="${x}" y="${badgeY+2*fs}" text-anchor="middle" font-family="'IBM Plex Mono',monospace" font-size="${10.5*fs}" font-weight="700" fill="${badgeText}">${declared?preseFatte+'/'+previsione:'···'}</text>
      </g>`;

    // --- etichetta nome: sopra l'avatar, con clamp per non uscire dai bordi
    let nm = player.name.length>11 ? player.name.slice(0,10)+'…' : player.name;
    const label = esc(nm) + (isMe?' (tu)':(player.isBot?' ᴀɪ':''));
    const pillW = Math.max(52*fs, label.length*7.2*fs + 16);
    const lx = Math.max(pillW/2+3, Math.min(VB-pillW/2-3, x));
    const ly = y - avatarR - 15*fs;

    // --- carta giocata in questa presa, tra l'avatar e il centro
    let playedCardSvg = '';
    if(match.phase==='play' && match.trick){
      const playEntry = match.trick.plays.find(p=>p.playerId===pid);
      if(playEntry){
        const playedR = seatR - 46*fs;
        const px = cx + playedR*Math.cos(angle);
        const py = cy + playedR*Math.sin(angle);
        const isWin = match.trick.resolved && match.trick.winnerId===pid;
        const tilt = (Math.atan2(py-cy, px-cx)*180/Math.PI + 90) * 0.12;
        const sc = 0.63*fs;
        const aceTag = playEntry.forcedValue
          ? `<text x="${px}" y="${py+29*fs}" text-anchor="middle" font-family="'IBM Plex Mono',monospace" font-size="${9*fs}" font-weight="700" fill="#D4AF6A">${playEntry.forcedValue==='alto'?'▲ alto':'▼ basso'}</text>`
          : '';
        playedCardSvg = `
          <g transform="translate(${px},${py}) rotate(${tilt})">
            <g class="played-in ${isWin?'played-win':''}">
              <g transform="translate(${-26*sc},${-37*sc}) scale(${sc})">${cardFrontSVG(playEntry.card)}</g>
            </g>
          </g>${aceTag}`;
      }
    }

    seats += `
      <g>
        ${isTurn?`<circle class="turn-ring" cx="${x}" cy="${y}" r="${avatarR+5}" fill="none" stroke="#D4AF6A" stroke-width="2"/>`:''}
        <circle cx="${x}" cy="${y}" r="${avatarR}" fill="${isTurn?'#2C4C3E':'#223B32'}" stroke="${isTurn?'#D4AF6A':(isMe?'#8C7647':'#3C5A4C')}" stroke-width="${isTurn?2.4:1.8}"/>
        <rect x="${x-9*fs}" y="${y-13*fs}" width="${18*fs}" height="${26*fs}" rx="3" fill="url(#table-cardback)" stroke="#8C7647" stroke-width="1"/>
        <circle cx="${x+9*fs}" cy="${y+10*fs}" r="${7.5*fs}" fill="#16261F" stroke="#D4AF6A" stroke-width="1"/>
        <text x="${x+9*fs}" y="${y+13.5*fs}" text-anchor="middle" font-family="'IBM Plex Mono',monospace" font-size="${9.5*fs}" font-weight="700" fill="#D4AF6A">${cardsLeft}</text>
        ${livesDotsSvg}
        ${fractionSvg}
        ${playedCardSvg}
        <rect x="${lx-pillW/2}" y="${ly-11*fs}" width="${pillW}" height="${19*fs}" rx="${9.5*fs}" fill="rgba(10,20,16,0.92)" stroke="${isTurn?'#D4AF6A':'#3C5A4C'}" stroke-width="1"/>
        <text x="${lx}" y="${ly+3*fs}" text-anchor="middle" font-family="'Fraunces',serif" font-size="${12.5*fs}" font-weight="700" fill="${isTurn?'#D4AF6A':'#F1ECE1'}">${label}</text>
      </g>`;
  });

  const arrowR = seatR - 26*fs;
  const a1 = -0.5, a2 = 0.5;
  const ax1 = cx + arrowR*Math.cos(a1), ay1 = cy + arrowR*Math.sin(a1);
  const ax2 = cx + arrowR*Math.cos(a2), ay2 = cy + arrowR*Math.sin(a2);
  const tableDefs = `
    <defs>
      <marker id="rot-arrow-head" markerWidth="9" markerHeight="9" refX="4.5" refY="4.5" orient="auto">
        <path d="M0,0 L9,4.5 L0,9 Z" fill="#D4AF6A"/>
      </marker>
      <pattern id="table-cardback" width="4" height="4" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
        <rect width="4" height="4" fill="#2A4A3C"/>
        <rect width="2" height="4" fill="#1E332B"/>
      </pattern>
      <radialGradient id="feltGrad" cx="50%" cy="42%" r="62%">
        <stop offset="0%" stop-color="#274539"/>
        <stop offset="62%" stop-color="#1D3730"/>
        <stop offset="100%" stop-color="#132520"/>
      </radialGradient>
      <radialGradient id="centerGrad" cx="50%" cy="40%" r="60%">
        <stop offset="0%" stop-color="#28483B"/>
        <stop offset="100%" stop-color="#1B322A"/>
      </radialGradient>
    </defs>`;
  const rotationArrow = `
    <circle cx="${cx}" cy="${cy}" r="${arrowR}" fill="none" stroke="#33544A" stroke-width="1.2" stroke-dasharray="2 8"/>
    <path d="M ${ax1} ${ay1} A ${arrowR} ${arrowR} 0 0 1 ${ax2} ${ay2}" fill="none" stroke="#D4AF6A" stroke-width="2.2" stroke-linecap="round" marker-end="url(#rot-arrow-head)" opacity="0.85"/>
  `;

  const trickNo = (match.phase==='play' && match.tricksWon)
    ? Object.values(match.tricksWon).reduce((a,b)=>a+b,0) + (match.trick && match.trick.resolved ? 0 : 1)
    : null;
  const centerR = 56*fs;

  return `
    <div class="table-wrap">
      <svg viewBox="0 0 ${VB} ${VB}" width="100%" style="max-width:340px;aspect-ratio:1/1;display:block;height:auto;">
        ${tableDefs}
        <circle cx="${cx}" cy="${cy}" r="${seatR+30*fs}" fill="url(#feltGrad)" stroke="#4A6B5B" stroke-width="2"/>
        <circle cx="${cx}" cy="${cy}" r="${seatR+24*fs}" fill="none" stroke="#3C5A4C" stroke-width="1" opacity=".7"/>
        <circle cx="${cx}" cy="${cy}" r="${centerR}" fill="url(#centerGrad)" stroke="#3C5A4C" stroke-width="1.2"/>
        <text x="${cx}" y="${cy-9*fs}" text-anchor="middle" font-family="'Fraunces',serif" font-size="${15*fs}" font-weight="700" fill="#D4AF6A">Mano ${match.roundIndex+1}</text>
        <text x="${cx}" y="${cy+7*fs}" text-anchor="middle" font-family="'IBM Plex Mono',monospace" font-size="${10*fs}" fill="#B9C4BC">${cards} cart${cards===1?'a':'e'}</text>
        <text x="${cx}" y="${cy+22*fs}" text-anchor="middle" font-family="'IBM Plex Mono',monospace" font-size="${9*fs}" fill="#6C8078">${trickNo!==null?'presa '+trickNo:'previsioni'}</text>
        ${rotationArrow}
        ${seats}
      </svg>
    </div>`;
}

function renderMatch(match, claim){
  const cards = SEQ[match.roundIndex % SEQ.length];
  const revealAll = claim.type==='all';
  const myId = claim.type==='seat' ? claim.playerId : null;
  const myLabel = revealAll ? 'tutti visibili' : esc(nameOf(match,myId));

  let body = match.phase==='predict' ? renderPredict(match, cards, revealAll, myId) : renderPlay(match, cards, revealAll, myId);

  // --- chi ha il turno adesso, detto in modo inequivocabile
  const turnId = match.phase==='play'
    ? (match.trick && match.trick.resolved ? null : match.trick.turnOrder[match.trick.plays.length])
    : match.turnOrder.find(id=>match.previsioni[id]===undefined);
  let turnBar = '';
  if(turnId){
    const isMine = revealAll || turnId===myId;
    turnBar = `<div class="turn-bar ${isMine?'mine':''}">${isMine
      ? (revealAll ? 'Tocca a <b>'+esc(nameOf(match,turnId))+'</b>' : '► TOCCA A TE')
      : 'Sta giocando <b>'+esc(nameOf(match,turnId))+'</b> — aspetta <button class="refresh-mini" onclick="forceResync()" title="Aggiorna">⟳</button>'}</div>`;
  }

  // --- avviso onesto quando le nostre mosse non stanno arrivando agli altri
  const syncWarn = syncDiverged ? `
    <div class="desync-warn">
      <b>Attenzione:</b> le tue mosse non stanno arrivando agli altri dispositivi.
      Voi due state vedendo due partite diverse.
      <div class="row-btns" style="margin-top:8px;">
        <button class="btn-secondary btn-small" onclick="forceResync()">Riallinea alla partita degli altri</button>
        <button class="btn-secondary btn-small" onclick="openShareFromMatch()">Codice partita</button>
      </div>
    </div>` : '';

  return `
    <div class="card">
      <div class="toolbar">
        <span>Sei: ${myLabel}</span>
        <div class="row-btns" style="flex:0;gap:6px;">
          <button class="btn-secondary btn-small" onclick="changeSeat('${match.id}')">Cambia</button>
          <button class="btn-danger btn-small" onclick="abandonMatch()">Abbandona</button>
        </div>
      </div>
      ${syncWarn}
      ${turnBar}
      ${renderTableSVG(match, cards, revealAll, myId)}
      ${body}
    </div>
    ${renderLog(match)}
  `;
}
function openShareFromMatch(){
  // mostra il pannello di condivisione anche durante la partita (di norma nascosto in modalita compatta)
  document.body.classList.add('force-share');
  const p = document.getElementById('code-panel');
  if(p) p.style.display = 'block';
  const el = document.getElementById('sync-panel');
  if(el) el.scrollIntoView({behavior:'smooth', block:'center'});
}

function renderHandsBlock(match, cards, revealAll, myId, opts){
  const forehead = cards===1;
  const turnId = opts && opts.turnId;
  const interactive = !!(opts && opts.interactive);
  return match.roundActive.map(pid=>{
    const isMe = pid===myId;
    const isTurn = !!turnId && pid===turnId;
    const hidden = !revealAll && (forehead ? isMe : !isMe);
    const player = match.players.find(p=>p.id===pid);
    const previsione = match.previsioni ? match.previsioni[pid] : undefined;
    const preseFatte = (match.tricksWon && match.tricksWon[pid]) || 0;
    const fraction = previsione!==undefined ? `<span class="trick-fraction">${preseFatte}/${previsione}</span>` : '';

    if(hidden && !isMe){
      // avversario a mano nascosta: riga compatta senza le carte (gia rappresentate sul tavolo), ma con nome/previsione/vite ben visibili
      return `
        <div class="hand-block compact">
          <div class="hand-block-head">
            <span>${esc(player.name)}${player.isBot?' 🤖':''}${fraction} ${isTurn?'<b>· tocca a lui/lei</b>':''}</span>
            <span class="lives-dots">${livesDots(player.lives, match.startingLives)}</span>
          </div>
        </div>`;
    }
    const hand = match.hands[pid];

    let cardsHtml;
    if(hidden){
      cardsHtml = `<div class="hand">${hand.map(()=>`<span class="hand-card hidden-card">${cardBackSVG()}</span>`).join('')}</div>`;
      if(interactive && forehead && isMe && isTurn && hand.length===1){
        cardsHtml += `<button class="btn-primary mystery-btn" style="margin-top:8px;" onclick="playCard('${match.id}','${pid}','${hand[0].id}')">Gioca la tua carta misteriosa</button>`;
      }
    } else {
      const sorted = [...hand].sort((a,b)=> a.si-b.si || a.ri-b.ri);
      const clickable = interactive && (revealAll || isMe) && isTurn;
      cardsHtml = `<div class="hand">${sorted.map(c=>
        clickable
          ? (isAssoDenari(c)
              ? `<button class="hand-card ${SUIT_CLASS[c.suit]}" title="${cardLabel(c)}" onclick="chooseAceValue('${match.id}','${pid}','${c.id}')">${cardFrontSVG(c)}</button>`
              : `<button class="hand-card ${SUIT_CLASS[c.suit]}" title="${cardLabel(c)}" onclick="playCard('${match.id}','${pid}','${c.id}')">${cardFrontSVG(c)}</button>`)
          : `<span class="hand-card ${SUIT_CLASS[c.suit]} disabled" title="${cardLabel(c)}">${cardFrontSVG(c)}</span>`
      ).join('')}</div>`;
    }

    return `
      <div class="hand-block">
        <div class="hand-block-head">
          <span>${esc(nameOf(match,pid))}${player.isBot?' 🤖':''}${fraction} ${isTurn?'<b>· tocca a lui/lei</b>':''}</span>
          <span class="lives-dots">${livesDots(player.lives, match.startingLives)}</span>
        </div>
        ${cardsHtml}
      </div>`;
  }).join('');
}

function renderPredict(match, cards, revealAll, myId){
  const target = match.turnOrder.find(id => match.previsioni[id]===undefined);
  const already = match.turnOrder.filter(id=>match.previsioni[id]!==undefined)
    .map(id=>`<div class="player-row"><div class="player-name">${esc(nameOf(match,id))}</div><div style="text-align:right;font-family:'IBM Plex Mono',monospace;">${match.previsioni[id]}</div></div>`).join('');

  const canAct = revealAll || target===myId;
  const forehead = cards===1;

  const buttons = Array.from({length: cards+1}, (_,v)=>v)
    .map(v=>`<button class="btn-secondary predict-btn" onclick="declarePrevisione('${match.id}','${target}',${v},${cards})">${v}</button>`)
    .join('');

  const inputBlock = canAct ? `
    <div class="turn-banner">Tocca a <b>${esc(nameOf(match,target))}</b> dichiarare.</div>
    ${forehead && !revealAll ? '<div class="forehead-note">Mano da 1 carta: non conosci la tua carta, dichiara alla cieca.</div>' : ''}
    <div class="predict-btn-row">${buttons}</div>
  ` : `<div class="waiting-banner">In attesa che <b>${esc(nameOf(match,target))}</b> dichiari...</div>`;

  return `
    <div class="round-banner"><span class="round-badge">Mano ${match.roundIndex+1} · ${cards} cart${cards===1?'a':'e'}</span></div>
    <h2 style="margin-top:0;">La tua mano</h2>
    ${renderHandsBlock(match, cards, revealAll, myId, {interactive:false, turnId:null})}
    <h2>Previsioni</h2>
    <p class="hint">Si dichiara in ordine, a partire da chi ha vinto l'ultima presa. Guarda la tua mano qui sopra prima di dichiarare.</p>
    ${already}
    ${inputBlock}
  `;
}

function renderPlay(match, cards, revealAll, myId){
  const trick = match.trick;
  const resolved = !!trick.resolved;
  const turnId = resolved ? null : trick.turnOrder[trick.plays.length];
  const forehead = cards===1;

  const continueBlock = resolved ? `
    <div class="turn-banner">Presa vinta da <b>${esc(nameOf(match,trick.winnerId))}</b>.</div>
    <button class="btn-primary" onclick="continueAfterTrick('${match.id}')">${trick.roundDoneNext ? 'Vedi il risultato della mano' : 'Prossima presa'}</button>
  ` : '';

  const aceChoiceBlock = (pendingAceChoice && pendingAceChoice.matchId===match.id) ? `
    <div class="turn-banner">Asso di Denari: che valore gli dai?</div>
    <div class="row-btns">
      <button class="btn-secondary" onclick="confirmAceValue('basso')">Meno dell'Asso di Bastoni</button>
      <button class="btn-secondary" onclick="confirmAceValue('alto')">Più del Re di Denari</button>
    </div>
    <button class="btn-danger btn-small" style="margin-top:8px;" onclick="cancelAceChoice()">Annulla</button>
  ` : '';

  const hands = renderHandsBlock(match, cards, revealAll, myId, {interactive:true, turnId});

  return `
    <div class="round-banner"><span class="round-badge">Mano ${match.roundIndex+1} · ${cards} cart${cards===1?'a':'e'} · presa ${trick.plays.length? 'in corso':'nuova'}</span></div>
    ${forehead ? '<div class="forehead-note">Mano da 1 carta: vedi le carte degli altri ma non la tua.</div>' : ''}
    ${continueBlock}
    ${aceChoiceBlock}
    ${hands}
  `;
}

function renderLog(match){
  if(!match.log || match.log.length===0) return '';
  const rounds = match.log.slice().reverse().map(r=>`
    <div class="log-round">
      <div class="log-round-title">Mano ${r.round} · ${r.cards} carte</div>
      ${r.entries.map(e=>`
        <div class="log-entry">
          <span>${esc(e.name)}${e.eliminated?'<span class="eliminated-tag">eliminato</span>':''}</span>
          <span>prev ${e.previsione}</span>
          <span>fatte ${e.prese}</span>
          <span class="${e.delta===0?'delta-ok':'delta-bad'}">${e.delta===0?'esatto':'-1 vita (scarto '+e.delta+')'}</span>
        </div>`).join('')}
    </div>`).join('');
  return `<div class="card">
    <div class="sync-toggle" onclick="toggleLogPanel()" style="margin-top:0;">Andamento partita ▾</div>
    <div id="log-panel" style="display:none;margin-top:12px;">${rounds}</div>
  </div>`;
}
function toggleLogPanel(){
  const p = document.getElementById('log-panel');
  if(p) p.style.display = p.style.display==='none' ? 'block' : 'none';
}

async function abandonMatch(){
  if(!confirm('Abbandonare la partita in corso? Non verrà salvata nello storico.')) return;
  const match = await getActiveMatch();
  await clearActiveMatch();
  if(match) await clearClaim(match.id);
  if(myRoomId){
    try{ const list=(await getRooms()).filter(s=>s.id!==myRoomId); await saveRooms(list); }catch(e){}
  }
  myRoomId=null; mySeatIdx=null; soloMode=false; lobbyView='lobby';
  await rememberSeat();
  lastRenderKey=null;
  await render(true);
}

// ---------------- STORICO ----------------
let openHistoryId = null;
function renderHistory(history){
  if(history.length===0) return `<div class="card"><h2>Storico partite</h2><p class="empty">Nessuna partita ancora giocata.</p></div>`;
  const items = history.map(h=>{
    const isOpen = openHistoryId === h.id;
    const detail = isOpen ? `
      <div class="history-detail">
        ${h.players.map(p=>`
          <div class="rank-row ${p.rank===1?'win':''}">
            <span>${p.rank}. ${esc(p.name)}${p.isBot?' 🤖':''}</span>
            <span>${p.rank===1?'vincitore':'eliminato mano '+p.eliminatedAtRound}</span>
          </div>`).join('')}
        <div style="font-size:12px;color:var(--cream-dim);margin-top:6px;">${h.rounds} man${h.rounds===1?'o':'i'} giocate · ${h.startingLives||3} vite a testa</div>
      </div>` : '';
    return `
      <div class="history-item" onclick="toggleHistory('${h.id}')">
        <div class="h-top">
          <span>${new Date(h.date).toLocaleDateString('it-IT',{day:'2-digit',month:'2-digit',year:'numeric'})} · ${h.solo?'Singolo 🤖':'Con amici'}</span>
          <span>${h.players.length} giocatori</span>
        </div>
        <div class="h-winner">${h.winner ? '🏆 '+esc(h.winner) : 'Nessun vincitore netto'}</div>
        ${detail}
      </div>`;
  }).join('');
  return `<div class="card"><h2>Storico partite</h2>${items}</div>`;
}
function toggleHistory(id){ openHistoryId = openHistoryId===id ? null : id; render(); }

// ---------------- AVVIO ----------------
// L'avvio e' gestito da avviaApp() nel modulo Firebase, che parte quando la
// pagina e' pronta. Manteniamo un controllo di sicurezza poco frequente nel
// caso un aggiornamento in tempo reale andasse perso.
setInterval(()=>{
  if(document.visibilityState!=='visible') return;
  const a = document.activeElement;
  if(a && (a.tagName==='INPUT' || a.tagName==='TEXTAREA')) return;
  render();
}, 4000);
document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState==='visible') render(); });

// rendo raggiungibili le funzioni usate dai pulsanti della pagina
window.render = render;
window.recallSeat = recallSeat;
