      <div class="risiko-map-col">${risikoMapSVG(match.territories, match.players, mapOpts)}</div>
      <div class="risiko-panel-col">${panel}</div>
    </div>
  `;
}

const BS_SIZE = 10;
const BS_ROWS = ['A','B','C','D','E','F','G','H','I','J'];
const BS_SHIPS = [
  {id:'portaerei', name:'Portaerei', size:5},
  {id:'corazzata', name:'Corazzata', size:4},
  {id:'incrociatore', name:'Incrociatore', size:3},
  {id:'sottomarino', name:'Sottomarino', size:3},
  {id:'cacciatorpediniere', name:'Cacciatorpediniere', size:2}
];
const BS_MAX_PLAYERS = 2;

function bsEmptyBoard(){
  const cells = {};
  BS_ROWS.forEach(r=>{ for(let c=1;c<=BS_SIZE;c++) cells[r+c] = { shipId:null, shot:false }; });
  return cells;
}
function bsCellsForShip(row, col, size, horizontal){
  const cells = [];
  for(let i=0;i<size;i++){
    const r = horizontal ? row : BS_ROWS[BS_ROWS.indexOf(row)+i];
    const c = horizontal ? col+i : col;
    if(!r || c<1 || c>BS_SIZE) return null;
    cells.push(r+c);
  }
  return cells;
}
function bsCanPlace(board, cells){ return !!cells && cells.every(k=> board[k] && board[k].shipId===null); }
function bsPlaceShip(board, shipId, row, col, size, horizontal){
  const cells = bsCellsForShip(row, col, size, horizontal);
  if(!bsCanPlace(board, cells)) return null;
  cells.forEach(k=>{ board[k].shipId = shipId; });
  return cells;
}
function bsRandomFleet(){
  const board = bsEmptyBoard();
  const placements = {};
  for(const ship of BS_SHIPS){
    let placed = null, tentativi=0;
    while(!placed && tentativi<500){
      tentativi++;
      const horizontal = Math.random()<0.5;
      const row = BS_ROWS[Math.floor(Math.random()*BS_SIZE)];
      const col = 1+Math.floor(Math.random()*BS_SIZE);
      placed = bsPlaceShip(board, ship.id, row, col, ship.size, horizontal);
    }
    if(!placed) return bsRandomFleet(); // sfortuna estrema: ricomincio da capo
    placements[ship.id] = placed;
  }
  return { board, placements };
}
function bsShoot(board, coord){
  const cell = board[coord];
  if(!cell || cell.shot) return null;
  cell.shot = true;
  return { hit: !!cell.shipId, shipId: cell.shipId };
}
function bsShipSunk(board, placements, shipId){ return placements[shipId].every(k=>board[k].shot); }
function bsAllSunk(board, placements){ return Object.keys(placements).every(id=>bsShipSunk(board, placements, id)); }
function bsCoordNeighbors(coord){
  const row = coord[0], col = parseInt(coord.slice(1));
  const ri = BS_ROWS.indexOf(row);
  const out = [];
  if(ri>0) out.push(BS_ROWS[ri-1]+col);
  if(ri<BS_SIZE-1) out.push(BS_ROWS[ri+1]+col);
  if(col>1) out.push(row+(col-1));
  if(col<BS_SIZE) out.push(row+(col+1));
  return out;
}
function bsAllCoords(){ const out=[]; BS_ROWS.forEach(r=>{ for(let c=1;c<=BS_SIZE;c++) out.push(r+c); }); return out; }
function bsBotChooseShot(board, botState){
  const unshot = c=> !board[c].shot;
  if(botState.hits.length>0){
    if(botState.hits.length>=2){
      const sameRow = botState.hits.every(c=>c[0]===botState.hits[0][0]);
      const candidates = [];
      if(sameRow){
        const row = botState.hits[0][0];
        const cols = botState.hits.map(c=>parseInt(c.slice(1)));
        const minC = Math.min(...cols), maxC = Math.max(...cols);
        if(minC>1) candidates.push(row+(minC-1));
        if(maxC<BS_SIZE) candidates.push(row+(maxC+1));
      } else {
        const col = parseInt(botState.hits[0].slice(1));
        const rows = botState.hits.map(c=>BS_ROWS.indexOf(c[0]));
        const minR = Math.min(...rows), maxR = Math.max(...rows);
        if(minR>0) candidates.push(BS_ROWS[minR-1]+col);
        if(maxR<BS_SIZE-1) candidates.push(BS_ROWS[maxR+1]+col);
      }
      const valid = candidates.filter(c=>board[c] && unshot(c));
      if(valid.length) return valid[Math.floor(Math.random()*valid.length)];
    }
    const around = bsCoordNeighbors(botState.hits[0]).filter(unshot);
    if(around.length) return around[Math.floor(Math.random()*around.length)];
  }
  const all = bsAllCoords().filter(unshot);
  const checker = all.filter(c=>{ const r=BS_ROWS.indexOf(c[0]), col=parseInt(c.slice(1)); return (r+col)%2===0; });
  const pool = checker.length ? checker : all;
  return pool[Math.floor(Math.random()*pool.length)];
}
function bsBotRegisterResult(botState, coord, result, board, placements){
  if(!result.hit) return;
  if(result.shipId && bsShipSunk(board, placements, result.shipId)) botState.hits = [];
  else botState.hits.push(coord);
}

function buildBattleshipMatch(id, names){
  const players = names.map((name,i)=>({id:'p'+i, name, isBot:false}));
  const boards = {}, placements = {}, ready = {}, botStates = {};
  players.forEach(p=>{ boards[p.id]=bsEmptyBoard(); placements[p.id]=null; ready[p.id]=false; botStates[p.id]={hits:[]}; });
  return {
    id, game:'battaglianavale', createdAt:new Date().toISOString(),
    players, turnOrder: players.map(p=>p.id),
    phase:'placement', boards, placements, ready, botStates,
    currentId: players[0].id, lastShot:null, winnerId:null
  };
}
async function bsAutoPlace(matchId, playerId){
  const match = await getActiveMatch();
  if(!match || match.id!==matchId || match.phase!=='placement') return;
  const fleet = bsRandomFleet();
  match.boards[playerId] = fleet.board;
  match.placements[playerId] = fleet.placements;
  match.ready[playerId] = true;
  await bsMaybeStartBattle(match);
  await setActiveMatch(match);
  await render();
}
async function bsPlaceShipManual(matchId, playerId, shipId, row, col, horizontal){
  const match = await getActiveMatch();
  if(!match || match.id!==matchId || match.phase!=='placement' || match.ready[playerId]) return;
  const ship = BS_SHIPS.find(s=>s.id===shipId);
  if(!ship) return;
  const board = match.boards[playerId];
  if(!match.placements[playerId]) match.placements[playerId] = {};
  // se la nave era gia' piazzata, la tolgo prima di riprovare altrove
  if(match.placements[playerId][shipId]){
    match.placements[playerId][shipId].forEach(k=>{ board[k].shipId = null; });
    delete match.placements[playerId][shipId];
  }
  const cells = bsPlaceShip(board, shipId, row, col, ship.size, horizontal);
  if(cells) match.placements[playerId][shipId] = cells;
  await setActiveMatch(match);
  await render();
  return !!cells;
}
async function bsRemoveShip(matchId, playerId, shipId){
  const match = await getActiveMatch();
  if(!match || match.id!==matchId || match.phase!=='placement' || match.ready[playerId]) return;
  const board = match.boards[playerId];
  const placed = match.placements[playerId] && match.placements[playerId][shipId];
  if(placed){ placed.forEach(k=>{ board[k].shipId = null; }); delete match.placements[playerId][shipId]; }
  await setActiveMatch(match);
  await render();
}
async function bsConfirmReady(matchId, playerId){
  const match = await getActiveMatch();
  if(!match || match.id!==matchId || match.phase!=='placement') return;
  const placed = match.placements[playerId] || {};
  if(BS_SHIPS.some(s=>!placed[s.id])) return; // mancano ancora navi da piazzare
  match.ready[playerId] = true;
  await bsMaybeStartBattle(match);
  await setActiveMatch(match);
  await render();
}
async function bsMaybeStartBattle(match){
  if(match.turnOrder.every(id=>match.ready[id])){
    match.phase = 'battle';
    match.currentId = match.turnOrder[0];
  }
}
async function bsShootAt(matchId, shooterId, coord){
  const match = await getActiveMatch();
  if(!match || match.id!==matchId || match.phase!=='battle' || match.currentId!==shooterId) return;
  const targetId = match.turnOrder.find(id=>id!==shooterId);
  const res = bsShoot(match.boards[targetId], coord);
  if(!res) return;
  match.lastShot = { shooterId, targetId, coord, hit:res.hit, shipId: res.shipId, sunk: res.shipId ? bsShipSunk(match.boards[targetId], match.placements[targetId], res.shipId) : false };
  if(match.players.find(p=>p.id===targetId).isBot===false){} // nessuna azione extra necessaria
  if(bsAllSunk(match.boards[targetId], match.placements[targetId])){
    match.phase = 'ended';
    match.winnerId = shooterId;
    sndWin(); vibrate([50,30,50]);
  } else if(!res.hit){
    match.currentId = targetId; // un colpo a vuoto passa il turno, un colpo a segno rigioca
  }
  await setActiveMatch(match);
  await render();
}
async function bsBotTakeTurn(match, botId){
  const targetId = match.turnOrder.find(id=>id!==botId);
  const botState = match.botStates[botId];
  const coord = bsBotChooseShot(match.boards[targetId], botState);
  const res = bsShoot(match.boards[targetId], coord);
  bsBotRegisterResult(botState, coord, res, match.boards[targetId], match.placements[targetId]);
  match.lastShot = { shooterId: botId, targetId, coord, hit:res.hit, shipId: res.shipId, sunk: res.shipId ? bsShipSunk(match.boards[targetId], match.placements[targetId], res.shipId) : false };
  if(bsAllSunk(match.boards[targetId], match.placements[targetId])){
    match.phase = 'ended';
    match.winnerId = botId;
  } else if(!res.hit){
    match.currentId = targetId;
  }
  await setActiveMatch(match);
  await render();
}
async function maybeSaveBattleshipHistory(match){
  if(match.phase!=='ended' || match._historySaved) return;
  match._historySaved = true;
  const ranked = match.players.map(p=>({name:p.name, isBot:p.isBot, rank: p.id===match.winnerId?1:2}));
  const historyEntry = {

  };

    try{ const list=(await getRooms()).filter(s=>s.id!==myRoomId); await saveRooms(list); }catch(e){}

}
const BS_BOT_THINK_MS = 800;
async function scheduleBattleshipBotMove(match){
  if(!match || match.phase==='ended') return;
  if(match.phase==='placement'){
    for(const id of match.turnOrder){
      const p = match.players.find(x=>x.id===id);
      if(p.isBot && !match.ready[id]){
        const key = 'bsPlace|'+match.id+'|'+id;
        if(botMoveKey===key) continue;
        botMoveKey = key;
        await bsAutoPlace(match.id, id);
      }
    }
    return;
  }
  if(match.phase!=='battle') return;
  const p = match.players.find(x=>x.id===match.currentId);
  if(!p || !p.isBot){ botMoveKey=null; return; }
  const targetId = match.turnOrder.find(id=>id!==p.id);
  const key = 'bs|'+match.id+'|'+p.id+'|'+Object.values(match.boards[targetId]).filter(c=>c.shot).length;
  if(botMoveKey===key) return;
  botMoveKey = key;
  if(botMoveTimer) clearTimeout(botMoveTimer);
  botMoveTimer = setTimeout(async ()=>{
    const cur = await getActiveMatch();
    if(!cur || cur.game!=='battaglianavale' || cur.phase!=='battle') return;
    const bot = cur.players.find(x=>x.id===cur.currentId);
    if(!bot || !bot.isBot) return;
    await bsBotTakeTurn(cur, bot.id);
  }, BS_BOT_THINK_MS);
}

const F4_COLS = 7, F4_ROWS = 6;
const F4_MAX_PLAYERS = 2;

function f4EmptyGrid(){
  const grid = [];
  for(let r=0;r<F4_ROWS;r++) grid.push(new Array(F4_COLS).fill(null));
  return grid;
}
function f4DropRow(grid, col){
  for(let r=F4_ROWS-1; r>=0; r--) if(!grid[r][col]) return r;
  return -1;
}
function f4Drop(grid, col, color){
  const r = f4DropRow(grid, col);
  if(r<0) return null;
  grid[r][col] = color;
  return {row:r, col};
}
function f4ColumnFull(grid, col){ return grid[0][col]!==null; }
function f4BoardFull(grid){ for(let c=0;c<F4_COLS;c++) if(!f4ColumnFull(grid,c)) return false; return true; }
function f4CheckWinAt(grid, row, col){
  const color = grid[row][col];
  if(!color) return null;
  const dirs = [[0,1],[1,0],[1,1],[1,-1]];
  for(const [dr,dc] of dirs){
    const line = [[row,col]];
    let r=row+dr, c=col+dc;
    while(r>=0&&r<F4_ROWS&&c>=0&&c<F4_COLS&&grid[r][c]===color){ line.push([r,c]); r+=dr; c+=dc; }
    r=row-dr; c=col-dc;
    while(r>=0&&r<F4_ROWS&&c>=0&&c<F4_COLS&&grid[r][c]===color){ line.unshift([r,c]); r-=dr; c-=dc; }
    if(line.length>=4) return line;
  }
  return null;
}
function f4ValidColumns(grid){
  const cols = [];
  for(let c=0;c<F4_COLS;c++) if(!f4ColumnFull(grid,c)) cols.push(c);
  return cols;
}
function f4Opponent(color){ return color==='R' ? 'G' : 'R'; }
function f4ScoreWindow(cells, me){
  const opp = f4Opponent(me);
  const myCount = cells.filter(c=>c===me).length;
  const oppCount = cells.filter(c=>c===opp).length;
  const empty = cells.filter(c=>c===null).length;
  if(myCount===4) return 100000;
  if(oppCount===4) return -100000;
  if(myCount>0 && oppCount>0) return 0;
  if(myCount===3 && empty===1) return 50;
  if(myCount===2 && empty===2) return 10;
  if(oppCount===3 && empty===1) return -80;
  if(oppCount===2 && empty===2) return -8;
  return 0;
}
function f4EvaluateBoard(grid, me){
  let score = 0;
  const centerCol = Math.floor(F4_COLS/2);
  for(let r=0;r<F4_ROWS;r++) if(grid[r][centerCol]===me) score += 3;
  for(let r=0;r<F4_ROWS;r++) for(let c=0;c<=F4_COLS-4;c++) score += f4ScoreWindow([grid[r][c],grid[r][c+1],grid[r][c+2],grid[r][c+3]], me);
  for(let c=0;c<F4_COLS;c++) for(let r=0;r<=F4_ROWS-4;r++) score += f4ScoreWindow([grid[r][c],grid[r+1][c],grid[r+2][c],grid[r+3][c]], me);
  for(let r=0;r<=F4_ROWS-4;r++) for(let c=0;c<=F4_COLS-4;c++){
    score += f4ScoreWindow([grid[r][c],grid[r+1][c+1],grid[r+2][c+2],grid[r+3][c+3]], me);
    score += f4ScoreWindow([grid[r+3][c],grid[r+2][c+1],grid[r+1][c+2],grid[r][c+3]], me);
  }
  return score;
}
function f4Minimax(grid, depth, alpha, beta, maximizing, me){
  const validCols = f4ValidColumns(grid);
  if(depth===0 || validCols.length===0) return { score: f4EvaluateBoard(grid, me), col:null };
  const turnColor = maximizing ? me : f4Opponent(me);
  let best = maximizing ? {score:-Infinity, col:validCols[0]} : {score:Infinity, col:validCols[0]};
  const ordered = validCols.slice().sort((a,b)=>Math.abs(a-3)-Math.abs(b-3));
  for(const col of ordered){
    const row = f4DropRow(grid, col);
    grid[row][col] = turnColor;
    const win = f4CheckWinAt(grid, row, col);
    let val;
    if(win) val = maximizing ? 100000+depth : -100000-depth;
    else val = f4Minimax(grid, depth-1, alpha, beta, !maximizing, me).score;
    grid[row][col] = null;
    if(maximizing){ if(val>best.score) best = {score:val, col}; alpha = Math.max(alpha, val); }
    else { if(val<best.score) best = {score:val, col}; beta = Math.min(beta, val); }
    if(beta<=alpha) break;
  }
  return best;
}
function f4BotChooseColumn(grid, myColor, depth){
  depth = depth || 6;
  return f4Minimax(grid, depth, -Infinity, Infinity, true, myColor).col;
}

function buildForza4Match(id, names, handsToWin){
  const players = names.map((name,i)=>({id:'p'+i, name, isBot:false, color: i===0?'R':'G'}));
  const handWins = {}; players.forEach(p=>handWins[p.id]=0);
  return {
    id, game:'forza4', createdAt:new Date().toISOString(),
    players, turnOrder: players.map(p=>p.id), handsToWin: handsToWin||4, dealNumber:1,
    handWins, dealHistory:[],
    grid: f4EmptyGrid(), currentId: players[0].id, phase:'playing', winLine:null, lastMove:null
  };
}
async function forza4Drop(matchId, playerId, col){
  const match = await getActiveMatch();
  if(!match || match.id!==matchId || match.phase!=='playing' || match.currentId!==playerId) return;
  const player = match.players.find(p=>p.id===playerId);
  const res = f4Drop(match.grid, col, player.color);
  if(!res) return;
  match.lastMove = {row:res.row, col, color:player.color};
  const win = f4CheckWinAt(match.grid, res.row, col);
  if(win){
    match.winLine = win;
    match.handWins[playerId] = (match.handWins[playerId]||0) + 1;
    match.dealHistory.push({dealNumber:match.dealNumber, winnerId:playerId});
    if(match.handWins[playerId] >= match.handsToWin){
      match.phase = 'ended';
      match._winnerId = playerId;
    } else {
      match.phase = 'dealEnd';
    }
  } else if(f4BoardFull(match.grid)){
    match.dealHistory.push({dealNumber:match.dealNumber, winnerId:null});
    match.phase = 'dealEnd';
    match._draw = true;
  } else {
    const idx = match.turnOrder.indexOf(playerId);
    match.currentId = match.turnOrder[(idx+1)%match.turnOrder.length];
  }
  await setActiveMatch(match);
  await render();
}
async function continueAfterForza4Deal(matchId){
  const match = await getActiveMatch();
  if(!match || match.id!==matchId || match.phase!=='dealEnd') return;
  match.dealNumber += 1;
  match.grid = f4EmptyGrid();
  match.winLine = null;
  match.lastMove = null;
  match._draw = false;
  // alterna chi comincia ad ogni mano
  const starterIdx = (match.dealNumber-1) % match.turnOrder.length;
  match.currentId = match.turnOrder[starterIdx];
  match.phase = 'playing';
  await setActiveMatch(match);
  await render();
}
async function maybeSaveForza4History(match){
  if(match.phase!=='ended' || match._historySaved) return;
  match._historySaved = true;
  const ranked = match.players.map(p=>({name:p.name, maniVinte: match.handWins[p.id]||0, isBot:p.isBot, rank: p.id===match._winnerId?1:2}));
  const historyEntry = {
    id:match.id, date:match.createdAt, endedAt:new Date().toISOString(),
    game:'forza4', dealNumber: match.dealNumber, handsToWin: match.handsToWin,
    winner: nameOf(match, match._winnerId),
    players: ranked, solo: match.players.some(p=>p.isBot)
  };
  const history = await getHistory();
  history.unshift(historyEntry);
  await saveHistory(history);
  if(myRoomId){
    try{ const list=(await getRooms()).filter(s=>s.id!==myRoomId); await saveRooms(list); }catch(e){}
  }
}
const F4_BOT_THINK_MS = 700;
async function scheduleForza4BotMove(match){
  if(!match) return;
  if(match.phase==='dealEnd'){
    const key = 'f4deal|'+match.id+'|'+match.dealNumber;
    if(botMoveKey===key) return;
    botMoveKey = key;
    if(botMoveTimer) clearTimeout(botMoveTimer);
    botMoveTimer = setTimeout(()=>{ continueAfterForza4Deal(match.id); }, 1800);
    return;
  }
  if(match.phase!=='playing') return;
  const p = match.players.find(x=>x.id===match.currentId);
  if(!p || !p.isBot) { botMoveKey=null; return; }
  const key = 'f4|'+match.id+'|'+match.dealNumber+'|'+match.currentId+'|'+match.grid.flat().filter(x=>x).length;
  if(botMoveKey===key) return;
  botMoveKey = key;
  if(botMoveTimer) clearTimeout(botMoveTimer);
  botMoveTimer = setTimeout(async ()=>{
    const cur = await getActiveMatch();
    if(!cur || cur.game!=='forza4' || cur.phase!=='playing') return;
    const bot = cur.players.find(x=>x.id===cur.currentId);
    if(!bot || !bot.isBot) return;
    const filled = cur.grid.flat().filter(x=>x).length;
    const depth = filled>28 ? 8 : (filled>16 ? 7 : 6);
    const col = f4BotChooseColumn(cur.grid, bot.color, depth);
    if(col!==null && col!==undefined) await forza4Drop(cur.id, bot.id, col);
  }, F4_BOT_THINK_MS);
}

const UNO_COLORS = ['Rosso','Giallo','Verde','Blu'];
const UNO_COLOR_HEX = {Rosso:'#D5262C', Giallo:'#F4B400', Verde:'#2E9B44', Blu:'#1568C4'};
const UNO_MAX_PLAYERS = 6;

let uno_id_counter = 0;
function buildUnoSingleDeck(){
  const deck = [];
  UNO_COLORS.forEach(color=>{
    for(let n=0;n<=9;n++) deck.push({color, kind:'number', value:n, id:'u'+(uno_id_counter++)});
    deck.push({color, kind:'reverse', id:'u'+(uno_id_counter++)});
    deck.push({color, kind:'skip', id:'u'+(uno_id_counter++)});
    deck.push({color, kind:'draw2', id:'u'+(uno_id_counter++)});
  });
  for(let i=0;i<2;i++) deck.push({color:null, kind:'wild', id:'u'+(uno_id_counter++)});
  for(let i=0;i<2;i++) deck.push({color:null, kind:'wild4', id:'u'+(uno_id_counter++)});
  return deck;
}
function buildUnoDeck(){ return [...buildUnoSingleDeck(), ...buildUnoSingleDeck()]; }

function unoCardPoints(card){
  if(card.kind==='number') return card.value;
  if(card.kind==='wild' || card.kind==='wild4') return 50;
  return 20;
}
function unoCardLabel(card){
  if(card.kind==='number') return card.value+' '+card.color;
  if(card.kind==='skip') return 'Salta Turno '+card.color;
  if(card.kind==='reverse') return 'Cambia Giro '+card.color;
  if(card.kind==='draw2') return 'Pesca 2 '+card.color;
  if(card.kind==='wild') return 'Cambia Colore';
  if(card.kind==='wild4') return 'Pesca 4';

function unoCardImageHref(card){

  if(card.kind==='wild4') return 'cards-uno/wild4.png';
  const suffix = card.kind==='number' ? card.value : card.kind;
  return `cards-uno/${card.color}-${suffix}.png`;
}
function unoCardSVG(card, w, h, dim){

  return `<svg viewBox="0 0 60 84" width="${w}" height="${h}" style="display:block;opacity:${dim?0.4:1};">
    <image href="${href}" x="0" y="0" width="60" height="84" preserveAspectRatio="xMidYMid meet"/>
  </svg>`;
}
function unoCardBackSVG(w, h){
  return `<svg viewBox="0 0 60 84" width="${w}" height="${h}" style="display:block;">
    <rect x="1" y="1" width="58" height="82" rx="8" fill="#161616" stroke="#3C5A4C" stroke-width="1.5"/>
    <ellipse cx="30" cy="42" rx="21" ry="30" fill="#D5262C" transform="rotate(-18 30 42)"/>
    <text x="30" y="48" text-anchor="middle" font-family="'Fraunces',serif" font-size="15" font-weight="800" fill="#F4B400" transform="rotate(-18 30 42)">UNO</text>
  </svg>`;
}

function unoNextIndex(match, fromIdx, steps){
  const n = match.turnOrder.length;
  let idx = fromIdx;
  for(let i=0;i<steps;i++) idx = ((idx + match.direction) % n + n) % n;
  return idx;
}

function unoDrawCards(match, playerId, n){
  const drawn = [];
  for(let i=0;i<n;i++){
    if(match.drawPile.length===0){
      if(match.discard.length<=1) break; // non c'e' altro da rimescolare
      const top = match.discard.pop();
      match.drawPile = shuffle(match.discard);
      match.discard = [top];
    }
    if(match.drawPile.length===0) break;
    const c = match.drawPile.pop();
    match.hands[playerId].push(c);
    drawn.push(c);
  }
  return drawn;
}

function unoCardPlayable(match, card){
  if(match.pendingDrawStack){
    // durante una catena di pesca in corso, l'unica risposta possibile e' un'altra
    // carta dello stesso tipo (Pesca 2 su Pesca 2, Pesca 4 su Pesca 4): qualsiasi
    // altra carta, anche se altrimenti valida, resta bloccata finche' la catena
    // non si chiude (con uno stack ulteriore o con qualcuno che pesca tutto il mazzo).
    return card.kind === match.pendingDrawStack.kind;
  }
  const top = match.discard[match.discard.length-1];
  if(card.kind==='wild' || card.kind==='wild4') return true;
  if(card.color === match.currentColor) return true;
  if(card.kind==='number' && top.kind==='number' && card.value===top.value) return true;
  if(card.kind!=='number' && card.kind===top.kind) return true;
  return false;
}

// mescola un mazzo fresco, distribuisce 7 carte a testa, e gira la prima carta
// non-azione/non-jolly per aprire gli scarti (le altre vengono rimesse nel
// mazzo di pesca, come da regole ufficiali "ignoratela e girate la successiva").
function unoFreshDeal(ids){
  const deck = shuffle(buildUnoDeck());
  const hands = {}; ids.forEach(pid=>hands[pid]=[]);
  for(let i=0;i<7;i++) ids.forEach(pid=>hands[pid].push(deck.pop()));
  let drawPile = deck, discard = [], guard = 0;
  while(drawPile.length && guard<1000){
    const c = drawPile.pop();
    if(c.kind==='number'){ discard.push(c); break; }
    drawPile.splice(Math.floor(Math.random()*(drawPile.length+1)), 0, c);
    guard++;
  }
  return { hands, drawPile, discard, currentColor: discard[0].color };
}

function buildUnoMatch(id, names, handsToWin){
  const players = names.map((name,i)=>({id:'p'+i, name, isBot:false}));
  const ids = players.map(p=>p.id);
  const dealt = unoFreshDeal(ids);
  const handWins = {}; ids.forEach(pid=>handWins[pid]=0);
  const leaderIdx = Math.floor(Math.random()*ids.length);
  return {
    id, game:'uno', createdAt:new Date().toISOString(),
    players, turnOrder: ids,
    hands: dealt.hands, drawPile: dealt.drawPile, discard: dealt.discard, currentColor: dealt.currentColor,
    direction: 1,
    currentId: ids[leaderIdx], _leaderIdx: leaderIdx,
    handsToWin: handsToWin||2, dealNumber:1, handWins, dealHistory:[],
    pendingWild: null, pendingDrawStack: null,
    unoPending: null, unoPendingSince: null, unoDeclared: {},
    pendingDrawn: null,
    lastAction: null,
    phase: 'playing'
  };
}

function unoApplyEffect(match, card, playerId){
  const ids = match.turnOrder;
  const idx = ids.indexOf(playerId);
  if(card.kind==='reverse'){
    match.direction *= -1;
    if(ids.length===2){
      match.currentId = playerId; // con 2 giocatori il Cambia Giro equivale a Salta: si rigioca
    } else {
      match.currentId = ids[unoNextIndex(match, idx, 1)];
    }
  } else if(card.kind==='skip'){
    match.currentId = ids[unoNextIndex(match, idx, 2)];
  } else {
    match.currentId = ids[unoNextIndex(match, idx, 1)];
  }
}

function finishUnoDeal(match, winnerId){
  match.handWins[winnerId] = (match.handWins[winnerId]||0) + 1;
  match.dealHistory.push({dealNumber: match.dealNumber, winnerId});
  const traguardo = match.players.find(p=>(match.handWins[p.id]||0) >= match.handsToWin);
  if(traguardo){ match.phase='ended'; match._winnerId = traguardo.id; }
  else { match.phase='dealEnd'; }
}

// per lo scarico multiplo: due carte sono "gemelle" se hanno lo stesso valore (numeriche)
// o lo stesso tipo (speciali, jolly compresi) - il colore non conta.
function unoDumpKey(card){
  if(card.kind==='number') return 'number:'+card.value;
  return card.kind;
}

async function unoPlayCard(matchId, playerId, cardId){
  const match = await getActiveMatch();
  if(!match || match.id!==matchId || match.phase!=='playing') return;
  if(match.currentId !== playerId) return;
  if(match.pendingDrawn && match.pendingDrawn.playerId===playerId && match.pendingDrawn.cardId!==cardId) return;
  const hand = match.hands[playerId];
  const idx = hand.findIndex(c=>c.id===cardId);
  if(idx<0) return;
  const card = hand[idx];
  if(!unoCardPlayable(match, card)) return;

  hand.splice(idx,1);
  cardFxThrowFromSeat(match, match.turnOrder, playerId, unoCardImageHref(card));
  match.discard.push(card);
  match.pendingDrawn = null;

  // carte "gemelle" ancora in mano (stesso valore o stesso tipo, jolly compresi): se ce
  // ne sono, offro la possibilita' di scaricarle assieme nello stesso turno prima di
  // chiudere - variante casalinga molto diffusa. Funziona anche quando si sta
  // rispondendo a una catena di Pesca 2/4 gia' aperta: unoCardPlayable garantisce gia'
  // che l'unica carta giocabile in quel caso sia dello stesso tipo della catena, quindi
  // le sue "gemelle" sono automaticamente coerenti (altri Pesca 2/4).
  const dumpKey = unoDumpKey(card);
  const gemelle = hand.filter(c=>unoDumpKey(c)===dumpKey);
  if(gemelle.length>0){
    match.pendingDump = { playerId, dumpKey, played:[card] };
    match.lastAction = { type:'play', playerId, card };
    await setActiveMatch(match);
    await render();
    return;
  }

  await unoResolveDumpAndAdvance(match, playerId, [card]);
}

// aggiunge un'altra carta gemella allo scarico in corso (senza ancora chiudere il turno)
async function unoAddToDump(matchId, playerId, cardId){
  const match = await getActiveMatch();
  if(!match || match.id!==matchId || !match.pendingDump || match.pendingDump.playerId!==playerId) return;
  const hand = match.hands[playerId];
  const idx = hand.findIndex(c=>c.id===cardId);
  if(idx<0 || unoDumpKey(hand[idx])!==match.pendingDump.dumpKey) return;
  const card = hand.splice(idx,1)[0];
  cardFxThrowFromSeat(match, match.turnOrder, playerId, unoCardImageHref(card));
  match.discard.push(card);
  match.pendingDump.played.push(card);
  match.lastAction = { type:'play', playerId, card, dumping:true };
  await setActiveMatch(match);
  await render();
}
// chiude lo scarico (anche con una sola carta giocata) e applica l'effetto complessivo
async function unoFinishDump(matchId, playerId){
  const match = await getActiveMatch();
  if(!match || match.id!==matchId || !match.pendingDump || match.pendingDump.playerId!==playerId) return;
  const played = match.pendingDump.played;
  match.pendingDump = null;
  await unoResolveDumpAndAdvance(match, playerId, played);
}
// toglie l'ultima carta aggiunta allo scarico (non la primissima, che ha gia' aperto il
// turno) e la rimette in mano: permette di correggere l'ordine se ci si e' sbagliati,
// dato che e' proprio l'ultima carta scaricata a decidere il colore finale.
async function unoUndoLastDump(matchId, playerId){
  const match = await getActiveMatch();
  if(!match || match.id!==matchId || !match.pendingDump || match.pendingDump.playerId!==playerId) return;
  if(match.pendingDump.played.length<=1) return;
  const card = match.pendingDump.played.pop();
  const top = match.discard[match.discard.length-1];
  if(top && top.id===card.id) match.discard.pop();
  match.hands[playerId].push(card);
  await setActiveMatch(match);
  await render();
}

// applica l'effetto di TUTTE le carte scaricate insieme in questo turno e passa la
// palla: le numeriche non hanno effetto oltre al colore finale; Salta Turno salta tante
// persone quante sono le carte scaricate; Cambia Giro inverte una volta per ogni carta
// dispari-conteggio (le coppie si annullano); Pesca 2/4 sommano il loro totale alla
// catena in corso (o ne aprono una nuova) in un colpo solo.
async function unoResolveDumpAndAdvance(match, playerId, cardsPlayed){
  const hand = match.hands[playerId];
  match.lastAction = { type:'play', playerId, card: cardsPlayed[cardsPlayed.length-1], dumpCount: cardsPlayed.length };

  if(hand.length===0){
    finishUnoDeal(match, playerId);
    await maybeSaveUnoHistory(match);
    await setActiveMatch(match);
    await render();
    return;
  }
  if(hand.length===1){
    if(match.unoDeclared[playerId]){
      // si era gia' dichiarato in anticipo (bottone "UNO" premuto prima di scendere
      // a una carta sola): resta al sicuro, nessuna finestra di cattura si apre.
    } else {
      match.unoPending = playerId;
      match.unoPendingSince = Date.now();
    }
  } else if(hand.length>1){
    // e' risalito sopra una carta (es. ha pescato): la dichiarazione precedente non
    // vale piu', servira' dichiararsi di nuovo se in futuro riscende a una carta sola.
    match.unoDeclared[playerId] = false;
  }

  const last = cardsPlayed[cardsPlayed.length-1];
  const count = cardsPlayed.length;
  const kind = last.kind;
  const ids = match.turnOrder;
  const myIdx = ids.indexOf(playerId);

  if(kind==='wild' || kind==='wild4'){
    const hadColorCard = kind==='wild4' ? hand.some(c=>c.color===match.currentColor) : false;
    match.pendingWild = { byId: playerId, isDraw4: kind==='wild4', hadColorCard, dumpCount: count };
    match.phase = 'chooseColor';
  } else if(kind==='draw2'){
    const targetId = ids[unoNextIndex(match, myIdx, 1)];
    match.currentColor = last.color;
    if(match.pendingDrawStack && match.pendingDrawStack.kind==='draw2'){
      match.pendingDrawStack.total += 2*count;
      match.pendingDrawStack.chainLength += 1;
      match.pendingDrawStack.targetId = targetId;
    } else {
      match.pendingDrawStack = { kind:'draw2', total:2*count, targetId, chainLength:1 };
    }
    match.currentId = targetId;
  } else if(kind==='skip'){
    match.currentColor = last.color;
    match.currentId = ids[unoNextIndex(match, myIdx, count+1)];
  } else if(kind==='reverse'){
    match.currentColor = last.color;
    if(ids.length===2){
      match.currentId = playerId;
    } else {
      if(count%2===1) match.direction *= -1;
      match.currentId = ids[unoNextIndex(match, myIdx, 1)];
    }
  } else {
    match.currentColor = last.color;
    match.currentId = ids[unoNextIndex(match, myIdx, 1)];
  }
  await setActiveMatch(match);
  await render();
}

async function unoChooseColor(matchId, playerId, color){
  const match = await getActiveMatch();
  if(!match || match.id!==matchId || match.phase!=='chooseColor' || !match.pendingWild || match.pendingWild.byId!==playerId) return;
  match.currentColor = color;
  const isDraw4 = match.pendingWild.isDraw4;
  const hadColorCard = match.pendingWild.hadColorCard;
  const dumpCount = match.pendingWild.dumpCount || 1;
  match.pendingWild = null;

  const ids = match.turnOrder;
  const idx = ids.indexOf(playerId);
  const targetId = ids[unoNextIndex(match, idx, 1)];

  if(isDraw4){
    const addAmount = 4 * dumpCount;
    if(match.pendingDrawStack && match.pendingDrawStack.kind==='wild4'){
      // e' un rilancio su una catena di Pesca 4 gia' aperta: si somma, niente sfida
      // (la sfida resta disponibile solo sul primissimo +4 della catena)
      match.pendingDrawStack.total += addAmount;
      match.pendingDrawStack.chainLength += 1;
      match.pendingDrawStack.targetId = targetId;
    } else {
      // apre una nuova catena di Pesca 4: il prossimo puo' sfidare (solo ora, essendo
      // il primo), rilanciare con un altro +4, o pescare tutto il totale
      match.pendingDrawStack = { kind:'wild4', total:addAmount, targetId, chainLength:1, byId: playerId, hadColorCard };
    }
    match.currentId = targetId;
  } else {
    match.currentId = targetId;
  }
  match.phase = 'playing';
  await setActiveMatch(match);
  await render();
}

// la sfida resta possibile solo sul primo Pesca 4 di una catena (chainLength===1):
// se qualcuno ha gia' rilanciato sopra, la sfida su quella prima carta non e' piu'
// proponibile e restano solo le due scelte di sempre (rilanciare o pescare tutto).
async function unoResolveChallenge(matchId, targetId, challenge){
  const match = await getActiveMatch();
  if(!match || match.id!==matchId || match.phase!=='playing') return;
  if(!match.pendingDrawStack || match.pendingDrawStack.kind!=='wild4') return;
  if(match.pendingDrawStack.targetId!==targetId || match.pendingDrawStack.chainLength!==1) return;
  if(!challenge){
    await unoDrawTurn(matchId, targetId); // equivale a non sfidare: pesca tutto il totale, resta il suo turno
    return;
  }
  const { byId, hadColorCard } = match.pendingDrawStack;
  const ids = match.turnOrder;
  const byIdx = ids.indexOf(byId);

  if(hadColorCard){
    unoDrawCards(match, byId, 4);
    match.lastAction = { type:'challengeSuccess', targetId, byId };
    match.pendingDrawStack = null;
    match.currentId = targetId; // sfida riuscita: il bersaglio gioca normalmente, nessuna penalita'
  } else {
    unoDrawCards(match, targetId, 6);
    match.lastAction = { type:'challengeFail', targetId, byId };
    match.pendingDrawStack = null;
    match.currentId = ids[unoNextIndex(match, byIdx, 2)];
  }
  await setActiveMatch(match);
  await render();
}

async function unoDrawTurn(matchId, playerId){
  const match = await getActiveMatch();
  if(!match || match.id!==matchId || match.phase!=='playing') return;
  if(match.currentId !== playerId || match.pendingDrawn) return;

  if(match.pendingDrawStack && match.pendingDrawStack.targetId===playerId){
    // cede alla catena: pesca tutto il totale accumulato, ma resta il suo turno (puo'
    // ancora giocare una carta valida dalla mano appena arricchita, o pescare ancora)
    const totale = match.pendingDrawStack.total;
    const kind = match.pendingDrawStack.kind;
    unoDrawCards(match, playerId, totale);
    if(match.hands[playerId].length>1) match.unoDeclared[playerId] = false;
    match.lastAction = { type:'drawStackAccept', playerId, total: totale, kind };
    match.pendingDrawStack = null;
    await setActiveMatch(match);
    await render();
    return;
  }

  const [card] = unoDrawCards(match, playerId, 1);
  if(match.hands[playerId].length>1) match.unoDeclared[playerId] = false;
  const ids = match.turnOrder, idx = ids.indexOf(playerId);
  if(!card){
    match.currentId = ids[unoNextIndex(match, idx, 1)];
    await setActiveMatch(match); await render(); return;
  }
  match.lastAction = { type:'draw', playerId, card };
  if(unoCardPlayable(match, card)){
    match.pendingDrawn = { playerId, cardId: card.id };
  } else {
    match.currentId = ids[unoNextIndex(match, idx, 1)];
  }
  await setActiveMatch(match);
  await render();
}

async function unoPassTurn(matchId, playerId){
  const match = await getActiveMatch();
  if(!match || match.id!==matchId || match.phase!=='playing') return;
  if(match.currentId !== playerId) return;
  match.pendingDrawn = null;
  const ids = match.turnOrder, idx = ids.indexOf(playerId);
  match.currentId = ids[unoNextIndex(match, idx, 1)];
  await setActiveMatch(match);
  await render();
}

const UNO_CATCH_WINDOW_START = 1000; // prima di 1s dall'essere scesi a una carta, nessuno puo' ancora beccare
const UNO_CATCH_WINDOW_END = 3000;   // dopo 3s la finestra si chiude, non si puo' piu' beccare

// il bottone "UNO" e' sempre disponibile: si puo' premere in anticipo (anche con piu' di
// una carta in mano) per mettersi al sicuro subito, o mentre si e' nella finestra di
// rischio per sfuggire a un possibile "Becca".
async function unoDeclare(matchId, playerId){
  const match = await getActiveMatch();
  if(!match || match.id!==matchId) return;
  match.unoDeclared[playerId] = true;
  if(match.unoPending===playerId){ match.unoPending=null; match.unoPendingSince=null; }
  await setActiveMatch(match);
  await render();
}
async function unoCatch(matchId, targetId){
  const match = await getActiveMatch();
  if(!match || match.id!==matchId) return;
  if(match.unoPending===targetId){
    const elapsed = Date.now() - (match.unoPendingSince||0);
    if(elapsed < UNO_CATCH_WINDOW_START || elapsed > UNO_CATCH_WINDOW_END) return;
    unoDrawCards(match, targetId, 2);
    match.unoDeclared[targetId] = false;
    match.unoPending = null;
    match.unoPendingSince = null;
    match.lastAction = { type:'unoCaught', targetId, byId: null };
  }
  await setActiveMatch(match);
  await render();
}

async function continueAfterUnoDeal(matchId){
  const match = await getActiveMatch();
  if(!match || match.id!==matchId || match.phase!=='dealEnd') return;
  match.dealNumber += 1;
  const ids = match.turnOrder;
  const dealt = unoFreshDeal(ids);
  match.hands = dealt.hands;
  match.drawPile = dealt.drawPile;
  match.discard = dealt.discard;
  match.currentColor = dealt.currentColor;
  match.direction = 1;
  match.pendingWild = null;
  match.pendingDrawStack = null;
  match.unoPending = null;
  match.unoPendingSince = null;
  match.unoDeclared = {};
  match.pendingDrawn = null;
  match.lastAction = null;
  const leaderIdx = ((match._leaderIdx ?? 0) + 1) % ids.length;
  match._leaderIdx = leaderIdx;
  match.currentId = ids[leaderIdx];
  match.phase = 'playing';
  await setActiveMatch(match);
  await render();
}

async function maybeSaveUnoHistory(match){
  if(match.phase!=='ended' || match._historySaved) return;
  match._historySaved = true;
  const ranked = [...match.players].sort((a,b)=>(match.handWins[b.id]||0)-(match.handWins[a.id]||0))
    .map((p,i)=>({name:p.name, rank:i+1, maniVinte: match.handWins[p.id]||0, isBot:p.isBot}));
  const historyEntry = {
    id:match.id, date:match.createdAt, endedAt:new Date().toISOString(),
    game:'uno', handsToWin: match.handsToWin, dealNumber: match.dealNumber,
    winner: nameOf(match, match._winnerId),
    players: ranked, solo: match.players.some(p=>p.isBot)
  };
  const history = await getHistory();
  history.unshift(historyEntry);
  await saveHistory(history);
  if(myRoomId){
    try{ const list=(await getRooms()).filter(s=>s.id!==myRoomId); await saveRooms(list); }catch(e){}
  }
}

function unoBotPickColor(match, botId){
  const hand = match.hands[botId];
  const counts = {Rosso:0,Giallo:0,Verde:0,Blu:0};
  hand.forEach(c=>{ if(c.color) counts[c.color]++; });
  let best = 'Rosso', bestN = -1;
  UNO_COLORS.forEach(col=>{ if(counts[col]>bestN){ bestN=counts[col]; best=col; } });
  return best;
}

function unoNextPlayerId(match, fromId){
  const ids = match.turnOrder;
  const idx = ids.indexOf(fromId);
  const nextIdx = ((idx + match.direction) % ids.length + ids.length) % ids.length;
  return ids[nextIdx];
}

// un giocatore che "ragiona prima di tirare": non spreca i jolly se puo' evitarlo (li
// tiene per quando servono davvero), preferisce restare bilanciato sui 4 colori invece
// di accumularne uno a caso, e quando l'avversario dopo di lui ha poche carte rimaste
// (rischio di perdere a breve) usa una carta "offensiva" per rallentarlo.
async function unoBotTakeTurn(match, botId){
  const hand = match.hands[botId];
  if(match.pendingDrawStack && match.pendingDrawStack.targetId===botId){
    // deve rispondere a una catena: rilancia se puo' (i bot rilanciano sempre quando
    // possibile, non sfidano mai), altrimenti pesca tutto il totale accumulato
    const stackCard = hand.find(c=>c.kind===match.pendingDrawStack.kind);
    if(stackCard) await unoPlayCard(match.id, botId, stackCard.id);
    else await unoDrawTurn(match.id, botId);
    return;
  }
  const playable = hand.filter(c=>unoCardPlayable(match,c));
  if(playable.length){
    const nextId = unoNextPlayerId(match, botId);
    const nextHandLen = (match.hands[nextId] || []).length;
    const nonWild = playable.filter(c=>c.kind!=='wild' && c.kind!=='wild4');
    const pool = nonWild.length ? nonWild : playable;

    let scelta = null;
    if(nextHandLen>0 && nextHandLen<=2){
      // il prossimo e' vicino a vincere: gioca una carta che lo rallenti se ce l'hai
      const offensive = pool.filter(c=>c.kind==='skip'||c.kind==='draw2'||c.kind==='reverse');
      scelta = offensive[0] || playable.find(c=>c.kind==='wild4') || null;
    }
    if(!scelta){
      // nessuna urgenza: preferisci le carte numeriche (conservi skip/draw2/jolly per
      // quando serviranno davvero), e tra quelle il colore di cui hai piu' copie, cosi'
      // la mano resta bilanciata invece di accumulare a caso un colore che poi resta li'
      const numeriche = pool.filter(c=>c.kind==='number');
      if(numeriche.length){
        const counts = {};
        hand.forEach(c=>{ if(c.color) counts[c.color] = (counts[c.color]||0)+1; });
        scelta = numeriche.reduce((a,b)=> (counts[a.color]||0)>=(counts[b.color]||0) ? a : b);
      } else {
        scelta = pool[0];
      }
    }
    await unoPlayCard(match.id, botId, scelta.id);
  } else {
    await unoDrawTurn(match.id, botId);
    const cur = await getActiveMatch();
    if(cur && cur.pendingDrawn && cur.pendingDrawn.playerId===botId){
      await unoPlayCard(cur.id, botId, cur.pendingDrawn.cardId);
    }
  }
}

let unoCatchWatchKey = null;
// i bot "vegliano" sul rischio UNO indipendentemente da chi ha il turno: ognuno, quando
// vede un avversario scendere a una carta sola senza dichiararsi, decide con un proprio
// tempo di reazione casuale (sempre dentro la finestra valida 1-3s) se beccarlo.
function scheduleUnoCatchWatchers(match){
  if(!match.unoPending){ unoCatchWatchKey = null; return; }
  const targetId = match.unoPending;
  const since = match.unoPendingSince || 0;
  const key = 'unoWatch|'+match.id+'|'+targetId+'|'+since;
  if(unoCatchWatchKey===key) return;
  unoCatchWatchKey = key;
  const catchers = match.players.filter(p=>p.isBot && p.id!==targetId);
  catchers.forEach(bot=>{
    const delay = UNO_CATCH_WINDOW_START + Math.random()*(UNO_CATCH_WINDOW_END - UNO_CATCH_WINDOW_START - 200);
    setTimeout(async ()=>{
      const cur = await getActiveMatch();
      if(!cur || cur.game!=='uno' || cur.id!==match.id) return;
      if(cur.unoPending===targetId && (cur.unoPendingSince||0)===since){
        cur.lastAction = { type:'unoCaught', targetId, byId: bot.id };
        await unoCatch(cur.id, targetId);
      }
    }, delay);
  });
}

const UNO_BOT_THINK_MS = 900;
async function scheduleUnoBotMove(match){
  if(!match || match.phase==='ended' || match.phase==='dealEnd') return;
  scheduleUnoCatchWatchers(match);
  let actor = null, kind = null;
  if(match.pendingDump){
    const p = match.players.find(x=>x.id===match.pendingDump.playerId);
    if(p && p.isBot){ actor = p.id; kind='dump'; }
  } else if(match.phase==='chooseColor' && match.pendingWild){
    const p = match.players.find(x=>x.id===match.pendingWild.byId);
    if(p && p.isBot){ actor = p.id; kind='chooseColor'; }
  } else if(match.phase==='playing'){
    const p = match.players.find(x=>x.id===match.currentId);
    if(p && p.isBot){ actor = p.id; kind='turn'; }
  }
  if(!actor){ botMoveKey=null; return; }

  const key = 'uno|'+match.id+'|'+kind+'|'+actor+'|'+(match.hands[actor]?match.hands[actor].length:0)+'|'+match.discard.length+'|'+match.drawPile.length+'|'+(match.pendingDrawStack?match.pendingDrawStack.total:0)+'|'+(match.pendingDump?match.pendingDump.played.length:0);
  if(botMoveKey===key) return;
  botMoveKey = key;
  if(botMoveTimer) clearTimeout(botMoveTimer);
  botMoveTimer = setTimeout(async ()=>{
    const cur = await getActiveMatch();
    if(!cur || cur.game!=='uno') return;
    // se e' lui stesso rimasto con una carta sola senza essersi ancora dichiarato, lo fa
    // ora prima di procedere (la cattura da parte degli avversari e' gestita a parte,
    // dal watcher indipendente qui sopra, che rispetta sempre la finestra 1-3s).
    if(cur.unoPending===actor){
      cur.unoDeclared[actor] = true;
      cur.unoPending = null;
      cur.unoPendingSince = null;
      await setActiveMatch(cur);
      await render();
    }

    if(kind==='dump'){
      // i bot scaricano sempre tutte le gemelle disponibili: liberarsi di carte
      // e' quasi sempre conveniente in UNO, non c'e' motivo di trattenerle.
      if(cur.pendingDump && cur.pendingDump.playerId===actor){
        const dumpKey = cur.pendingDump.dumpKey;
        let c2 = cur;
        while(c2 && c2.pendingDump && c2.pendingDump.playerId===actor){
          const hand = c2.hands[actor] || [];
          const gemella = hand.find(c=>unoDumpKey(c)===dumpKey);
          if(!gemella) break;
          await unoAddToDump(c2.id, actor, gemella.id);
          c2 = await getActiveMatch();
        }
        if(c2 && c2.pendingDump && c2.pendingDump.playerId===actor){
          await unoFinishDump(c2.id, actor);
        }
      }
    } else if(kind==='chooseColor'){
      if(cur.phase==='chooseColor' && cur.pendingWild && cur.pendingWild.byId===actor){
        await unoChooseColor(cur.id, actor, unoBotPickColor(cur, actor));
      }
    } else if(cur.phase==='playing' && cur.currentId===actor){
      const p = cur.players.find(x=>x.id===actor);
      if(p && p.isBot) await unoBotTakeTurn(cur, actor);
    }
  }, UNO_BOT_THINK_MS);
}

function unoScoreBar(match){
  const chips = match.players.map(p=>`
    <div class="score-chip">
      <span>${esc(p.name)}</span>
      <span class="score-num">${match.handWins[p.id]||0}</span>
    </div>`).join('');
  return `<div class="score-bar">${chips}<div class="score-chip target">prima a ${match.handsToWin} mani</div></div>`;
}

function unoLastActionText(match){
  const a = match.lastAction;
  if(!a) return '';
  if(a.type==='play'){
    const count = a.dumpCount || 1;
    let txt = count>1
      ? `${esc(nameOf(match,a.playerId))} scarica ${count} carte, l'ultima <b>${esc(unoCardLabel(a.card))}</b>`
      : `${esc(nameOf(match,a.playerId))} ha giocato <b>${esc(unoCardLabel(a.card))}</b>`;
    if(a.card.kind==='draw2') txt += count>1 ? ` — ${2*count} carte da pescare in catena` : ' — si apre una catena di Pesca 2';
    if(a.card.kind==='skip') txt += count>1 ? ` — salta ${count} giocatori` : ' — salta il turno del prossimo';
    if(a.card.kind==='reverse') txt += ' — il senso di gioco si inverte'+(count>1?' (x'+count+')':'');
    return txt;
  }
  if(a.type==='draw') return `${esc(nameOf(match,a.playerId))} pesca una carta`;
  if(a.type==='drawStackAccept') return `${esc(nameOf(match,a.playerId))} pesca ${a.total} cart${a.total===1?'a':'e'} e tocca ancora a lui`;
  if(a.type==='challengeSuccess') return `Sfida riuscita! <b>${esc(nameOf(match,a.byId))}</b> pesca 4 carte, <b>${esc(nameOf(match,a.targetId))}</b> gioca normalmente`;
  if(a.type==='challengeFail') return `Sfida fallita! <b>${esc(nameOf(match,a.targetId))}</b> pesca 6 carte e salta il turno`;
  if(a.type==='unoCaught') return `${a.byId?esc(nameOf(match,a.byId))+' si accorge che ':''}<b>${esc(nameOf(match,a.targetId))}</b> non ha detto UNO! Pesca 2 carte di penalità`;
  return '';
}

function unoTableSVG(match, myId){
  const ids = rotateIdsForMe(match.turnOrder, myId);
  const n = ids.length;
  const C = tableConfig(n);
  const VB = C.VB, fs = C.fs;
  const cx = VB/2, cy = VB/2, half = C.half, avatarR = C.avatarR;
  const layout = rectSeatLayout(half, half, n);

  let seats = '';
  ids.forEach((pid,i)=>{
    const {x:relX, y:relY} = layout[i];
    const x = cx+relX, y = cy+relY;
    const player = match.players.find(p=>p.id===pid);
    const cardsLeft = (match.hands[pid]||[]).length;
    const isTurn = pid===match.currentId;
    const isMe = pid===myId;
    const isUnoRisk = match.unoPending===pid;

    const displayDirY = relY>=0 ? 1 : -1;
    const nameY = y + displayDirY*(avatarR + 26*fs);
    let nm = player.name.length>10 ? player.name.slice(0,9)+'…' : player.name;
    const label = esc(nm) + (isMe?' (tu)':(player.isBot?' ᴀɪ':'')) + (isUnoRisk?' ⚠️':'');
    const pillW = Math.max(52*fs, label.length*7*fs + 16);
    const lx = Math.max(pillW/2+3, Math.min(VB-pillW/2-3, x));
    const ly = nameY;

    seats += `
      <g>
        ${isTurn?`<circle class="turn-ring" cx="${x}" cy="${y}" r="${avatarR+5}" fill="none" stroke="#D4AF6A" stroke-width="2"/>`:''}
        <circle cx="${x}" cy="${y}" r="${avatarR}" fill="${isTurn?'#2C4C3E':(isMe?'#4A2A28':'#223B32')}" stroke="${isTurn?'#D4AF6A':(isMe?'#D98878':'#3C5A4C')}" stroke-width="${isTurn?2.4:1.8}"/>
        <rect x="${x-9*fs}" y="${y-13*fs}" width="${18*fs}" height="${26*fs}" rx="3" fill="#161616" stroke="${isUnoRisk?'#D5262C':'#8C7647'}" stroke-width="${isUnoRisk?2:1}"/>
        <circle cx="${x+9*fs}" cy="${y+10*fs}" r="${7.5*fs}" fill="#16261F" stroke="#D4AF6A" stroke-width="1"/>
        <text x="${x+9*fs}" y="${y+13.5*fs}" text-anchor="middle" font-family="'IBM Plex Mono',monospace" font-size="${9.5*fs}" font-weight="700" fill="#D4AF6A">${cardsLeft}</text>
        <rect x="${lx-pillW/2}" y="${ly-11*fs}" width="${pillW}" height="${19*fs}" rx="${9.5*fs}" fill="rgba(10,20,16,0.92)" stroke="${isTurn?'#D4AF6A':'#3C5A4C'}" stroke-width="1"/>
        <text x="${lx}" y="${ly+3*fs}" text-anchor="middle" font-family="'Fraunces',serif" font-size="${12.5*fs}" font-weight="700" fill="${isTurn?'#D4AF6A':'#F1ECE1'}">${label}</text>
      </g>`;
  });

  const top = match.discard[match.discard.length-1];
  const cW = 26*fs, cH = 54*fs;
  const gap = 20*fs;
  const dirArrow = match.direction===1 ? '↻' : '↺';
  const colorDot = UNO_COLOR_HEX[match.currentColor] || '#888';
  const centerSvg = `
    <g transform="translate(${cx-gap},${cy-6*fs})">${unoCardBackSVGInline(cW,cH)}</g>
    <text x="${cx-gap}" y="${cy-6*fs+cH/2+14*fs}" text-anchor="middle" font-family="'IBM Plex Mono',monospace" font-size="${8*fs}" fill="#B9C4BC">${match.drawPile.length} nel mazzo</text>
    <g transform="translate(${cx+gap},${cy-6*fs})">
      <rect x="${-cW/2-1}" y="${-cH/2-1}" width="${cW+2}" height="${cH+2}" rx="4" fill="#F1ECE1" stroke="#8C7647" stroke-width="0.8"/>
      ${unoCardSVGInline(top, cW, cH)}
    </g>
    <text x="${cx}" y="${cy-32*fs}" text-anchor="middle" font-size="${15*fs}">${dirArrow}</text>
    <circle cx="${cx}" cy="${cy+30*fs}" r="${6*fs}" fill="${colorDot}" stroke="#16261F" stroke-width="1.5"/>
  `;

  const tableDefs = `
    <defs>
      <linearGradient id="feltGrad6" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#274539"/><stop offset="60%" stop-color="#1D3730"/><stop offset="100%" stop-color="#132520"/>
      </linearGradient>
      <linearGradient id="centerGrad6" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#28483B"/><stop offset="100%" stop-color="#1B322A"/>
      </linearGradient>
    </defs>`;
  const outerPad = 30*fs, feltR = 20*fs, centerR = 14*fs;
  const centerHalf = C.centerHalf*fs;
  const curIdx = ids.indexOf(match.currentId);
  const nextIdx = curIdx>=0 ? ((curIdx + match.direction) % n + n) % n : -1;
  const flowArrowSvg = turnFlowArrowSVG(layout, curIdx, nextIdx, cx, cy, fs, avatarR, centerHalf);
  return `
    <div class="table-wrap">
      <svg viewBox="0 0 ${VB} ${VB}" width="100%" style="max-width:420px;aspect-ratio:1/1;display:block;height:auto;">
        ${tableDefs}
        <rect x="${cx-half-outerPad}" y="${cy-half-outerPad}" width="${2*(half+outerPad)}" height="${2*(half+outerPad)}" rx="${feltR}" fill="url(#feltGrad6)" stroke="#4A6B5B" stroke-width="2"/>
        <rect x="${cx-centerHalf}" y="${cy-centerHalf}" width="${2*centerHalf}" height="${2*centerHalf}" rx="${centerR}" fill="url(#centerGrad6)" stroke="#3C5A4C" stroke-width="1.2"/>
        ${centerSvg}
        ${seats}
        ${flowArrowSvg}
      </svg>
    </div>`;
}
// versioni "inline" (senza il proprio tag <svg>) per essere incorporate dentro renderCavaCamisaTableSVG-style di sopra
function unoCardBackSVGInline(w,h){
  return `<rect x="${-w/2-1}" y="${-h/2-1}" width="${w+2}" height="${h+2}" rx="4" fill="#161616" stroke="#8C7647" stroke-width="1"/>
    <ellipse cx="0" cy="0" rx="${w*0.36}" ry="${h*0.4}" fill="#D5262C"/>
    <text x="0" y="4" text-anchor="middle" font-family="'Fraunces',serif" font-size="${Math.max(8,w*0.28)}" font-weight="800" fill="#F4B400">UNO</text>`;
}
function unoCardSVGInline(card, w, h){
  const href = unoCardImageHref(card);
  return `<image href="${href}" x="${-w/2}" y="${-h/2}" width="${w}" height="${h}" preserveAspectRatio="xMidYMid meet"/>`;
}

function renderUnoHand(match, myId){
  const hand = match.hands[myId] || [];
  const dumping = match.pendingDump && match.pendingDump.playerId===myId;
  const cards = hand.map(c=>{
    let playable, onclick;
    if(dumping){
      playable = unoDumpKey(c)===match.pendingDump.dumpKey;
      onclick = playable ? `unoAddToDump('${match.id}','${myId}','${c.id}')` : '';
    } else {
      playable = match.phase==='playing' && match.currentId===myId && !match.pendingDrawn && unoCardPlayable(match, c);
      onclick = playable ? `unoPlayCard('${match.id}','${myId}','${c.id}')` : '';
    }
    const style = playable
      ? 'cursor:pointer;box-shadow:0 0 0 2px #D4AF6A;'
      : 'opacity:0.55;cursor:default;';
    return `<div class="hand-card" style="${style}border-radius:6px;" ${onclick?`onclick="${onclick}"`:''}>${unoCardSVG(c, 44, 62)}</div>`;
  }).join('');
  return `<div class="hand-grid6" style="margin-top:10px;">${cards}</div>`;
}

function renderUnoMatch(match, claim){
  const revealAll = claim.type==='all';
  const myId = claim.type==='seat' ? claim.playerId : null;
  if(match.phase==='ended') return renderUnoEnd(match, myId);

  if(myId && match.phase!=='dealEnd'){
    const dealKey = 'uno|'+match.id+'|'+(match.dealNumber||1);
    if(!(dealKey in dealTableAnimState)){
      dealTableAnimState[dealKey] = 'started';
      const names = match.turnOrder.map(id=>nameOf(match,id));
      cardFxDealTable(names, match.turnOrder.indexOf(myId), match.hands[myId] ? match.hands[myId].length : 7, {
        onDone: ()=>{ dealTableAnimState[dealKey]='done'; lastRenderKey=null; render(true); }
      });
    }
    if(dealTableAnimState[dealKey]==='started') return dealWaitingScreenHTML('UNO · '+esc(nameOf(match,myId)));
  }

  if(match.phase==='dealEnd'){
    const ultima = match.dealHistory[match.dealHistory.length-1];
    const perdentiIds = match.players.map(p=>p.id).filter(id=>id!==ultima.winnerId);
    maybeShowLoserPopup(match.id, 'uno-deal-'+ultima.dealNumber, myId, perdentiIds);
    return `
      <div class="card">
        <div class="toolbar">
          <span>${hudAvatar(revealAll?'?':esc(nameOf(match,myId)))}UNO · ${revealAll?'tutti visibili':esc(nameOf(match,myId))}</span>
          <button class="btn-danger btn-small" onclick="abandonMatch()">Abbandona</button>
        </div>
        ${unoScoreBar(match)}
        <div class="deal-end-banner">
          <h3>Fine mano ${ultima.dealNumber} — vince ${esc(nameOf(match,ultima.winnerId))}</h3>
          <button class="btn-primary" style="margin-top:10px;width:100%;" onclick="continueAfterUnoDeal('${match.id}')">Prossima mano</button>
        </div>
      </div>`;
  }

  const isMyTurnPlaying = match.phase==='playing' && (revealAll || match.currentId===myId);
  const stack = match.pendingDrawStack;
  const stackWaitingForMe = stack && (revealAll || stack.targetId===myId);
  const dump = match.pendingDump;
  const dumpForMe = dump && (revealAll || dump.playerId===myId);
  const turnBanner = `<div class="turn-bar ${isMyTurnPlaying?'mine':''}">${
    dump ? (dumpForMe ? 'Hai altre carte uguali? Aggiungile o tocca "Continua"' : esc(nameOf(match,dump.playerId))+' sta scaricando altre carte uguali…')
    : match.phase==='chooseColor' ? (esc(nameOf(match,match.pendingWild.byId))+' sceglie il colore…')
    : stack ? ('Tocca a <b>'+esc(nameOf(match,stack.targetId))+'</b>: rilanciare con un altro '+(stack.kind==='draw2'?'Pesca 2':'Pesca 4')+' o pescare '+stack.total+'?')
    : isMyTurnPlaying ? (revealAll ? 'Tocca a <b>'+esc(nameOf(match,match.currentId))+'</b>' : '► TOCCA A TE')
    : 'Tocca a <b>'+esc(nameOf(match,match.currentId))+'</b> — aspetta <button class="refresh-mini" onclick="forceResync()" title="Aggiorna">⟳</button>'
  }</div>`;

  const actionBanner = match.lastAction ? `<div class="turn-banner">${unoLastActionText(match)}</div>` : '';

  const tableSvg = unoTableSVG(match, myId);

  // pannello di scarico multiplo: appare subito dopo aver giocato una carta se ne
  // restano altre uguali (stesso valore o stesso tipo) in mano, con un pulsante per
  // chiudere lo scarico e passare il turno con l'effetto complessivo di tutte le carte
  // buttate insieme.
  let dumpPanel = '';
  if(dumpForMe){
    const count = dump.played.length;
    const sequenza = dump.played.map((c,i)=>{
      const isLast = i===count-1;
      return `<span style="display:inline-block;${isLast?'box-shadow:0 0 0 2px #D4AF6A;border-radius:6px;':''}">${unoCardSVG(c, 34, 48)}</span>`;
    }).join('<span style="align-self:center;color:#8AA396;font-size:11px;">→</span>');
    dumpPanel = `
      <div class="turn-banner" style="border-color:#D4AF6A;">
        Hai scaricato ${count} cart${count===1?'a':'e'} finora, nell'ordine che hai scelto tu — l'ultima (evidenziata) decide il colore con cui si continua.
      </div>
      <div style="display:flex;align-items:center;gap:4px;flex-wrap:wrap;margin:8px 0;">${sequenza}</div>
      <div class="row-btns" style="margin-bottom:10px;">
        ${count>1?`<button class="btn-secondary" onclick="unoUndoLastDump('${match.id}','${dump.playerId}')">Annulla l'ultima</button>`:''}
        <button class="btn-primary" style="flex:1;" onclick="unoFinishDump('${match.id}','${dump.playerId}')">Continua (${count} cart${count===1?'a':'e'})</button>
      </div>`;
  }

  // pannello scelta colore
  let colorPanel = '';
  if(match.phase==='chooseColor' && (revealAll || match.pendingWild.byId===myId)){
    const btns = UNO_COLORS.map(c=>`<button class="btn-primary" style="background:${UNO_COLOR_HEX[c]};flex:1;" onclick="unoChooseColor('${match.id}','${match.pendingWild.byId}','${c}')">${c}</button>`).join('');
    colorPanel = `<div class="row-btns" style="margin-bottom:12px;flex-wrap:wrap;">${btns}</div>`;
  }

  // pannello di risposta a una catena di pesca in corso: la sfida (solo Pesca 4, e solo
  // se nessuno ha ancora rilanciato) resta un pulsante a parte; il rilancio avviene
  // semplicemente cliccando la carta giusta nella mano (gia' evidenziata da unoCardPlayable).
  let challengePanel = '';
  if(stackWaitingForMe){
    const canChallenge = stack.kind==='wild4' && stack.chainLength===1;
    challengePanel = `
      <div class="row-btns" style="margin-bottom:12px;">
        <button class="btn-secondary" onclick="unoDrawTurn('${match.id}','${stack.targetId}')">Pesca ${stack.total}</button>
        ${canChallenge?`<button class="btn-danger" onclick="unoResolveChallenge('${match.id}','${stack.targetId}',true)">Sfida!</button>`:''}
      </div>`;
  }

  // dichiarazione/cattura UNO
  // bottone "UNO" piccolo, sempre disponibile (anche con piu' di una carta in mano):
  // ci si puo' dichiarare in anticipo per mettersi al sicuro subito.
  const iAmSafe = myId && match.unoDeclared[myId];
  const unoBtnSmall = (myId && match.phase==='playing') ? `
    <div style="display:flex;justify-content:flex-end;margin:6px 0;">
      <button class="btn-secondary btn-small" style="${iAmSafe?'opacity:0.5;':''}background:#D5262C;color:#fff;border-color:#D5262C;padding:4px 14px;font-size:12px;" onclick="unoDeclare('${match.id}','${myId}')">UNO</button>
    </div>` : '';

  // pannello di rischio/cattura: appare solo per gli AVVERSARI di chi e' sceso a una
  // carta sola senza dichiararsi, e solo dentro la finestra valida (tra 1 e 3 secondi
  // da quando e' scattato il rischio) - prima e' troppo presto, dopo non si puo' piu'.
  let unoPanel = '';
  if(match.unoPending && match.phase==='playing' && (revealAll || match.unoPending!==myId)){
    const elapsed = Date.now() - (match.unoPendingSince||0);
    unoEnsureCatchTicker(match.unoPendingSince);
    if(elapsed >= UNO_CATCH_WINDOW_START && elapsed <= UNO_CATCH_WINDOW_END){
      unoPanel = `<button class="btn-secondary" style="width:100%;margin-bottom:10px;" onclick="unoCatch('${match.id}','${match.unoPending}')">Becca ${esc(nameOf(match,match.unoPending))}! Non ha detto UNO</button>`;
    }
  } else {
    unoCatchTicker && clearInterval(unoCatchTicker);
    unoCatchTicker = null;
  }

  // carta appena pescata: gioca o passa
  let drawnPanel = '';
  const drawnForMe = match.pendingDrawn && (revealAll || match.pendingDrawn.playerId===myId);
  if(drawnForMe){
    const c = match.hands[match.pendingDrawn.playerId].find(x=>x.id===match.pendingDrawn.cardId);
    drawnPanel = `
      <div style="display:flex;align-items:center;gap:10px;margin:10px 0;padding:8px 10px;background:rgba(212,175,106,0.08);border:1px solid #8C7647;border-radius:8px;">
        <span style="font-size:11px;color:var(--cream-dim);flex-shrink:0;">Hai pescato:</span>
        ${c?unoCardSVG(c,40,56):''}
        <div class="row-btns" style="flex:1;margin:0;">
          <button class="btn-primary btn-small" onclick="unoPlayCard('${match.id}','${match.pendingDrawn.playerId}','${match.pendingDrawn.cardId}')">Giocala</button>
          <button class="btn-secondary btn-small" onclick="unoPassTurn('${match.id}','${match.pendingDrawn.playerId}')">Passa</button>
        </div>
      </div>`;
  }

  const canDraw = match.phase==='playing' && isMyTurnPlaying && !match.pendingDrawn && !stack && !dump;
  const drawBtn = canDraw ? `<button class="btn-secondary" style="width:100%;margin-bottom:10px;" onclick="unoDrawTurn('${match.id}','${match.currentId}')">Pesca una carta</button>` : '';

  const displayOwner = revealAll ? match.currentId : myId;
  const handHtml = displayOwner ? renderUnoHand(match, displayOwner) : '';
  const handCount = displayOwner ? (match.hands[displayOwner]||[]).length : 0;

  return `
    <div class="card">
      <div class="toolbar">
        <span>${hudAvatar(revealAll?'?':esc(nameOf(match,myId)))}UNO · ${revealAll?'tutti visibili':esc(nameOf(match,myId))}</span>
        <button class="btn-danger btn-small" onclick="abandonMatch()">Abbandona</button>
      </div>
      ${unoScoreBar(match)}
      ${turnBanner}
      ${actionBanner}
      ${tableSvg}

function renderRoundEndBanner(match, myId){

  const rows = ultima.entries.map(e=>{
    const persaVita = e.delta>0;

function renderMatch(match, claim){
  const cards = SEQ[match.roundIndex % SEQ.length];
  const revealAll = claim.type==='all';
  const myId = claim.type==='seat' ? claim.playerId : null;
  const myLabel = revealAll ? 'tutti visibili' : esc(nameOf(match,myId));

  if(myId && match.phase!=='roundEnd' && match.phase!=='ended'){
    const dealKey = 'bisca|'+match.id+'|'+match.roundIndex;
    if(!(dealKey in dealTableAnimState)){
      dealTableAnimState[dealKey] = 'started';
      const ids = match.players.map(p=>p.id);
      const names = ids.map(id=>nameOf(match,id));
      cardFxDealTable(names, ids.indexOf(myId), cards, {
        onDone: ()=>{ dealTableAnimState[dealKey]='done'; lastRenderKey=null; render(true); }
      });
    }
    if(dealTableAnimState[dealKey]==='started') return dealWaitingScreenHTML('Bisca · '+myLabel);
  }

  if(match.phase==='roundEnd'){
    return `
      <div class="card">
        <div class="toolbar">
          <span>${hudAvatar(myLabel)}Sei: ${myLabel}</span>
          <button class="btn-danger btn-small" onclick="abandonMatch()">Abbandona</button>
        </div>
        ${renderRoundEndBanner(match, myId)}
      </div>
      ${renderLog(match)}
    `;
  }

  let body = match.phase==='predict' ? renderPredict(match, cards, revealAll, myId) : renderPlay(match, cards, revealAll, myId);

  // --- chi ha il turno adesso, detto in modo inequivocabile
  const turnId = match.phase==='play'
    ? (match.trick && match.trick.resolved ? null : match.trick.turnOrder[match.trick.plays.length])
    : match.turnOrder.find(id=>match.previsioni[id]===undefined);
  let turnBar = '';
  if(turnId){
    const isMine = revealAll || turnId===myId;
    turnBar = `<div class="turn-bar ${isMine?'mine':''}">${isMine
      ? (revealAll ? 'Tocca a <b>'+esc(nameOf(match,turnId))+'</b>' : '► TOCCA A TE')
      : 'Sta giocando <b>'+esc(nameOf(match,turnId))+'</b> — aspetta <button class="refresh-mini" onclick="forceResync()" title="Aggiorna">⟳</button>'}</div>`;
  }

  // --- avviso onesto quando le nostre mosse non stanno arrivando agli altri
  const syncWarn = syncDiverged ? `
    <div class="desync-warn">
      <b>Attenzione:</b> le tue mosse non stanno arrivando agli altri dispositivi.
      Voi due state vedendo due partite diverse.
      <div class="row-btns" style="margin-top:8px;">
        <button class="btn-secondary btn-small" onclick="forceResync()">Riallinea alla partita degli altri</button>
        <button class="btn-secondary btn-small" onclick="openShareFromMatch()">Codice partita</button>
      </div>
    </div>` : '';

  return `
    <div class="card">
      <div class="toolbar">
        <span>${hudAvatar(myLabel)}Sei: ${myLabel}</span>
        <div class="row-btns" style="flex:0;gap:6px;">
          <button class="btn-secondary btn-small" onclick="changeSeat('${match.id}')">Cambia</button>
          <button class="btn-danger btn-small" onclick="abandonMatch()">Abbandona</button>
        </div>
      </div>
      ${syncWarn}
      ${turnBar}
      ${renderTableSVG(match, cards, revealAll, myId)}
      ${body}
    </div>
    ${renderLog(match)}
  `;
}
function openShareFromMatch(){
  // mostra il pannello di condivisione anche durante la partita (di norma nascosto in modalita compatta)
  document.body.classList.add('force-share');
  const p = document.getElementById('code-panel');
  if(p) p.style.display = 'block';
  const el = document.getElementById('sync-panel');
  if(el) el.scrollIntoView({behavior:'smooth', block:'center'});
}

function renderHandsBlock(match, cards, revealAll, myId, opts){
  const forehead = cards===1;
  const turnId = opts && opts.turnId;
  const interactive = !!(opts && opts.interactive);
  return match.roundActive.map(pid=>{
    const isMe = pid===myId;
    const isTurn = !!turnId && pid===turnId;
    const hidden = !revealAll && (forehead ? isMe : !isMe);
    const player = match.players.find(p=>p.id===pid);
    const previsione = match.previsioni ? match.previsioni[pid] : undefined;
    const preseFatte = (match.tricksWon && match.tricksWon[pid]) || 0;
    const fraction = previsione!==undefined ? `<span class="trick-fraction">${preseFatte}/${previsione}</span>` : '';

    if(hidden && !isMe){
      // avversario a mano nascosta: riga compatta senza le carte (gia rappresentate sul tavolo), ma con nome/previsione/vite ben visibili
      return `
        <div class="hand-block compact">
          <div class="hand-block-head">
            <span>${esc(player.name)}${player.isBot?' 🤖':''}${fraction} ${isTurn?'<b>· tocca a lui/lei</b>':''}</span>
            <span class="lives-dots">${livesDots(player.lives, match.startingLives)}</span>
          </div>
        </div>`;
    }
    const hand = match.hands[pid];

    let cardsHtml;
    if(hidden){
      cardsHtml = `<div class="hand">${hand.map(()=>`<span class="hand-card hidden-card">${cardBackSVG()}</span>`).join('')}</div>`;
      if(interactive && forehead && isMe && isTurn && hand.length===1){
        cardsHtml += `<button class="btn-primary mystery-btn" style="margin-top:8px;" onclick="playCard('${match.id}','${pid}','${hand[0].id}')">Gioca la tua carta misteriosa</button>`;
      }
    } else {
      const sorted = [...hand].sort((a,b)=> a.si-b.si || a.ri-b.ri);
      const clickable = interactive && (revealAll || isMe) && isTurn;
      cardsHtml = `<div class="hand">${sorted.map(c=>
        clickable
          ? (isAssoDenari(c)
              ? `<button class="hand-card ${SUIT_CLASS[c.suit]}" title="${cardLabel(c)}" onclick="chooseAceValue('${match.id}','${pid}','${c.id}')">${cardFrontSVG(c)}</button>`
              : `<button class="hand-card ${SUIT_CLASS[c.suit]}" title="${cardLabel(c)}" onclick="playCard('${match.id}','${pid}','${c.id}')">${cardFrontSVG(c)}</button>`)
          : `<span class="hand-card ${SUIT_CLASS[c.suit]} disabled" title="${cardLabel(c)}">${cardFrontSVG(c)}</span>`
      ).join('')}</div>`;
    }

    return `
      <div class="hand-block">
        <div class="hand-block-head">
          <span>${esc(nameOf(match,pid))}${player.isBot?' 🤖':''}${fraction} ${isTurn?'<b>· tocca a lui/lei</b>':''}</span>
          <span class="lives-dots">${livesDots(player.lives, match.startingLives)}</span>
        </div>
        ${cardsHtml}
      </div>`;
  }).join('');
}

function renderPredict(match, cards, revealAll, myId){
  const target = match.turnOrder.find(id => match.previsioni[id]===undefined);
  const already = match.turnOrder.filter(id=>match.previsioni[id]!==undefined)
    .map(id=>`<div class="player-row"><div class="player-name">${esc(nameOf(match,id))}</div><div style="text-align:right;font-family:'IBM Plex Mono',monospace;">${match.previsioni[id]}</div></div>`).join('');

  const canAct = revealAll || target===myId;
  const forehead = cards===1;

  const vietato = numeroVietato(match, target, cards);
  const buttons = Array.from({length: cards+1}, (_,v)=>v)
    .map(v=> v===vietato
      ? `<button class="btn-secondary predict-btn" disabled title="Non puoi far pareggiare tutti">${v}</button>`
      : `<button class="btn-secondary predict-btn" onclick="declarePrevisione('${match.id}','${target}',${v},${cards})">${v}</button>`)
    .join('');

  const inputBlock = canAct ? `
    <div class="turn-banner">Tocca a <b>${esc(nameOf(match,target))}</b> dichiarare.</div>
    ${forehead && !revealAll ? '<div class="forehead-note">Mano da 1 carta: non conosci la tua carta, dichiara alla cieca.</div>' : ''}
    ${vietato!==null ? `<div class="forehead-note">Sei l'ultimo a dichiarare: non puoi scegliere ${vietato}, farebbe pareggiare esattamente le carte in gioco.</div>` : ''}
    <div class="predict-btn-row">${buttons}</div>
  ` : `<div class="waiting-banner">In attesa che <b>${esc(nameOf(match,target))}</b> dichiari...</div>`;

  return `
    <div class="round-banner"><span class="round-badge">Mano ${match.roundIndex+1} · ${cards} cart${cards===1?'a':'e'}</span></div>
    <h2 style="margin-top:0;">La tua mano</h2>
    ${renderHandsBlock(match, cards, revealAll, myId, {interactive:false, turnId:null})}
    <h2>Previsioni</h2>
    <p class="hint">Si dichiara in ordine, a partire da chi apre questa mano a rotazione. Guarda la tua mano qui sopra prima di dichiarare.</p>
    ${already}
    ${inputBlock}
  `;
}

function renderPlay(match, cards, revealAll, myId){
  const trick = match.trick;
  const resolved = !!trick.resolved;
  const turnId = resolved ? null : trick.turnOrder[trick.plays.length];
  const forehead = cards===1;

  const continueBlock = resolved ? `
    <div class="turn-banner">Presa vinta da <b>${esc(nameOf(match,trick.winnerId))}</b>.</div>
    <button class="btn-primary" onclick="continueAfterTrick('${match.id}')">${trick.roundDoneNext ? 'Vedi il risultato della mano' : 'Prossima presa'}</button>
  ` : '';

  const aceChoiceBlock = (pendingAceChoice && pendingAceChoice.matchId===match.id) ? `
    <div class="turn-banner">Asso di Denari: che valore gli dai?</div>
    <div class="row-btns">
      <button class="btn-secondary" onclick="confirmAceValue('basso')">Meno dell'Asso di Bastoni</button>
      <button class="btn-secondary" onclick="confirmAceValue('alto')">Più del Re di Denari</button>
    </div>
    <button class="btn-danger btn-small" style="margin-top:8px;" onclick="cancelAceChoice()">Annulla</button>
  ` : '';

  const hands = renderHandsBlock(match, cards, revealAll, myId, {interactive:true, turnId});

  return `
    <div class="round-banner"><span class="round-badge">Mano ${match.roundIndex+1} · ${cards} cart${cards===1?'a':'e'} · presa ${trick.plays.length? 'in corso':'nuova'}</span></div>
    ${forehead ? '<div class="forehead-note">Mano da 1 carta: vedi le carte degli altri ma non la tua.</div>' : ''}
    ${continueBlock}
    ${aceChoiceBlock}
    ${hands}
  `;
}

  if(!match.log || match.log.length===0) return '';
  const rounds = match.log.slice().reverse().map(r=>`
    <div class="log-round">
      <div class="log-round-title">Mano ${r.round} · ${r.cards} carte</div>

        <div class="log-entry">

          <span>prev ${e.previsione}</span>
          <span>fatte ${e.prese}</span>
          <span class="${e.delta===0?'delta-ok':'delta-bad'}">${e.delta===0?'esatto':'-1 vita (scarto '+e.delta+')'}</span>
        </div>`).join('')}
    </div>`).join('');
  return `<div class="card">

// Uscita "da casino'": lascia il tavolo SENZA terminare la partita per gli altri
// (a differenza di abandonMatch, che chiude tutto per tutti). Usata solo per
// Roulette/Black Jack in modalita' libera, dove entrare e uscire a piacere e' la norma.
// Se il giocatore ha soldi in ballo nel giro in corso, l'uscita viene applicata
// automaticamente all'inizio del prossimo giro (mai a meta' mano).
async function leaveGameTable(matchId, playerId){
  const match = await getActiveMatch();
  if(match && match.id===matchId){
    if(!match.pendingLeave) match.pendingLeave = {};
    match.pendingLeave[playerId] = true;
    if(match.phase==='betting') applyPendingLeaves(match);
    const humansLeft = match.players.some(p=>!p.isBot);
    if(!humansLeft){
      await clearActiveMatch();
      if(myRoomId){ try{ const list=(await getRooms()).filter(s=>s.id!==myRoomId); await saveRooms(list); }catch(e){} }
    } else {
      await setActiveMatch(match);
    }
  }
  await clearClaim(matchId);
  localOverrideMatch = null; lastKnownRemoteRev = -1; syncDiverged = false;
  myRoomId=null; mySeatIdx=null; soloMode=false; lobbyView='lobby';
  await rememberSeat();
  lastRenderKey=null;
  await render(true);
}

async function abandonMatch(){
  if(!confirm('Abbandonare la partita in corso? Non verrà salvata nello storico.')) return;
  const match = await getActiveMatch();
  await clearActiveMatch();
  if(match) await clearClaim(match.id);
  if(myRoomId){
    try{ const list=(await getRooms()).filter(s=>s.id!==myRoomId); await saveRooms(list); }catch(e){}
  }
  myRoomId=null; mySeatIdx=null; soloMode=false; lobbyView='lobby';
  bjCurrentBet = 0; // non deve sopravvivere a una partita abbandonata a meta' puntata
  await rememberSeat();
  lastRenderKey=null;
  await render(true);
}
