}
function rouletteNumberCellStyle(n){
  const color = n===0 ? '#2E7D4F' : (ROULETTE_RED.has(n) ? '#B23B3B' : '#241812');
  return `background:${color};color:#F1ECE1;`;
}
function rouletteBettingBoard(match, myId){
  const player = match.players.find(p=>p.id===myId);
  const myBets = match.bets[myId] || [];
  const totPuntato = myBets.reduce((s,b)=>s+b.amount,0);
  const chipRow = ROULETTE_CHIP_PRESETS.map(v=>`<button class="btn-secondary btn-small ${rouletteChipValue===v?'mode-active':''}" onclick="rouletteChipValue=${v}; render(true)">${v}</button>`).join('');
  // fiche in sovrimpressione: un piccolo indicatore dorato con l'importo, per
  // mostrare a colpo d'occhio dove ho gia' puntato senza dover leggere la lista
  // testuale sotto. Sommo eventuali puntate multiple sulla stessa casella (es.
  // due fiches aggiunte in tempi diversi sullo stesso numero) in un unico badge.
  function chipBadge(type, param, size){
    const filterKey = param===undefined ? undefined : rouletteParamKey(param);
    const puntate = myBets.filter(b=> b.type===type && (filterKey===undefined || rouletteParamKey(b.param)===filterKey));
    if(!puntate.length) return '';
    const somma = puntate.reduce((s,b)=>s+b.amount,0);
    return pokerChipHTML(somma, size||15);
  }
  // griglia numeri 1-36 in 3 colonne x 12 righe (ordine tabellone reale: colonna 1 = 1,4,7...34
  // ecc). Tra le caselle dei numeri sono interposte sottili tracce "cuscinetto"
  // (griglia CSS 5 colonne x 23 righe: numeri sugli indici pari, cuscinetti sui
  // dispari) che ospitano le zone cliccabili per cavallo (2 numeri adiacenti) e
  // angolo (4 numeri): cosi' la loro posizione discende automaticamente dalla
  // griglia, senza dover misurare pixel via JS.
  const GUTTER = 13;
  function splitHotspot(row, col, orientation){
    const nums = orientation==='h' ? [row*3+col+1, row*3+col+2] : [row*3+col+1, (row+1)*3+col+1];
    const gc = orientation==='h' ? 2*col+2 : 2*col+1;
    const gr = orientation==='h' ? 2*row+1 : 2*row+2;
    const chip = chipBadge('split', nums, 13);
    const paramStr = '['+nums.join(',')+']';
    return `<div onclick="roulettePlaceBet('${match.id}','${myId}','split',${paramStr},rouletteChipValue)" title="Cavallo ${nums.join('-')}" style="grid-column:${gc};grid-row:${gr};position:relative;display:flex;align-items:center;justify-content:center;cursor:pointer;">
      ${chip || `<span style="width:7px;height:7px;border-radius:50%;background:rgba(212,175,106,.5);"></span>`}
    </div>`;
  }
  function cornerHotspot(row, col){
    const nums = [row*3+col+1, row*3+col+2, (row+1)*3+col+1, (row+1)*3+col+2];
    const gc = 2*col+2, gr = 2*row+2;
    const chip = chipBadge('corner', nums, 13);
    const paramStr = '['+nums.join(',')+']';
    return `<div onclick="roulettePlaceBet('${match.id}','${myId}','corner',${paramStr},rouletteChipValue)" title="Angolo ${nums.join('-')}" style="grid-column:${gc};grid-row:${gr};position:relative;display:flex;align-items:center;justify-content:center;cursor:pointer;">
      ${chip || `<span style="width:7px;height:7px;border-radius:50%;background:rgba(212,175,106,.5);"></span>`}
    </div>`;
  }
  let gridHtml = `<div style="display:grid;grid-template-columns:1fr ${GUTTER}px 1fr ${GUTTER}px 1fr;grid-template-rows:${Array(12).fill('34px').join(` ${GUTTER}px `)};max-width:min(280px, 82vw);margin:8px auto;">`;
  for(let row=0; row<12; row++){
    for(let col=0; col<3; col++){
      const n = row*3 + col + 1;
      const chip = chipBadge('straight', n, 14);
      gridHtml += `<div onclick="roulettePlaceBet('${match.id}','${myId}','straight',${n},rouletteChipValue)" style="${rouletteNumberCellStyle(n)}grid-column:${2*col+1};grid-row:${2*row+1};border-radius:4px;display:flex;align-items:center;justify-content:center;gap:3px;font-size:12px;cursor:pointer;border:1px solid #0A1410;padding:0 2px;overflow:hidden;">
        <span>${n}</span>${chip}
      </div>`;
      if(col<2) gridHtml += splitHotspot(row, col, 'h');
    }
    if(row<11){
      for(let col=0; col<3; col++) gridHtml += splitHotspot(row, col, 'v');
      for(let col=0; col<2; col++) gridHtml += cornerHotspot(row, col);
    }
  }
  gridHtml += `</div>`;
  const zeroHtml = `<div style="position:relative;max-width:min(280px, 82vw);margin:0 auto;">
    <div onclick="roulettePlaceBet('${match.id}','${myId}','straight',0,rouletteChipValue)" style="${rouletteNumberCellStyle(0)}padding:8px;border-radius:4px;display:flex;align-items:center;justify-content:center;gap:4px;cursor:pointer;border:1px solid #0A1410;">
      <span>0</span>${chipBadge('straight', 0, 14)}
    </div>
  </div>`;
  const outsideBtn = (type,param,label)=>`<div style="position:relative;flex:1;display:flex;align-items:center;">
    <button class="btn-secondary btn-small" style="width:100%;display:flex;align-items:center;justify-content:center;gap:5px;" onclick="roulettePlaceBet('${match.id}','${myId}','${type}',${param===null?'null':JSON.stringify(param)},rouletteChipValue)">${label}${chipBadge(type, param===null?undefined:param, 14)}</button>
  </div>`;
  const betListHtml = myBets.length ? `<div style="margin-top:10px;">
    <p style="font-size:12px;color:var(--cream-dim);margin:4px 0;">Le tue puntate (${totPuntato} in gioco):</p>
    ${myBets.map(b=>`<div class="rank-row"><span>${ROULETTE_BET_TYPES[b.type].label(b.param)} — ${b.amount}</span><button class="btn-danger btn-small" onclick="rouletteRemoveBet('${match.id}','${myId}','${b.id}')">✕</button></div>`).join('')}
  </div>` : `<p class="hint" style="margin-top:10px;">Nessuna puntata ancora piazzata.</p>`;
  return `
    <p class="hint" style="margin-bottom:4px;">Valore fiche (disponibili: <b>${player.chips}</b>${totPuntato?', '+totPuntato+' già puntate':''}):</p>
    <div class="row-btns">${chipRow}</div>
    <div class="roulette-bet-scroll">
      ${zeroHtml}
      ${gridHtml}
      <div class="row-btns" style="flex-wrap:wrap;gap:4px;">
        ${outsideBtn('dozen',1,'1ª dozzina')}${outsideBtn('dozen',2,'2ª dozzina')}${outsideBtn('dozen',3,'3ª dozzina')}
      </div>
      <div class="row-btns" style="flex-wrap:wrap;gap:4px;margin-top:4px;">
        ${outsideBtn('column',1,'Colonna 1')}${outsideBtn('column',2,'Colonna 2')}${outsideBtn('column',3,'Colonna 3')}
      </div>
      <div class="row-btns" style="flex-wrap:wrap;gap:4px;margin-top:4px;">
        ${outsideBtn('low',null,'Manque 1-18')}${outsideBtn('high',null,'Passe 19-36')}
      </div>
      <div class="row-btns" style="flex-wrap:wrap;gap:4px;margin-top:4px;">
        ${outsideBtn('red',null,'🔴 Rosso')}${outsideBtn('black',null,'⚫ Nero')}
      </div>
      <div class="row-btns" style="flex-wrap:wrap;gap:4px;margin-top:4px;">
        ${outsideBtn('even',null,'Pari')}${outsideBtn('odd',null,'Dispari')}
      </div>
      ${betListHtml}
      ${match.mode==='free' && cachedRouletteStats ? deviceStatsSummaryHTML(cachedRouletteStats) : ''}
    </div>
    <div class="row-btns" style="margin-top:10px;">
      <button class="btn-secondary" style="flex:1;" onclick="rouletteClearBets('${match.id}','${myId}')" ${myBets.length?'':'disabled'}>Azzera puntate</button>
      <button class="btn-primary" style="flex:1;" onclick="rouletteConfirmReady('${match.id}','${myId}')" ${match.ready[myId]?'disabled':''}>${match.ready[myId]?'In attesa…':'Pronto, gira!'}</button>
    </div>`;
}
function rouletteResultPanel(match, myId){
  const r = match.lastResult;
  const rows = match.turnOrder.map(id=>{
    const p = match.players.find(x=>x.id===id);
    const net = r.payouts[id]||0;
    const sign = net>0 ? '+' : '';
    const color = net>0 ? '#7FBF9E' : (net<0 ? '#D98C8C' : 'var(--cream-dim)');
    return `<div class="rank-row"><span>${esc(p.name)}${p.isBot?' 🤖':''}</span><span style="color:${color};font-weight:600;">${sign}${net} <span style="color:var(--cream-dim);font-weight:400;">(${p.chips} fiches)</span></span></div>`;
  }).join('');
  const colorLabel = r.color==='red' ? 'Rosso' : (r.color==='black' ? 'Nero' : 'Verde');
  return `<div class="turn-banner" style="text-align:center;">
    <div style="font-size:40px;font-weight:700;margin:6px 0;">${r.number}</div>
    <div>${colorLabel}</div>
  </div>
  ${rows}
  <button class="btn-primary" style="width:100%;margin-top:12px;" onclick="rouletteNextRound('${match.id}')">Prossimo giro</button>`;
}
function rouletteEndPanel(match, myId){
  if(match.mode==='free'){
    const busted = match.players.find(p=>p.id===match.bustedPlayerId);
    const ranking = match.players.slice().sort((a,b)=>b.chips-a.chips);
    return `<div class="turn-banner" style="text-align:center;">
      <b>${esc(busted.name)}</b> è rimasto senza fiches — partita finita
    </div>
    ${ranking.map(p=>`<div class="rank-row ${p.id===match.bustedPlayerId?'':''}"><span>${esc(p.name)}${p.isBot?' 🤖':''}</span><span>${p.chips} fiches</span></div>`).join('')}
    <button class="btn-primary" style="width:100%;margin-top:12px;" onclick="backToLobbyFromEnd()">Torna al menu</button>`;
  }
  // torneo
  const ranking = match.players.slice().sort((a,b)=>b.chips-a.chips);
  const titolo = match.tieWinners
    ? 'Pareggio tra ' + match.tieWinners.map(id=>esc(nameOf(match,id))).join(' e ')
    : 'Vince ' + esc(nameOf(match, match.winnerId));
  return `<div class="turn-banner" style="text-align:center;">

  <button class="btn-primary" style="width:100%;margin-top:12px;" onclick="backToLobbyFromEnd()">Torna al menu</button>`;
}
// Sceglie il pulsante giusto: "Esci dal tavolo" (lascia il posto senza disturbare
// gli altri) solo per Roulette/Black Jack in modalita' libera dentro una sala
// online; altrimenti il normale "Abbandona" che chiude tutto (gioca-da-solo, torneo).
function tableExitButton(match, myId){
  if(myRoomId && !soloMode && myId && match.mode==='free'){
    return `<button class="btn-danger btn-small" onclick="leaveGameTable('${match.id}','${myId}')">Esci dal tavolo</button>`;
  }
  return `<button class="btn-danger btn-small" onclick="abandonMatch()">Abbandona</button>`;
}
function renderRouletteMatch(match, claim){
  const myId = claim.type==='seat' ? claim.playerId : null;
  const revealAll = claim.type==='all';
  const scoreBar = `<div class="row-pills" style="flex-wrap:wrap;">${match.players.map(p=>`<span class="pill" style="margin:2px 4px 2px 0;${p.busted?'opacity:0.5;':''}">${esc(p.name)}${p.isBot?' 🤖':''} <b>${p.chips}</b></span>`).join('')}</div>`;
  const historyHtml = match.history.length ? `<p class="hint" style="margin-top:6px;">Ultimi numeri: ${match.history.slice(0,10).map(n=>`<span style="display:inline-block;width:20px;height:20px;line-height:20px;text-align:center;border-radius:50%;font-size:11px;margin:0 2px;${rouletteNumberCellStyle(n)}">${n}</span>`).join('')}</p>` : '';
  const modeLabel = match.mode==='tournament' ? ('giro '+match.roundNumber+'/'+ROULETTE_TOURNAMENT_ROUNDS) : ('giro '+match.roundNumber);

  if(match.phase==='ended'){
    maybeSaveRouletteHistory(match);
    return `<div class="card">
      <div class="toolbar"><span>Roulette</span></div>
      ${scoreBar}
      ${rouletteEndPanel(match, myId)}
    </div>`;
  }
  if(match.phase==='spinning'){
    const spinGuardKey = 'spin|'+match.id+'|'+match.roundNumber;
    if(rouletteSpinGuard!==spinGuardKey){
      rouletteSpinGuard = spinGuardKey;
      setTimeout(()=>{ rouletteFinishSpin(match.id); }, ROULETTE_SPIN_DURATION*1000 + 200);
    }
    return `<div class="card">
      <div class="toolbar"><span>Roulette · ${modeLabel}</span>${tableExitButton(match, myId)}</div>
      ${scoreBar}
      <div class="turn-banner" style="text-align:center;">La pallina gira…</div>
      ${rouletteWheelSVG(true, match.spinResult)}
    </div>`;
  }
  if(match.phase==='result' && myId && match.lastResult && match.lastResult.payouts[myId]!==undefined){
    const key = 'roulette-stats|'+match.id+'|'+match.roundNumber;
    if(statsRecordGuard!==key){ statsRecordGuard = key; recordDeviceOutcome('roulette', match.lastResult.payouts[myId]); }
    if(match.lastResult.payouts[myId]<0) maybeShowLoserPopup(match.id, 'roul-spin-'+match.roundNumber, myId, [myId]);
  }
  const myPlayer = myId ? match.players.find(p=>p.id===myId) : null;
  if(myPlayer && myPlayer.busted && !revealAll){
    if(match.mode==='tournament'){
      if(match.phase==='betting' && !match.ready[myId]){ rouletteConfirmReady(match.id, myId); }
      return `<div class="card">
        <div class="toolbar"><span>Roulette · ${modeLabel}</span>${tableExitButton(match, myId)}</div>
        ${scoreBar}
        <div class="turn-banner">Sei rimasto senza fiches. Aspetta la fine del torneo per vedere la classifica finale.</div>
      </div>`;
    }
    return `<div class="card">
      <div class="toolbar"><span>Roulette · ${modeLabel}</span>${tableExitButton(match, myId)}</div>
      ${scoreBar}
      <div class="turn-banner">Sei rimasto senza fiches.</div>
      <button class="btn-primary" style="width:100%;margin-top:10px;" onclick="rouletteConfirmTopUp('${match.id}','${myId}',1000)">Ricarica (+1000 fiches)</button>
    </div>`;
  }
  if(match.phase==='result'){
    return `<div class="card">
      <div class="toolbar"><span>Roulette · ${modeLabel}</span>${tableExitButton(match, myId)}</div>
      ${scoreBar}
      ${rouletteWheelSVG(false, null)}
      ${rouletteResultPanel(match, myId)}
      ${historyHtml}
    </div>`;
  }
  // fase 'betting'
  if(!myId && !revealAll){
    return `<div class="card"><div class="toolbar"><span>Roulette</span></div><p class="hint">Stai a guardare questa partita.</p></div>`;
  }
  const waitingOthers = match.ready[myId] ? `<div class="turn-banner">In attesa degli altri giocatori…</div>` : '';
  return `<div class="card">
    <div class="toolbar"><span>Roulette · ${modeLabel}</span>${tableExitButton(match, myId)}</div>
    ${scoreBar}
    ${historyHtml}
    ${waitingOthers}
    ${rouletteBettingBoard(match, myId)}
  </div>`;
}

let bjCurrentBet = 0;

const BJ_CHIP_PRESETS = [5,10,25,50,100];

function bjHandTotalLabel(cards){
  const v = bjHandValue(cards);
  if(bjIsBust(cards)) return v.total+' — sballato';
  if(bjIsBlackjack(cards)) return 'Blackjack!';
  return v.total + (v.soft ? ' (soft)' : '');
}
function bjCardsHTML(cards, hideSecond){
  // Su schermi bassi (telefono orizzontale) piu' mani impilate rischiano di
  // superare l'altezza disponibile: le carte restano leggibili anche un po'
  // piu' piccole, quindi si riducono quando lo spazio verticale scarseggia.
  const compact = window.innerHeight < 500;
  const w = compact ? 30 : 38, h = compact ? 42 : 54;
  return cards.map((c,i)=> i===1 && hideSecond ? pokerCardBack(w,h) : pokerMiniCard(c,w,h)).join('');

// Carte in miniatura per le mani degli altri giocatori (bot) durante la

// 3-4 avversari al tavolo, mostrarle a piena grandezza in blocchi separati

function bjTinyCardsHTML(cards){

function bjCompactHandsHTML(match, forPlayerId){

function bjBettingPanel(match, myId){

async function bjConfirmBetAndReady(matchId, myId){

function bjPlayerHandsHTML(match, myId, forPlayerId, revealDealer){

      </div>` : '';

      ${actionsHtml}
    </div>`;
  }).join('');
}
function bjResultPanel(match, myId){
  // Come nella mano in corso: il mio risultato resta ben leggibile, quello
  // degli avversari diventa una riga compatta con l'esito netto in fiches,
  // cosi' il riepilogo non sfora lo schermo con piu' giocatori al tavolo.
  const myRow = myId ? (()=>{
    const p = match.players.find(x=>x.id===myId);
    const net = match.lastPayouts ? (match.lastPayouts[myId]||0) : 0;
    const sign = net>0 ? '+' : '';
    const color = net>0 ? '#7FBF9E' : (net<0 ? '#D98C8C' : 'var(--cream-dim)');
    return `<div style="margin:8px 0;">
      <div style="font-weight:600;">${esc(p.name)} <span style="color:${color};">${sign}${net}</span></div>
      ${bjPlayerHandsHTML(match, myId, myId, true)}
    </div>`;
  })() : '';
  const otherRows = match.turnOrder.filter(id=>id!==myId).map(id=>{
    const p = match.players.find(x=>x.id===id);
    const net = match.lastPayouts ? (match.lastPayouts[id]||0) : 0;
    const sign = net>0 ? '+' : '';
    const color = net>0 ? '#7FBF9E' : (net<0 ? '#D98C8C' : 'var(--cream-dim)');
    return `<div style="display:flex;align-items:center;gap:6px;padding:4px 8px;border-radius:8px;background:rgba(255,255,255,.04);">
      <span style="font-size:12px;font-weight:600;white-space:nowrap;">${esc(p.name)}${p.isBot?' 🤖':''}</span>
      <div style="display:flex;gap:1px;">${bjTinyCardsHTML(bjPlayerHands(match,id).flatMap(h=>h.cards))}</div>
      <span style="margin-left:auto;font-size:12px;font-weight:700;color:${color};white-space:nowrap;">${sign}${net}</span>
    </div>`;
  }).join('');
  return `${myRow}
    ${otherRows ? `<div style="display:flex;flex-wrap:wrap;gap:5px;margin:6px 0;">${otherRows}</div>` : ''}
    <button class="btn-primary" style="width:100%;margin-top:12px;" onclick="bjNextRound('${match.id}')">Prossima mano</button>`;
}
function bjEndPanel(match){
  if(match.mode==='free'){
    const busted = match.players.find(p=>p.id===match.bustedPlayerId);
    const ranking = match.players.slice().sort((a,b)=>b.chips-a.chips);
    return `<div class="turn-banner" style="text-align:center;"><b>${esc(busted.name)}</b> è rimasto senza fiches — partita finita</div>
      ${ranking.map(p=>`<div class="rank-row"><span>${esc(p.name)}${p.isBot?' 🤖':''}</span><span>${p.chips} fiches</span></div>`).join('')}
      <button class="btn-primary" style="width:100%;margin-top:12px;" onclick="backToLobbyFromEnd()">Torna al menu</button>`;
  }
  const ranking = match.players.slice().sort((a,b)=>b.chips-a.chips);
  const titolo = match.tieWinners ? 'Pareggio tra ' + match.tieWinners.map(id=>esc(nameOf(match,id))).join(' e ') : 'Vince ' + esc(nameOf(match, match.winnerId));
  return `<div class="turn-banner" style="text-align:center;"><b>Torneo finito dopo ${BJ_TOURNAMENT_ROUNDS} mani</b><br>${titolo}</div>
    ${ranking.map((p,i)=>`<div class="rank-row ${(match.tieWinners?match.tieWinners.includes(p.id):p.id===match.winnerId)?'win':''}"><span>${i+1}. ${esc(p.name)}${p.isBot?' 🤖':''}</span><span>${p.chips} fiches</span></div>`).join('')}
    <button class="btn-primary" style="width:100%;margin-top:12px;" onclick="backToLobbyFromEnd()">Torna al menu</button>`;
}
// Tavolo da Black Jack "a mezzaluna" come un vero tavolo da casino': bordo
// dritto in alto (dove sta il banco), bordo curvo in basso dove si
// affacciano fino a 7 caselle di puntata. E' una vista d'insieme — le azioni
// vere e proprie (Carta/Stai/Raddoppia/Dividi) restano nei pannelli sotto,
// dove c'e' spazio per leggerle bene anche su telefono; qui invece si vede
// subito chi ha puntato cosa e con quali carte, come guardando il tavolo
// dall'alto. Niente "Assicurazione" stampata sul feltro: non e' una
// puntata che questo gioco offre, e stamparla in tavolo lascerebbe credere
// il contrario.
function bjTableSVG(match, myId){
  const compact = window.innerHeight < 520;
  const VB_W = 420, VB_H = 220;
  const cx = VB_W/2, cyTop = 56, rx = 192, ry = 144;
  const rimPad = 11;
  // Flag di rotazione dell'arco a 0 (antiorario, da sinistra a destra): con
  // l'asse y che cresce verso il basso, e' questo verso — non l'orario — a
  // far passare la curva per il PUNTO PIU' BASSO (il fondo della cupola),
  // che e' la forma voluta. Il verso opposto disegnerebbe la cupola verso
  // l'alto, quasi del tutto fuori dal viewBox e percio' invisibile.
  const feltPath = `M${(cx-rx).toFixed(1)},${cyTop} A${rx},${ry} 0 0 0 ${(cx+rx).toFixed(1)},${cyTop} Z`;
  const rimPath = `M${(cx-rx-rimPad).toFixed(1)},${(cyTop-rimPad).toFixed(1)} A${rx+rimPad},${ry+rimPad} 0 0 0 ${(cx+rx+rimPad).toFixed(1)},${(cyTop-rimPad).toFixed(1)} L${(cx-rx-rimPad).toFixed(1)},${(cyTop-rimPad).toFixed(1)} Z`;
  const textRx = rx*0.60, textRy = ry*0.58;
  const textPath = `M${(cx-textRx).toFixed(1)},${cyTop} A${textRx.toFixed(1)},${textRy.toFixed(1)} 0 0 0 ${(cx+textRx).toFixed(1)},${cyTop}`;

  const n = BJ_MAX_PLAYERS;
  // Gradi totali coperti dai posti lungo il bordo curvo: deve restare
  // abbastanza stretto da lasciare spazio, anche ai posti agli estremi
  // (i piu' vicini al bordo dritto in alto, dove il raggio verticale
  // disponibile e' minimo), alla riga di carte sopra il cerchio — altrimenti
  // finiscono a "galleggiare" fuori dal tavolo invece che sopra la propria fiche.
  const angleSpan = 120;
  const seatInset = 0.90;
  const mySlot = myId ? bjSeatOf(match, myId) : -1;
  const seatR = compact ? 15 : 18;
  const cardW = compact ? 17 : 20, cardH = compact ? 24 : 28;

  let seatsHtml = '';
  for(let slot=0; slot<n; slot++){
    const t = (slot/(n-1) - 0.5) * angleSpan;
    const rad = t*Math.PI/180;
    const x = cx + Math.sin(rad)*rx*seatInset;
    const y = cyTop + Math.cos(rad)*ry*seatInset;
    const occId = match.seatSlots[slot];
    const player = occId ? match.players.find(p=>p.id===occId) : null;
    const isMe = occId===myId;
    const bet = occId ? (match.bets[occId]||0) : 0;
    const hands = occId ? bjPlayerHands(match, occId) : [];
    const cards = hands.length ? hands.flatMap(h=>h.cards) : [];
    const clickable = !occId && mySlot>=0 && match.phase==='betting';
    const ringColor = isMe ? '#D4AF6A' : (occId ? '#8FA89C' : '#4A6B5B');
    const ringWidth = isMe ? 2.4 : 1.6;

    const chipHtml = bet>0 ? `<foreignObject x="${(x-seatR*0.8).toFixed(1)}" y="${(y-seatR*0.8).toFixed(1)}" width="${(seatR*1.6).toFixed(1)}" height="${(seatR*1.6).toFixed(1)}"><div xmlns="http://www.w3.org/1999/xhtml" style="display:flex;width:100%;height:100%;">${pokerChipHTML(bet, seatR*1.6)}</div></foreignObject>` : '';
    const cardsW = Math.max(cardW*1.1, cards.length*cardW*0.62 + cardW*0.5);
    // Non deve mai finire sopra il bordo dritto del tavolo (cyTop): senza
    // questa rete di sicurezza, i posti piu' vicini agli angoli finivano con
    // le carte "staccate" a galleggiare fuori dal feltro.
    const cardsY = Math.max(cyTop+3, y-seatR-cardH-3);
    const cardsHtml = cards.length ? `<foreignObject x="${(x-cardsW/2).toFixed(1)}" y="${cardsY.toFixed(1)}" width="${cardsW.toFixed(1)}" height="${cardH}"><div xmlns="http://www.w3.org/1999/xhtml" style="display:flex;justify-content:center;">${cards.map(c=>pokerMiniCard(c,cardW,cardH)).join('')}</div></foreignObject>` : '';
    const nameLabel = player ? (player.name.length>9 ? player.name.slice(0,8)+'…' : player.name) : ('Posto '+(slot+1));
    const nameColor = player ? (isMe?'#D4AF6A':'#E9E3D3') : '#6C8078';

    seatsHtml += `
      <g ${clickable?`onclick="bjChangeSeat('${match.id}','${myId}',${slot})" style="cursor:pointer;"`:''}>
        ${cardsHtml}
        <circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${seatR}" fill="rgba(10,20,16,0.35)" stroke="${ringColor}" stroke-width="${ringWidth}"/>
        ${!player ? `<text x="${x.toFixed(1)}" y="${(y+3).toFixed(1)}" text-anchor="middle" font-size="${(seatR*0.62).toFixed(1)}" fill="#6C8078" font-family="'IBM Plex Mono',monospace">${slot+1}</text>` : ''}
        ${chipHtml}
        <text x="${x.toFixed(1)}" y="${(y+seatR+11).toFixed(1)}" text-anchor="middle" font-size="9.5" font-weight="600" fill="${nameColor}" font-family="'Fraunces',serif">${esc(nameLabel)}${player && player.isBot ? ' ᴀɪ':''}</text>
      </g>`;
  }

  const dealerHidden = match.phase==='playing' && !match.dealerRevealed;
  const dealerCards = match.dealerHand || [];
  const dealerLabel = dealerCards.length ? (dealerHidden ? bjHandTotalLabel([dealerCards[0]])+' + ?' : bjHandTotalLabel(dealerCards)) : '';
  const dealerCardW = compact ? 26 : 30, dealerCardH = compact ? 37 : 42;
  const dealerCardsHtml = dealerCards.length ? `<foreignObject x="${(cx-dealerCardW*2.2).toFixed(1)}" y="${(cyTop-dealerCardH-6).toFixed(1)}" width="${(dealerCardW*4.4).toFixed(1)}" height="${dealerCardH}"><div xmlns="http://www.w3.org/1999/xhtml" style="display:flex;justify-content:center;gap:2px;">${dealerCards.map((c,i)=> i===1 && dealerHidden ? pokerCardBack(dealerCardW,dealerCardH) : pokerMiniCard(c,dealerCardW,dealerCardH)).join('')}</div></foreignObject>` : '';

  return `<div class="bj-table-svg-wrap" style="display:flex;justify-content:center;margin:6px 0;max-height:min(230px, 30vh);">
    <svg viewBox="0 0 ${VB_W} ${VB_H}" width="100%" style="max-width:440px;max-height:min(230px, 30vh);width:auto;display:block;">
      <defs>
        <linearGradient id="bjRimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#5C3A1C"/><stop offset="100%" stop-color="#2A1A0C"/>
        </linearGradient>
        <linearGradient id="bjFeltGrad" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" stop-color="#274539"/><stop offset="60%" stop-color="#1D3730"/><stop offset="100%" stop-color="#132520"/>
        </linearGradient>
        <path id="bj-arc-text-path" d="${textPath}"/>
      </defs>
      <path d="${rimPath}" fill="url(#bjRimGrad)" stroke="#1A0F06" stroke-width="1.5"/>
      <path d="${feltPath}" fill="url(#bjFeltGrad)" stroke="#4A6B5B" stroke-width="1.5"/>
      <text font-size="12" font-weight="700" fill="#D4AF6A" font-family="'Fraunces',serif" opacity="0.85" letter-spacing="1">
        <textPath href="#bj-arc-text-path" startOffset="50%" text-anchor="middle">BLACKJACK PAGA 3 A 2</textPath>
      </text>
      ${dealerCardsHtml}
      ${dealerLabel ? `<text x="${cx}" y="${cyTop-dealerCardH-11}" text-anchor="middle" font-size="10" fill="#B9C4BC" font-family="'IBM Plex Mono',monospace">Banco: ${dealerLabel}</text>` : `<text x="${cx}" y="${cyTop-14}" text-anchor="middle" font-size="10" fill="#6C8078" font-family="'IBM Plex Mono',monospace">Banco</text>`}
      ${seatsHtml}
    </svg>
  </div>`;
}
function renderBlackjackMatch(match, claim){
  const myId = claim.type==='seat' ? claim.playerId : null;
  const revealAll = claim.type==='all';
  const scoreBar = `<div class="row-pills" style="flex-wrap:wrap;">${match.players.map(p=>`<span class="pill" style="margin:2px 4px 2px 0;${p.busted?'opacity:0.5;':''}">${esc(p.name)}${p.isBot?' 🤖':''} <b>${p.chips}</b></span>`).join('')}</div>`;
  const modeLabel = match.mode==='tournament' ? ('mano '+match.roundNumber+'/'+BJ_TOURNAMENT_ROUNDS) : ('mano '+match.roundNumber);

  if(match.phase==='ended'){
    maybeSaveBlackjackHistory(match);
    return `<div class="card"><div class="toolbar"><span>Black Jack</span></div>${scoreBar}${bjEndPanel(match)}</div>`;
  }
  if(match.phase==='result' && myId && match.lastPayouts && match.lastPayouts[myId]!==undefined){
    const key = 'blackjack-stats|'+match.id+'|'+match.roundNumber;
    if(statsRecordGuard!==key){ statsRecordGuard = key; recordDeviceOutcome('blackjack', match.lastPayouts[myId]); }
    if(match.lastPayouts[myId]<0) maybeShowLoserPopup(match.id, 'bj-hand-'+match.roundNumber, myId, [myId]);
  }
  const myPlayerGlobal = myId ? match.players.find(p=>p.id===myId) : null;
  if(myPlayerGlobal && myPlayerGlobal.busted && !revealAll && match.phase!=='ended'){
    if(match.mode==='tournament'){
      if(match.phase==='betting' && !match.ready[myId]) bjConfirmReady(match.id, myId);
      return `<div class="card"><div class="toolbar"><span>Black Jack · ${modeLabel}</span>${tableExitButton(match, myId)}</div>${scoreBar}<div class="turn-banner">Sei rimasto senza fiches. Aspetta la fine del torneo per vedere la classifica finale.</div></div>`;
    }
    return `<div class="card"><div class="toolbar"><span>Black Jack · ${modeLabel}</span>${tableExitButton(match, myId)}</div>${scoreBar}<div class="turn-banner">Sei rimasto senza fiches.</div><button class="btn-primary" style="width:100%;margin-top:10px;" onclick="bjConfirmTopUp('${match.id}','${myId}',1000)">Ricarica (+1000 fiches)</button></div>`;
  }
  if(match.phase==='betting'){
    if(!myId && !revealAll) return `<div class="card"><div class="toolbar"><span>Black Jack</span></div><p class="hint">Stai a guardare questa partita.</p></div>`;
    return `<div class="card">
      <div class="toolbar"><span>Black Jack · ${modeLabel}</span>${tableExitButton(match, myId)}</div>
      ${scoreBar}
      ${bjTableSVG(match, myId)}
      ${bjBettingPanel(match, myId)}
    </div>`;
  }
  // fasi 'playing', 'dealer', 'result': mostro il tavolo con banco e tutte le mani
  const turnBanner = match.phase==='playing'
    ? (match.currentPlayerId===myId || revealAll ? `<div class="turn-bar mine">► TOCCA A ${revealAll?esc(nameOf(match,match.currentPlayerId)):'TE'}</div>` : `<div class="turn-bar">Tocca a <b>${esc(nameOf(match,match.currentPlayerId))}</b> <button class="refresh-mini" onclick="forceResync()" title="Aggiorna">⟳</button></div>`)
    : (match.phase==='dealer' ? `<div class="turn-banner" style="text-align:center;">Il banco gioca…</div>` : '');
  // La mia mano resta a piena grandezza (serve leggerla bene per decidere),
  // le mani degli avversari diventano righe compatte affiancabili: con 3-4
  // bot al tavolo, mostrarle tutte a piena grandezza in blocchi separati e'
  // quello che manda la pagina fuori schermo, specialmente in orizzontale.
  const myHandHtml = myId && bjPlayerHands(match,myId).length
    ? `<div style="margin:2px 0;"><div style="font-weight:600;font-size:13px;">${esc(nameOf(match,myId))}</div>${bjPlayerHandsHTML(match, myId, myId, match.dealerRevealed)}</div>`
    : '';
  // Il tavolo SVG mostra gia' banco, puntate e carte di tutti i posti: nelle
  // fasi 'playing'/'dealer' sostituisce sia il vecchio blocco testuale del
  // banco sia l'elenco compatto degli avversari (ridondante con le caselle
  // del tavolo), lasciando spazio verticale solo per la MIA mano, l'unica
  // che serve leggere a piena grandezza per decidere la mossa.
  const tableSvgHtml = bjTableSVG(match, myId);
  return `<div class="card">
    <div class="toolbar"><span>Black Jack · ${modeLabel}</span>${tableExitButton(match, myId)}</div>
    ${scoreBar}
    ${turnBanner}
    ${match.phase==='result' ? `${tableSvgHtml}${bjResultPanel(match, myId)}` : `
    ${tableSvgHtml}
    ${myHandHtml}`}
  </div>`;
}
setInterval(()=>{
  if(document.visibilityState!=='visible') return;
  const a = document.activeElement;
  if(a && (a.tagName==='INPUT' || a.tagName==='TEXTAREA')) return;
  render();
}, 4000);
document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState==='visible') render(); });

// ===== video di apertura =====
function introHide(){
  const overlay = document.getElementById('intro-overlay');
  if(!overlay) return;
  overlay.classList.add('intro-hidden');
  const v = document.getElementById('intro-video');
  if(v) v.pause();
  setTimeout(()=>{ overlay.remove(); }, 400);
}
function introSkip(){
  // Anche saltando l'intro, sfrutto lo stesso tocco per un istante
  // brevissimo (invisibile: l'overlay sparisce subito) di riproduzione
  // NON muta del video: su iOS Safari l'audio di un elemento <video>
  // ignora la levetta fisica del silenzioso (a differenza di <audio> e
  // della Web Audio API), e farlo partire porta la sessione audio della
  // pagina sulla categoria "riproduzione multimediale". Da quel momento
  // in poi, per il resto della sessione, anche gli effetti sonori del
  // gioco (Web Audio API) restano udibili col telefono in silenzioso.
  const v = document.getElementById('intro-video');
  if(v){
    v.muted = false;
    v.play().then(()=>{ setTimeout(()=>{ v.pause(); }, 250); }).catch(()=>{});
  }
  getAudioCtx();
  updateMenuMusic(document.body.classList.contains('in-match'));
  introHide();
}
function introStart(){
  const v = document.getElementById('intro-video');
  const hint = document.getElementById('intro-start-hint');
  if(!v) return;
  if(hint) hint.remove();
  v.muted = false;
  getAudioCtx(); // stesso gesto: sblocco anche i suoni di gioco per il resto della sessione
  updateMenuMusic(document.body.classList.contains('in-match'));
  v.play().catch(()=>{
    // rete di sicurezza estrema, non dovrebbe mai servire dato che e' un vero tap dell'utente
    v.muted = true;
    v.play().catch(introHide);
  });
}
(function initIntro(){
  const v = document.getElementById('intro-video');
  const hint = document.getElementById('intro-start-hint');
  if(!v) return;
  v.addEventListener('ended', introHide);
  // App installata sulla schermata Home (non aperta da un link nel browser):
  // Chrome (e alcuni altri) permettono in questo caso l'autoplay con audio
  // senza bisogno di alcun tocco preventivo. Su iOS Safari il comportamento
  // non e' garantito allo stesso modo, ma il tentativo e' innocuo: se fallisce,
  // ripiego comunque sul 'tocca per iniziare' che funziona sempre.
  const isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
  if(isStandalone){
    v.muted = false;
    getAudioCtx();
    v.play().then(()=>{
      if(hint) hint.remove();
    }).catch(()=>{
      // l'autoplay con audio non e' stato concesso: lascio il video fermo,
      // cosi' l'esperienza resta coerente col 'tocca per iniziare' ancora
      // visibile (che restera' l'unico modo per avviarlo, con audio garantito).
      v.pause();
      v.currentTime = 0;
    });
  }
})();

// Registrazione del service worker: fa funzionare "gioca da solo" e
// "Solitario" anche senza connessione, una volta aperta l'app almeno una
// volta. Le sale online restano comunque legate a Firebase (hanno bisogno
// di rete per loro stessa natura). Se il file sw.js non e' raggiungibile
// (es. l'app aperta direttamente da file:// invece che da un vero server)
// fallisce silenziosamente: l'app resta comunque utilizzabile online.
if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('sw.js').then(reg=>{
      // Controlla subito se sw.js e' cambiato da quando e' stato installato
      // l'ultima volta, invece di aspettare il controllo automatico del
      // browser (che puo' metterci ore): senza, chi ha gia' aperto l'app
      // resterebbe bloccato sulla versione vecchia — anche piu' di una
      // pubblicazione indietro — finche' non svuota la cache a mano.
      reg.update().catch(()=>{});
    }).catch(()=>{});
  });
  // Quando il nuovo service worker prende il controllo (sw.js e' cambiato,
  // vedi sopra), la scheda gia' aperta non se ne accorgerebbe da sola: la
  // ricarico una sola volta cosi' l'HTML/JS aggiornati arrivano davvero,
  // invece di lasciare in mano quelli con cui la pagina era stata caricata.
  // Solo se c'era GIA' un controller (cioe' e' un aggiornamento, non la
  // primissima installazione): altrimenti ricaricherebbe anche al primo
  // avvio, quando non ce n'e' alcun bisogno.
  let swReloading = false;
  const hadController = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.addEventListener('controllerchange', ()=>{
    if(swReloading || !hadController) return;
    swReloading = true;
    window.location.reload();
  });
}
